# Loop Now 本地一体化运行：服务端 + Web 控制台。
# 控制台没有登录功能，端口只发布到本机回环。服务端的库（SQLite）、备份、上下文与工作区都在 loopdata 卷里，
# 首次启动自动建库。
name: loop-now

services:
  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    ports:
      - "127.0.0.1:8780:8780"
    volumes:
      - loopdata:/var/lib/loop-now
    healthcheck:
      # 同时确认 HTTP、数据库迁移和 Pi 模型目录已就绪。
      test: ["CMD", "curl", "-fsS", "http://localhost:8780/api/v1/model-settings"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  loopdata:
