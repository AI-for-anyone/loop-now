<!doctype html>
<!-- The shell's built-in status page: shown while the server starts (minimalist centered logo boarding screen) and when it fails to start.
     The shell passes text in query parameters; action links on failure are intercepted by the shell. -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Loop Now</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --ink: #171717;
        --muted: #666666;
        --border: rgba(0, 0, 0, 0.08);
        --panel: #fafafa;
        --primary: #0070f3;
        --primary-fg: #ffffff;
        --logo-shadow: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.14));
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #000000;
        --ink: #ededed;
        --muted: #888888;
        --border: rgba(255, 255, 255, 0.12);
        --panel: #0a0a0a;
        --primary: #3291ff;
        --primary-fg: #ffffff;
        --logo-shadow: drop-shadow(0 14px 34px rgba(0, 0, 0, 0.65));
      }
      :root[data-skin='plate'] {
        color-scheme: light;
        --bg: #f3efe6;
        --ink: #18265e;
        --muted: #5a628a;
        --border: rgba(24, 38, 94, 0.18);
        --panel: #fbf9f4;
        --primary: #2443b5;
        --primary-fg: #ffffff;
        --logo-shadow: drop-shadow(0 12px 28px rgba(24, 38, 94, 0.18));
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]):not([data-skin='plate']) {
          color-scheme: dark;
          --bg: #000000;
          --ink: #ededed;
          --muted: #888888;
          --border: rgba(255, 255, 255, 0.12);
          --panel: #0a0a0a;
          --primary: #3291ff;
          --primary-fg: #ffffff;
          --logo-shadow: drop-shadow(0 14px 34px rgba(0, 0, 0, 0.65));
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: grid;
        place-items: center;
      }
      .titlebar {
        position: fixed;
        inset: 0 0 auto;
        height: 48px;
        -webkit-app-region: drag;
      }
      main {
        width: min(600px, 100vw);
        padding: 48px 28px 32px;
      }
      body.boarding main {
        width: auto;
        padding: 0;
        display: grid;
        place-items: center;
      }
      .logo {
        width: 48px;
        height: 48px;
        display: block;
        margin-bottom: 20px;
        filter: var(--logo-shadow);
      }
      body.boarding .logo {
        width: 72px;
        height: 72px;
        margin: 0;
      }
      .gold-square {
        transform-origin: 45px 19px;
      }
      body.boarding .gold-square {
        animation: gold-turn 4.6s linear infinite;
      }
      @keyframes gold-turn {
        0% {
          transform: rotate(0deg);
          animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
        }
        19%,
        25% {
          transform: rotate(90deg);
          animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
        }
        44%,
        50% {
          transform: rotate(180deg);
          animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
        }
        69%,
        75% {
          transform: rotate(270deg);
          animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
        }
        94%,
        100% {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        body.boarding .gold-square {
          animation: none;
        }
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
        overflow-wrap: anywhere;
        white-space: pre-line;
      }
      pre {
        margin: 20px 0 0;
        padding: 12px 14px;
        max-height: 45vh;
        overflow: auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        font: 12px/1.55 ui-monospace, 'SF Mono', Menlo, monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      nav {
        margin-top: 20px;
        display: flex;
        gap: 10px;
      }
      nav a {
        display: inline-flex;
        align-items: center;
        height: 36px;
        padding: 0 14px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--ink);
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
      }
      nav a:first-child {
        border-color: transparent;
        background: var(--primary);
        color: var(--primary-fg);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>

      <div id="error-panel" hidden>
        <h1 id="title"></h1>
        <p id="body"></p>
        <pre id="log" hidden></pre>
        <nav id="actions" hidden>
          <a id="retry" href="?action=retry"></a>
          <a id="logs" href="?action=logs"></a>
        </nav>
      </div>
    </main>
    <script>
      const query = new URLSearchParams(location.search)
      const skin = query.get('skin')
      const theme = query.get('theme')
      if (skin === 'plate' || skin === 'mono') {
        document.documentElement.dataset.skin = skin
      }
      if (skin !== 'plate' && (theme === 'light' || theme === 'dark')) {
        document.documentElement.dataset.theme = theme
      }
      const busy = query.get('busy') === '1'
      const title = query.get('title') || 'Loop Now'
      document.title = title
      document.getElementById('stage').setAttribute('aria-label', title)
      document.body.classList.toggle('boarding', busy)
      if (!busy) {
        const text = (id, value) => (document.getElementById(id).textContent = value ?? '')
        document.getElementById('error-panel').hidden = false
        text('title', query.get('title'))
        text('body', query.get('body'))
        if (query.get('log')) {
          text('log', query.get('log'))
          document.getElementById('log').hidden = false
        }
        if (query.get('retry')) {
          text('retry', query.get('retry'))
          text('logs', query.get('logs'))
          document.getElementById('actions').hidden = false
        }
      }
    </script>
  </body>
</html>
