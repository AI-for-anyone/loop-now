name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (go vet + go test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: go vet
        run: go vet ./cmd/... ./internal/... ./api/...
      # 数据层不能引入只有 unix 才有的代码（实例锁等有 Windows 实现）。
      - name: go vet (windows, data layer)
        run: GOOS=windows go vet ./internal/server/db/...
      - name: go test
        run: go test -count=1 -skip '^TestStress' ./cmd/... ./internal/... ./api/...
      # 并发写、读到自己的写、取消、进程被杀与检查点的压测，单独连跑三次。
      - name: go test (data layer stress)
        run: go test -count=3 -run '^TestStress' ./internal/server/db/...

  # 一次性 PostgreSQL 导入器的测试需要一个 PostgreSQL；导入器删除时这个 job 一并删除。
  # 不列入分支保护的必需检查。
  importer:
    name: importer (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: loop_now
          POSTGRES_PASSWORD: loop_now
          POSTGRES_DB: loop_now_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loop_now -d loop_now_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LOOP_NOW_TEST_DATABASE_URL: postgres://loop_now:loop_now@127.0.0.1:5432/loop_now_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test
        run: go test -count=1 ./internal/server/pgimport/...

  web:
    name: web (typecheck, api:check, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run api:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  plugins:
    name: plugins (build, test, validate official)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: plugins/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: validate the official plugins
        run: |
          for dir in official/*/; do
            node host/dist/main.js validate "$dir"
          done
