name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (go vet + go test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: go vet
        run: go vet ./cmd/... ./internal/... ./api/...
      # 数据层不能引入只有 unix 才有的代码（实例锁等有 Windows 实现）。
      - name: go vet (windows, data layer)
        run: GOOS=windows go vet ./internal/server/db/...
      - name: go test
        run: go test -count=1 -skip '^TestStress' ./cmd/... ./internal/... ./api/...
      # 并发写、读到自己的写、取消、进程被杀与检查点的压测，单独连跑三次。
      - name: go test (data layer stress)
        run: go test -count=3 -run '^TestStress' ./internal/server/db/...

  # 一次性 PostgreSQL 导入器的测试需要一个 PostgreSQL；导入器删除时这个 job 一并删除。
  # 不列入分支保护的必需检查。
  importer:
    name: importer (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: loop_now
          POSTGRES_PASSWORD: loop_now
          POSTGRES_DB: loop_now_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loop_now -d loop_now_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LOOP_NOW_TEST_DATABASE_URL: postgres://loop_now:loop_now@127.0.0.1:5432/loop_now_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test
        run: go test -count=1 ./internal/server/pgimport/...

  web:
    name: web (typecheck, api:check, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run api:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  plugins:
    name: plugins (build, test, validate official)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: plugins/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: validate the official plugins
        run: |
          for dir in official/*/; do
            node host/dist/main.js validate "$dir"
          done

  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # 单测用 test/fakeserver（Go 写的假服务端）真的拉起、停掉、清理孤儿：Windows 走 taskkill 与 PowerShell 查进程，Linux 走信号。
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # electron 只在第一次运行时下载二进制，这里只做类型检查、编译和单测，不下载也不出安装包。
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Windows：用假服务端充当 loop-server.exe 打一次 NSIS 安装包，确认 electron-builder 的 win 配置与 after-pack 在 windows-latest 上能跑通。
      # 真的服务端 Windows 包合入后，release.yml 的 desktop-win 用同样的命令。
      - name: fake server bundle
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node scripts/fake-bundle.js "$RUNNER_TEMP/fake-bundle" --os windows --arch amd64
          echo "LOOP_NOW_DESKTOP_BUNDLE=$RUNNER_TEMP/fake-bundle" >> "$GITHUB_ENV"
      - name: dist:win (fake server)
        if: runner.os == 'Windows'
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: loop-now-desktop-fake-win-x64
          path: |
            .local-build/desktop/*.exe
            .local-build/desktop/latest.yml
          retention-days: 3
          if-no-files-found: error
