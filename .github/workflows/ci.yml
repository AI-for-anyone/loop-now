name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (go vet + go test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: go vet
        run: go vet ./cmd/... ./internal/... ./api/...
      # Go comments and log messages must be in English (a quoted Chinese original followed by its English is allowed
      # in comments); see scripts/check-english for the exact rule.
      - name: English comments and log messages
        run: go run ./scripts/check-english
      # The whole server must cross-compile to Windows (process groups, locks, permissions and no-follow opens each have a Windows implementation); real runs are in server-windows.
      - name: go vet (windows cross)
        run: GOOS=windows GOARCH=amd64 go vet ./cmd/... ./internal/... ./api/... ./auth-helper/...
      - name: go test
        run: go test -count=1 -skip '^TestStress' ./cmd/... ./internal/... ./api/...
      # Stress tests for concurrent writes, read-your-writes, cancellation, killed processes and checkpoints, run three times on their own.
      - name: go test (data layer stress)
        run: go test -count=3 -run '^TestStress' ./internal/server/db/...

  # Server on Windows: build, vet and all Go tests (tests that need a local Pi, Unix signals, permission bits or macOS-only features are skipped on Windows or excluded by build tags).
  server-windows:
    name: server (windows, go vet + go test)
    # Disabled for now (user decision, 2026-11-11): 4 executor tests of the Claude Code runtime do not pass on Windows yet; see MAIN.md.
    # The Windows cross-compile check stays in the server job above (go vet windows cross), and the desktop Windows packaging check is unaffected. Delete the line below to re-enable.
    if: false
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Golden files and testdata are compared with LF line endings; git on the Windows runner converts them to CRLF by default.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: go vet
        run: go vet ./cmd/... ./internal/... ./api/... ./auth-helper/...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -count=1 -skip '^TestStress' ./cmd/... ./internal/... ./api/... ./auth-helper/...

  # Tests of the one-off PostgreSQL importer need a PostgreSQL; delete this job together with the importer.
  # Not a required check in branch protection.
  importer:
    name: importer (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: loop_now
          POSTGRES_PASSWORD: loop_now
          POSTGRES_DB: loop_now_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loop_now -d loop_now_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LOOP_NOW_TEST_DATABASE_URL: postgres://loop_now:loop_now@127.0.0.1:5432/loop_now_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test
        run: go test -count=1 ./internal/server/pgimport/...

  web:
    name: web (typecheck, api:check, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run api:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  plugins:
    name: plugins (build, test, validate official)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: plugins/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: validate the official plugins
        run: |
          for dir in official/*/; do
            node host/dist/main.js validate "$dir"
          done

  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # Unit tests really start, stop and clean up orphans of test/fakeserver (a fake server written in Go): taskkill and PowerShell process queries on Windows, signals on Linux.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # electron only downloads its binary on first run; here we only type-check, compile and run unit tests, with no download and no installer.
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Windows: build one NSIS installer with the fake server standing in for loop-server.exe, to confirm electron-builder's win config and after-pack work on windows-latest.
      # Once the real server's Windows package lands, desktop-win in release.yml uses the same command.
      - name: fake server bundle
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node scripts/fake-bundle.js "$RUNNER_TEMP/fake-bundle" --os windows --arch amd64
          echo "LOOP_NOW_DESKTOP_BUNDLE=$RUNNER_TEMP/fake-bundle" >> "$GITHUB_ENV"
      - name: dist:win (fake server)
        if: runner.os == 'Windows'
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: loop-now-desktop-fake-win-x64
          path: |
            .local-build/desktop/*.exe
            .local-build/desktop/latest.yml
          retention-days: 3
          if-no-files-found: error
