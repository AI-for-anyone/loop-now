name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (go vet + go test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: go vet
        run: go vet ./cmd/... ./internal/... ./api/...
      # Go comments, string literals (tests included) and the API contracts (api/*.yaml) must be in English (a quoted
      # Chinese original followed by its English is allowed in Go comments; a literal that must stay Chinese is marked
      # "check-english: zh (reason)"); see scripts/check-english for the exact rule.
      - name: English comments, strings and API contracts
        run: go run ./scripts/check-english
      - name: go test
        run: go test -count=1 -skip '^TestStress' ./cmd/... ./internal/... ./api/...
      # Stress tests for concurrent writes, read-your-writes, cancellation, killed processes and checkpoints, run three times on their own.
      - name: go test (data layer stress)
        run: go test -count=3 -run '^TestStress' ./internal/server/db/...

  # Server on Windows: build, vet and all Go tests (tests that need a local Pi, Unix signals, permission bits or macOS-only features are skipped on Windows or excluded by build tags).
  server-windows:
    name: server (windows, go vet + go test)
    # Disabled for now (user decision, 2026-11-11): 4 executor tests of the Claude Code runtime do not pass on Windows yet; see MAIN.md.
    # The Windows cross-compile check was removed from the server job too (user decision, 2026-11-26); the desktop Windows packaging check is unaffected. Delete the line below to re-enable.
    if: false
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Golden files and testdata are compared with LF line endings; git on the Windows runner converts them to CRLF by default.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: go vet
        run: go vet ./cmd/... ./internal/... ./api/... ./auth-helper/...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -count=1 -skip '^TestStress' ./cmd/... ./internal/... ./api/... ./auth-helper/...

  # Tests of the one-off PostgreSQL importer need a PostgreSQL; delete this job together with the importer.
  # Not a required check in branch protection.
  importer:
    name: importer (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: loop_now
          POSTGRES_PASSWORD: loop_now
          POSTGRES_DB: loop_now_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loop_now -d loop_now_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LOOP_NOW_TEST_DATABASE_URL: postgres://loop_now:loop_now@127.0.0.1:5432/loop_now_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test
        run: go test -count=1 ./internal/server/pgimport/...

  web:
    name: web (typecheck, api:check, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run api:check
      - run: npm run lint
      # UI text stays in the i18n tables, and comments in web, desktop and plugins must be in English (a quoted Chinese
      # original followed by its English is allowed); see web/scripts/check-ui-text.mjs and check-comments.mjs.
      - run: npm run check:text
      - run: npm test
      - run: npm run build

  plugins:
    name: plugins (build, test, validate official)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: plugins/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: validate the official plugins
        run: |
          for dir in official/*/; do
            node host/dist/main.js validate "$dir"
          done
