name: release

# 发布构建：每个平台在对应架构的机器上运行 scripts/release/build.sh（Pi 的依赖要在目标架构上安装），
# 用产物实际启动一次，再把压缩包与校验和作为 artifact 上传。macOS arm64 另把服务端发行包装进桌面壳，出 DMG 与更新用的 zip，
# 只做 ad-hoc 签名。都不公证，也不创建 GitHub Release。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（不带 v），例如 0.9.0
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: darwin/arm64 }
          - { runner: macos-15-intel, target: darwin/amd64 }
          - { runner: ubuntu-24.04, target: linux/amd64 }
          - { runner: ubuntu-24.04-arm, target: linux/arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: version
        id: version
        env:
          INPUT: ${{ inputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${INPUT:-${TAG#v}}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "artifact=loop-now-$v-$(echo '${{ matrix.target }}' | tr / -)" >> "$GITHUB_OUTPUT"
      - name: build and smoke test
        run: scripts/release/build.sh --only ${{ matrix.target }} --smoke "${{ steps.version.outputs.version }}" out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            out/*.tar.gz
            out/*.tar.gz.sha256
          if-no-files-found: error

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd dist
          cat *.tar.gz.sha256 | sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS

  # 桌面版（macOS arm64）：把上面 darwin/arm64 的服务端发行包整个放进 app 的 Resources/server，
  # 出 DMG、更新用的 zip、两者的 blockmap 与 dev-mac.yml（electron-updater 的 dev 通道）。x64 以后再加。
  desktop-mac:
    name: desktop (darwin/arm64)
    needs: build
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: version
        id: version
        env:
          INPUT: ${{ inputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${INPUT:-${TAG#v}}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "server=loop-now-$v-darwin-arm64" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.version.outputs.server }}
          path: ${{ runner.temp }}/server
      - name: unpack the server bundle
        env:
          SERVER: ${{ steps.version.outputs.server }}
        run: |
          cd "$RUNNER_TEMP/server"
          shasum -a 256 -c "$SERVER.tar.gz.sha256"
          tar -xzf "$SERVER.tar.gz"
          echo "LOOP_NOW_DESKTOP_BUNDLE=$RUNNER_TEMP/server/$SERVER" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # 版本号以 tag（或手动输入）为准，打包前写进 package.json 与 lock；DMG、zip 的文件名和 dev-mac.yml 都从这里取。
      - name: set version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: loop-now-desktop-${{ steps.version.outputs.version }}-mac-arm64
          path: |
            .local-build/desktop/*.dmg
            .local-build/desktop/*.zip
            .local-build/desktop/*.blockmap
            .local-build/desktop/dev-mac.yml
          if-no-files-found: error
