name: release

# 发布构建：darwin/linux 每个平台在对应架构的机器上运行 scripts/release/build.sh（Pi 的依赖要在目标架构上安装）并用产物实际启动一次；
# windows/amd64 在 ubuntu 上交叉构建（Go 交叉编译，Pi 的依赖不分平台），出 zip，不 smoke。压缩包与校验和作为 artifact 上传。
# macOS arm64 把服务端发行包装进桌面壳，出 DMG 与更新用的 zip，只做 ad-hoc 签名，不公证；Windows x64 把服务端 zip 装进桌面壳，
# 出 NSIS 安装包，不签名。最后汇总全部产物写 SHA256SUMS；推 v* tag 时据此创建 GitHub Release，tag 带 - 的标为预发布
# （预发布一律用 -beta.N，如 v0.3.0-beta.1）。说明取自 CHANGELOG.md 里该版本的一节或 tag 注解（scripts/release/notes.sh）。
# 手动运行只构建，不建 Release。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（不带 v），例如 0.9.0
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # 推 tag 时先确认发布说明有内容，没有就不开始构建。actions/checkout 拉下的 tag 是轻量的，注解要另外取一次。
  notes:
    name: release notes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: check
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --depth=1 --force origin "refs/tags/$TAG:refs/tags/$TAG"
          scripts/release/notes.sh "$TAG"

  build:
    name: build (${{ matrix.target }})
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: darwin/arm64 }
          - { runner: macos-15-intel, target: darwin/amd64 }
          - { runner: ubuntu-24.04, target: linux/amd64 }
          - { runner: ubuntu-24.04-arm, target: linux/arm64 }
          # 交叉构建：产物是 zip，不 smoke（Linux 上跑不了 loop-server.exe）；Windows 上的 Go 测试在 ci.yml 的 server-windows。
          - { runner: ubuntu-24.04, target: windows/amd64, smoke: false }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: version
        id: version
        env:
          INPUT: ${{ inputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${INPUT:-${TAG#v}}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "artifact=loop-now-$v-$(echo '${{ matrix.target }}' | tr / -)" >> "$GITHUB_OUTPUT"
      - name: build and smoke test
        run: scripts/release/build.sh --only ${{ matrix.target }} ${{ matrix.smoke == false && '' || '--smoke' }} "${{ steps.version.outputs.version }}" out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            out/*.tar.gz
            out/*.tar.gz.sha256
            out/*.zip
            out/*.zip.sha256
          if-no-files-found: error

  # 桌面版（macOS arm64）：把上面 darwin/arm64 的服务端发行包整个放进 app 的 Resources/server，
  # 出 DMG、更新用的 zip、两者的 blockmap 与 latest-mac.yml（electron-updater 读的更新信息）。x64 以后再加。
  desktop-mac:
    name: desktop (darwin/arm64)
    needs: build
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: version
        id: version
        env:
          INPUT: ${{ inputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${INPUT:-${TAG#v}}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "server=loop-now-$v-darwin-arm64" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.version.outputs.server }}
          path: ${{ runner.temp }}/server
      - name: unpack the server bundle
        env:
          SERVER: ${{ steps.version.outputs.server }}
        run: |
          cd "$RUNNER_TEMP/server"
          shasum -a 256 -c "$SERVER.tar.gz.sha256"
          tar -xzf "$SERVER.tar.gz"
          echo "LOOP_NOW_DESKTOP_BUNDLE=$RUNNER_TEMP/server/$SERVER" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # 版本号以 tag（或手动输入）为准，打包前写进 package.json 与 lock；DMG、zip 的文件名和 latest-mac.yml 都从这里取。
      - name: set version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: loop-now-desktop-${{ steps.version.outputs.version }}-mac-arm64
          path: |
            .local-build/desktop/*.dmg
            .local-build/desktop/*.zip
            .local-build/desktop/*.blockmap
            .local-build/desktop/latest-mac.yml
          if-no-files-found: error

  # 桌面版（Windows x64）：把 windows/amd64 的服务端发行包（loop-server.exe 那一套，zip）解开放进 resources\server，出 NSIS 安装包、
  # blockmap 与 latest.yml（electron-updater 在 Windows 上读的更新信息）。不签名：SmartScreen 会提示"仍要运行"。
  desktop-win:
    name: desktop (windows/amd64)
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: version
        id: version
        shell: bash
        env:
          INPUT: ${{ inputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${INPUT:-${TAG#v}}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "server=loop-now-$v-windows-amd64" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.version.outputs.server }}
          path: ${{ runner.temp }}/server
      - name: unpack the server bundle
        shell: bash
        env:
          SERVER: ${{ steps.version.outputs.server }}
        run: |
          cd "$RUNNER_TEMP/server"
          sha256sum -c "$SERVER.zip.sha256"
          # Git Bash 没有 unzip，runner 自带 7-Zip。
          7z x -bso0 -bsp0 "$SERVER.zip"
          test -f "$SERVER/loop-server.exe"
          echo "LOOP_NOW_DESKTOP_BUNDLE=$RUNNER_TEMP/server/$SERVER" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: set version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: loop-now-desktop-${{ steps.version.outputs.version }}-win-x64
          path: |
            .local-build/desktop/*.exe
            .local-build/desktop/*.blockmap
            .local-build/desktop/latest.yml
          if-no-files-found: error

  # 汇总：全部 artifact（五个平台的服务端包、macOS 桌面版的 DMG、zip、blockmap、latest-mac.yml，Windows 桌面版的 exe、blockmap、latest.yml）
  # 平铺到一个目录，构建时写的单个校验和核对后并进 SHA256SUMS（不另外挂出）；推 tag 时把目录里的文件全部挂到 GitHub Release。
  release:
    name: release
    needs: [notes, build, desktop-mac, desktop-win]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -c -- *.sha256
          rm -- *.sha256
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
      - name: GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --depth=1 --force origin "refs/tags/$TAG:refs/tags/$TAG"
          scripts/release/notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          prerelease=""
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" $prerelease
