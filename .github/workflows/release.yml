name: release

# Release build: each platform runs scripts/release/build.sh on a machine of that architecture (Pi's dependencies
# must be installed on the target architecture), starts the result once, then uploads the archive and its checksum as
# artifacts. macOS arm64 also wraps the server release in the desktop shell and produces a DMG plus the zip used for
# updates, ad-hoc signed only and never notarized; the Windows x64 desktop app (NSIS, unsigned) waits for the server's
# Windows package, see desktop-win. Finally all artifacts are collected into SHA256SUMS; pushing a v* tag creates a
# GitHub Release from them, and a tag containing - is marked as a pre-release (pre-releases always use -beta.N, e.g.
# v0.3.0-beta.1). The notes come from that version's section in CHANGELOG.md or the tag annotation
# (scripts/release/notes.sh).
# A manual run only builds; it does not create a Release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number (without v), e.g. 0.9.0
        required: true
      desktop_win:
        description: Also build the Windows desktop app (needs the server's windows/amd64 package, which does not exist yet)
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # When a tag is pushed, first confirm the release notes are not empty; if they are, do not start building. The tag that actions/checkout fetches is lightweight, so the annotation has to be fetched separately.
  notes:
    name: release notes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: check
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --depth=1 --force origin "refs/tags/$TAG:refs/tags/$TAG"
          scripts/release/notes.sh "$TAG"

  build:
    name: build (${{ matrix.target }})
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: darwin/arm64 }
          - { runner: macos-15-intel, target: darwin/amd64 }
          - { runner: ubuntu-24.04, target: linux/amd64 }
          - { runner: ubuntu-24.04-arm, target: linux/arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: version
        id: version
        env:
          INPUT: ${{ inputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${INPUT:-${TAG#v}}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "artifact=loop-now-$v-$(echo '${{ matrix.target }}' | tr / -)" >> "$GITHUB_OUTPUT"
      - name: build and smoke test
        run: scripts/release/build.sh --only ${{ matrix.target }} --smoke "${{ steps.version.outputs.version }}" out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            out/*.tar.gz
            out/*.tar.gz.sha256
          if-no-files-found: error

  # Desktop app (macOS arm64): put the whole darwin/arm64 server release from above into the app's Resources/server,
  # and produce the DMG, the zip used for updates, the blockmaps of both and latest-mac.yml (the update info electron-updater reads). x64 comes later.
  desktop-mac:
    name: desktop (darwin/arm64)
    needs: build
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: version
        id: version
        env:
          INPUT: ${{ inputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${INPUT:-${TAG#v}}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "server=loop-now-$v-darwin-arm64" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.version.outputs.server }}
          path: ${{ runner.temp }}/server
      - name: unpack the server bundle
        env:
          SERVER: ${{ steps.version.outputs.server }}
        run: |
          cd "$RUNNER_TEMP/server"
          shasum -a 256 -c "$SERVER.tar.gz.sha256"
          tar -xzf "$SERVER.tar.gz"
          echo "LOOP_NOW_DESKTOP_BUNDLE=$RUNNER_TEMP/server/$SERVER" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # The version comes from the tag (or the manual input) and is written into package.json and the lock file before packaging; the DMG and zip file names and latest-mac.yml all take it from there.
      - name: set version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: loop-now-desktop-${{ steps.version.outputs.version }}-mac-arm64
          path: |
            .local-build/desktop/*.dmg
            .local-build/desktop/*.zip
            .local-build/desktop/*.blockmap
            .local-build/desktop/latest-mac.yml
          if-no-files-found: error

  # Desktop app (Windows x64): put the windows/amd64 server release (the loop-server.exe set) into resources\server and produce the NSIS installer,
  # its blockmap and latest.yml (the update info electron-updater reads on Windows). Unsigned: SmartScreen shows "Run anyway".
  # There is no server Windows package yet (the build matrix has no windows/amd64), so for now this job only runs on a manual run with desktop_win checked;
  # once the server package lands: add windows/amd64 to the build matrix and remove the condition here.
  desktop-win:
    name: desktop (windows/amd64)
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.desktop_win
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: version
        id: version
        shell: bash
        env:
          INPUT: ${{ inputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${INPUT:-${TAG#v}}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "server=loop-now-$v-windows-amd64" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.version.outputs.server }}
          path: ${{ runner.temp }}/server
      - name: unpack the server bundle
        shell: bash
        env:
          SERVER: ${{ steps.version.outputs.server }}
        run: |
          cd "$RUNNER_TEMP/server"
          sha256sum -c "$SERVER.tar.gz.sha256"
          tar -xzf "$SERVER.tar.gz"
          echo "LOOP_NOW_DESKTOP_BUNDLE=$RUNNER_TEMP/server/$SERVER" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: set version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: loop-now-desktop-${{ steps.version.outputs.version }}-win-x64
          path: |
            .local-build/desktop/*.exe
            .local-build/desktop/*.blockmap
            .local-build/desktop/latest.yml
          if-no-files-found: error

  # Collect: all artifacts (the server packages of the four platforms; the desktop DMG, zip, blockmaps and latest-mac.yml; once enabled, the Windows exe and latest.yml)
  # go flat into one directory; the single checksums written during the builds are verified and merged into SHA256SUMS (not published separately); on a tag push every file in the directory is attached to the GitHub Release.
  # Collects as usual when desktop-win was skipped (its result is skipped).
  release:
    name: release
    needs: [notes, build, desktop-mac, desktop-win]
    if: ${{ !cancelled() && needs.notes.result == 'success' && needs.build.result == 'success' && needs.desktop-mac.result == 'success' && (needs.desktop-win.result == 'success' || needs.desktop-win.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -c -- *.tar.gz.sha256
          rm -- *.tar.gz.sha256
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
      - name: GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --depth=1 --force origin "refs/tags/$TAG:refs/tags/$TAG"
          scripts/release/notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          prerelease=""
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" $prerelease
