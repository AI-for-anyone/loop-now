<!-- Pi, the coding agent Loop Now ships. Drawn 2026-11-26 from piLogoLines() in dist/modes/interactive/components/pi-logo.js of the @earendil-works/pi-coding-agent npm package 1.4.0: a 4 by 4 grid of square pixels in its brand colors coral rgb(228,138,122), blue rgb(79,142,179) and yellow rgb(234,182,93), as Pi prints it in a terminal. Used only to identify the runtime an Agent runs on. -->
