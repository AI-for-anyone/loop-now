  /agents/{agentId}/events:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      tags: [conversation]
      operationId: streamAgentEvents
      x-access: console
      summary: Agent 事件流（SSE）
      description: |
        `text/event-stream`，每条事件都带 `id`（Redis Stream 条目 ID），事件名与 data 结构的对应见 `x-sse-events`，保活为注释行。

        - 不带 `Last-Event-ID`，或它已超出保留范围：先发一条 `snapshot`，其 `id` 是快照时刻事件流的最新位置；
          `snapshot.currentText` 恰好包含到这个位置为止的全部文字增量。之后只发送这个位置之后的事件，不重放之前的事件。
        - 带 `Last-Event-ID` 且仍在保留范围内：不发 `snapshot`，直接从该 ID 之后续传。

        平台提醒那一轮（`Message.origin = inbox_reminder`）排队时，用户消息的正文是占位文字；开始执行时改写为提醒文字，并以同一消息 ID 再推送一次 `message.created`，控制台按 ID 更新。

        `queue.updated` 在排队列表任何变化时推送完整列表（入队、合并、开始、转为打断、撤回或取消、消息被读取后离队、提醒作废）。
        未执行即作废的执行（Run.endReason 为 user_cancelled、merged_into_interrupt、no_pending_messages）在对话流中应隐藏，运行记录照常显示。
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 事件流
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-sse-events:
        snapshot: { $ref: "#/components/schemas/SseSnapshot" }
        message.created: { $ref: "#/components/schemas/SseMessageCreated" }
        run.updated: { $ref: "#/components/schemas/SseRunUpdated" }
        run.text: { $ref: "#/components/schemas/SseRunText" }
        run.tool: { $ref: "#/components/schemas/SseRunTool" }
        run.ended: { $ref: "#/components/schemas/SseRunEnded" }
        session.updated: { $ref: "#/components/schemas/SseSessionUpdated" }
        sleep.updated: { $ref: "#/components/schemas/SseSleepUpdated" }
        queue.updated: { $ref: "#/components/schemas/SseQueueUpdated" }

