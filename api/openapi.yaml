  /external-identities/{identityId}/manager:
    parameters:
      - $ref: "#/components/parameters/IdentityId"
    put:
      tags: [external-identities]
      operationId: setExternalIdentityManager
      x-access: console
      summary: 设置或清空代管这个外部身份的插件渠道
      description: |
        plugins/SPEC.md §12：代管的插件收到发给这个身份的消息与提问（identity.inbound），并能以它的名义回复。一个身份最多一个代管者，设置即替换。
        插件须已安装，渠道须在它的清单里声明 `manageIdentities: true`，否则 422；身份不存在或已删除时 404。
        插件停用或宿主停止时绑定保留；卸载插件，或更新后渠道不再声明代管时，绑定清空。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExternalIdentityManagerInput" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 更新后的外部身份
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalIdentity" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

