          oneOf:
            - $ref: "#/components/schemas/ProcessExit"
            - type: "null"

    SseOverviewSnapshot:
      type: object
      required: [agents]
      additionalProperties: false
      properties:
        agents:
          type: array
          items: { $ref: "#/components/schemas/AgentOverview" }

    SseAgentStatus:
