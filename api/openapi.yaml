  "/projects/{projectId}/credential-account-impact":
    get:
      tags:
      - credentials
      operationId: getProjectCredentialAccountImpact
      x-access: console-and-external
      description: The explicit/automatic Agents, consistent with the current config. For model, only the currently saved
        provider counts; for cli, the Agent must have permission for the CLI. Without accountId it gives the impact of
        adding a second account. Historical tasks and legacy_cleared are not included.
