          description: 仓库地址；不能带用户名或密码
          type: string
          minLength: 1
        branch: { type: string, minLength: 1 }
        path:
          description: Agent 文件夹内的目标子目录，必须不存在或是空目录
          type: string
          minLength: 1

    FolderGitPullList:
      type: object
      required: [pulls]
      additionalProperties: false
      properties:
        pulls:
          description: 新的在前
          type: array
          items: { $ref: "#/components/schemas/FolderGitPull" }

    FolderGitPull:
      type: object
      required: [id, agentId, url, branch, path, status, errorCode, errorMessage, createdAt, finishedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        url: { type: string }
        branch: { type: string }
        path: { type: string }
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        errorCode:
          description: |
            - target_exists：开始时目标已不是空目录
            - branch_not_found：分支不存在
            - timeout：超过克隆时限
            - clone_failed：其他失败（地址无效、无权限、网络等），详见 errorMessage
            - server_restart：服务重启时仍在进行，已中止
          type: [string, "null"]
          enum: [target_exists, branch_not_found, timeout, clone_failed, server_restart, null]
        errorMessage:
          description: git 输出的末尾（最多 2000 字符）或失败原因；成功时为 null
          type: [string, "null"]
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }

    CredentialMeta:
      type: object
      required:
        - status
        - updatedAt
        - fieldNames
        - envNames
        - filePaths
        - warnings
      additionalProperties: false
      properties:
        projectId: { type: [string, "null"], format: uuid, description: 项目共享来源；平台私有历史省略 }
        accountId: { type: [string, "null"], format: uuid, description: 稳定项目账号ID；平台私有历史省略 }
        status:
          type: string
          enum:
            - set
            - unavailable
            - needs_reentry
        updatedAt:
          type: string
          format: date-time
        fieldNames:
          type: array
          items:
            type: string
        envNames:
          type: array
          items:
            type: string
        filePaths:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        provider:
          type:
            - string
            - 'null'
        authMethod:
          type:
            - string
            - 'null'
          enum:
            - api_key
            - oauth
            - legacy
            - null
        versionId:
          type:
            - string
            - 'null'
          format: uuid
        accountLabel:
          type:
            - string
            - 'null'
          description: 允许展示的非秘密账号标识，不包含token或授权码。

    AgentCli:
      type: object
      required: [name, hasTemplate, credential]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/CliName" }
        hasTemplate: { type: boolean }
        credential:
          oneOf:
            - $ref: "#/components/schemas/CredentialMeta"
            - type: "null"

    CliCredentialInput:
      type: object
      required: [fields]
      additionalProperties: false
      properties:
        fields:
          type: object
          additionalProperties: { type: string }

    ModelCredentialInput:
      type: object
      additionalProperties: false
      required:
        - provider
        - key
      properties:
        provider:
          type: string
        key:
          type: string
          minLength: 1
          writeOnly: true
        expectedConfigVersion:
          type: integer
          minimum: 1

    SkillFile:
      type: object
      required: [path, size, sha256]
      additionalProperties: false
      properties:
        path: { type: string }
        size: { type: integer, minimum: 0 }
        sha256: { type: string }

    SkillArchiveUpload:
      type: object
      required: [archive]
      properties:
        archive:
          description: Skill 目录的 zip 压缩包
          type: string
          format: binary

    SkillCreateFromMarkdown:
      type: object
      required: [skillMd]
      additionalProperties: false
      properties:
        skillMd: { type: string, minLength: 1 }

    SkillMarkdownInput:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content: { type: string, minLength: 1 }

    SkillTemplateSummary:
      type: object
      required: [id, name, description, fileCount, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        fileCount: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SkillTemplate:
      type: object
      required: [id, name, description, files, skillMd, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        files:
          type: array
          items: { $ref: "#/components/schemas/SkillFile" }
        skillMd: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AgentSkillSummary:
      type: object
      required: [id, name, description, sourceTemplateId, fileCount, copiedAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        sourceTemplateId:
          description: 来源模板；模板已删除时为 null，此时不能重新复制
          type: [string, "null"]
          format: uuid
        fileCount: { type: integer, minimum: 1 }
        copiedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AgentSkill:
      type: object
      required: [id, name, description, sourceTemplateId, files, skillMd, copiedAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        sourceTemplateId:
          type: [string, "null"]
          format: uuid
        files:
          type: array
          items: { $ref: "#/components/schemas/SkillFile" }
        skillMd: { type: string }
        copiedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WhenBusy:
      type: string
      enum: [interrupt, queue]

    RunStatus:
      type: string
      enum: [queued, starting, running, aborting, completed, failed, interrupted]

    RunPhase:
      description: 仅 status 为 starting 时有值
      type: [string, "null"]
      enum: [waiting_slot, preparing, launching, null]

    RunEndReason:
      description: |
        执行中断或尚未领取的排队执行失效的原因：
        - user_interrupt：被新消息打断；user_stopped：被人停止（只停这一次回复）；server_restart：服务重启。
        - sleep_superseded：sleep timer 被真实工作承接；sleep_invalidated：所属生命周期失效。
        - user_cancelled：排队中被人撤回或取消；merged_into_interrupt：其中的消息已全部转入打断提醒；no_pending_messages：提醒承载的消息已全部被读取或取消。
        后五种都没有执行工具或模型，对话流中应隐藏 user_cancelled、merged_into_interrupt、no_pending_messages 三种。
      type: [string, "null"]
      enum: [user_interrupt, user_stopped, server_restart, sleep_superseded, sleep_invalidated, user_cancelled, merged_into_interrupt, no_pending_messages, null]

    ToolState:
      type: string
      enum: [started, succeeded, failed]

    ToolEvent:
      type: object
      required: [toolCallId, toolName, state, at]
      additionalProperties: false
      properties:
        toolCallId: { type: string }
        toolName: { type: string }
        state: { $ref: "#/components/schemas/ToolState" }
        at: { type: string, format: date-time }

    Run:
      type: object
      required: [id, status, phase, endReason, errorCode, errorMessage, configVersion, whenBusy, queuedAt, startedAt, runningAt, abortRequestedAt, endedAt, tools, usage, model]
      additionalProperties: false
      properties:
        triggerInboxMessageId:
          description: 触发本轮平台提醒的原 Inbox 消息 ID；无触发消息的历史及普通来源省略
          type: string
          format: uuid
        wakeSleepId:
          description: 本轮有效承接的 sleep；普通历史可省略或为 null
          type: [string, "null"]
          format: uuid
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/RunStatus" }
        phase: { $ref: "#/components/schemas/RunPhase" }
        endReason: { $ref: "#/components/schemas/RunEndReason" }
        errorCode:
          description: 仅 status 为 failed 时有值
          oneOf:
            - $ref: "#/components/schemas/RunErrorCode"
            - type: "null"
        errorMessage: { type: [string, "null"] }
        configVersion:
          description: 开始执行时使用的配置版本；排队中为发送时的配置版本
          type: integer
        whenBusy:
          description: 发送时 Agent 正忙所做的选择；空闲时发送为 null
          oneOf:
            - $ref: "#/components/schemas/WhenBusy"
            - type: "null"
        queuedAt: { type: string, format: date-time }
        startedAt:
          description: 派发时间：离开队列、开始处理
          type: [string, "null"]
          format: date-time
        runningAt:
          description: 进入回复的时间：消息已交给 Pi
          type: [string, "null"]
          format: date-time
        abortRequestedAt:
          description: 发起打断的时间；没有被打断时为 null
          type: [string, "null"]
          format: date-time
        endedAt: { type: [string, "null"], format: date-time }
        tools:
          type: array
          items: { $ref: "#/components/schemas/ToolEvent" }
        usage:
          description: 这次执行全部用量之和（含压缩、缓存预热与工具用量）
          $ref: "#/components/schemas/UsageTotals"
        model:
          description: 这次执行实际使用的提供方与模型（最后一次模型调用报告的值）；没有模型调用时为 null
          oneOf:
            - $ref: "#/components/schemas/ModelRef"
            - type: "null"

    UsageTotals:
      description: 若干条用量之和；total 按 输入 + 输出 + 缓存读 + 缓存写 计算
      type: object
      required: [calls, input, output, cacheRead, cacheWrite, total]
      additionalProperties: false
      properties:
        calls: { type: integer, minimum: 0 }
        input: { type: integer, minimum: 0 }
        output: { type: integer, minimum: 0 }
        cacheRead: { type: integer, minimum: 0 }
        cacheWrite: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }

    MessageRole:
      type: string
      enum: [user, assistant]

    MessageOrigin:
      description: 对话消息的来源：console 为控制台发送；inbox_reminder 为收到 Inbox 消息后的平台提醒；sleep_wake 为到期后接续原会话的平台唤醒
      type: string
      enum: [console, inbox_reminder, sleep_wake]

    Message: {"type":"object","required":["id","role","origin","text","createdAt","sessionEpoch","run"],"additionalProperties":false,"properties":{"id":{"type":"string","format":"uuid"},"role":{"$ref":"#/components/schemas/MessageRole"},"origin":{"description":"取自所属执行，用户消息与对应的回复相同。平台提醒那一轮的用户消息正文是开始执行时生成的提醒文字","$ref":"#/components/schemas/MessageOrigin"},"text":{"type":"string"},"createdAt":{"type":"string","format":"date-time"},"sessionEpoch":{"type":"integer","minimum":1},"run":{"description":"该消息所属的执行；用户消息与对应回复带同一个执行","$ref":"#/components/schemas/Run"},"images":{"type":"array","items":{"$ref":"#/components/schemas/MessageImage"}}}}
    MessagePage:
      type: object
      required: [messages, hasMore, hasMoreAfter]
      additionalProperties: false
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        hasMore:
          description: 这一页之前还有更早的消息
          type: boolean
        hasMoreAfter:
          description: 这一页之后还有更新的消息；取最新一页时恒为 false
          type: boolean

    SendMessageInput: {"type":"object","required":["text"],"additionalProperties":false,"properties":{"text":{"type":"string"},"whenBusy":{"$ref":"#/components/schemas/WhenBusy"},"imageIds":{"type":"array","uniqueItems":true,"items":{"type":"string","format":"uuid"},"description":"先在当前会话上传的图片ID；不得跨Agent/任务/节点复用。纯图片text传空字符串，数量上限取context.limits。"}},"allOf":[{"anyOf":[{"properties":{"text":{"pattern":"\\S"}}},{"required":["imageIds"],"properties":{"imageIds":{"minItems":1}}}]}]}
    SendMessageResult:
      type: object
      required: [message, run]
      additionalProperties: false
      properties:
        message: { $ref: "#/components/schemas/Message" }
        run: { $ref: "#/components/schemas/Run" }

    ProcessState:
      type: string
      enum: [stopped, starting, idle, busy]

    AgentStatus:
      type: object
      required: [sleep, sleepRevision, agentId, busy, currentRun, queued, processState, processPid, processStartedAt, session]
      additionalProperties: false
      properties:
        sleep:
          description: 当前作用域正在生效的 sleep；登记尚未收尾或没有等待时为 null
          oneOf:
            - $ref: "#/components/schemas/SleepInfo"
            - type: "null"
        sleepRevision: { type: integer, format: int64, minimum: 0 }
        agentId: { type: string, format: uuid }
        busy: { type: boolean }
        currentRun:
          oneOf:
            - $ref: "#/components/schemas/Run"
            - type: "null"
        queued: { $ref: "#/components/schemas/QueueCounts" }
        processState: { $ref: "#/components/schemas/ProcessState" }
        processPid:
          description: Pi 进程号；进程存活（idle、busy）时有值
          type: [integer, "null"]
        processStartedAt:
          description: Pi 进程的启动时间；进程存活时有值
          type: [string, "null"]
          format: date-time
        session: { $ref: "#/components/schemas/SessionInfo" }

    SseSnapshot:
      type: object
      required: [status, currentText, queuedRuns, queueItems]
      additionalProperties: false
      properties:
        status: { $ref: "#/components/schemas/AgentStatus" }
        currentText:
          description: 当前执行已产生的文字；没有进行中的执行时为 null
          type: [string, "null"]
        queuedRuns:
          description: 排队中的执行，按处理顺序排列
          type: array
          items: { $ref: "#/components/schemas/Run" }
        queueItems:
          description: 逐条排队列表，结构同 `GET /agents/{agentId}/queue` 的 items
          type: array
          items: { $ref: "#/components/schemas/QueueItem" }

    SseMessageCreated:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message: { $ref: "#/components/schemas/Message" }

    SseRunUpdated:
      type: object
      required: [run]
      additionalProperties: false
      properties:
        run: { $ref: "#/components/schemas/Run" }

    SseQueueUpdated:
      description: 排队列表发生了变化；客户端用 items 整体替换逐条列表，queuedRuns 同 snapshot.queuedRuns
      type: object
      required: [queuedRuns, items]
      additionalProperties: false
      properties:
        queuedRuns:
          description: 全部排队中的执行，按实际出队顺序排列
          type: array
          items: { $ref: "#/components/schemas/Run" }
        items:
          description: 逐条排队列表，结构同 `GET /agents/{agentId}/queue` 的 items
          type: array
          items: { $ref: "#/components/schemas/QueueItem" }

    QueueItem:
      description: 排队列表中的一项：一条仍待处理的消息
      type: object
      required: [kind, runId, messageId, from, text, images, whenBusy, queuedAt]
      additionalProperties: false
      properties:
        kind:
          description: run 为控制台在对话中发出的消息（一次执行一条）；inbox 为 Inbox 消息（由平台提醒或节点轮次承载）
          type: string
          enum: [run, inbox]
        runId:
          description: 承载它的排队执行（任务节点为轮次）
          type: string
          format: uuid
        messageId:
          description: kind=inbox 时为 Inbox 消息 ID；kind=run 时为 null
          type: [string, "null"]
          format: uuid
        from: { $ref: "#/components/schemas/InboxParticipant" }
        text:
          description: 全文；纯图片消息为空字符串
          type: string
        images:
          type: array
          items: { $ref: "#/components/schemas/MessageImage" }
        whenBusy: { $ref: "#/components/schemas/WhenBusy" }
        queuedAt:
          description: kind=run 为入队时间，kind=inbox 为消息发送时间
          type: string
          format: date-time

    AgentQueue:
      type: object
      required: [agentId, items]
      additionalProperties: false
      properties:
        agentId: { type: string, format: uuid }
        items:
          description: 按实际处理顺序排列
          type: array
          items: { $ref: "#/components/schemas/QueueItem" }

    AgentQueueActionInput:
      type: object
      required: [actionId]
      additionalProperties: false
      properties:
        actionId:
          description: 客户端生成；结果未知时用同一 actionId 重试
          type: string
          format: uuid

    AgentQueueActionReceipt:
      type: object
      required: [actionId, agentId, operation, status, item, run, queue]
      additionalProperties: false
      properties:
        actionId: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        operation:
          type: string
          enum: [promote_run, cancel_run, stop_run, promote_inbox_message, cancel_inbox_message]
        status:
          type: string
          enum: [accepted, already_interrupt, already_cancelled, already_stopping]
        item:
          description: 动作针对的排队项在动作时的内容（撤回或取消时供“编辑”回填）；停止为 null
          oneOf:
            - $ref: "#/components/schemas/QueueItem"
            - type: "null"
        run:
          description: 动作后的相关执行：转为打断时为现在承载它的执行，撤回、取消时为原承载执行，停止时为被停止的执行
          oneOf:
            - $ref: "#/components/schemas/Run"
            - type: "null"
        queue:
          description: 动作完成时的排队列表；之后的变化以 queue.updated 为准
          type: array
          items: { $ref: "#/components/schemas/QueueItem" }

    RunNotQueuedDetails:
      description: run_not_queued 的详情：排队项的当前状态
      type: object
      required: [runId, status, whenBusy]
      additionalProperties: false
      properties:
        runId:
          description: 执行，或 Inbox 消息当前的承载执行；消息没有承载执行时为 null
          type: [string, "null"]
          format: uuid
        status:
          type: [string, "null"]
          enum: [queued, starting, running, aborting, completed, failed, interrupted, null]
        whenBusy:
          oneOf:
            - $ref: "#/components/schemas/WhenBusy"
            - type: "null"
        messageId:
          description: 针对 Inbox 消息的动作时给出
          type: string
          format: uuid
        messageState:
          description: read：已读；cancelled：已取消；dispatched：承载执行已开始或结束；not_queued：没有排队中的承载执行
          type: string
          enum: [read, cancelled, dispatched, not_queued]

    RunNotActiveDetails:
      description: run_not_active 的详情：要停止的执行当前的状态
      type: object
      required: [runId, status]
      additionalProperties: false
      properties:
        runId: { type: string, format: uuid }
        status: { type: string, enum: [queued, starting, running, aborting, completed, failed, interrupted] }

    SseRunText:
      type: object
      required: [runId, delta]
      additionalProperties: false
      properties:
        runId: { type: string, format: uuid }
        delta: { type: string }

    SseRunTool:
      type: object
      required: [runId, toolCallId, toolName, state, at]
      additionalProperties: false
      properties:
        runId: { type: string, format: uuid }
        toolCallId: { type: string }
        toolName: { type: string }
        state: { $ref: "#/components/schemas/ToolState" }
        at: { type: string, format: date-time }

    SseRunEnded:
      type: object
      required: [run, message]
      additionalProperties: false
      properties:
        run: { $ref: "#/components/schemas/Run" }
        message:
          description: 这次执行的回复；以其中的文字为最终回复
          $ref: "#/components/schemas/Message"

    SseSessionUpdated:
      type: object
      required: [state, epoch]
      additionalProperties: false
      properties:
        state: { $ref: "#/components/schemas/SessionState" }
        epoch: { type: integer, minimum: 1 }

