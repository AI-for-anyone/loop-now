  /health:
    get:
      tags: [context]
      operationId: getHealth
      x-access: console-and-external
      summary: Health of the local database (including WAL size)
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: All available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: At least one item unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /model-providers:
    get:
      tags: [models]
      operationId: listModelProviders
      x-access: console-and-external
      summary: Provider catalog of the pinned Pi version after merging the native models.json, plus the providers registered by installed plugins
      description: |
        The catalog changes after a plugin is installed, updated or uninstalled and after models.json is saved (there is no
        version number or push event; the console reads it again after these operations).
        With agentId, providers whose source is plugin also give `unavailableReason`, the reason this Agent cannot use them
        right now (read it again after project enablement or grants change, too).
        With agentId, projectId or scope=platform, every provider gives `usable` (see ModelProvider.usable); at most one
        of the three may be given (422 otherwise). Read it again after accounts, keys or logins change.
        With include=models, every provider also carries its models, so a picker can search all models at once.
      parameters:
        - name: agentId
          in: query
          required: false
          description: Marks for plugin providers whether this Agent can use them, and for every provider whether this Agent has an account or key for it; returns 404 if the Agent does not exist
          schema: { type: string, format: uuid }
        - name: projectId
          in: query
          required: false
          description: For a new Agent in this project (no Agent yet), whether the project has an account for each provider; returns 404 if the project does not exist
          schema: { type: string, format: uuid }
        - name: scope
          in: query
          required: false
          description: platform asks the same for a new platform Agent (no Agent yet), which has no keys or logins of its own until they are entered
          schema: { type: string, enum: [platform] }
        - name: include
          in: query
          required: false
          description: models adds each provider's models (ModelProvider.models)
          schema: { type: string, enum: [models] }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Provider list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelProviderList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /model-settings:
    get:
      tags: [models]
      operationId: getModelSettings
      x-access: console
      summary: Read the global native models.json document
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Current document and revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [models]
      operationId: putModelSettings
      x-access: console
      summary: Validate the native models.json with the pinned Pi version and save it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelSettingsPut" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Saved document and revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /local-mode-settings:
    get:
      tags: [local-mode]
      operationId: getLocalModeSettings
      x-access: console
      summary: Read the four local mode switches
      description: |
        Personal edition "Local mode": lets Agents directly use what already exists on the user's computer, with one switch for
        each of four items. directories, git and cli are on by default after a fresh install and after an upgrade;
        logins amounts to letting Agents use local tools as the user in person, so it is off by default after both a fresh
        install and an upgrade, and the user must turn it on.
        - directories: "Bind local directories". The local directories registered for projects and Agents are written into
          the "Folders and context" section of the Pi system prompt; when off, the lists are still saved but given to no Agent.
        - git: "Use local git identity". "Pull from Git" uses the server process user's real HOME, SSH_AUTH_SOCK and the local
          credential helper; the Agent's gh credential is still used only for github.com.
        - cli: "Use local CLIs". Appends the user's PATH after the execution PATH (the bundled Node, loopctl and the CLI
          template directories still come first); does not change HOME or login state.
        - logins: "Use local logins". HOME of Pi and its child processes (plus USERPROFILE, APPDATA and LOCALAPPDATA on
          Windows) becomes the server process user's real one,
          so the existing logins of the local tools can be used directly; a CLI with an account configured for the Agent in
          Loop Now still uses the configured account (pointed back to the Agent directory through each tool's own config
          directory variable),
          and Pi's sessions and config, Loop Now's credential files and plugin data never land in the user's directory.
          Independent of cli: with only logins on, only commands already in the execution PATH can use the local logins.
        Changes to directories, cli and logins take effect the next time Pi starts (the next dispatch that detects a change
        restarts it without interrupting a reply in progress; the same goes for instances inside tasks); git takes effect
        from the next pull.
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Current switches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalModeSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [local-mode]
      operationId: updateLocalModeSettings
      x-access: console
      summary: Change local mode switches (only the fields in the request are changed)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalModeSettingsPatch" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: All switches after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalModeSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /runtimes:
    get:
      tags: [models]
      operationId: listRuntimes
      x-access: console
      summary: Whether each Agent runtime is available on this computer
      description: |
        pi is the bundled Pi and is always available. The other runtimes are CLIs installed on the user's computer
        (claude-code: claude; codex: codex): the CLI is looked up in the PATH of the server user's login shell and its
        --version is run; a version older than RuntimeDefinition.minVersion is reported as version_unsupported. The login
        state is answered by the CLI itself (claude auth status, codex login status; the platform neither reads nor stores
        its credentials), and only whether it is logged in, the login method and the subscription type are given; email
        and organization are not returned. A CLI can report a login that its service has since revoked; runs then fail
        with runtime_login_required.
        When the login state cannot be determined, state is unknown, and errors are then reported as they are only when a run
        fails (runtime_login_required and so on). Results are cached for 30 seconds; refresh=true checks again.
      parameters:
        - name: refresh
          in: query
          required: false
          schema: { type: boolean }
          description: When true, skip the cache and check again
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Status of each runtime, pi first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /runtime-definitions:
    get:
      tags: [models]
      operationId: listRuntimeDefinitions
      x-access: console
      summary: What each Agent runtime is, without checking this computer
      description: |
        The fixed definition of each runtime: its name, the model providers it runs, which runtime is the default, and
        what it can do. Reading it starts no process and checks nothing on this computer, so it answers at once; whether
        a runtime is installed and logged in is GET /runtimes. The list changes when the server is upgraded and when a
        local ACP command is added or removed (POST and DELETE /acp-commands).
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Each runtime, pi first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeDefinitionList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /acp-commands:
    get:
      tags: [models]
      operationId: listAcpCommands
      x-access: console
      summary: The local ACP commands people added
      description: |
        A local ACP command is any program on this computer that speaks the Agent Client Protocol over stdio, added by
        a person: the platform runs it as a runtime of its own (AcpCommand.runtime), with one model provider of the same
        id. Its environment values are never returned, only their names.
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The commands, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcpCommandList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [models]
      operationId: createAcpCommand
      x-access: console
      summary: Add a local ACP command
      description: |
        The executable is a name looked up on the PATH of the server user's login shell, or an absolute path; it is run
        directly with the arguments as given (no shell). The program uses its own login on this computer; the
        environment given here is added to the one Agents run with (for example a key the program needs). Its runtime
        and model provider appear at once in GET /runtime-definitions and GET /model-providers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcpCommandCreate" }
      responses:
        "201":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The command added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcpCommand" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /acp-commands/{commandId}:
    parameters:
      - name: commandId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [models]
      operationId: updateAcpCommand
      x-access: console
      summary: Change a local ACP command
      description: |
        Fields left out stay as they are. env is merged into the saved environment: a name with a string sets it, a
        name with null removes it, and names not mentioned keep their saved values. Agents running it pick the change
        up from their next message.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcpCommandUpdate" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The command after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcpCommand" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [models]
      operationId: deleteAcpCommand
      x-access: console
      summary: Remove a local ACP command
      description: |
        Returns 409 `runtime_in_use` (details is RuntimeInUseDetails, naming the Agents) while an Agent (not deleted) has
        its model provider; move those Agents to another model first. The sessions the program kept are left as they
        are.
      responses:
        "204":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Removed
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /text-generation-settings:
    get:
      tags: [text-generation]
      operationId: getTextGenerationSettings
      x-access: console
      summary: Who writes with AI ("Write with AI"), and who would write right now
      description: |
        "Write with AI" drafts a Prompt (POST /prompt-drafts) with one short run of a CLI installed on this computer,
        using that CLI's own login; no Agent is created. Only runtimes whose accounts are local
        (RuntimeCapabilities.accounts) write; the bundled Pi does not.
        selection is the runtime model a person chose; null is Automatic: the first ready runtime in the order Claude
        Code, Codex, Antigravity, Grok, then the local ACP commands in the order they were added, with a small model from
        its live model list: Claude Code a Haiku model, Codex a Luna model (else a -mini model) at the low thinking
        level, Antigravity a Neon model (else a Flash model) at its lowest thinking level, the others their first listed
        model; the first listed model when no preferred one is listed, and the model's default thinking level when the
        preferred one is not offered. A
        runtime is ready when GET /runtimes reports it available and not logged out (its 30-second cache is used) and
        its model list has the model.
        writer says who would write now: the chosen one when it is ready; otherwise Automatic's choice, with fellBack
        true when a chosen one was passed over; null when no runtime is ready.
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The setting and who would write now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TextGenerationSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [text-generation]
      operationId: putTextGenerationSettings
      x-access: console
      summary: Choose who writes with AI
      description: |
        selection null goes back to Automatic. A provider that no runtime with local accounts runs is refused (422,
        field selection.provider). The model and thinking level are not checked against the live model list, which can
        be out of date while a CLI is logged out; when writing, one that is not listed then falls back to Automatic.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TextGenerationSettingsPut" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The saved setting and who would write now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TextGenerationSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /prompt-drafts:
    post:
      tags: [text-generation]
      operationId: createPromptDraft
      x-access: console
      summary: Write a draft of an Agent's or a project's Prompt with AI
      description: |
        Asks the writer (GET /text-generation-settings; a chosen one that is not ready falls back to Automatic for this
        request, with writer.fellBack true) once and returns its draft. Nothing is saved: the console puts the draft in
        the editor, and the person saves as usual.
        The writer runs as a new session of the CLI in an empty temporary folder that is removed afterwards, with the
        CLI's own login and without Loop Now Skills, loopctl, plugins, MCP servers or tools; every permission request
        is refused, and the session is not kept in the CLI's history. The model is given an instruction for an Agent
        Prompt or a project Prompt, the Agent's name, the project's name and its Prompt (for an Agent in a project, so
        the Agent Prompt does not repeat it), currentText and request. One surrounding code fence is removed from the
        reply.
        The request is answered when the draft is ready (at most 3 minutes); closing the request stops the CLI at once.
        The texts of the request and the draft are not logged. A few drafts are written at a time; more wait for their
        turn within the same 3 minutes.
        Errors: 409 text_generation_unavailable when no runtime is ready (the message says how to set one up); 502
        text_generation_failed when the CLI fails, tries to use a tool, runs over 3 minutes or returns nothing (the
        message carries the CLI's own reason, such as a used-up limit or a revoked login); 404 for an Agent or project
        that does not exist; 422 when request and currentText are both empty, a text is too long, or the ids do not
        fit the target.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromptDraftRequest" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The draft and who wrote it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromptDraft" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "502":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The writer failed (text_generation_failed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /path-picks:
    post:
      tags: [path-picks]
      operationId: createPathPick
      x-access: console
      summary: Choose a folder or file in this computer's own dialog and get its full path
      description: |
        For the console in a browser, which cannot learn a full path (the desktop app uses its own dialog instead). The
        console port listens only on this computer, so the dialog shows on the screen the browser is on.
        The dialog opens in front of other windows (it may take one click before it gets the keyboard), and the request
        is answered when the person chooses or cancels, with no time limit; closing the request closes the dialog at
        once. One dialog is open at a time.
        kind directory chooses a folder, with a button to make a new one; kind file chooses a file, with hidden files
        shown. On macOS a chosen application (.app) stands for the program inside it, Contents/MacOS/ and the
        CFBundleExecutable from its Info.plist; when that cannot be read or is not there, the .app is returned as chosen.
        defaultPath, such as the field's current value, is where the dialog opens when, without surrounding spaces, it is
        an absolute path that exists (a file opens its folder); anything else opens the dialog where it usually opens.
        Only macOS for now, in a logged-in desktop session; Context.pathPicker says whether it works here.
        Errors: 409 path_picker_unavailable when this computer cannot show the dialog (the message says why); 409
        path_picker_busy when a dialog is already open; 422 when defaultPath holds a NUL character.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PathPickRequest" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The chosen path, or null when the person cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PathPick" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /model-providers/{providerId}/models:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
    get:
      tags: [models]
      operationId: listModels
      x-access: console-and-external
      summary: Models of one provider
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Model list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cli-templates:
    get:
      tags: [cli-templates]
      operationId: listCliTemplates
      x-access: console-and-external
      summary: Built-in CLI template catalog
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Template list
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: "#/components/schemas/CliTemplate" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      x-access: console-and-external
      summary: All non-deleted projects in the default organization
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Project list; the default project first, the rest sorted by name
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                additionalProperties: false
                properties:
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [projects]
      operationId: createProject
      x-access: console-and-external
      summary: Create a project in the default organization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "201":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [projects]
      operationId: getProject
      x-access: console-and-external
      x-plugin-scope: agents.read
      summary: Project details; a deleted project returns 404
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [projects]
      operationId: updateProject
      x-access: console-and-external
      summary: Rename; the addresses of the Agents in the project change with it; renaming works even while Agents in the project are busy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The updated project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [projects]
      operationId: deleteProject
      x-access: console-and-external
      summary: Soft delete a project
      description: |
        Requires every non-deleted Agent in the project to be idle (no reply in progress and no queued messages), otherwise
        returns 409 `agent_not_idle` with details of type ProjectNotIdleDetails. After deletion, the project and its Agents are
        handled as in "Delete Agent" (Pi is stopped and the credential ciphertext and credential files are deleted, while the
        working folder, session files and conversation history are kept), the Manager is cleared, and the name can be reused.
        The default project cannot be deleted; that returns 422 `validation_failed` (field `projectId`).
      responses:
        "204":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /projects/{projectId}/prompt:
