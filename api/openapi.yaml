    TaskLarkSwitchParticipant:
      type: object
      additionalProperties: false
      description: 仅控制台从本task冻结实例/原snapshot及有效overlay读取；可用不保证后续POST成功，不自动选成员。
      required: [agentId, runtimeId, baseSnapshotSHA, larkAllowed, bindingRevision, prepared, available, unavailableReason, stepIds]
      properties:
        agentId:
          type: string
          format: uuid
        runtimeId:
          type: string
          format: uuid
        baseSnapshotSHA:
          type: string
          pattern: '^[a-f0-9]{64}$'
        larkAllowed:
          type: [boolean, 'null']
          description: 原冻结snapshot的Lark许可；原snapshot无法可靠校验时为null，绝不读取当前Agent权限补齐。
        bindingRevision:
          type: integer
          format: int64
          minimum: 0
          description: 本task当前有效覆盖revision，无覆盖为0；最终POST仍须锁内CAS。
        prepared:
          type: boolean
          description: 现有实例准备状态；未准备的未来followup也必须返回，GET不准备它。
        available:
          type: boolean
          description: 只读静态资格提示，不代表进程/队列已锁定或POST必然成功。
        unavailableReason:
          type: [string, 'null']
          description: 不可用时的固定安全原因码；不含路径、上游错误或秘密，可用时为null。
        stepIds:
          type: array
          items: {type: string}
          description: 原冻结workflow中引用此Agent的step ID，仅供人确认，不据名称推断publisher/followup。
