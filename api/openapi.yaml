  /agents/{agentId}/folder/entries:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      tags: [folders]
      operationId: listAgentFolderEntries
      x-access: console
      summary: 列出 Agent 文件夹中的一层（懒加载）
      description: |
        只列 `path` 这一层，不递归、不统计目录大小；目录在前，同类按名称排序。`limit` 默认 500、上限 2000，
        有更多时返回 `nextCursor`，原样传回取下一页。Agent 文件夹就是它的工作目录（Pi 的 cwd），也是它自己的上下文；常态与平台 Agent 各有一个。
      parameters:
        - $ref: "#/components/parameters/FolderPath"
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 这一层的条目
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderEntryPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [folders]
      operationId: deleteAgentFolderEntry
      x-access: console
      summary: 删除 Agent 文件夹中的一个文件或目录（含其全部内容）
      description: |
        先移到文件夹外的回收区（立即返回），再在后台删除，不提供恢复。软链接只删链接本身。不能删除文件夹根。
      parameters:
        - $ref: "#/components/parameters/FolderEntryPath"
      responses:
        "204":
          description: 已删除
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /agents/{agentId}/folder/content:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      tags: [folders]
      operationId: getAgentFolderFileContent
      x-access: console
      summary: 下载 Agent 文件夹中的一个文件（原始字节）
      description: 支持 Range；只下载单个文件，不提供目录打包。文本与否由客户端判断，在线编辑的大小上限见 `Context.limits.textEdit`。
      parameters:
        - $ref: "#/components/parameters/FolderEntryPath"
      responses:
        "200":
          description: 文件内容
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: 请求的字节范围
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    put:
      tags: [folders]
      operationId: putAgentFolderFileContent
      x-access: console
      summary: 上传、新建或保存（在线编辑） Agent 文件夹中的一个文件
      description: |
        请求体为文件的原始字节，流式写入同目录的临时文件后改名，读取方不会看到写了一半的文件；缺少的上级目录自动创建。
        没有锁，最后一次写入为准。`create=true` 时目标已存在返回 409 `path_conflict`（新建文件用）。
        目标是软链接或目录时返回 422。单个文件上限见 `Context.limits.maxFolderUpload`，超过返回 413。上传文件夹时客户端按相对路径逐个上传。
      parameters:
        - $ref: "#/components/parameters/FolderEntryPath"
        - name: create
          in: query
          required: false
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

