    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [observability]
      operationId: getRunTimeline
      x-access: console-and-external
      x-plugin-scope: runs.read
      summary: 一次执行的运行记录时间线
      description: |
        条目按时间排序：生命周期事件、每个工具调用（开始与结束合并为一条）、每次模型调用的用量。
        执行进行中时返回到目前为止的条目。本变更之前的执行没有详细事件，按执行信息中的时间合成条目。
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 时间线
