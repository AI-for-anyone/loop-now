  /projects/{projectId}/local-directories:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [local-mode]
      operationId: getProjectLocalDirectories
      x-access: console
      summary: The project's local directory list (applies to every Agent in the project, including instances in tasks)
      description: |
        Each entry carries its status as read by the server at request time. A project that has never saved a list
        returns revision 0 and an empty list. Local directories are "extra mounts": the Agent's own folder, task copies
        and the trash stay unchanged. Pi is not sandboxed, so the list informs and manages; it does not isolate
        permissions. Agents (including instances in tasks) have full read and write access to these directories, and
        changes land directly on the user's real files.
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectLocalDirectories" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [local-mode]
      operationId: putProjectLocalDirectories
      x-access: console
      summary: Replace the project's whole local directory list
      description: |
        `expectedRevision` must equal the current revision (0 if never saved), otherwise 412 `precondition_failed`; on
        success the revision increases by one. Validation rules are in `LocalDirectoryInput`. A validation failure
        returns 422 `validation_failed`; the field of a field error looks like `directories[2].path` or
        `directories[2].note`, and is `directories` when there are too many entries. A path that does not exist or is
        not a directory does not block saving; the status in the response marks it. After the list changes, the Pi of
        each affected Agent restarts with the new list at its next dispatch (a reply in progress is not interrupted).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalDirectoriesPut" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The saved list (with status)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectLocalDirectories" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /agents/{agentId}/local-directories:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      tags: [local-mode]
      operationId: getAgentLocalDirectories
      x-access: console
      summary: The Agent's own local directory list, plus the entries inherited from its project
      description: |
        `directories` is the Agent's own list (editable); `inherited` is its project's list (read-only, the same as the
        project endpoint returns). A platform Agent has no project: `projectId` is null and `inherited` is empty, and
        its own list works as usual. In effect, the project's entries come first and the Agent's own after them; the
        same path counts only once. A regular Agent's list also applies to its instances in tasks. Revision is 0 if
        never saved.
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The list
          content:
            application/json:
