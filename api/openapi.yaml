        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProjectCredentialCreate"
  "/projects/{projectId}/credential-accounts/{accountId}":
    get:
      tags:
      - credentials
      operationId: getProjectCredentialAccount
