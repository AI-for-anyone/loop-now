  "/agents/{agentId}/credential-selections":
    get:
      tags:
      - credentials
      operationId: getAgentCredentialSelections
      x-access: console-and-external
      description: For a project Agent, returns the currently saved model provider, the saved records of other providers
        and the allowed template CLIs. There is no provider filter; a platform Agent returns 422. Candidates are never
        filtered by availability.
      parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          headers:
