    post:
      tags: [folders]
      operationId: startAgentFolderGitPull
      x-access: console
      summary: 从 Git 一次性拉取一个分支到 Agent 文件夹的子目录
      description: |
        只拉取这一个分支，保留它的完整历史（`clone --single-branch --branch`，不截断），之后就是普通文件，不再同步。
        使用该 Agent 当前配置里的 gh CLI 凭证（项目 GitHub 账号）；没有配置 gh 时匿名克隆，只能拉公开仓库。
        `path` 必须不存在或是空目录，否则返回 409 `path_conflict`；同一目标已有进行中的拉取时同样返回 409。
