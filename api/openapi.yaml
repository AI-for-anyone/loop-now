                  }
                }
              },
              {
                "required": [
                  "larkIdentity"
                ],
                "properties": {
                  "purpose": {
                    "const": "cli"
                  },
                  "cli": {
                    "const": "lark-cli"
                  },
                  "authMethod": {
                    "const": "oauth"
                  },
                  "currentVersionId": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "larkIdentity": {
                    "$ref": "#/components/schemas/LarkIdentity"
                  }
                }
              }
            ]
          }
        ],
        "properties": {
          "githubIdentity": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/GitHubIdentity"
              },
              {
                "type": "null"
              }
            ]
          },
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "projectId": {
            "type": "string",
            "format": "uuid"
          },
          "purpose": {
            "$ref": "#/components/schemas/ProjectCredentialPurpose"
          },
          "provider": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ]
          },
          "cli": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ]
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "accountLabel": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ]
          },
          "revision": {
