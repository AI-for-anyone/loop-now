                "$ref": "#/components/schemas/InboxReadInput"
              }
            }
          }
        },
        "description": " 严格任务 Inbox 的 Agent 必须提供所属实际运行中的 runId；普通旧 Inbox 可省略。失效或跨节点不改投、不推断当前 run。"
      }
    }
  /inbox/pending:
    get:
      tags: [inbox]
      operationId: getInboxPending
      x-access: console
      summary: 控制台待处理的 Inbox：发给 @console 的 open 问题与其他未读消息，带发件项目与任务归属，并按 Agent、任务汇总；只读
      description: |
        不分页。收件箱事件流（`GET /inbox/events`）的任何事件都可能改变结果，客户端据此重新获取；没有单独的事件。
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 待处理汇总
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxPending" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /inbox/events:
    get:
      tags: [inbox]
      operationId: streamInboxEvents
      x-access: console
      summary: 收件箱事件流（SSE），覆盖全部 Inbox 消息
      description: |
        `text/event-stream`，快照与续传规则同 `GET /agents/{agentId}/events`：不带 `Last-Event-ID` 或它已超出保留范围时，先发一条 `snapshot`。
        事件在消息写入数据库并提交之后发布，只带摘要；`unreadTotal` 都是控制台操作者的未读总数，越靠后的事件越新。
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 事件流
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-sse-events:
        snapshot: { $ref: "#/components/schemas/SseInboxSnapshot" }
        inbox.message.created: { $ref: "#/components/schemas/SseInboxMessageCreated" }
        inbox.message.read: { $ref: "#/components/schemas/SseInboxMessageRead" }
        inbox.message.cancelled: { $ref: "#/components/schemas/SseInboxMessageCancelled" }
        inbox.question.updated: { $ref: "#/components/schemas/SseInboxMessageCreated" }

