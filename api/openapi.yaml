openapi: 3.1.0
info:
  title: Loop Now 控制台 API
  version: 0.1.0
  description: |
    Loop Now 服务端提供给 Web 控制台的接口契约，由服务端维护（变更 add-server-first-loop）。
    控制台据此生成类型；服务端用契约测试保证实际行为与本文件一致。

    约定：
    - 所有 JSON 字段使用 camelCase；时间为 RFC 3339 字符串；ID 为 UUID。
    - 错误响应统一使用 `Error` 结构。
    - 每个响应都带 `Loop-Now-Request-Id` 头（本次请求的编号）与 `Loop-Now-Version` 头（服务端版本）。
    - SSE 事件流见 `GET /agents/{agentId}/events` 与 `GET /overview/events`，各事件的数据结构见各自的 `x-sse-events`。
    - 可观测（变更 add-observability）：运行记录时间线、用量统计（只统计 token，不提供费用）、异常列表与概览事件流。
    - Inbox 与对外访问（变更 add-inbox-and-external-access）：Agent、控制台操作者与外部身份之间的 Inbox，外部身份与令牌的管理，按地址查找 Agent。
    - 访问范围：每个操作带 `x-access`。`console` 只限控制台；`console-and-external` 同时对外部身份开放。
      - 控制台：回环监听器上的 `/api/v1`，免登录；带 `Authorization` 头的请求（例如带 `lna_` 或 `lne_` 令牌）返回 403 `forbidden`；
      - 外部身份：对外端口（TLS）上的同一组 `/api/v1`，必须带 `Authorization: Bearer lne_…`，缺失或无效时返回 401 `unauthenticated`，调用 `x-access: console` 的操作返回 403 `forbidden`；
      - 对外端口另外提供 loopctl 下载（不在本文件中）：`GET /downloads/loopctl/manifest.json`、`GET /downloads/loopctl/SHA256SUMS`、`GET /downloads/loopctl/{file}`，同样需要外部令牌，响应带 `X-Content-SHA256`。
      - Agent 专用接口见 `api/agent-openapi.yaml`。
      - 插件令牌（插件第二版，plugins/SPEC.md §5）：插件的平台半边在回环监听器的 `/api/v1` 上带 `Authorization: Bearer lnp_…` 调用。
        只能调用标了 `x-plugin-scope` 且该范围在令牌内的操作，否则返回 403 `forbidden`；路径中的项目、Agent、任务须属于启用了该插件的项目（平台 Agent 与全局上下文文件夹除外），否则返回 403。
        插件宿主协议见 `api/plugin-host-protocol.md`。
        插件令牌调用“我的 Inbox”（listInboxMessages、readInboxMessage、线索）时当前身份是这个插件，读到的是发给它的消息（Agent 对它的回复）；
        以 inbox.send 发出的消息发件方为 plugin（plugins/SPEC.md §11），只能发给平台 Agent 或启用了该插件的项目里的 Agent。
      - 插件 HTTP 入口（不在本文件的操作中）：清单 `http: true` 的插件在对外端口（TLS）上有无令牌的 `/hooks/<插件 id>/<任意路径>`，
        在回环监听器上有 `/api/v1/plugins/<插件 id>/http/<任意路径>`（控制台，或该插件自己的插件令牌）。方法、路径、查询、头与正文（不超过 1 MiB，超过返回 413）
        原样交给平台半边，30 秒内的回应原样返回（超时 504 plugin_timeout）；签名校验由插件自己做；每个插件每秒最多 20 次，超出返回 429。
        插件不存在、没有 HTTP 入口或没有在宿主里时返回 404。
    - 项目层（变更 add-project-layer）：项目的管理与 Manager；Agent 属于某个项目或平台，列出与创建按范围进行（`/projects/{projectId}/agents`、`/platform/agents`），单个 Agent 仍按 ID 访问；概览、用量与异常可按 `projectId` 或 `platform` 筛选。
servers:
  - url: http://127.0.0.1:8780/api/v1
    description: 本机开发默认地址（控制台）
  - url: https://{externalHost}/api/v1
    description: 对外端口（开启时），只接受外部令牌
    variables:
      externalHost:
        default: 127.0.0.1:8781
tags:
  - name: context
  - name: models
  - name: cli-templates
  - name: projects
  - name: agents
  - name: folders
  - name: credentials
  - name: skills
  - name: agent-skills
  - name: conversation
  - name: observability
  - name: inbox
  - name: external-identities
  - name: plugins

