    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      tags: [folders]
      operationId: createAgentFolderDirectory
      x-access: console
      summary: Create a directory in an Agent folder (including missing parent directories)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FolderPathInput" }
      responses:
        "201":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Created (an existing directory is returned the same way)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /agents/{agentId}/folder/move:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      tags: [folders]
      operationId: moveAgentFolderEntry
      x-access: console
      summary: Rename or move a file or directory within an Agent folder
      description: Moves only within the same folder; an existing target returns 409 `path_conflict` and is not
