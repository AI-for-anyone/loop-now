        title: { type: string, description: "Truncated text of the first regular user message; an empty string when there are no text messages" }
        preview: { type: string, description: "Truncated text of the last regular user message; an empty string when there are no text messages" }
        updatedAt: { type: string, format: date-time }
        current: { type: boolean }

