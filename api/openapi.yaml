    InboxMessagePage:
      type: object
      required: [messages, nextCursor]
      additionalProperties: false
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/InboxMessageSummary" }
        nextCursor:
          description: Cursor for the next page; null when there are no more
          type: [string, "null"]

    InboxQuestionOptions:
      type: array
      minItems: 1
      maxItems: 10
      uniqueItems: true
      items: {type: string, minLength: 1, maxLength: 50}
    InboxQuestionOption:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id: {type: string}
        label: {type: string}
    InboxAnswer:
      type: object
      additionalProperties: false
      required: [messageId, optionId, optionLabel, textPreview, by, at]
      properties:
        messageId: {type: string, format: uuid}
        optionId: {type: [string, 'null']}
        optionLabel: {type: [string, 'null']}
        textPreview: {type: string}
        by: {$ref: '#/components/schemas/InboxParticipant'}
        at: {type: string, format: date-time}
    InboxQuestion:
      type: object
      additionalProperties: false
      required: [options, expiresAt, state, answer]
      properties:
        options:
          type: array
          items: {$ref: '#/components/schemas/InboxQuestionOption'}
        expiresAt: {type: string, format: date-time}
        state: {type: string, enum: [open, answered, expired, closed, cancelled]}
        answer:
          oneOf:
            - $ref: '#/components/schemas/InboxAnswer'
            - type: 'null'
    InboxAnswerTo:
      type: object
      additionalProperties: false
      required: [messageId, optionId, optionLabel]
      properties:
        messageId: {type: string, format: uuid}
        optionId: {type: [string, 'null']}
        optionLabel: {type: [string, 'null']}
    InboxNotice:
      type: object
      additionalProperties: false
      required: [type, messageId, reason]
      properties:
        type: {type: string, enum: [question_expired]}
        messageId: {type: string, format: uuid}
        reason: {type: string}
    QuestionClosedDetails:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question: {$ref: '#/components/schemas/InboxQuestion'}

    InboxSendInput:
      type: object
      required: [to, text]
      additionalProperties: false
      properties:
        runId:
          type: string
          format: uuid
          not: {const: "00000000-0000-0000-0000-000000000000"}
          description: Ordinary Inbox calls may omit it. A question from a dedicated QA recovery node must carry the exact runId of the current turn; a missing runId or one that belongs elsewhere is rejected inside the original transaction and is not treated as a workflow retry.
        to:
          description: |
            Recipient address, resolved by the server; names match segment by segment, exactly and case-sensitively:
            - `@console`: the console operator; `@<name>`: an external identity that is not deleted;
            - three segments `<organization>/<project>/<Agent>`: looked up only among projects that are not deleted;
            - two segments `<project>/<Agent>`: a project in the sender's organization; for the console operator,
              external identities and platform-held Agents, resolved in the default organization;
            - a single segment shaped like a UUID: the Agent's internal ID;
            - any other single segment: the name of a platform-held Agent;
            - an address with `#<task ID>` resolves to a task instance; when the task has ended, the message goes to the
              current Manager with the original recipient noted.
          type: string
          minLength: 1
        text:
          description: Message text, must not be empty; returns 413 when it exceeds limits.maxInboxMessage bytes
          type: string
          minLength: 1
        whenBusy:
          description: Applies when the recipient is an Agent, defaulting to queue when omitted; ignored when the recipient is a person
          $ref: "#/components/schemas/WhenBusy"
        options: {$ref: '#/components/schemas/InboxQuestionOptions'}
        nodeRunId:
          description: Required when a task instance asks a question and must match the current node access; ordinary identities omit it. Grants no task/runtime permissions.
          type: string
          format: uuid
        channelId:
          description: Valid only for calls with a plugin token (other identities get 422). The plugin channel the message comes from; the Agent's reply goes back to this channel through the thread.
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
        senderName:
          description: Valid only for calls with a plugin token. Sender name shown in the conversation; defaults to the plugin's display name.
          type: string
          minLength: 1
          maxLength: 100

    InboxReplyInput:
      {
        "additionalProperties": false,
        "if": {
          "not": {
            "required": [
              "optionId"
            ]
          }
        },
        "properties": {
          "asIdentityId": {
            "description": "Plugin token only: reply on behalf of an external identity the plugin manages (plugins/SPEC.md §12)",
            "format": "uuid",
            "type": "string"
          },
          "nodeRunId": {
            "description": "Required when a task instance asks a new question; must match the current node access.",
            "format": "uuid",
            "type": "string"
          },
          "optionId": {
            "description": "On the explicit answer path, the chosen option of the original question; the caller must be the question's recipient and the question must be open. When text is omitted, the chosen option's text is recorded automatically.",
            "minLength": 1,
            "type": "string"
          },
          "options": {
            "$ref": "#/components/schemas/InboxQuestionOptions"
          },
          "text": {
            "description": "Message text, must not be empty; returns 413 when it exceeds limits.maxInboxMessage bytes",
            "minLength": 1,
            "type": "string"
          },
          "whenBusy": {
            "$ref": "#/components/schemas/WhenBusy",
            "description": "Applies when the recipient is an Agent, defaulting to queue when omitted; ignored when the recipient is a person"
          },
          "runId": {
            "type": "string",
            "format": "uuid",
            "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
            "not": {
              "const": "00000000-0000-0000-0000-000000000000"
            },
            "description": "An Agent reply in a strict task Inbox must pass the ID of the turn actually running under the original task/node/runtime; it is not inferred from the most recent run."
          }
        },
        "then": {
          "required": [
            "text"
          ]
        },
        "type": "object"
      }
    InboxThreadSummary:
      type: object
      required: [threadId, participants, lastMessage, unreadCount, updatedAt]
      additionalProperties: false
      properties:
        threadId: { type: string, format: uuid }
        participants:
          description: The two parties of the thread (sender and recipient of the first message), including the current identity itself
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/InboxParticipant" }
        lastMessage: { $ref: "#/components/schemas/InboxMessageSummary" }
        unreadCount:
          description: Number of unread messages in the thread addressed to the current identity
          type: integer
          minimum: 0
        updatedAt:
          description: Time of the last message
          type: string
          format: date-time

    InboxThreadPage:
      type: object
      required: [threads, unreadTotal, nextCursor]
      additionalProperties: false
      properties:
        threads:
          type: array
          items: { $ref: "#/components/schemas/InboxThreadSummary" }
        unreadTotal:
          description: Total unread count across all threads of the current identity
          type: integer
          minimum: 0
        nextCursor: { type: [string, "null"] }

    InboxThread:
      type: object
      required: [threadId, messages]
      additionalProperties: false
      properties:
        threadId: { type: string, format: uuid }
        messages:
          description: In chronological order
          type: array
          items: { $ref: "#/components/schemas/InboxMessage" }

    InboxUnreadTotal:
      type: object
      required: [unreadTotal]
      additionalProperties: false
      properties:
        unreadTotal:
          description: The current identity's latest unread total
          type: integer
          minimum: 0

    InboxConversationPage:
      type: object
      required: [messages, nextCursor]
      additionalProperties: false
      properties:
        messages:
          description: Full messages, newest first
          type: array
          items: { $ref: "#/components/schemas/InboxMessage" }
        nextCursor:
          description: Cursor for the next page; null when there are no more
          type: [string, "null"]

    InboxPendingItem:
      type: object
      required: [message, projectId]
      additionalProperties: false
      properties:
        message: { $ref: "#/components/schemas/InboxMessageSummary" }
        projectId:
          description: Project of the sending Agent; null for platform-held Agents, external identities and platform notices
          type: [string, "null"]
          format: uuid

    InboxPendingAgentCount:
      description: Pending item counts where the sender is a regular Agent (not in a task, message.task is null)
      type: object
      required: [agentId, projectId, questions, unread]
      additionalProperties: false
      properties:
        agentId: { type: string, format: uuid }
        projectId: { type: [string, "null"], format: uuid }
        questions: { type: integer, minimum: 0, description: "Number of items in questions from this Agent" }
        unread: { type: integer, minimum: 0, description: "Number of items in unread from this Agent" }

    InboxPendingTaskCount:
      description: Pending item counts where the sender is a task instance (message.task is not null), aggregated per task; node-level numbers can be aggregated from each item's message.task.nodeRunId
      type: object
      required: [taskId, projectId, questions, unread]
      additionalProperties: false
      properties:
        taskId: { type: string, format: uuid }
        projectId: { type: [string, "null"], format: uuid }
        questions: { type: integer, minimum: 0, description: "Number of items in questions that belong to this task" }
        unread: { type: integer, minimum: 0, description: "Number of items in unread that belong to this task" }

    InboxPending:
      description: |
        The console's pending Inbox items, in two lists that never overlap, both newest first:
        - `questions`: questions to `@console` that are still open and not expired (whether read or not);
        - `unread`: other unread messages to `@console` (excluding those cancelled by a person).
        `byAgent` and `byTask` aggregate the entries of both lists: entries whose sender is a regular Agent count toward
        byAgent, entries whose sender is a task instance count toward byTask; external identities and platform notices
        appear only in the lists.
      type: object
      required: [questions, unread, byAgent, byTask]
      additionalProperties: false
      properties:
        questions:
          type: array
          items: { $ref: "#/components/schemas/InboxPendingItem" }
        unread:
          type: array
          items: { $ref: "#/components/schemas/InboxPendingItem" }
        byAgent:
          type: array
          items: { $ref: "#/components/schemas/InboxPendingAgentCount" }
        byTask:
          type: array
          items: { $ref: "#/components/schemas/InboxPendingTaskCount" }

    MultiplexedEvent:
      description: One event of a stream carried by GET /events
      type: object
      required: [stream, id, event, data]
      additionalProperties: false
      properties:
        stream: { type: string, description: "The stream's name, as requested" }
        id: { type: string, description: "The event's id in its own stream (what its own endpoint sends as the SSE id)" }
        event: { type: string, description: "The event's name in its own stream" }
        data:
          description: The event's data, as the stream's own endpoint lists it for that name in x-sse-events

    MultiplexedStreamError:
      description: A stream carried by GET /events that could not be opened or read; it is no longer followed on this connection
      type: object
      required: [stream, error]
      additionalProperties: false
      properties:
        stream: { type: string }
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }

    SseInboxSnapshot:
      type: object
      required: [unreadTotal]
      additionalProperties: false
      properties:
        unreadTotal:
          description: Unread total for the console operator, counted at the same moment as the snapshot position
          type: integer
          minimum: 0

    SseInboxMessageCreated:
      type: object
      required: [message, unreadTotal]
      additionalProperties: false
      properties:
        message: { $ref: "#/components/schemas/InboxMessageSummary" }
        unreadTotal: { type: integer, minimum: 0, description: Latest unread total for the console operator }

    SseInboxMessageRead:
      type: object
      required: [id, threadId, to, readAt, unreadTotal]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        threadId: { type: string, format: uuid }
        to: { $ref: "#/components/schemas/InboxParticipant" }
        readAt: { type: string, format: date-time }
