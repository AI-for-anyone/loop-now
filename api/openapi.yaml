components:
  headers:
    RequestId:
      description: Unique ID of this request (UUIDv7), the same as requestId in the server logs; the console shows it on errors
      required: true
      schema: { type: string, format: uuid }
    Version:
      description: Server version (from the version package shared with loopctl), which loopctl compares against its own; for cross-origin access it is listed in `Access-Control-Expose-Headers` together with `Loop-Now-Request-Id` and `ETag`
      required: true
      schema: { type: string, minLength: 1 }

  parameters:
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PluginId:
      name: pluginId
      in: path
      required: true
      description: Plugin id (loopNow.id in the manifest)
      schema: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$" }
    PluginPreviewId:
      name: previewId
      in: path
      required: true
      description: Preview id (returned by `POST /plugin-previews`)
      schema: { type: string, format: uuid }
    PluginReadmeLocale:
      name: locale
      in: query
      required: false
      description: The language to read, written like the locale keys of plugin text (such as zh-CN or en-US); an invalid value returns 422
      schema: { type: string, pattern: "^[A-Za-z]{2,3}(-[A-Za-z0-9]{1,8})*$" }
    PluginAccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ScopeProjectId:
      name: projectId
      in: query
      required: false
      description: Only Agents in this (non-deleted) project; mutually exclusive with platform, and giving both returns 422. Giving neither means all non-deleted projects and the platform
      schema: { type: string, format: uuid }
    ScopePlatform:
      name: platform
      in: query
      required: false
      description: When true, only platform-owned Agents; mutually exclusive with projectId
      schema: { type: boolean }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FolderPath:
      name: path
      in: query
      required: false
      description: Relative path within the folder; omitted or an empty string means the folder root
      schema: { type: string }
    FolderEntryPath:
      name: path
      in: query
      required: true
      description: Relative path within the folder, such as `docs/intro.md`; must not be empty, contain `..` or start with `/`
      schema: { type: string, minLength: 1 }
    SkillId:
      name: skillId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentSkillId:
      name: agentSkillId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProviderId:
      name: providerId
      in: path
      required: true
      schema: { type: string }
    CliName:
      name: cli
      in: path
      required: true
      schema: { $ref: "#/components/schemas/CliName" }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ThreadId:
      name: threadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdentityId:
      name: identityId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InboxUnread:
      name: unread
      in: query
      required: false
      description: When true, lists only unread messages (no read time); by default both read and unread messages are included
      schema: { type: boolean, default: false }
    PageCursor:
      name: cursor
      in: query
      required: false
      description: The nextCursor returned by the previous page; an opaque string, and an invalid one returns 422
      schema: { type: string, minLength: 1 }
    PageLimit:
      name: limit
      in: query
      required: false
      description: Items per page, default 20; a value over the server limit (default 100, configurable) is capped at that limit
      schema: { type: integer, minimum: 1, default: 20 }

  responses:
    Unauthenticated:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: The token is missing, invalid, expired or revoked, or its identity has been deleted (`unauthenticated`). Occurs only on the external port and on Agent-only endpoints; the error message never echoes the token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: |
        `error.code` values:
        - `forbidden`: the identity is valid but not allowed to do this: an external identity called an
          `x-access: console` operation, a cross-organization send was rejected, or a token was sent to a console
          endpoint;
        - `forbidden_origin`, `invalid_host`: the Origin or Host of a console endpoint request is not on the allowlist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: The resource does not exist (including deleted Agents)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: |
        Conflicts with the current state. `error.code` values:
        `agent_busy` (details is AgentBusyDetails), `agent_not_idle` (details is ProjectNotIdleDetails when deleting a
        project, otherwise no details), `session_missing`, `template_deleted`, `name_conflict`, `path_conflict`,
        `runtime_in_use` (details is RuntimeInUseDetails), `text_generation_unavailable`, `path_picker_unavailable`,
        `path_picker_busy`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: Validation failed, with field-level errors where possible
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PreconditionFailed:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: If-Match does not match the current content
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: Exceeds the size limit
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    CLIImportInternalError:
      {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "Sanitized internal_error; a failure response does not mean the commit was rolled back.",
        "headers": {
          "Loop-Now-Request-Id": {
            "$ref": "#/components/headers/RequestId"
          },
          "Loop-Now-Version": {
            "$ref": "#/components/headers/Version"
          }
        }
      }

    CLIImportPreconditionFailed:
      {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "precondition_failed or import_source_changed; check the revision or scan again.",
        "headers": {
          "Loop-Now-Request-Id": {
            "$ref": "#/components/headers/RequestId"
          },
          "Loop-Now-Version": {
            "$ref": "#/components/headers/Version"
          }
        }
      }

    CLIImportUnavailable:
      {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "HTTP 503 also uses the existing internal_error code; when the commit outcome is unknown, only query the original operation and do not resend the work.",
        "headers": {
          "Loop-Now-Request-Id": {
            "$ref": "#/components/headers/RequestId"
          },
          "Loop-Now-Version": {
            "$ref": "#/components/headers/Version"
          }
        }
      }

  schemas:
    SleepInput:
      type: object
      additionalProperties: false
      required: [actionId, runId, seconds]
      properties:
        actionId: { type: string, format: uuid }
        runId:
          description: The run ID given in the platform's instructions for this turn; a status query must not be used to silently swap in an old turn's ID
          type: string
          format: uuid
        seconds: { type: integer, format: int64, minimum: 1, maximum: 2147483647 }
        reason:
          description: Optional note; non-empty text is subject to the server's message length limit
          type: [string, "null"]

    SleepRecord:
      type: object
      additionalProperties: false
      required: [id, scopeKind, agentId, taskId, runtimeId, nodeRunId, sourceRunId, state, seconds, requestedAt, enteredAt, wakeAt, endedAt, endReason, wakeRunId, reason, revision]
      properties:
        id: { type: string, format: uuid }
        scopeKind: { type: string, enum: [normal, task] }
        agentId: { type: string, format: uuid }
        taskId: { type: [string, "null"], format: uuid }
        runtimeId: { type: [string, "null"], format: uuid }
        nodeRunId: { type: [string, "null"], format: uuid }
        sourceRunId: { type: string, format: uuid }
        state: { type: string, enum: [requested, sleeping, woken, cancelled] }
        seconds: { type: integer, format: int64, minimum: 1, maximum: 2147483647 }
        requestedAt: { type: string, format: date-time }
        enteredAt: { type: [string, "null"], format: date-time }
        wakeAt: { type: [string, "null"], format: date-time }
        endedAt: { type: [string, "null"], format: date-time }
        endReason:
          type: [string, "null"]
          enum: [deadline, queued_work, execution_failed, interrupted, task_ended, node_changed, session_reopened, owner_deleted, null]
        wakeRunId: { type: [string, "null"], format: uuid }
        reason: { type: [string, "null"] }
        revision:
          description: Monotonic revision of the owning scope; a new sleep continues the scope's existing revision
          type: integer
          format: int64
          minimum: 1

    SleepInfo:
      $ref: "#/components/schemas/SleepRecord"

    SleepReceipt:
      type: object
      additionalProperties: false
      required: [sleep, endTurn]
      properties:
        sleep: { $ref: "#/components/schemas/SleepRecord" }
        endTurn: { type: boolean, enum: [true] }

    SleepState:
      type: object
      additionalProperties: false
      required: [currentRunId, sleep]
      properties:
        currentRunId: { type: [string, "null"], format: uuid }
        sleep:
          description: The caller's own requested or sleeping record; null when there is none
          oneOf:
            - $ref: "#/components/schemas/SleepRecord"
            - type: "null"

    SseSleepUpdated:
      type: object
      additionalProperties: false
      required: [scopeKind, agentId, taskId, runtimeId, nodeRunId, taskVersion, sleepRevision, sleep, endedSleepId]
      properties:
        scopeKind: { type: string, enum: [normal, task] }
        agentId: { type: string, format: uuid }
        taskId: { type: [string, "null"], format: uuid }
        runtimeId: { type: [string, "null"], format: uuid }
        nodeRunId: { type: [string, "null"], format: uuid }
        taskVersion:
          description: task.version after the task transaction commits; null for the regular scope. Used to reject an empty list from an older task snapshot
          type: [integer, "null"]
          format: int64
          minimum: 1
        sleepRevision: { type: integer, format: int64, minimum: 0 }
        sleep:
          oneOf:
            - $ref: "#/components/schemas/SleepInfo"
            - type: "null"
        endedSleepId: { type: [string, "null"], format: uuid }

    TaskAgentList:
      type: object
      additionalProperties: false
      required:
        - agents
      properties:
        agents:
          type: array
          items:
