        walBytes:
          type: object
          description: Current size in bytes of the -wal file of each database
          required: [data, events]
          additionalProperties: false
          properties:
            data: { type: integer, format: int64, minimum: 0 }
            events: { type: integer, format: int64, minimum: 0 }
        walWarning:
          type: boolean
          description: Either WAL exceeds the warning threshold (256 MiB), usually because a long-running read transaction is blocking checkpoints

    ModelSettings:
      type: object
      required: [modelsJson, revision]
      additionalProperties: false
      properties:
        modelsJson:
          type: string
          description: Pi's native models.json text; API keys are still managed by project or Agent accounts.
        revision: { type: integer, format: int64, minimum: 1 }
        loadError:
          type: string
          description: Warning when the saved configuration fails the current Pi validation; the live catalog has then fallen back to the built-in configuration.

    ModelSettingsPut:
      type: object
      required: [modelsJson, expectedRevision]
      additionalProperties: false
      properties:
        modelsJson: { type: string }
        expectedRevision: { type: integer, format: int64, minimum: 1 }

    ModelProviderList:
      type: object
      required: [piVersion, catalogGeneratedAt, providers]
      additionalProperties: false
      properties:
        piVersion: { type: string }
        catalogGeneratedAt: { type: [string, "null"], format: date-time }
        providers:
          type: array
          items: { $ref: "#/components/schemas/ModelProvider" }

    ModelProvider:
      type: object
      required:
        - id
        - name
        - source
        - runtime
        - pluginId
        - pluginDisplayName
        - unavailableReason
        - apiKeyEnvVars
        - modelCount
        - authMethods
        - usable
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: [string, "null"]
          description: Display name given by the provider itself; currently only plugin providers have one (the extension's original text, shown as plain text), null for the rest.
        source:
          type: string
          enum: [builtin, config, plugin, local_cli]
          description: |
            builtin is the pure built-in catalog; config means the provider has a native models.json configuration or
            override;
            plugin is a provider registered by the Pi extension of an installed plugin (plugins/SPEC.md §13): a project
            Agent can choose it only when the project has enabled the plugin and the Agent has been granted it, and the
            account is a subscription account logged in within the project; a platform Agent can choose it only when the
            plugin has been granted to that Agent, and the account is logged in under that Agent's own model credential
            (POST /agents/{agentId}/model-auth/operations). Otherwise updating the Agent returns 422, and it cannot be
            chosen directly when creating an Agent.
            local_cli is a model provided by a CLI installed on the user's computer (claude-code: the local Claude Code;
            codex-cli: the local Codex); it uses the CLI's own local login, needs no account, and the platform stores no
            token; both project Agents and platform Agents can choose it. For claude-code the model ids are Claude Code
            aliases (fable, opus, sonnet, haiku); for codex-cli they are the models the local Codex lists for its login
            (none when Codex is not installed or cannot list them). The thinking level is the CLI's reasoning effort
            (low to max). Whether it is installed and logged in on this computer is shown by GET /runtimes; it can be
            chosen even when not installed, and runs then fail with runtime_*.
        runtime:
          $ref: "#/components/schemas/AgentRuntime"
          description: The runtime that executes Agents that choose this provider.
        pluginId:
          type: [string, "null"]
          description: When source is plugin, the id of the plugin that registered it; otherwise null.
        pluginDisplayName:
          description: When source is plugin, the display name of the plugin that registered it (as in the manifest); otherwise null.
          oneOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        unavailableReason:
          type: [string, "null"]
          enum: [plugin_not_enabled, agent_not_granted, plugins_disabled, null]
          description: |
            Can be non-null only when the query has agentId and source is plugin: why this Agent cannot use it now.
            plugin_not_enabled: the Agent's project has not enabled the plugin (project Agents only; platform Agents
            have no project enable step);
            agent_not_granted: the plugin has not been granted to this Agent; plugins_disabled: all plugins are disabled
            globally (this does not block saving, but Pi fails to start).
            In the first two cases, updating the Agent to choose it returns 422 (validation_failed, field
            model.provider, with a message saying which case).
            Once the plugin is uninstalled, its provider disappears from the catalog (Agents that chose it fail
            explicitly at start).
        apiKeyEnvVars:
          description: Diagnostic metadata kept for compatibility with legacy environment credentials; not a field for entering model credentials.
          type: array
          items:
            type: string
          deprecated: true
        modelCount:
          type: integer
          minimum: 0
        authMethods:
          type: array
          items:
            $ref: '#/components/schemas/ModelAuthMethod'
          uniqueItems: true
          description: Explicit authentication methods the platform supports; OAuth login is console only and currently supports openai-codex and plugin providers (plugin providers support only oauth).
        usable:
          type: [boolean, "null"]
          description: |
            Whether the Agent (or a new Agent in the project, or a new platform Agent) can run this provider right now
            without entering an account, key or login first; null when the query has none of agentId, projectId and
            scope.
            true: the provider needs nothing (authMethods is empty), or the platform keeps a usable one: for a project
            Agent or a project, at least one project model account for this provider (when there are several, a run
            may still ask which one to use); for a platform Agent, its own model key or login for this provider, or an
            older single key with one of its environment variables. A new platform Agent has none yet, so only
            providers that need nothing are true.
            A provider whose runtime uses its own local login (RuntimeCapabilities.accounts is local, such as
            claude-code) is always true: the platform keeps no account for it, and whether that runtime is installed
            and logged in on this computer is GET /runtimes.
            A plugin provider with a non-null unavailableReason is false.
        models:
          description: Present only with include=models; the same list as GET /model-providers/{providerId}/models
          type: array
          items: { $ref: "#/components/schemas/Model" }

    AgentRuntime:
      type: string
      minLength: 1
      description: |
        A plain string, not a closed list: besides the built-in runtimes below, each local ACP command a person added
        (AcpCommand) is a runtime of its own, whose id is acp- followed by the command's id (AcpCommand.runtime). Show an
        id the console does not know by the name GET /runtime-definitions gives it.
        The runtime that executes the Agent: pi is the bundled Pi; claude-code is the unmodified Claude Code, codex the
        unmodified Codex, grok the unmodified Grok CLI and antigravity the unmodified Antigravity CLI (agy) installed on
        the user's computer (looked up on the login shell's PATH; Codex runs as `codex app-server`, Grok and
        Antigravity speak the Agent Client Protocol), each using its own local login; the platform neither reads nor
        stores their credentials. The runtime follows from the model provider and is not set separately: claude-code
        when model.provider is claude-code, codex when it is codex-cli, grok when it is grok-cli, antigravity when it
        is antigravity-cli, and pi otherwise (the openai-codex provider runs on Pi). Under Claude
        Code and Codex there are no Pi extensions (/pi: commands, extension conversations, plugin providers); plugin
        Skills and MCP servers work as usual. A Codex Agent's conversation is kept in the user's own Codex home (it
        shows in the user's Codex history); deleting the Agent archives it there. Grok and Antigravity keep their
        sessions in their own data as well.

    RuntimeList:
      type: object
      required: [runtimes]
      additionalProperties: false
      properties:
        runtimes:
          type: array
          items: { $ref: "#/components/schemas/RuntimeStatus" }

    AcpCommand:
      description: A local ACP command a person added; it runs as the runtime named in runtime, with one model provider of the same id
      type: object
      required: [id, runtime, name, command, args, envNames, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        runtime: { $ref: "#/components/schemas/AgentRuntime" }
        name: { type: string, description: "The name shown for the runtime and its model provider" }
        command: { type: string, description: "The executable: a name on the login shell's PATH, or an absolute path" }
        args:
          type: array
          items: { type: string }
          description: The arguments, each passed as is (no shell)
        envNames:
          type: array
          items: { type: string }
          description: The names of the environment variables given to it, sorted; their values are never returned
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AcpCommandList:
      type: object
      required: [commands]
      additionalProperties: false
      properties:
        commands:
          type: array
          items: { $ref: "#/components/schemas/AcpCommand" }

    AcpCommandCreate:
      type: object
      required: [name, command]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        command: { type: string, minLength: 1, maxLength: 4096 }
        args:
          type: array
          maxItems: 64
          items: { type: string, maxLength: 4096 }
        env:
          type: object
          maxProperties: 64
          description: Environment variables added for the program (names are letters, digits and _, not starting with a digit)
          additionalProperties: { type: string, maxLength: 8192 }

    AcpCommandUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        command: { type: string, minLength: 1, maxLength: 4096 }
        args:
          type: array
          maxItems: 64
          items: { type: string, maxLength: 4096 }
        env:
          type: object
          maxProperties: 64
          description: Merged into the saved environment; a string sets the variable, null removes it, names left out stay as they are
          additionalProperties:
            type: [string, "null"]
            maxLength: 8192

    RuntimeDefinitionList:
      type: object
      required: [runtimes]
      additionalProperties: false
      properties:
        runtimes:
          type: array
          items: { $ref: "#/components/schemas/RuntimeDefinition" }

    RuntimeDefinition:
      description: The fixed definition of a runtime; nothing in it depends on this computer, except that setup is given for the operating system the server runs on.
      type: object
      required: [id, name, providers, isDefault, capabilities, setup, minVersion, acpCommandId]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/AgentRuntime" }
        acpCommandId:
          description: The local ACP command this runtime runs (AcpCommand.id); null for the built-in runtimes
          type: [string, "null"]
          format: uuid
        name:
          type: string
          description: The product name, shown as is in every language
        providers:
          type: array
          items: { type: string }
          uniqueItems: true
          description: |
            The model providers this runtime runs (ModelProvider.id). Empty for the default runtime, which runs every
            provider that no other runtime lists.
        isDefault:
          type: boolean
          description: True for exactly one runtime, the one that runs every model provider no other runtime lists
        capabilities: { $ref: "#/components/schemas/RuntimeCapabilities" }
        minVersion:
          type: [string, "null"]
          description: |
            The oldest version of the runtime's CLI the platform supports (the version it was tested with); GET /runtimes
            reports an older one as version_unsupported. null when there is no minimum (the bundled Pi, Claude Code).
        setup:
          description: How a person sets this runtime up on this computer when GET /runtimes says it is not ready; null for a runtime that needs no setup (the bundled Pi)
          oneOf:
            - $ref: "#/components/schemas/RuntimeSetup"
            - type: "null"

    RuntimeSetup:
      description: |
        Commands a person runs in a terminal, for the operating system the server runs on. The console shows them; nothing
        runs them for the user.
      type: object
      required: [install, login, docsUrl]
      additionalProperties: false
      properties:
        install:
          type: [string, "null"]
          description: The command that installs the runtime's CLI (for example on Windows a PowerShell command); null when there is none to show
        login:
          type: [string, "null"]
          description: The command that logs the CLI in; null when it needs no login
        docsUrl:
          type: [string, "null"]
          format: uri
          description: The vendor's setup page, for other ways to install

    RuntimeCapabilities:
      description: What a runtime can do. Thinking levels and image input are per model, in the model catalog.
      type: object
      required: [accounts, realHome, nativeCommands, pluginExtensions, bundled]
      additionalProperties: false
      properties:
        accounts:
          type: string
          enum: [managed, local]
          description: |
            Whose login runs the model. managed: the accounts and credentials the platform keeps for the project or the
            Agent. local: the login of the runtime's own CLI on this computer, which the platform neither reads nor
            stores.
        realHome:
          type: boolean
          description: |
            Always runs with the user's real HOME. When false, the Agent has a HOME of its own unless "Use local logins"
            is on.
        nativeCommands:
          type: boolean
          description: Lists its own slash commands; GET /agents/{agentId}/commands then includes them besides the platform's.
        pluginExtensions:
          type: boolean
          description: |
            Loads the Agent-side extensions of granted plugins, and with them plugin model providers and extension
            dialogs. Plugin Skills and MCP servers work on every runtime.
        bundled:
          type: boolean
          description: Ships with the platform and needs no install or login on this computer; GET /runtimes always reports it as available.

    RuntimeStatus:
      type: object
      required: [id, available, version, binaryPath, unavailableReason, login, checkedAt]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/AgentRuntime" }
        available:
          type: boolean
          description: For a CLI runtime, true when the CLI was found and its version could be read and is supported (see login for whether it is logged in)
        version:
          type: [string, "null"]
          description: For pi, the version of the bundled Pi; for a CLI runtime, the version number from its --version
        binaryPath:
          type: [string, "null"]
          description: The real path of the CLI after resolving symlinks; null for pi and when the CLI was not found
        unavailableReason:
          type: [string, "null"]
          enum: [not_found, version_failed, version_unsupported, null]
          description: |
            not_found means the CLI is not on the login shell's PATH; version_failed means running its --version failed;
            version_unsupported means it is older than RuntimeDefinition.minVersion (version still says which it is)
        login:
          description: Present only for a CLI runtime whose CLI was found and is supported; null for pi and otherwise
          oneOf:
            - $ref: "#/components/schemas/RuntimeLogin"
            - type: "null"
        checkedAt: { type: string, format: date-time }

    RuntimeLogin:
      type: object
      required: [state, authMethod, subscriptionType]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [logged_in, logged_out, unknown]
          description: From the CLI's own check (claude auth status, codex login status); unknown when it cannot run or its output is not recognized
        authMethod:
          type: [string, "null"]
          description: Login method, such as claude.ai (Claude Code) or chatgpt and api_key (Codex)
        subscriptionType:
          type: [string, "null"]
          description: Subscription type, such as max

    TextGenerationSelection:
      description: A runtime model chosen to write with AI
      type: object
      required: [provider, modelId]
      additionalProperties: false
      properties:
        provider:
          type: string
          minLength: 1
          description: The model provider (ModelProvider.id) of a runtime whose accounts are local, such as claude-code or codex-cli
        modelId: { type: string, minLength: 1, maxLength: 256 }
        thinkingLevel:
          description: The thinking level; null or left out uses the model's default
          anyOf:
            - $ref: "#/components/schemas/ThinkingLevel"
            - type: "null"

    TextGenerationWriter:
      description: The runtime and model that write (or would write now)
      type: object
      required: [runtime, provider, modelId, modelName, thinkingLevel, fellBack]
      additionalProperties: false
      properties:
        runtime: { $ref: "#/components/schemas/AgentRuntime" }
        provider: { type: string }
        modelId: { type: string }
        modelName: { type: string, description: "The model's name in the model list (its id when the list has none)" }
        thinkingLevel:
          description: The thinking level used; null when the model's default is used
          anyOf:
            - $ref: "#/components/schemas/ThinkingLevel"
            - type: "null"
        fellBack:
          type: boolean
          description: The chosen one was not ready (not installed, not logged in, too old, or its model is no longer listed), so Automatic's choice writes instead

    TextGenerationSettings:
      type: object
      required: [selection, writer]
      additionalProperties: false
      properties:
        selection:
          description: The chosen runtime model; null is Automatic
          oneOf:
            - $ref: "#/components/schemas/TextGenerationSelection"
            - type: "null"
        writer:
          description: Who would write now; null when no runtime is ready
          oneOf:
            - $ref: "#/components/schemas/TextGenerationWriter"
            - type: "null"

    TextGenerationSettingsPut:
      type: object
      required: [selection]
      additionalProperties: false
      properties:
        selection:
          description: The runtime model to write with; null is Automatic
          oneOf:
            - $ref: "#/components/schemas/TextGenerationSelection"
            - type: "null"

    PromptDraftRequest:
      description: |
        target agent: an existing Agent's Prompt (agentId), or a new Agent's (no agentId; projectId is the project it
        will be in, none for a platform Agent). target project: the Prompt of the project projectId. agentName is the
        name as typed so far; with agentId it replaces the saved name. agentId and agentName are refused with target
        project, and projectId together with agentId (422).
      type: object
      required: [target, request, currentText]
      additionalProperties: false
      properties:
        target: { type: string, enum: [agent, project] }
        agentId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        agentName: { type: string, maxLength: 100 }
        request:
          type: string
          maxLength: 4000
          description: What the person wants, in their words; may be empty only when currentText is not
        currentText:
          type: string
          description: The text in the editor now, which the draft improves or replaces; may be empty. Limited only by the request size, as the Prompt endpoints are.

    PromptDraft:
      type: object
      required: [text, writer]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, description: "The draft, to put in the editor" }
        writer: { $ref: "#/components/schemas/TextGenerationWriter" }

    PathPickRequest:
      description: The same request as the desktop app's pickPath.
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [directory, file] }
        defaultPath: { type: string, maxLength: 4096 }

    PathPick:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path:
          type: [string, "null"]
          minLength: 1
          description: The full path chosen, on the computer the server runs on; null when the person cancelled

    ModelList:
      type: object
      required: [providerId, models]
      additionalProperties: false
      properties:
        providerId: { type: string }
        models:
          type: array
          items: { $ref: "#/components/schemas/Model" }

    CodexServiceTier:
      description: Codex request speed tier; default is Standard, priority is Fast, ultrafast is Ultrafast. The vendor decides account and model eligibility; the tier is never silently downgraded.
      type: string
      enum: [default, priority, ultrafast]

    ThinkingLevel:
      type: string
      enum: [off, minimal, low, medium, high, xhigh, max]

    Model:
      type: object
      required: [id, name, reasoning, contextWindow, maxTokens, input]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        reasoning: { type: boolean }
        thinkingLevels:
          description: The levels actually available for this specific model, as computed by the pinned Pi; absent means an older server that does not provide this capability.
          type: array
          items: { $ref: "#/components/schemas/ThinkingLevel" }
        defaultThinkingLevel:
          description: The result of the pinned Pi's official clampThinkingLevel(model, medium); does not read the session or the host settings.
          $ref: "#/components/schemas/ThinkingLevel"
        contextWindow: { type: integer }
        maxTokens: { type: integer }
        input:
          type: array
          items: { type: string }

    CliName:
      type: string
      pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"

    CliTemplateField:
      type: object
      required: [name, label, type, required]
      additionalProperties: false
      properties:
        name: { type: string }
        label: { $ref: "#/components/schemas/LocalizedText" }
        type:
          type: string
          enum: [string, secret, enum]
        options:
          description: Allowed values when type is enum
          type: array
          items: { type: string }
        default: { type: string }
        required: { type: boolean }
        multiline: { type: boolean, description: "Multi-line text input; defaults to false and does not change how secret values are masked" }

    CliTemplate:
      type: object
      required: [name, version, fields, injection, install, warnings]
      additionalProperties: false
      properties:
        name: { type: string }
        version: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/CliTemplateField" }
        injection:
          type: string
          enum: [env, files]
        install:
          type: object
          required: [status]
          additionalProperties: false
          properties:
            status:
              type: string
              enum: [not_installed, installing, installed, failed, unsupported_platform]
            error: { type: [string, "null"] }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/Warning" }

    ModelRef:
      type: object
      required: [provider, modelId]
      additionalProperties: false
      properties:
        provider: { type: string }
        modelId: { type: string }

    SessionState:
      type: string
      enum: [none, active, missing]

    SessionInfo:
      type: object
      required: [state, epoch]
      additionalProperties: false
      properties:
        state: { $ref: "#/components/schemas/SessionState" }
        epoch: { type: integer, minimum: 1 }

    AgentListItem:
      type: object
      required: [sleep, sleepRevision, id, scope, projectId, isManager, name, address, model, runtime, configVersion, busy, sessionState, createdAt, updatedAt]
      additionalProperties: false
      properties:
        sleep:
          description: The sleep currently in effect for this scope; null while its registration is not yet finalized or when nothing is waiting
          oneOf:
            - $ref: "#/components/schemas/SleepInfo"
            - type: "null"
        sleepRevision: { type: integer, format: int64, minimum: 0 }
        id: { type: string, format: uuid }
        scope: { $ref: "#/components/schemas/AgentScope" }
        projectId: { type: [string, "null"], format: uuid }
        isManager: { type: boolean }
        name: { type: string }
        address:
          description: |
            Inbox address: for an Agent in a project, the full address
            `<organization name>/<project name>/<Agent name>`; for a platform-owned Agent, the name itself. It changes
            when the project is renamed.
            Null when a name does not meet the naming rules (Agents created before the rules took effect); address such
            an Agent by its Agent ID.
          type: [string, "null"]
        model: { $ref: "#/components/schemas/ModelRef" }
        runtime:
          $ref: "#/components/schemas/AgentRuntime"
          description: Derived from model.provider; read-only.
        serviceTier:
          description: Only openai-codex accepts a non-null value; null means Standard. Omitting it on create is the same as null; omitting it on update keeps the current value, and null resets it. For regular (non-task) runs it takes effect from the next turn; new tasks capture the concrete value, and older snapshots that lack it keep their original behavior.
          anyOf:
            - $ref: "#/components/schemas/CodexServiceTier"
            - type: "null"
        thinkingLevel:
          description: null means the current model's official clamp(medium) default. Omitting it on create is the same as null, omitting it on update keeps the current value, and an explicit level must be supported by the model. For regular (non-task) runs it takes effect from the next turn; new tasks capture the resolved value, and existing tasks are not rewritten.
          anyOf:
            - $ref: "#/components/schemas/ThinkingLevel"
            - type: "null"
        configVersion: { type: integer }
        busy: { type: boolean }
        sessionState: { $ref: "#/components/schemas/SessionState" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    EntityName:
      description: |
        Rules shared by organization, project and Agent names (they make up Inbox addresses):
        - 1 to 100 characters (counted in Unicode code points);
        - no `/` or `#`, and no control characters (U+0000–U+001F, U+007F–U+009F);
        - does not start with `@`;
        - no leading or trailing whitespace, where whitespace means U+0009–U+000D, U+0020, U+0085, U+00A0, U+1680,
          U+2000–U+200A, U+2028, U+2029, U+202F, U+205F, U+3000;
        - not a hexadecimal UUID in 8-4-4-4-12 form (case-insensitive).
        A name that breaks these rules returns 422 validation_failed with a field-level error on `name`.
        pattern uses only syntax that means the same in Go RE2 and ECMA-262.
      type: string
      minLength: 1
      maxLength: 100
      pattern: "^[^\\x00-\\x1F\\x7F-\\x9F \u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000/#@](?:[^\\x00-\\x1F\\x7F-\\x9F/#]*[^\\x00-\\x1F\\x7F-\\x9F \u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000/#])?$"
      not:
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"

    AgentScope:
      description: Where the Agent belongs; project means a project, platform means owned by the platform (not in any organization or project)
      type: string
      enum: [project, platform]

    AgentList:
      type: object
      required: [agents]
      additionalProperties: false
      properties:
        agents:
          type: array
          items: { $ref: "#/components/schemas/AgentListItem" }

    Project:
      type: object
      required: [id, organizationId, name, isDefault, managerAgentId, agentCount, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        isDefault:
          description: The default project can be renamed but not deleted
          type: boolean
        managerAgentId:
          description: The Agent acting as Manager; null when none is set
          type: [string, "null"]
          format: uuid
        agentCount:
          description: Number of non-deleted Agents in the project
          type: integer
          minimum: 0
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProjectCreate:
      description: The project name is unique among the organization's non-deleted projects, and a duplicate returns 409 name_conflict; names of deleted projects can be reused
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/EntityName" }

    ProjectUpdate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/EntityName" }

    ProjectManagerSet:
      type: object
      required: [agentId]
      additionalProperties: false
      properties:
        agentId: { type: string, format: uuid }

    ProjectNotIdleDetails:
      description: When deleting a project is rejected, lists the Agents that are not idle
      type: object
      required: [agents]
      additionalProperties: false
      properties:
        agents:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, name]
            additionalProperties: false
            properties:
              id: { type: string, format: uuid }
              name: { type: string }

    RuntimeInUseDetails:
      description: When removing a local ACP command is rejected, lists the Agents (not deleted) whose model provider it runs
      type: object
      required: [agents]
      additionalProperties: false
      properties:
        agents:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, name, projectId]
            additionalProperties: false
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              projectId:
                description: The Agent's project; null for a platform Agent
                type: [string, "null"]
                format: uuid

    AgentCreate:
      description: The Agent name is unique within its scope (this project or the platform), and a duplicate returns 409 name_conflict; deleted Agents do not hold their names; the scope comes from the request path and cannot change after creation
      type: object
      required: [name, model]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/EntityName" }
        model: { $ref: "#/components/schemas/ModelRef" }
        serviceTier:
          description: Only openai-codex accepts a non-null value; null means Standard. Omitting it on create is the same as null; omitting it on update keeps the current value, and null resets it. For regular (non-task) runs it takes effect from the next turn; new tasks capture the concrete value, and older snapshots that lack it keep their original behavior.
          anyOf:
            - $ref: "#/components/schemas/CodexServiceTier"
            - type: "null"
        thinkingLevel:
          description: null means the current model's official clamp(medium) default. Omitting it on create is the same as null, omitting it on update keeps the current value, and an explicit level must be supported by the model. For regular (non-task) runs it takes effect from the next turn; new tasks capture the resolved value, and existing tasks are not rewritten.
          anyOf:
            - $ref: "#/components/schemas/ThinkingLevel"
            - type: "null"
        prompt: { type: string }

    ProjectPrompt:
      type: object
      additionalProperties: false
      required: [prompt, promptVersion]
      properties:
        prompt: { type: string }
        promptVersion: { type: integer, format: int64, minimum: 1 }
    ProjectPromptUpdate:
      type: object
      additionalProperties: false
      required: [prompt, expectedPromptVersion]
      properties:
        prompt: { type: string }
        expectedPromptVersion: { type: integer, format: int64, minimum: 1 }

    AgentUpdate:
      description: |
        Changing model.provider to one that another runtime runs switches the runtime (see AgentRuntime). It is
        accepted at any time, also while the Agent is replying, and applies from the next message dispatched. The new
        runtime starts its own session and is given a selection of the saved conversation with its first message
        (Run.contextHandoff); the session number does not change, sleeps are kept, and the old runtime's session is
        neither migrated nor deleted. When the runtime is changed back before any message has reached the new one (a
        message that failed to start there, for example because it is not installed or not logged in, does not count),
        the earlier session simply continues and nothing is handed over. A change of provider or model within one runtime
        keeps that runtime's session. Records from before this behaviour show a session reset with reason
        runtime_changed at each change of runtime.
      type: object
      additionalProperties: false
      minProperties: 1
      dependentRequired:
        prompt: [expectedPromptVersion]
      properties:
        name: { $ref: "#/components/schemas/EntityName" }
        model: { $ref: "#/components/schemas/ModelRef" }
        serviceTier:
          description: Only openai-codex accepts a non-null value; null means Standard. Omitting it on create is the same as null; omitting it on update keeps the current value, and null resets it. For regular (non-task) runs it takes effect from the next turn; new tasks capture the concrete value, and older snapshots that lack it keep their original behavior.
          anyOf:
            - $ref: "#/components/schemas/CodexServiceTier"
            - type: "null"
        thinkingLevel:
          description: null means the current model's official clamp(medium) default. Omitting it on create is the same as null, omitting it on update keeps the current value, and an explicit level must be supported by the model. For regular (non-task) runs it takes effect from the next turn; new tasks capture the resolved value, and existing tasks are not rewritten.
          anyOf:
            - $ref: "#/components/schemas/ThinkingLevel"
            - type: "null"
        prompt: { type: string }
        expectedPromptVersion:
          type: integer
          format: int64
          minimum: 1
          description: Required when prompt is present (including empty text and unchanged text); independent of configVersion, and a stale value returns 412.

    Agent:
      type: object
      required: [id, scope, projectId, isManager, name, address, model, runtime, prompt, promptVersion, configVersion, busy, session, clis, modelCredential, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        scope: { $ref: "#/components/schemas/AgentScope" }
        projectId:
          description: The owning project; null for platform-owned Agents
          type: [string, "null"]
          format: uuid
        isManager:
          description: Whether the Agent is the Manager of its project; always false for platform Agents
          type: boolean
        name: { type: string }
        address:
          description: |
            Inbox address: for an Agent in a project, the full address
            `<organization name>/<project name>/<Agent name>`; for a platform-owned Agent, the name itself. It changes
            when the project is renamed.
            Null when a name does not meet the naming rules (Agents created before the rules took effect); address such
            an Agent by its Agent ID.
          type: [string, "null"]
        model: { $ref: "#/components/schemas/ModelRef" }
        runtime:
          $ref: "#/components/schemas/AgentRuntime"
          description: Derived from model.provider; read-only.
        serviceTier:
          description: Only openai-codex accepts a non-null value; null means Standard. Omitting it on create is the same as null; omitting it on update keeps the current value, and null resets it. For regular (non-task) runs it takes effect from the next turn; new tasks capture the concrete value, and older snapshots that lack it keep their original behavior.
          anyOf:
            - $ref: "#/components/schemas/CodexServiceTier"
            - type: "null"
        thinkingLevel:
          description: null means the current model's official clamp(medium) default. Omitting it on create is the same as null, omitting it on update keeps the current value, and an explicit level must be supported by the model. For regular (non-task) runs it takes effect from the next turn; new tasks capture the resolved value, and existing tasks are not rewritten.
          anyOf:
            - $ref: "#/components/schemas/ThinkingLevel"
            - type: "null"
        prompt: { type: string }
        promptVersion: { type: integer, format: int64, minimum: 1 }
        configVersion: { type: integer }
        busy: { type: boolean }
        session: { $ref: "#/components/schemas/SessionInfo" }
        clis:
          type: array
          items: { $ref: "#/components/schemas/AgentCli" }
        modelCredential:
          oneOf:
            - $ref: "#/components/schemas/CredentialMeta"
            - type: "null"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FolderSourceKind:
      description: Retired folder source kind, used only by workspace sync entries in old task run records
      type: string
      enum: [git, files]

    FolderEntry:
      type: object
      required: [name, path, type, size, modifiedAt, symlinkTarget]
      additionalProperties: false
      properties:
        name: { type: string }
        path:
          description: Relative path within the folder
          type: string
        type:
          description: other is an entry that cannot be operated on, such as a socket or a device
          type: string
          enum: [file, dir, symlink, other]
        size:
          description: File size in bytes; null for directories and other types (sizes are not computed recursively)
          type: [integer, "null"]
          format: int64
        modifiedAt: { type: string, format: date-time }
        symlinkTarget:
          description: The path the symlink points to (as stored); null for other types. Reading through a link works only when it points inside the folder
          type: [string, "null"]

    FolderEntryPage:
      type: object
      required: [path, entries, nextCursor]
      additionalProperties: false
      properties:
        path:
          description: The listed directory; an empty string for the root
          type: string
        entries:
          type: array
          items: { $ref: "#/components/schemas/FolderEntry" }
        nextCursor: { type: [string, "null"] }

    FolderPathInput:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string, minLength: 1 }

    FolderMoveInput:
      type: object
      required: [from, to]
      additionalProperties: false
      properties:
        from: { type: string, minLength: 1 }
        to: { type: string, minLength: 1 }

    FolderGitPullInput:
      type: object
      required: [actionId, url, branch, path]
      additionalProperties: false
      properties:
        actionId: { type: string, format: uuid }
        url:
          description: Repository URL; must not contain a username or password
          type: string
          minLength: 1
        branch: { type: string, minLength: 1 }
        path:
          description: Target subdirectory in the Agent folder; it must not exist yet or must be an empty directory
          type: string
          minLength: 1

    LocalModeSettings:
      type: object
      required: [directories, git, cli, logins]
      additionalProperties: false
      properties:
        directories: { type: boolean, description: "Bind local directories" }
        git: { type: boolean, description: "\"Pull from Git\" uses the local git identity" }
        cli: { type: boolean, description: "The user's PATH is appended after the execution PATH" }
        logins: { type: boolean, description: "Pi runs with the user's real HOME, so the logins of local tools are available (off by default)" }

    LocalModeSettingsPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        directories: { type: boolean }
        git: { type: boolean }
        cli: { type: boolean }
        logins: { type: boolean }

    LocalDirectoryInput:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path:
          description: |
            Absolute path of the local directory, in canonical form (Go's filepath.Clean leaves it unchanged): no `.` or
            `..` segments, no repeated separators and no trailing separator.
            On macOS/Linux it starts with `/`; on Windows it has a drive letter (`C:\Users\me\code`) or is a UNC path
            (`\\server\share\dir`), with `\` as the separator (`C:/x` counts as non-canonical).
            Must not contain control characters (including newlines and tabs); at most 4096 bytes; no duplicates within
            one list (case-insensitive on Windows).
          type: string
          minLength: 1
          maxLength: 4096
        note:
          description: Optional note, written into the system prompt together with the path; a note that is empty after trimming leading and trailing whitespace counts as null. At most 200 characters; must not contain control characters.
          type: [string, "null"]
          maxLength: 200

    LocalDirectoriesPut:
      type: object
      required: [expectedRevision, directories]
      additionalProperties: false
      properties:
        expectedRevision: { type: integer, format: int64, minimum: 0, description: "The revision you read; 0 if never saved" }
        directories:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/LocalDirectoryInput" }

    LocalDirectory:
      type: object
      required: [path, note, status]
      additionalProperties: false
      properties:
        path: { type: string }
        note: { type: [string, "null"] }
        status:
          description: |
            Result of a stat on the path, following symlinks, taken when the server reads it (in both read and save
            responses):
            - ok: a directory; only ok entries are written into the Agent's system prompt
            - missing: does not exist
            - not_directory: exists but is not a directory
            - inaccessible: its status cannot be read (for example, no permission)
          type: string
          enum: [ok, missing, not_directory, inaccessible]

    ProjectLocalDirectories:
      type: object
      required: [revision, directories]
      additionalProperties: false
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        directories:
          type: array
          items: { $ref: "#/components/schemas/LocalDirectory" }

    AgentLocalDirectories:
      type: object
      required: [revision, directories, projectId, inherited]
      additionalProperties: false
      properties:
        revision: { type: integer, format: int64, minimum: 0, description: "Revision of the Agent's own list" }
        directories:
          description: The Agent's own entries
          type: array
          items: { $ref: "#/components/schemas/LocalDirectory" }
        projectId:
          description: The project it belongs to; null for a platform Agent
          type: [string, "null"]
          format: uuid
        inherited:
          description: Entries inherited from its project (read-only); empty for a platform Agent
          type: array
          items: { $ref: "#/components/schemas/LocalDirectory" }

    FolderGitPullList:
      type: object
      required: [pulls]
      additionalProperties: false
      properties:
        pulls:
          description: Newest first
          type: array
          items: { $ref: "#/components/schemas/FolderGitPull" }

    FolderGitPull:
      type: object
      required: [id, agentId, url, branch, path, status, errorCode, errorMessage, createdAt, finishedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        url: { type: string }
        branch: { type: string }
        path: { type: string }
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        errorCode:
          description: |
            - target_exists: the target was no longer an empty directory when the pull started
            - branch_not_found: the branch does not exist
            - timeout: the clone time limit was exceeded
            - auth_failed: authentication failed (no usable HTTPS credential or the credential was rejected, the SSH
              public key was rejected, and so on); errorMessage carries the git output
            - host_key_unverified: the SSH host key is not confirmed (the host is not in known_hosts, or its fingerprint
              has changed); the pull does not confirm it on the user's behalf. Connect to the host once from a local
              terminal and check the fingerprint first (for example `ssh -T git@<host>`)
            - clone_failed: any other failure (invalid URL, repository does not exist, network, and so on); see
              errorMessage
            - server_restart: still in progress when the server restarted; aborted
          type: [string, "null"]
          enum: [target_exists, branch_not_found, timeout, auth_failed, host_key_unverified, clone_failed, server_restart, null]
        errorMessage:
          description: Tail of the git output (at most 2000 characters) or the failure reason; null on success
          type: [string, "null"]
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }

    CredentialMeta:
      type: object
      required:
        - status
        - updatedAt
        - fieldNames
        - envNames
        - filePaths
        - warnings
      additionalProperties: false
      properties:
        projectId: { type: [string, "null"], format: uuid, description: "The project it is shared from; omitted for platform-private history" }
        accountId: { type: [string, "null"], format: uuid, description: "Stable project account ID; omitted for platform-private history" }
        status:
          type: string
          enum:
            - set
            - unavailable
            - needs_reentry
        updatedAt:
          type: string
          format: date-time
        fieldNames:
          type: array
          items:
            type: string
        envNames:
          type: array
          items:
            type: string
        filePaths:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        provider:
          type:
            - string
            - 'null'
        authMethod:
          type:
            - string
            - 'null'
          enum:
            - api_key
            - oauth
            - legacy
            - null
        versionId:
          type:
            - string
            - 'null'
          format: uuid
        accountLabel:
          type:
            - string
            - 'null'
          description: Non-secret account label that may be displayed; contains no token or authorization code.

    AgentCli:
      type: object
      required: [name, hasTemplate, credential]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/CliName" }
        hasTemplate: { type: boolean }
        credential:
          oneOf:
            - $ref: "#/components/schemas/CredentialMeta"
            - type: "null"

    CliCredentialInput:
      type: object
      required: [fields]
      additionalProperties: false
      properties:
        fields:
          type: object
          additionalProperties: { type: string }

    ModelCredentialInput:
      type: object
      additionalProperties: false
      required:
        - provider
        - key
      properties:
        provider:
          type: string
        key:
          type: string
          minLength: 1
          writeOnly: true
        expectedConfigVersion:
          type: integer
          minimum: 1

    SkillFile:
      type: object
      required: [path, size, sha256]
      additionalProperties: false
      properties:
        path: { type: string }
        size: { type: integer, minimum: 0 }
        sha256: { type: string }

    SkillArchiveUpload:
      type: object
      required: [archive]
      properties:
        archive:
          description: Zip archive of the Skill directory
          type: string
          format: binary

    SkillCreateFromMarkdown:
      type: object
      required: [skillMd]
      additionalProperties: false
      properties:
        skillMd: { type: string, minLength: 1 }

    SkillMarkdownInput:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content: { type: string, minLength: 1 }

    SkillTemplateSummary:
      type: object
      required: [id, name, description, fileCount, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        fileCount: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SkillTemplate:
      type: object
      required: [id, name, description, files, skillMd, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        files:
          type: array
          items: { $ref: "#/components/schemas/SkillFile" }
        skillMd: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AgentSkillSummary:
      type: object
      required: [id, name, description, sourceTemplateId, fileCount, copiedAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        sourceTemplateId:
          description: Source template; null when the template has been deleted, in which case the Skill cannot be copied again
          type: [string, "null"]
          format: uuid
        fileCount: { type: integer, minimum: 1 }
        copiedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AgentSkill:
      type: object
      required: [id, name, description, sourceTemplateId, files, skillMd, copiedAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        sourceTemplateId:
          type: [string, "null"]
          format: uuid
        files:
          type: array
          items: { $ref: "#/components/schemas/SkillFile" }
        skillMd: { type: string }
        copiedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WhenBusy:
      type: string
      enum: [interrupt, queue]

    RunStatus:
      type: string
      enum: [queued, starting, running, aborting, completed, failed, interrupted]

    RunPhase:
      description: Set only when status is starting
      type: [string, "null"]
      enum: [waiting_slot, preparing, launching, null]

    RunEndReason:
      description: |
        Why a run was interrupted, or why a queued run that was not yet picked up became void:
        - user_interrupt: interrupted by a new message; user_stopped: stopped by a person (stops only this one reply);
          server_restart: the server restarted.
        - sleep_superseded: the sleep timer was taken over by real work; sleep_invalidated: the lifecycle it belongs to
          became invalid.
        - user_cancelled: withdrawn or cancelled by a person while queued; merged_into_interrupt: all of its messages
          were moved into an interrupt reminder; no_pending_messages: all messages the reminder carried were already
          read or cancelled.
        None of the last five ran any tool or model; the conversation stream should hide user_cancelled,
        merged_into_interrupt and no_pending_messages.
      type: [string, "null"]
      enum: [user_interrupt, user_stopped, server_restart, sleep_superseded, sleep_invalidated, user_cancelled, merged_into_interrupt, no_pending_messages, null]

    ToolState:
      description: |
        started: the tool is running; succeeded and failed: the runtime reported how it ended. no_result: the turn ended
        while the tool was still open and the runtime never said how it ended (for example a command still running in
        the background when the turn's wait for it ran out); it is neither a success nor a failure.
      type: string
      enum: [started, succeeded, failed, no_result]

    ToolEvent:
      type: object
      required: [toolCallId, toolName, state, at]
      additionalProperties: false
      properties:
        toolCallId: { type: string }
        toolName: { type: string }
        state: { $ref: "#/components/schemas/ToolState" }
        at: { type: string, format: date-time }

    Run:
      type: object
      required: [id, status, phase, endReason, errorCode, errorMessage, configVersion, whenBusy, queuedAt, startedAt, runningAt, abortRequestedAt, endedAt, tools, usage, usageReported, model, selection]
      additionalProperties: false
      properties:
        triggerInboxMessageId:
          description: ID of the original Inbox message that triggered this turn's platform reminder; omitted for history without a triggering message and for ordinary sources
          type: string
          format: uuid
        piCommand:
          description: |
            The command handed to Pi in this turn (plugins/SPEC.md §14): when a message on the conversation page starts
            with `/pi:<name>`, the server sends `/<name>` to Pi (the rest unchanged); the message itself is stored and
            shown as written. handled true means Pi handled the command itself (an extension command) without passing it
            to the model: the turn ends as completed with no assistant reply (the assistant message text is empty and
            the UI can show "Command ran; no reply"; notifications and statuses from the command are recorded as run
            events as usual). false means the command expanded into an ordinary prompt (a Skill command or a prompt
            template), or Pi did not recognize the command and passed it to the model as plain text. Runs that are not
            commands omit this field.
          type: object
          required: [name, handled, notices, truncated]
          additionalProperties: false
          properties:
            name: { description: 'Command name without the leading "/" (for a Skill command, skill:<name>)', type: string }
            handled: { type: boolean }
            notices:
              description: |
                When handled is true, the messages the extension posted with ctx.ui.notify while the command ran (most
                extension command output lands here), in order. They are saved with the run record and included both
                when history is reopened and in the SSE event sent when the run ends; message is the extension's
                original text, shown as plain text with line breaks and spaces kept. Statuses such as setStatus are not
                included.
                When handled is false, this is an empty array (the model replies as usual). At most 50 items and 16 KiB
                of message text in total; anything beyond that is truncated and truncated is true.
              type: array
              maxItems: 50
              items:
                type: object
                required: [level, message]
                additionalProperties: false
                properties:
                  level: { type: string, enum: [info, warning, error] }
                  message: { type: string }
            truncated: { description: "Whether notices was truncated for exceeding the limit", type: boolean }
        wakeSleepId:
          description: The sleep this turn validly took over; may be omitted or null in ordinary history
          type: [string, "null"]
          format: uuid
        compaction:
          description: Present only on manual compaction runs (/compact); omitted on other runs
          $ref: "#/components/schemas/RunCompaction"
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/RunStatus" }
        phase: { $ref: "#/components/schemas/RunPhase" }
        endReason: { $ref: "#/components/schemas/RunEndReason" }
        errorCode:
          description: Set only when status is failed
          oneOf:
            - $ref: "#/components/schemas/RunErrorCode"
            - type: "null"
        errorMessage: { type: [string, "null"] }
        configVersion:
          description: Config version used when the run started; while queued, the config version at send time
          type: integer
        whenBusy:
          description: The choice made because the Agent was busy at send time; null when sent while the Agent was idle
          oneOf:
            - $ref: "#/components/schemas/WhenBusy"
            - type: "null"
        queuedAt: { type: string, format: date-time }
        startedAt:
          description: Dispatch time, when the run left the queue and processing began
          type: [string, "null"]
          format: date-time
        runningAt:
          description: When the reply began, that is, when the message was handed to Pi
          type: [string, "null"]
          format: date-time
        abortRequestedAt:
          description: When the interrupt was requested; null if the run was not interrupted
          type: [string, "null"]
          format: date-time
        endedAt: { type: [string, "null"], format: date-time }
        tools:
          type: array
          items: { $ref: "#/components/schemas/ToolEvent" }
        usage:
          description: Sum of all usage of this run (including compaction, cache warming and tool usage)
          $ref: "#/components/schemas/UsageTotals"
        usageReported:
          type: boolean
          description: |
            Whether the runtime reported token usage for this run. false when it reported none (Agent Client Protocol
            runtimes such as Grok and Antigravity report only how full the context is) or the run never reached a model
            (for example it failed before starting); usage is then all zeros and means unknown, not zero.
        model:
          description: Provider and model this run actually used (as reported by the last model call); null when there was no model call
          oneOf:
            - $ref: "#/components/schemas/ModelRef"
            - type: "null"
        selection:
          description: |
            Who ran this turn: the runtime, model provider, model and thinking level. Recorded when the run is dispatched
            (the configuration it is dispatched with), so a run that fails before it starts still names the runtime it
            was meant for, and replaced when the reply begins (runningAt) by what the runtime actually took. Neighbouring
            turns with a different provider or model on the same runtime show a change of model; a change of runtime
            shows as contextHandoff instead. Null while queued and for turns recorded before it was kept (older records
            that began have it from when the reply began).
          oneOf:
            - $ref: "#/components/schemas/RunSelection"
            - type: "null"
        contextHandoff:
          description: |
            Present only on a turn that carried the saved conversation over to a new runtime (see ContextHandoff); omitted
            on every other run.
          $ref: "#/components/schemas/ContextHandoff"

    RunSelection:
      description: The runtime, model and thinking level a turn was handed over with.
      type: object
      required: [runtime, provider, modelId, thinkingLevel]
      additionalProperties: false
      properties:
        runtime: { $ref: "#/components/schemas/AgentRuntime" }
        provider: { type: string, description: ModelProvider.id }
        modelId: { type: string }
        thinkingLevel:
          description: The Agent's thinking level when the turn began; null means the model's default
          oneOf:
            - $ref: "#/components/schemas/ThinkingLevel"
            - type: "null"

    ContextHandoff:
      description: |
        A selection of the saved conversation, given to a new runtime with the first message after the Agent's runtime
        changed. The new runtime starts its own session and does not see the earlier runtime's memory; the selection is
        a marked block in the prompt before this turn's message (after the run ID line). The stored message stays the
        user's own text, and the message itself is never shortened.
        The conversation is everything saved for this Agent since the user last started over (/new or resuming another
        session). When it fits the budget it goes whole; otherwise the first request, the most recent requests and
        answers, and as many earlier messages as fit are kept, in order and in full (partial text of failed or
        interrupted turns included), with each turn's tool use in short form (tool names, how many failed). Reasoning,
        tool state and images are not carried. The block says how many messages were left out, and the Agent can read
        them with `loopctl conversation`.
        The block goes with every message until one that carries it reaches the new runtime and either completes or has
        its session saved, so a turn that fails before that (for example because the runtime is not logged in) does not
        lose it; each turn that carried it has this record.
      type: object
      required: [reason, fromRuntime, toRuntime, includedMessages, omittedMessages, images, bytes, budgetBytes]
      additionalProperties: false
      properties:
        reason:
          type: string
          enum: [runtime_changed, session_lost, task_start]
          description: |
            Why the conversation was carried: runtime_changed, the Agent's runtime changed; session_lost, the runtime's
            own session could not be continued (its record is gone or the runtime cannot load it), so a new session
            started with the saved conversation instead of stopping for the user; task_start, a task instance on a
            runtime that cannot fork sessions started with the regular conversation.
        fromRuntime:
          $ref: "#/components/schemas/AgentRuntime"
          description: The runtime that ran the conversation before the change; can equal toRuntime when the change was undone after the new runtime had already run a message
        toRuntime: { $ref: "#/components/schemas/AgentRuntime" }
        includedMessages: { type: integer, minimum: 0, description: Saved messages carried over in full }
        omittedMessages: { type: integer, minimum: 0, description: Saved messages left out to stay within the budget }
        images: { type: integer, minimum: 0, description: Images in the saved conversation; they are counted in the block but never carried }
        bytes: { type: integer, minimum: 0, description: Size of the block in UTF-8 bytes }
        budgetBytes:
          type: integer
          minimum: 0
          description: |
            The budget the block was selected for, counted as one token per UTF-8 byte (default 16000; the server's
            LOOP_NOW_CONTEXT_HANDOFF_TOKENS changes it, clamped to 1024-64000)

    UsageTotals:
      description: Sum of a number of usage records; total = input + output + cacheRead + cacheWrite
      type: object
      required: [calls, input, output, cacheRead, cacheWrite, total]
      additionalProperties: false
      properties:
        calls: { type: integer, minimum: 0 }
        input: { type: integer, minimum: 0 }
        output: { type: integer, minimum: 0 }
        cacheRead: { type: integer, minimum: 0 }
        cacheWrite: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }

    MessageRole:
      type: string
      enum: [user, assistant]

    MessageOrigin:
      description: Source of a conversation message. console means sent from the console; inbox_reminder means a platform reminder after an Inbox message arrived; sleep_wake means a platform wake that continues the original session when the sleep is due
      type: string
      enum: [console, inbox_reminder, sleep_wake]

    Message: {"type":"object","required":["id","role","origin","text","createdAt","sessionEpoch","run"],"additionalProperties":false,"properties":{"id":{"type":"string","format":"uuid"},"role":{"$ref":"#/components/schemas/MessageRole"},"origin":{"description":"Taken from the run the message belongs to; a user message and its reply have the same value. For a platform reminder turn, the user message text is the reminder text generated when the run starts","$ref":"#/components/schemas/MessageOrigin"},"text":{"type":"string"},"createdAt":{"type":"string","format":"date-time"},"sessionEpoch":{"type":"integer","minimum":1},"run":{"description":"The run this message belongs to; a user message and its reply carry the same run","$ref":"#/components/schemas/Run"},"images":{"type":"array","items":{"$ref":"#/components/schemas/MessageImage"}}}}
    ConversationPage:
