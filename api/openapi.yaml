    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      tags: [folders]
      operationId: createAgentFolderDirectory
      x-access: console
      summary: 在 Agent 文件夹中新建目录（含缺少的上级目录）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FolderPathInput" }
