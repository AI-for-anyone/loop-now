    # ---- Plugins (plugins/SPEC.md) ----

    PluginStatus:
      description: |
        - installed: installed; the platform side is not in the plugin host (there is no platform side, plugins are
          disabled globally, or the plugin host has not started yet)
        - active: the platform side is loaded in the plugin host
        - error: loading failed (the manifest does not match the code, register threw, etc.); see lastError for the
          reason
        - host_stopped: the plugin host reached its crash limit and was stopped
      type: string
      enum: [installed, active, error, host_stopped]

    PluginSource:
      description: |
        Install source. builtin is an official plugin shipped with the platform (location is the plugin id); local is
        the absolute path of a directory on the server machine (used in place); git is a repository address (ref is a
        branch, tag or commit; the default branch when omitted); npm is a package spec (a name, optionally with
        @version); market is an entry in a market (market is the market address, id is the entry's plugin id, and
        version defaults to the version listed in the market; the plugin is actually fetched from the entry's git or npm
        source).
        builtin, local, git and npm require location; market requires market and id.
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [builtin, local, git, npm, market] }
        location: { type: string, minLength: 1, maxLength: 2048 }
        ref: { type: [string, "null"], maxLength: 256 }
        market: { type: string, minLength: 1, maxLength: 2048 }
        id: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$" }
        version: { type: string, maxLength: 64 }

    PluginResolvedSource:
      description: The exact source recorded at install time (commit for git, npmVersion for npm; both null for builtin and local). When installed from a market, market is the market address (and kind is the entry's git or npm); otherwise null.
      type: object
      required: [kind, location, ref, commit, npmVersion, market]
      additionalProperties: false
      properties:
        market: { type: [string, "null"] }
        kind: { type: string, enum: [builtin, local, git, npm] }
        location: { type: string }
        ref: { type: [string, "null"] }
        commit: { type: [string, "null"] }
        npmVersion: { type: [string, "null"] }

    PluginAccountKind:
      type: object
      required: [kind, label, fields, multiple]
      additionalProperties: false
      properties:
        kind: { type: string }
        label: { $ref: "#/components/schemas/LocalizedText" }
        fields: { description: "JSON Schema of the account fields; secret fields carry `x-secret: true`; `title` and `description` may be LocalizedText as in configSchema", type: object }
        multiple: { type: boolean }

    PluginAction:
      type: object
      required: [id, label, where, fields]
      additionalProperties: false
      properties:
        id: { type: string }
        label: { $ref: "#/components/schemas/LocalizedText" }
        fields: { description: "JSON Schema of the action form (an object); an empty object when there is no input; `title` and `description` may be LocalizedText as in configSchema", type: object }
        where:
          type: array
          items: { type: string, enum: [agent, task, project, identity, global] }

    PluginComponents:
      description: Components shown before install, i.e. what each side contains.
      type: object
      required: [agentExtensions, skills, mcpServers, bin, platform, actions, channels, http, schedules]
      additionalProperties: false
      properties:
        agentExtensions: { description: "Number of files in pi.extensions", type: integer, minimum: 0 }
        skills: { description: "Directories in pi.skills", type: array, items: { type: string } }
        mcpServers: { description: "Names in loopNow.mcpServers", type: array, items: { type: string } }
        bin: { description: "Directories in loopNow.bin", type: array, items: { type: string } }
        platform: { description: "Whether there is a platform side", type: boolean }
        actions: { type: array, items: { $ref: "#/components/schemas/PluginAction" } }
        channels:
          type: array
          items:
            type: object
            required: [id, label, manageIdentities]
            additionalProperties: false
            properties:
              id: { type: string }
              label: { $ref: "#/components/schemas/LocalizedText" }
              manageIdentities: { description: "This channel can manage external identities (plugins/SPEC.md §12); requires the identities.manage scope", type: boolean }
        http: { type: boolean }
        schedules:
          type: array
          items:
            type: object
            required: [id, cron]
            additionalProperties: false
            properties:
              id: { type: string }
              cron: { type: string }

    LocalizedText:
      description: >-
        Text that can be given per language: plugin manifests and market entries (displayName, description, the labels
        of channels, actions and account kinds, and title, description and oneOf entry titles inside their JSON Schemas)
        and CLI template field labels. A string, which counts as English and is shown in every language; or an object
        keyed by language tag (such as `en-US`, `zh-CN`) whose values are strings that are non-empty after trimming, with
        at least one entry; official templates and plugins give en-US first and zh-CN. The server returns it as is
        (objects keep the author's key order) and does not translate it; the console picks the current language → zh-CN
        → en-US → the first entry. An empty string when absent.
      oneOf:
        - type: string
        - type: object
          minProperties: 1
          propertyNames: { pattern: "^[A-Za-z]{2,3}(-[A-Za-z0-9]{1,8})*$" }
          additionalProperties: { type: string, pattern: "\\S" }

    PluginManifest:
      description: The manifest read from the plugin's `package.json` (the pi and loopNow sections), validated against the rules.
      type: object
      required: [id, name, version, displayName, description, minPlatformVersion, events, permissions, failClosed, configSchema, accounts, components]
      additionalProperties: false
      properties:
        id: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$" }
        name: { description: "npm package name", type: string }
        version: { type: string }
        displayName: { $ref: "#/components/schemas/LocalizedText" }
        description: { $ref: "#/components/schemas/LocalizedText" }
        minPlatformVersion: { type: [string, "null"] }
        events: { description: "Subscribed events", type: array, items: { type: string } }
        permissions: { type: array, items: { $ref: "#/components/schemas/PluginPermission" } }
        failClosed: { description: "Block rather than allow when an intercepting Hook times out or errors", type: boolean }
        configSchema: { description: "JSON Schema of the config form; an empty object when there is no config. `title` and `description` at any level, including the oneOf entries that name enum options, may be LocalizedText; they are returned as written", type: object }
        accounts: { type: array, items: { $ref: "#/components/schemas/PluginAccountKind" } }
        components: { $ref: "#/components/schemas/PluginComponents" }

    PluginPermission:
      description: Scopes of platform endpoints a plugin token may use (plugins/SPEC.md §5); `x-plugin-scope` on an endpoint gives the scope it requires.
      type: string
      enum: [agents.read, agents.write, tasks.read, tasks.write, runs.read, inbox.read, inbox.send, folders.read, folders.write, identities.read, identities.manage, state, accounts.read]

    PluginPreviewRequest:
      type: object
      additionalProperties: false
      properties:
        source: { $ref: "#/components/schemas/PluginSource" }
        pluginId: { description: "Re-fetch from the source recorded for an installed plugin (preview before an update)", type: string }

    PluginPreview:
      type: object
      required: [previewId, expiresAt, source, trusted, manifest, installedVersion]
      additionalProperties: false
      properties:
        previewId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        source: { $ref: "#/components/schemas/PluginResolvedSource" }
        trusted: { description: "Official source; when false, the install must include confirm", type: boolean }
        manifest: { $ref: "#/components/schemas/PluginManifest" }
        installedVersion: { description: "Installed version with the same id; null when not installed", type: [string, "null"] }

    PluginReadme:
      description: The plugin's README (plugins/SPEC.md §2.3) as raw Markdown; relative links and images are not resolved.
      type: object
      required: [file, markdown, truncated]
      additionalProperties: false
      properties:
        file: { description: "Selected file name (such as README.zh-CN.md); null when there is no README at all", type: [string, "null"] }
        markdown: { description: "File content; null when there is no README", type: [string, "null"] }
        truncated: { description: "The file exceeds 1 MiB and only the first 1 MiB is returned", type: boolean }

    PluginInstall:
      type: object
      required: [previewId]
      additionalProperties: false
      properties:
        previewId: { type: string, format: uuid }
        confirm: { description: "Confirms installing from an unofficial source", type: boolean }

    Plugin:
      type: object
      required: [id, displayName, description, version, source, status, lastError, hasPlatform, enabledProjects, grantedAgents, installedAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string }
        displayName: { $ref: "#/components/schemas/LocalizedText" }
        description: { $ref: "#/components/schemas/LocalizedText" }
        version: { type: string }
        source: { $ref: "#/components/schemas/PluginResolvedSource" }
        status: { $ref: "#/components/schemas/PluginStatus" }
        lastError: { type: [string, "null"] }
        hasPlatform: { type: boolean }
        enabledProjects: { description: "Number of non-deleted projects that have it enabled", type: integer, minimum: 0 }
        grantedAgents: { description: "Number of non-deleted Agents it is granted to", type: integer, minimum: 0 }
        installedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PluginList:
      type: object
      required: [plugins]
      additionalProperties: false
      properties:
        plugins: { type: array, items: { $ref: "#/components/schemas/Plugin" } }

    PluginVersion:
      type: object
      required: [version, digest, installedAt, current]
      additionalProperties: false
      properties:
        version: { type: string }
        digest: { description: "sha256 of the installed content", type: string }
        installedAt: { type: string, format: date-time }
        current: { type: boolean }

    PluginDetail:
      type: object
      required: [plugin, manifest, versions, installDir, dataDir, providers, providerErrors, providersError, providerState]
      additionalProperties: false
      properties:
        plugin: { $ref: "#/components/schemas/Plugin" }
        manifest: { $ref: "#/components/schemas/PluginManifest" }
        versions: { description: "Newest first", type: array, items: { $ref: "#/components/schemas/PluginVersion" } }
        installDir: { type: string }
        dataDir: { type: string }
        providers:
          description: Model providers registered by the current version's Pi extensions (read at install or update); empty when there is no Pi extension or none is registered
          type: array
          items: { $ref: "#/components/schemas/PluginModelProvider" }
        providerErrors:
          description: Extension files that failed to load during the read, with reasons (the extension's original text, truncated; show as plain text)
          type: array
          items: { $ref: "#/components/schemas/PluginProviderCaptureError" }
        providersError:
          description: Why the whole read failed (such as Pi unavailable or a timeout); empty means the read succeeded or the plugin has no Pi extension
          type: [string, "null"]
        providerState: { $ref: "#/components/schemas/PluginProviderState" }

    PluginProviderState:
      description: |
        Which state of the model providers registered by the plugin follows the project account (plugins/SPEC.md §13):
        keys are provider ids, and paths are the relative paths under HOME where the extension saves its login and state
        (/-separated, 1 to 8 of them, no .., not under .loop-now). Before Pi starts, these paths are linked to the
        account's state directory, shared by all Agents in the same project.
        In plugin details this is the declaration in effect for the current version: the market entry's providerState
        when installed from a market, otherwise the package's own loopNow.providerState; an empty object when neither
        exists, in which case only Pi's auth entry follows the account. Display only.
      type: object
      additionalProperties:
        type: object
        required: [paths]
        additionalProperties: false
        properties:
          paths:
            type: array
            minItems: 1
            maxItems: 8
            items: { type: string, minLength: 1, maxLength: 200 }

    AgentCommandList:
      type: object
      required: [runtime, capturedAt, commands]
      additionalProperties: false
      properties:
        runtime:
          description: The Agent's current runtime. Only pi has Pi commands; other runtimes (claude-code, codex) list no Pi commands, and capturedAt is always null
          $ref: "#/components/schemas/AgentRuntime"
        capturedAt:
          description: When the Pi commands were read (at Pi startup). null while runtime is pi means Pi has not started yet; always null when runtime is not pi
          type: [string, "null"]
          format: date-time
        commands: { type: array, items: { $ref: "#/components/schemas/AgentCommand" } }

    AgentCommand:
      type: object
      required: [name, source, piSource, description, pluginId, pluginDisplayName, usage, available, unavailableReason]
      additionalProperties: false
      properties:
        name: { description: 'Command name without "/"; Skill commands are named skill:<name>', type: string }
        source: { description: "platform is a built-in platform command (sent as /<name>); pi is handed to Pi to run (sent as /pi:<name>)", type: string, enum: [platform, pi] }
        piSource: { description: "Source reported by Pi (verbatim): extension for an extension command, prompt for a prompt template, skill for a Skill command; an empty string for platform commands", type: string }
        description:
          description: |
            Command description, shown as plain text. For Pi commands it is the extension's original text (a string);
            for platform commands it is a Chinese and an English description (a LocalizedText object keyed by zh-CN and
            en-US), and the console picks the current language. Placeholders from the usage (instructions, html|jsonl,
            session-id) are written the same way in the description. null when there is no description
          oneOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        usage:
          description: "Usage of a platform command; arguments in square brackets are optional: `/compact [instructions]`, `/export [html|jsonl]`, `/resume [session-id]` (the full session ID). null for Pi commands"
          type: [string, "null"]
        available:
          description: |
            Whether it can be used right now. Platform commands depend only on the Agent's runtime
            (AgentCommandList.runtime) and session state (SessionState); see unavailableReason for the rules. Whether
            the Agent is busy is not judged here; sending then returns 409. Every change of either is pushed as
            session.updated on the Agent's event stream (GET /agents/{agentId}/events): reopen, resume, session file
            lost, the session going from none to active after the first reply, and a model change that switches the
            runtime (the session is reopened with it). After session.updated, just read this endpoint again.
            Always true for Pi commands.
          type: boolean
        unavailableReason:
          description: |
            Why it cannot be used: runtime_unsupported, the runtime does not support it (Claude Code Agents have no Pi
            session, so no /compact, /export or /resume); session_none, there is no session yet (/compact, /export);
            session_missing, the session file is lost (/compact, /export; run /new or /resume first). null when usable
          type: [string, "null"]
          enum: [runtime_unsupported, session_none, session_missing, null]
        pluginId: { description: "The installed plugin the command comes from (by the install directory that contains its source file); null for platform commands or when it cannot be determined", type: [string, "null"] }
        pluginDisplayName:
          oneOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"

    PluginModelProvider:
      type: object
      required: [id, name, extension, oauth, overridesBuiltin, inCatalog, error, modelCount]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { description: "Display name given by the extension (untrusted text; show as plain text)", type: string }
        extension: { description: "The extension file that registered it, relative to the plugin directory", type: string }
        oauth: { description: Whether it registers an OAuth subscription login, type: boolean }
        overridesBuiltin: { description: "Same id as a built-in Pi provider (the extension overrides the built-in provider's settings); not added to the model catalog", type: boolean }
        inCatalog: { description: "Currently in the model catalog and owned by this plugin; only providers with OAuth, an id different from both the built-in providers and models.json, and a clean registration get in", type: boolean }
        error: { description: "Why registration failed (the extension's original text, truncated)", type: [string, "null"] }
        modelCount: { type: integer, minimum: 0 }

    PluginProviderCaptureError:
      type: object
      required: [path, error]
      additionalProperties: false
      properties:
        path: { description: "Extension file, relative to the plugin directory", type: string }
