  /agents:
    get:
      tags: [agents]
      operationId: findAgents
      x-access: console-and-external
      summary: Find an Agent by address; returns 0 or 1 item
      description: |
        The address is written the same way as an Inbox recipient address (see `InboxSendInput.to`) and is resolved by the
        server; an Agent's internal ID is also accepted.
        When nothing is found, the Agent is deleted, its project is deleted, the address starts with `@` (it does not point to
        an Agent) or it carries `#<task ID>`, an empty list is returned, not 404.
        The address goes in a query parameter and must be URL-encoded, otherwise the part after `#` is taken as the URL
        fragment and lost.
      parameters:
        - name: address
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
