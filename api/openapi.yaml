        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [local-mode]
      operationId: putAgentLocalDirectories
      x-access: console
      summary: Replace the Agent's own whole local directory list
      description: Same rules as `putProjectLocalDirectories`; only `directories` is replaced. The response is the same as GET (with inherited).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalDirectoriesPut" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The saved list (with status)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentLocalDirectories" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

