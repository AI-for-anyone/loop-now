  /agents/{agentId}/folder/entries:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      tags: [folders]
      operationId: listAgentFolderEntries
      x-access: console
      summary: List one level of an Agent folder (lazy loading)
      description: |
        Lists only the `path` level, with no recursion and no directory sizes; directories first, each kind sorted by name.
        `limit` defaults to 500, at most 2000;
        when there are more, `nextCursor` is returned; pass it back unchanged to get the next page. The Agent folder is the
        Agent's working directory (Pi's cwd) and also its own context; every regular Agent and platform Agent has one.
      parameters:
        - $ref: "#/components/parameters/FolderPath"
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Entries at this level
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderEntryPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [folders]
      operationId: deleteAgentFolderEntry
      x-access: console
      summary: Delete a file or directory (with all its contents) in an Agent folder
      description: |
        First moves it to a trash area outside the folder (returns immediately), then deletes it in the background; there is
        no restore. For a symlink only the link itself is deleted. The folder root cannot be deleted.
      parameters:
        - $ref: "#/components/parameters/FolderEntryPath"
      responses:
        "204":
          description: Deleted
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /agents/{agentId}/folder/content:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      tags: [folders]
      operationId: getAgentFolderFileContent
      x-access: console
      summary: Download a file from an Agent folder (raw bytes)
      description: Supports Range; downloads a single file only, with no directory archive. The client decides whether a file
        is text; for the size limit of online editing see `Context.limits.textEdit`.
      parameters:
        - $ref: "#/components/parameters/FolderEntryPath"
      responses:
        "200":
          description: File content
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: The requested byte range
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    put:
      tags: [folders]
      operationId: putAgentFolderFileContent
      x-access: console
      summary: Upload, create or save (online editing) a file in an Agent folder
      description: |
        The request body is the file's raw bytes, streamed into a temporary file in the same directory and then renamed, so
        readers never see a half-written file; missing parent directories are created automatically.
        There is no lock; the last write wins. With `create=true`, an existing target returns 409 `path_conflict` (used for
        creating new files).
        Returns 422 when the target is a symlink or a directory. The per-file limit is `Context.limits.maxFolderUpload`;
        larger returns 413. To upload a folder, the client uploads the files one by one by relative path.
      parameters:
        - $ref: "#/components/parameters/FolderEntryPath"
        - name: create
          in: query
          required: false
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

