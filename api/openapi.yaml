    StatsReport:
      description: |
        Report for the stats page. Seconds are decimals; ratios are decimals from 0 to 1, null when the denominator
        is 0.
        "Runs" means regular runs (runs) and task turns (task_turns), counting only those actually dispatched; runs
        cancelled, merged or voided while queued do not count.
      type: object
      required: [from, to, bucket, buckets, tokens, byOrigin, wakes, context, questions, wait, outcomes, agents, tools, process, concurrency]
      additionalProperties: false
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        bucket: { type: string, enum: [hour, day] }
        buckets:
          description: Start time of each bucket, in chronological order
          type: array
          items: { type: string, format: date-time }
        tokens: { $ref: "#/components/schemas/StatsTokens" }
        byOrigin: { $ref: "#/components/schemas/StatsOrigins" }
        wakes:
          description: Runs from scheduled wakes (sleep expiry), aggregated per Agent, in descending order of tokens; Agents without wakes are left out
          type: array
          items: { $ref: "#/components/schemas/StatsAgentWakes" }
        context: { $ref: "#/components/schemas/StatsContext" }
        questions: { $ref: "#/components/schemas/StatsQuestions" }
        wait: { $ref: "#/components/schemas/StatsWait" }
        outcomes: { $ref: "#/components/schemas/StatsOutcomes" }
        agents:
          description: Agent health, one row per Agent with runs or usage in the time window, in descending order of tokens
          type: array
          items: { $ref: "#/components/schemas/StatsAgentHealth" }
        tools: { $ref: "#/components/schemas/StatsTools" }
        process: { $ref: "#/components/schemas/StatsProcess" }
        concurrency:
          description: |
            For each hour from 0 to 23 in the server's local time, the average number of runs replying at the same time
            during that hour (total reply time in that hour within the time window ÷ total observed time of that hour).
            Reply time: for regular runs, from the start of the reply to the end; for task turns, from dispatch to the
            end (task turns do not record a separate reply start time); runs that have not ended count up to now.
            null when that hour has not yet come within the time window (it is later than now).
          type: array
          minItems: 24
          maxItems: 24
          items: { type: [number, "null"], minimum: 0 }

    StatsTokenCounts:
      type: object
      required: [input, output, cacheRead, cacheWrite, total]
      additionalProperties: false
      properties:
        input: { type: integer, minimum: 0 }
        output: { type: integer, minimum: 0 }
        cacheRead: { type: integer, minimum: 0 }
        cacheWrite: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }

    StatsTokens:
      description: All usage in the time window (including usage outside tasks and replies)
      type: object
      required: [totals, cacheHitRate, byModel, series]
      additionalProperties: false
      properties:
        totals: { $ref: "#/components/schemas/StatsTokenCounts" }
        cacheHitRate:
          description: cacheRead ÷ (input + cacheRead)
          type: [number, "null"]
          minimum: 0
          maximum: 1
        byModel:
          description: Aggregated by (provider, model), in descending order of total; provider and model both null means an unknown model
          type: array
          items: { $ref: "#/components/schemas/StatsModelTokens" }
        series:
          description: The total of each bucket
          type: array
          items: { type: integer, minimum: 0 }

    StatsModelTokens:
      type: object
      required: [provider, model, total]
      additionalProperties: false
      properties:
        provider: { type: [string, "null"] }
        model: { type: [string, "null"] }
        total: { type: integer, minimum: 0 }

    StatsOriginTokens:
      description: |
        Tokens split by the source that triggered the run. Regular runs go by runs.origin: console (your messages, plus
        manual compactions with /compact from the console), inbox_reminder (Inbox reminders), sleep_wake (scheduled
        wakes); task turns go by their origin: console_node counts toward console, inbox_reminder toward inboxReminder,
        sleep_wake toward sleepWake, task_node toward task; usage that belongs to no run (for example cache warming
        between two turns) counts toward other. The five fields sum to tokens.totals.total.
      type: object
      required: [console, inboxReminder, sleepWake, task, other]
      additionalProperties: false
      properties:
        console: { type: integer, minimum: 0 }
        inboxReminder: { type: integer, minimum: 0 }
        sleepWake: { type: integer, minimum: 0 }
        task: { type: integer, minimum: 0 }
        other: { type: integer, minimum: 0 }

    StatsOrigins:
      type: object
      required: [totals, unrequestedShare, series]
      additionalProperties: false
      properties:
        totals: { $ref: "#/components/schemas/StatsOriginTokens" }
        unrequestedShare:
          description: sleepWake ÷ all tokens
          type: [number, "null"]
          minimum: 0
          maximum: 1
        series:
          description: Tokens per source for each bucket
          type: array
          items: { $ref: "#/components/schemas/StatsOriginTokens" }

    StatsAgentWakes:
      type: object
      required: [agentId, name, projectId, count, tokens, avgTokens, avgIntervalSeconds]
      additionalProperties: false
      properties:
        agentId: { type: string, format: uuid }
        name: { type: string }
        projectId: { type: [string, "null"], format: uuid, description: "null for a platform Agent" }
        count:
          description: Number of scheduled wake runs queued in the time window (regular runs and task turns)
          type: integer
          minimum: 1
        tokens:
          description: All usage of these wake runs
          type: integer
          minimum: 0
        avgTokens: { type: number, minimum: 0 }
        avgIntervalSeconds:
          description: Average interval between consecutive wakes ((last − first) ÷ (count − 1)); null when there was only one
          type: [number, "null"]
          minimum: 0

    StatsContext:
      description: Context sent into each model call (input + cacheRead), counting only usage with kind assistant; compactions is the number of usage records with kind compaction
      type: object
      required: [avgInputPerCall, compactions, series, agents]
      additionalProperties: false
      properties:
        avgInputPerCall: { type: [number, "null"], minimum: 0 }
        compactions: { type: integer, minimum: 0 }
        series:
          description: avgInputPerCall of each bucket; null when the bucket has no calls
          type: array
          items: { type: [number, "null"], minimum: 0 }
        agents:
          description: Agents with model calls in the time window, in descending order of avgInputPerCall
          type: array
          items: { $ref: "#/components/schemas/StatsAgentContext" }

    StatsAgentContext:
      type: object
      required: [agentId, name, projectId, calls, avgInputPerCall, compactions]
      additionalProperties: false
      properties:
        agentId: { type: string, format: uuid }
        name: { type: string }
        projectId: { type: [string, "null"], format: uuid }
        calls: { type: integer, minimum: 1 }
        avgInputPerCall: { type: number, minimum: 0 }
        compactions: { type: integer, minimum: 0 }

    StatsQuestions:
      description: Questions sent to `@console` by Agents (including task instances)
      type: object
      required: [asked, answered, avgAnswerSeconds, maxAnswerSeconds, series, pending]
      additionalProperties: false
      properties:
        asked:
          description: Number of questions sent in the time window
          type: integer
          minimum: 0
        answered:
          description: How many of them have been answered
          type: integer
          minimum: 0
        avgAnswerSeconds:
          description: Average seconds from sending to answering (answered_at) for answered questions; null when there are none
          type: [number, "null"]
          minimum: 0
        maxAnswerSeconds: { type: [number, "null"], minimum: 0 }
        series:
          description: Questions sent per bucket
          type: array
          items: { type: integer, minimum: 0 }
        pending:
          description: Questions that are still open and not expired now, regardless of the time window, oldest first
          type: array
          items: { $ref: "#/components/schemas/StatsPendingQuestion" }

    StatsPendingQuestion:
      type: object
      required: [messageId, agentId, name, projectId, text, askedAt]
      additionalProperties: false
      properties:
        messageId: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        name: { type: string }
        projectId: { type: [string, "null"], format: uuid }
        text:
          description: First 80 characters of the question text
          type: string
          maxLength: 80
        askedAt: { type: string, format: date-time }

    StatsWait:
      description: |
        Wait: seconds from queueing your message (a regular run with origin console) to the start of its reply,
        including time spent queued behind other runs.
        Reply duration: seconds from the start of a run's reply to its end (for task turns, counted from dispatch),
        across all sources and outcomes.
      type: object
      required: [p50, p90, durationP50, series]
      additionalProperties: false
      properties:
        p50: { type: [number, "null"], minimum: 0 }
        p90: { type: [number, "null"], minimum: 0 }
        durationP50: { type: [number, "null"], minimum: 0 }
        series:
          type: array
          items: { $ref: "#/components/schemas/StatsWaitBucket" }

    StatsWaitBucket:
      type: object
      required: [p50, p90]
      additionalProperties: false
      properties:
        p50: { type: [number, "null"], minimum: 0 }
        p90: { type: [number, "null"], minimum: 0 }

    StatsOutcomeCounts:
      description: Outcomes of ended runs; interrupted includes both interrupted and stopped runs
      type: object
      required: [completed, interrupted, failed]
      additionalProperties: false
      properties:
        completed: { type: integer, minimum: 0 }
        interrupted: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }

    StatsOutcomes:
      type: object
      required: [totals, series, reasons]
      additionalProperties: false
      properties:
        totals: { $ref: "#/components/schemas/StatsOutcomeCounts" }
        series:
          type: array
          items: { $ref: "#/components/schemas/StatsOutcomeCounts" }
        reasons:
          description: Reasons for not completing, in descending order of count
          type: array
          items: { $ref: "#/components/schemas/StatsOutcomeReason" }

    StatsOutcomeReason:
      type: object
      required: [kind, code, count]
      additionalProperties: false
      properties:
        kind:
          description: stopped means you pressed stop; interrupted means any other interruption (a new message, a server restart and so on); failed means a failure
          type: string
          enum: [interrupted, stopped, failed]
        code:
          description: For interrupted or stopped, the end reason (endReason for regular runs, errorCode for task turns, user_stopped for a stop); for failed, the errorCode; null when nothing was recorded
          type: [string, "null"]
        count: { type: integer, minimum: 1 }

    StatsAgentHealth:
      type: object
      required: [agentId, name, projectId, runs, completionRate, waitP90, durationP50, wakes, wakeTokens, avgContext, compactions, tokens, cacheHitRate]
      additionalProperties: false
      properties:
        agentId: { type: string, format: uuid }
        name: { type: string }
        projectId: { type: [string, "null"], format: uuid }
        runs:
          description: Number of ended runs (same as outcomes)
          type: integer
          minimum: 0
        completionRate: { type: [number, "null"], minimum: 0, maximum: 1 }
        waitP90: { type: [number, "null"], minimum: 0, description: "Same as wait.p90, for this Agent only" }
        durationP50: { type: [number, "null"], minimum: 0 }
        wakes: { type: integer, minimum: 0 }
        wakeTokens: { type: integer, minimum: 0 }
        avgContext: { type: [number, "null"], minimum: 0, description: "Same as context.agents[].avgInputPerCall" }
        compactions: { type: integer, minimum: 0 }
        tokens: { type: integer, minimum: 0 }
        cacheHitRate: { type: [number, "null"], minimum: 0, maximum: 1 }

    StatsTools:
      description: Tool calls of regular runs (task turns do not record tool calls); counts the runs queued in the time window that started replying
      type: object
      required: [byName, callsPerRunAvg, callsPerRunMax]
      additionalProperties: false
      properties:
        byName:
          description: Aggregated by tool name, in descending order of calls
          type: array
          items: { $ref: "#/components/schemas/StatsTool" }
        callsPerRunAvg:
          description: Average number of calls per run (including runs without calls); null when there are no runs
          type: [number, "null"]
          minimum: 0
        callsPerRunMax: { type: [integer, "null"], minimum: 0 }

    StatsTool:
      type: object
      required: [name, calls, failures]
      additionalProperties: false
      properties:
        name: { type: string }
        calls: { type: integer, minimum: 0 }
        failures: { type: integer, minimum: 0 }

    StatsProcess:
      description: Run record events in the time window (regular and task)
      type: object
      required: [modelRetries, piExits, piColdStarts, piColdStartAvgMs]
      additionalProperties: false
      properties:
        modelRetries:
          description: Number of model request retries (model.retry_started)
          type: integer
          minimum: 0
        piExits:
          description: Number of abnormal Pi process ends, that is, unexpected exits (pi.exited) plus forced stops after an interrupt timed out (pi.stopped with reason abort_timeout)
          type: integer
          minimum: 0
        piColdStarts:
          description: Number of Pi process starts (pi.started)
          type: integer
          minimum: 0
        piColdStartAvgMs: { type: [number, "null"], minimum: 0 }

    RunTimeline:
      type: object
      required: [run, entries, usage]
      additionalProperties: false
      properties:
        run: { $ref: "#/components/schemas/Run" }
        entries:
          description: Sorted by time
          type: array
          items: { $ref: "#/components/schemas/TimelineEntry" }
        usage: { $ref: "#/components/schemas/UsageTotals" }

    TimelineEntry:
      oneOf:
        - $ref: "#/components/schemas/TimelineSleepEntry"
        - $ref: "#/components/schemas/TimelineQueued"
        - $ref: "#/components/schemas/TimelinePromoted"
        - $ref: "#/components/schemas/TimelineMessageCancelled"
        - $ref: "#/components/schemas/TimelineMarker"
        - $ref: "#/components/schemas/TimelinePhase"
        - $ref: "#/components/schemas/TimelineCliInstall"
        - $ref: "#/components/schemas/TimelineWorkspaceSync"
        - $ref: "#/components/schemas/TimelinePiStarted"
        - $ref: "#/components/schemas/TimelinePiReused"
        - $ref: "#/components/schemas/TimelinePiStopped"
        - $ref: "#/components/schemas/TimelinePiExited"
        - $ref: "#/components/schemas/TimelineTool"
        - $ref: "#/components/schemas/TimelineModelCall"
        - $ref: "#/components/schemas/TimelineModelRetryStarted"
        - $ref: "#/components/schemas/TimelineModelRetryEnded"
        - $ref: "#/components/schemas/TimelineCompaction"
        - $ref: "#/components/schemas/TimelineAbortRequested"
        - $ref: "#/components/schemas/TimelineEnded"
        - $ref: "#/components/schemas/TimelineSessionMissing"
        - $ref: "#/components/schemas/TimelineContextHandoff"
        - $ref: "#/components/schemas/TimelineBackgroundWaitTimeout"
        - $ref: "#/components/schemas/TimelineExtensionUI"
        - $ref: "#/components/schemas/TimelineModelRateLimit"
      discriminator:
        propertyName: type
        mapping:
          queued: "#/components/schemas/TimelineQueued"
          promoted: "#/components/schemas/TimelinePromoted"
          message_cancelled: "#/components/schemas/TimelineMessageCancelled"
          dispatched: "#/components/schemas/TimelineMarker"
          running: "#/components/schemas/TimelineMarker"
          phase: "#/components/schemas/TimelinePhase"
          cli_install: "#/components/schemas/TimelineCliInstall"
          workspace_sync: "#/components/schemas/TimelineWorkspaceSync"
          pi_started: "#/components/schemas/TimelinePiStarted"
          pi_reused: "#/components/schemas/TimelinePiReused"
          pi_stopped: "#/components/schemas/TimelinePiStopped"
          pi_exited: "#/components/schemas/TimelinePiExited"
          tool: "#/components/schemas/TimelineTool"
          model_call: "#/components/schemas/TimelineModelCall"
          model_retry_started: "#/components/schemas/TimelineModelRetryStarted"
          model_retry_ended: "#/components/schemas/TimelineModelRetryEnded"
          compaction: "#/components/schemas/TimelineCompaction"
          abort_requested: "#/components/schemas/TimelineAbortRequested"
          ended: "#/components/schemas/TimelineEnded"
          session_missing: "#/components/schemas/TimelineSessionMissing"
          context_handoff: "#/components/schemas/TimelineContextHandoff"
          background_wait_timeout: "#/components/schemas/TimelineBackgroundWaitTimeout"
          sleep: "#/components/schemas/TimelineSleepEntry"
          extension_ui: "#/components/schemas/TimelineExtensionUI"
          model_rate_limit: "#/components/schemas/TimelineModelRateLimit"

    TimelineExtensionUI:
      description: |
        A request from an agent-side extension through ctx.ui (extension_ui_request in Pi RPC). notify is a notification
        (level info, warning or error); setStatus sets or clears a status (cleared when message is empty). select,
        confirm, input and editor are dialogs, and message is the dialog title: a confirm, select or input during a
        regular Agent's turn becomes a question from that Agent to the console (questionId; the deadline is the
        request's timeout, or 30 minutes when it has none), and the answer is handed back to the extension. This entry
        is written when the dialog ends, with answered set to answered (someone answered), cancelled (the answer was a
        cancel) or expired (the deadline passed or the turn ended, and the extension received a cancel); editor, task
        turns and dialogs that cannot become questions are answered with a cancel right away (answered is cancelled,
        questionId is null).
      type: object
      required: [type, at, method, message, level, statusKey, answered, questionId]
      additionalProperties: false
      properties:
        type: { type: string, enum: [extension_ui] }
        at: { type: string, format: date-time }
        method: { type: string, enum: [notify, setStatus, select, confirm, input, editor] }
        message: { type: [string, "null"] }
        level: { type: [string, "null"], enum: [info, warning, error, null] }
        statusKey: { type: [string, "null"] }
        answered: { type: [string, "null"], enum: [answered, cancelled, expired, null] }
        questionId: { description: "The console question for the dialog (an Inbox message ID)", type: [string, "null"], format: uuid }

    TimelineSleepEntry:
      description: Persistent record of a sleep being registered, taking effect, ending early, being scheduled on expiry or becoming invalid; contains no internal scheduling fields
      type: object
      additionalProperties: false
      required: [type, at, sleep]
      properties:
        type: { type: string, enum: [sleep] }
        at: { type: string, format: date-time }
        sleep: { $ref: "#/components/schemas/SleepRecord" }

    TimelineQueued:
      description: Queued because the Agent was busy at send time
      type: object
      required: [type, at, whenBusy]
      additionalProperties: false
      properties:
        type: { type: string, enum: [queued] }
        at: { type: string, format: date-time }
        whenBusy: { $ref: "#/components/schemas/WhenBusy" }

    TimelinePromoted:
      description: A queued message changed how it is queued (currently only from ordinary queueing to interrupt); the earlier queued entry keeps its original value. When Inbox messages are converted one by one, the entry is recorded on the interrupt reminder that receives the message and carries messageId
      type: object
      required: [type, at, from, to]
      additionalProperties: false
      properties:
        type: { type: string, enum: [promoted] }
        at: { type: string, format: date-time }
        from: { $ref: "#/components/schemas/WhenBusy" }
        to: { $ref: "#/components/schemas/WhenBusy" }
        messageId:
          description: The Inbox message converted individually; omitted when a console run is converted as a whole
          type: string
          format: uuid

    TimelineMessageCancelled:
      description: An Inbox message carried by this run was cancelled by a person; if the run itself becomes void as a result, there is a separate ended entry
      type: object
      required: [type, at, messageId]
      additionalProperties: false
      properties:
        type: { type: string, enum: [message_cancelled] }
        at: { type: string, format: date-time }
        messageId: { type: string, format: uuid }
    TimelineMarker:
      description: dispatched is the dispatch (the run left the queue and processing began); running is the start of the reply (the message was handed to Pi)
      type: object
      required: [type, at]
      additionalProperties: false
      properties:
        type: { type: string, enum: [dispatched, running] }
        at: { type: string, format: date-time }

    TimelinePhase:
      description: A startup phase began
      type: object
      required: [type, at, phase, runtime]
      additionalProperties: false
      properties:
        type: { type: string, enum: [phase] }
        at: { type: string, format: date-time }
        phase: { type: string, enum: [waiting_slot, preparing, launching] }
        runtime:
          $ref: "#/components/schemas/AgentRuntime"
          description: |
            The runtime this run is being started on, recorded with the phase. Records written before it was recorded
            get it when read, by a rule that applies to those old records only: the runtime of the first process entry
            (pi_started or pi_reused) after this phase in the same run, where a process entry without one means pi; when
            there is none, claude-code if the run ended with a runtime_* error code; otherwise pi.

    TimelineCliInstall:
      description: A CLI installation that actually ran; there is no such entry when the CLI was already installed or needed no installation
      type: object
      required: [type, at, cli, version, result, durationMs, error]
      additionalProperties: false
      properties:
        type: { type: string, enum: [cli_install] }
        at: { type: string, format: date-time }
        cli: { type: string }
        version: { type: string }
        result: { type: string, enum: [succeeded, failed] }
        durationMs: { type: integer, minimum: 0 }
        error: { type: [string, "null"] }

    TimelineSyncSource:
      type: object
      required: [path, kind, outcome, filesWritten, filesDeleted, error]
      additionalProperties: false
      properties:
        path: { type: string }
        kind: { $ref: "#/components/schemas/FolderSourceKind" }
        outcome:
          description: cloned is a fresh clone, kept means the existing repository was left untouched, files_synced means the files were synced, failed is a failure
          type: string
          enum: [cloned, kept, files_synced, failed]
        filesWritten:
          description: Only for `files` sources; number of files written to disk
          type: [integer, "null"]
        filesDeleted:
          description: Only for `files` sources; number of files deleted from disk
          type: [integer, "null"]
        error: { type: [string, "null"] }

    TimelineWorkspaceSync:
      description: Config sync while preparing the runtime environment (Skills, Prompt, credential files and folder sources)
      type: object
      required: [type, at, result, durationMs, error, sources]
      additionalProperties: false
      properties:
        type: { type: string, enum: [workspace_sync] }
        at: { type: string, format: date-time }
        result: { type: string, enum: [succeeded, failed] }
        durationMs: { type: integer, minimum: 0 }
        error: { type: [string, "null"] }
        sources:
          type: array
          items: { $ref: "#/components/schemas/TimelineSyncSource" }

    TimelinePiStarted:
      description: A new Pi process was started
      type: object
      required: [type, at, pid, startupMs, reason, configVersion, runtime]
      additionalProperties: false
      properties:
        type: { type: string, enum: [pi_started] }
        at: { type: string, format: date-time }
        pid: { type: integer }
        startupMs:
          description: Time from starting the process until Pi was ready
          type: integer
          minimum: 0
        reason:
          description: no_process means there was no live process; config_changed means a restart after a config change
          type: string
          enum: [no_process, config_changed]
        configVersion: { type: integer }
        runtime:
          $ref: "#/components/schemas/AgentRuntime"
          description: Runtime of this process (Claude Code processes are recorded in these event types too). Records written before it was recorded get pi when read; this rule applies to those old records only.

    TimelinePiReused:
      description: An already running Pi process was reused
      type: object
      required: [type, at, pid, processStartedAt, runtime]
      additionalProperties: false
      properties:
        type: { type: string, enum: [pi_reused] }
        at: { type: string, format: date-time }
        pid: { type: integer }
        processStartedAt: { type: [string, "null"], format: date-time }
        runtime:
          $ref: "#/components/schemas/AgentRuntime"
          description: Runtime of this process (Claude Code processes are recorded in these event types too). Records written before it was recorded get pi when read; this rule applies to those old records only.

    TimelinePiStopped:
      description: The platform stopped the Pi process
      type: object
      required: [type, at, pid, reason, uptimeMs, runtime]
      additionalProperties: false
      properties:
        type: { type: string, enum: [pi_stopped] }
        at: { type: string, format: date-time }
        pid: { type: integer }
        reason:
          description: Same meaning as ProcessExit.reason
          type: string
          enum: [idle_timeout, config_changed, evicted, released, fork_snapshot, shutdown, abort_timeout, session_reset, console_reload, session_resumed, console_export]
        uptimeMs: { type: integer, minimum: 0 }
        runtime:
          $ref: "#/components/schemas/AgentRuntime"
          description: Runtime of this process (Claude Code processes are recorded in these event types too). Records written before it was recorded get pi when read; this rule applies to those old records only.

    TimelinePiExited:
      description: The Pi process exited unexpectedly
      type: object
      required: [type, at, pid, uptimeMs, exit, stderrTail, runtime]
      additionalProperties: false
      properties:
        type: { type: string, enum: [pi_exited] }
        at: { type: string, format: date-time }
        pid: { type: integer }
        uptimeMs: { type: integer, minimum: 0 }
        exit: { type: string }
        stderrTail:
          description: Tail of Pi's error output (length-limited)
          type: string
        runtime:
          $ref: "#/components/schemas/AgentRuntime"
          description: Runtime of this process (Claude Code processes are recorded in these event types too). Records written before it was recorded get pi when read; this rule applies to those old records only.

    TimelineModelRateLimit:
      description: Subscription quota status reported by the runtime's CLI (Claude Code's rate_limit_event, Codex's account rate limits); info is passed through as is (for example status, rateLimitType, resetsAt). Recorded only; it does not affect the run.
      type: object
      required: [type, at, info]
      additionalProperties: false
      properties:
        type: { type: string, enum: [model_rate_limit] }
        at: { type: string, format: date-time }
        info: { type: object }

    TimelineTool:
      description: One tool call; at is the start time. Only bash may include a length-bounded, redacted command; no other arguments or output are included
      type: object
      required: [type, at, toolCallId, toolName, state, endedAt, durationMs]
      additionalProperties: false
      properties:
        type: { type: string, enum: [tool] }
        at: { type: string, format: date-time }
        toolCallId: { type: string }
        toolName: { type: string }
        command:
          description: Safe display text of the actual bash command, at most 4096 characters; hidden for sensitive commands; omitted in old records and for other tools.
          type: string
          maxLength: 4096
        state: { $ref: "#/components/schemas/ToolState" }
        endedAt: { type: [string, "null"], format: date-time }
        durationMs: { type: [integer, "null"] }

    TimelineModelCall:
      description: One usage record from a model call (assistant), the tool itself (tool), context compaction (compaction), cache warming (cache_warm) or something else (other)
      type: object
      required: [type, at, kind, provider, model, responseModel, stopReason, input, output, cacheRead, cacheWrite, reasoning, total, durationMs]
      additionalProperties: false
      properties:
        type: { type: string, enum: [model_call] }
        at: { type: string, format: date-time }
        kind: { type: string, enum: [assistant, tool, compaction, cache_warm, other] }
        provider: { type: [string, "null"] }
        model: { type: [string, "null"] }
        responseModel:
          description: Actual model name returned by the provider
          type: [string, "null"]
        stopReason: { type: [string, "null"] }
        input: { type: integer, minimum: 0 }
        output: { type: integer, minimum: 0 }
        cacheRead: { type: integer, minimum: 0 }
        cacheWrite: { type: integer, minimum: 0 }
        reasoning:
          description: Reasoning tokens, part of output
          type: [integer, "null"]
        total: { type: integer, minimum: 0 }
        durationMs: { type: [integer, "null"] }

    TimelineModelRetryStarted:
      type: object
      required: [type, at, attempt, maxAttempts, delayMs, errorMessage]
      additionalProperties: false
      properties:
        type: { type: string, enum: [model_retry_started] }
        at: { type: string, format: date-time }
        attempt: { type: integer }
        maxAttempts: { type: integer }
        delayMs: { type: integer }
        errorMessage: { type: string }

    TimelineModelRetryEnded:
      type: object
      required: [type, at, success, attempt, finalError]
      additionalProperties: false
      properties:
        type: { type: string, enum: [model_retry_ended] }
        at: { type: string, format: date-time }
        success: { type: boolean }
        attempt: { type: integer }
        finalError: { type: [string, "null"] }

    TimelineCompaction:
      type: object
      required: [type, at, reason, result, tokensBefore, estimatedTokensAfter, errorMessage, durationMs]
      additionalProperties: false
      properties:
        type: { type: string, enum: [compaction] }
        at: { type: string, format: date-time }
        reason: { type: string }
        result: { type: string, enum: [succeeded, failed, aborted] }
        tokensBefore: { type: [integer, "null"] }
        estimatedTokensAfter: { type: [integer, "null"] }
        errorMessage: { type: [string, "null"] }
        durationMs: { type: [integer, "null"] }

    TimelineAbortRequested:
      description: An interrupt or stop was requested
      type: object
      required: [type, at, byRunId]
      additionalProperties: false
      properties:
        type: { type: string, enum: [abort_requested] }
        at: { type: string, format: date-time }
        byRunId:
          description: The run of the message that caused the interrupt; null when stopped by a person, and for runs recorded before this change
          type: [string, "null"]
          format: uuid
        stop:
          description: When true, the run was stopped by a person (no new message was sent)
          type: boolean

    TimelineEnded:
      type: object
      required: [type, at, status, endReason, errorCode]
      additionalProperties: false
      properties:
        type: { type: string, enum: [ended] }
        at: { type: string, format: date-time }
        status: { type: string, enum: [completed, failed, interrupted] }
        endReason: { $ref: "#/components/schemas/RunEndReason" }
        errorCode:
          oneOf:
            - $ref: "#/components/schemas/RunErrorCode"
            - type: "null"

    TimelineSessionMissing:
      type: object
      required: [type, at, sessionFile]
      additionalProperties: false
      properties:
        type: { type: string, enum: [session_missing] }
        at: { type: string, format: date-time }
        sessionFile:
          type: [string, "null"]
          description: The session reference that was missing, as the runtime keeps it (a file path for Pi and Claude Code, a thread id for Codex)

    TimelineBackgroundWaitTimeout:
      description: |
        The runtime's reply had ended while commands it runs in the background were still going (Antigravity moves a
        command that takes longer than its wait to the background and reports on it by itself later), so the turn
        waited for them and for the runtime's own follow-up reply. Nothing came from the runtime for limitMs, so the
        turn ended there; the tools still open were closed as no_result.
      type: object
      required: [type, at, limitMs]
      additionalProperties: false
      properties:
        type: { type: string, enum: [background_wait_timeout] }
        at: { type: string, format: date-time }
        limitMs:
          description: How long the turn waited without any message from the runtime
          type: integer
          minimum: 0

    TimelineContextHandoff:
      description: The saved conversation was carried over to a new runtime with this turn's message (see ContextHandoff)
      type: object
      required: [type, at, reason, fromRuntime, toRuntime, includedMessages, omittedMessages, images, bytes, budgetBytes]
      additionalProperties: false
      properties:
        type: { type: string, enum: [context_handoff] }
        reason: { type: string, enum: [runtime_changed, session_lost, task_start] }
        at: { type: string, format: date-time }
        fromRuntime: { $ref: "#/components/schemas/AgentRuntime" }
        toRuntime: { $ref: "#/components/schemas/AgentRuntime" }
        includedMessages: { type: integer, minimum: 0 }
        omittedMessages: { type: integer, minimum: 0 }
        images: { type: integer, minimum: 0 }
        bytes: { type: integer, minimum: 0 }
        budgetBytes: { type: integer, minimum: 0 }

    PrincipalKind:
      description: Identity kind. console is the console operator, external is an external identity, agent is an Agent
      type: string
      enum: [console, external, agent]

    Whoami:
      type: object
      required:
        - kind
        - address
        - name
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/PrincipalKind'
        address:
          description: "Address of the current identity: `@console`, `@<external identity name>`, or the Agent's address (same form as `Agent.address`; null when the name does not satisfy the naming rules)"
          type:
            - string
            - 'null'
        name:
          description: "Display name: the fixed console name for the console operator (still sent in Chinese for now), its name for an external identity, the Agent name for an Agent"
          type: string
        taskId:
          type:
            - string
            - 'null'
          format: uuid
          description: The bound task instance; null or omitted for regular Agents and human identities
        runtimeId:
          type:
            - string
            - 'null'
          format: uuid
          description: Task runtime instance ID; grants no extra permissions
    InboxParticipant:
      description: |
        One party of a message.
        - `address`: `@console` for the console operator, `@<name>` for an external identity, and the same form as
          `Agent.address` for an Agent. A deleted party still gets its original address (once released, an external
          identity's name may be taken by a new identity; `deleted` tells them apart); null for an Agent whose name does
          not satisfy the naming rules.
        - `name`: display name: the fixed console name for the console operator, its name for an external identity, the
          Agent name for an Agent; a fixed placeholder name once the identity or Agent is deleted. The fixed names are
          still sent in Chinese for now.
        - `deleted`: the external identity has been deleted, or the Agent has been deleted (including along with its
          project).
        - `id`: Agent ID or external identity ID; null for the console operator and for plugins. When the address is not
          unique or is null, use it to find the specific Agent or external identity.
        - `plugin`: a message a plugin sent with inbox.send using its plugin token (plugins/SPEC.md §11), shown in the
          conversation like an external identity: `pluginId` is the plugin id, `channelId` is the channel within the
          plugin (null when none), `address` is `plugin:<plugin id>` or `plugin:<plugin id>/<channel>`, and `name` is
          the sender name the plugin gave; `deleted` is true once the plugin is uninstalled. For other parties
          `pluginId` and `channelId` are null.
      type: object
      required: [kind, id, address, name, deleted, pluginId, channelId]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [console, external, agent, platform, plugin]}
        id: { type: [string, "null"], format: uuid }
        address: { type: [string, "null"] }
        name: { type: string }
        deleted: { type: boolean }
        pluginId: { type: [string, "null"] }
        channelId: { type: [string, "null"] }

    InboxTaskRef:
      description: |
        The task instance the message belongs to, derived from the task instance records of the message's two ends, not
        by parsing address text: the sender if the sender is a task instance, otherwise the recipient; the whole field
        is null when neither end is a task instance.
      type: object
      required: [taskId, nodeRunId, runtimeId]
      additionalProperties: false
      properties:
        taskId: { type: string, format: uuid }
        nodeRunId:
          description: |
            The node run the message belongs to; the first of these that can be determined, in order:
            - strict node message: the bound node;
            - a question asked by the task instance, and messages replying to it: the node the question is bound to;
            - other messages to the task instance: the node of the reminder turn carrying it;
            - otherwise: the node of the task instance's most recent turn that started at or before the message time.
            null when none can be determined.
          type: [string, "null"]
          format: uuid
        runtimeId:
          description: Task instance (runtime instance) ID
          type: string
          format: uuid

