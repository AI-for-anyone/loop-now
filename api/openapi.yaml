  "/projects/{projectId}/credential-accounts":
    get:
      tags:
      - credentials
      operationId: listProjectCredentialAccounts
      x-access: console-and-external
      description: Lists only live, selectable accounts and does not probe the provider. `provider` may only be used with
        purpose=model, and `cli` only with purpose=cli. Not paginated; stable order by createdAt, id.
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: purpose
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/ProjectCredentialPurpose"
      - name: provider
        in: query
        required: false
        schema:
          type: string
          minLength: 1
      - name: cli
        in: query
        required: false
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Success
          headers:
            Loop-Now-Request-Id:
              "$ref": "#/components/headers/RequestId"
            Loop-Now-Version:
              "$ref": "#/components/headers/Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProjectCredentialAccountList"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '412':
          "$ref": "#/components/responses/PreconditionFailed"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
        '422':
          "$ref": "#/components/responses/ValidationFailed"
        '500':
          description: Server error or component temporarily unavailable; fixed safe message
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          headers:
            Loop-Now-Request-Id:
              "$ref": "#/components/headers/RequestId"
            Loop-Now-Version:
              "$ref": "#/components/headers/Version"
        '503':
          description: Server error or component temporarily unavailable; fixed safe message
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          headers:
            Loop-Now-Request-Id:
              "$ref": "#/components/headers/RequestId"
            Loop-Now-Version:
              "$ref": "#/components/headers/Version"
    post:
      tags:
      - credentials
      operationId: createProjectCredentialAccount
      x-access: console-and-external
      description: Saves only an API key or a template CLI credential; names may repeat. Only the `credential` part is
        secret. Saving does not mean the remote side has verified it; after an unknown response, do not treat an account
        with the same name as success, and do not resend automatically.
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Success
          headers:
            Loop-Now-Request-Id:
              "$ref": "#/components/headers/RequestId"
            Loop-Now-Version:
              "$ref": "#/components/headers/Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProjectCredentialAccount"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
