    InboxMessagePage:
      type: object
      required: [messages, nextCursor]
      additionalProperties: false
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/InboxMessageSummary" }
        nextCursor:
          description: 下一页的游标；没有更多时为 null
          type: [string, "null"]

    InboxQuestionOptions:
      type: array
      minItems: 1
      maxItems: 10
      uniqueItems: true
      items: {type: string, minLength: 1, maxLength: 50}
    InboxQuestionOption:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id: {type: string}
        label: {type: string}
    InboxAnswer:
      type: object
      additionalProperties: false
      required: [messageId, optionId, optionLabel, textPreview, by, at]
      properties:
        messageId: {type: string, format: uuid}
        optionId: {type: [string, 'null']}
        optionLabel: {type: [string, 'null']}
        textPreview: {type: string}
        by: {$ref: '#/components/schemas/InboxParticipant'}
        at: {type: string, format: date-time}
    InboxQuestion:
      type: object
      additionalProperties: false
      required: [options, expiresAt, state, answer]
      properties:
        options:
          type: array
          items: {$ref: '#/components/schemas/InboxQuestionOption'}
        expiresAt: {type: string, format: date-time}
        state: {type: string, enum: [open, answered, expired, closed, cancelled]}
        answer:
          oneOf:
            - $ref: '#/components/schemas/InboxAnswer'
            - type: 'null'
    InboxAnswerTo:
      type: object
      additionalProperties: false
      required: [messageId, optionId, optionLabel]
      properties:
        messageId: {type: string, format: uuid}
        optionId: {type: [string, 'null']}
        optionLabel: {type: [string, 'null']}
    InboxNotice:
      type: object
      additionalProperties: false
      required: [type, messageId, reason]
      properties:
        type: {type: string, enum: [question_expired]}
        messageId: {type: string, format: uuid}
        reason: {type: string}
    QuestionClosedDetails:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question: {$ref: '#/components/schemas/InboxQuestion'}

    InboxSendInput:
      type: object
      required: [to, text]
      additionalProperties: false
      properties:
        runId:
          type: string
          format: uuid
          not: {const: "00000000-0000-0000-0000-000000000000"}
          description: 普通Inbox调用可省略；专用QA恢复节点提问须携本轮准确runId，缺失或错归属在原事务内拒绝，不作为workflow重试。
        to:
          description: |
            收件地址，由服务端解析，名称逐段精确匹配、区分大小写：
            - `@console`：控制台操作者；`@<名称>`：未删除的外部身份；
            - 三段 `组织名/项目名/Agent名`：只在未删除的项目中查找；
            - 两段 `项目名/Agent名`：发件人所在组织中的项目；控制台操作者、外部身份与平台持有的 Agent 按默认组织解析；
            - 形如 UUID 的单段值：Agent 的内部 ID；
            - 其他单段值：平台持有的 Agent 的名称；
            - 带 `#任务ID` 的地址解析任务实例；任务已结束时转当前Manager并注明原收件人。
          type: string
          minLength: 1
        text:
          description: 正文，不能为空；超过 limits.maxInboxMessage 字节时返回 413
          type: string
          minLength: 1
        whenBusy:
          description: 收件人是 Agent 时生效，不传为 queue；收件人是人时忽略
          $ref: "#/components/schemas/WhenBusy"
        options: {$ref: '#/components/schemas/InboxQuestionOptions'}
        nodeRunId:
          description: 任务实例提问时必填，须匹配当前节点访问；普通身份不传。不授予task/runtime权限。
          type: string
          format: uuid
        channelId:
          description: 只在插件令牌调用时有效（其他身份传入返回 422）：消息来自插件的哪个渠道，Agent 的回复按线索回到这个渠道。
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
        senderName:
          description: 只在插件令牌调用时有效：在对话里显示的发件名称，默认为插件的显示名称。
          type: string
          minLength: 1
          maxLength: 100

    InboxReplyInput:
      {
        "additionalProperties": false,
        "if": {
          "not": {
            "required": [
              "optionId"
            ]
          }
        },
        "properties": {
          "asIdentityId": {
            "description": "只用于插件令牌：以它代管的外部身份的名义回复（plugins/SPEC.md §12）",
            "format": "uuid",
            "type": "string"
          },
          "nodeRunId": {
            "description": "任务实例提出新问题时必填，匹配当前节点访问。",
            "format": "uuid",
            "type": "string"
          },
          "optionId": {
            "description": "显式回答路径指定的原题，须为收件身份且原题open；省略正文时自动记选择文字。",
            "minLength": 1,
            "type": "string"
          },
          "options": {
            "$ref": "#/components/schemas/InboxQuestionOptions"
          },
          "text": {
            "description": "正文，不能为空；超过 limits.maxInboxMessage 字节时返回 413",
            "minLength": 1,
            "type": "string"
          },
          "whenBusy": {
            "$ref": "#/components/schemas/WhenBusy",
            "description": "收件人是 Agent 时生效，不传为 queue；收件人是人时忽略"
          },
          "runId": {
            "type": "string",
            "format": "uuid",
            "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
            "not": {
              "const": "00000000-0000-0000-0000-000000000000"
            },
            "description": "严格任务 Inbox 的 Agent 回复必须传原 task/node/runtime 下实际运行中的轮次 ID；不从最近运行推测。"
          }
        },
        "then": {
          "required": [
            "text"
          ]
        },
        "type": "object"
      }
    InboxThreadSummary:
      type: object
      required: [threadId, participants, lastMessage, unreadCount, updatedAt]
      additionalProperties: false
      properties:
        threadId: { type: string, format: uuid }
        participants:
          description: 线索的两方（第一条消息的发件人与收件人），包含当前身份自己
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/InboxParticipant" }
        lastMessage: { $ref: "#/components/schemas/InboxMessageSummary" }
        unreadCount:
          description: 线索中发给当前身份的未读消息数
          type: integer
          minimum: 0
        updatedAt:
          description: 最后一条消息的时间
          type: string
          format: date-time

    InboxThreadPage:
      type: object
      required: [threads, unreadTotal, nextCursor]
      additionalProperties: false
      properties:
        threads:
          type: array
          items: { $ref: "#/components/schemas/InboxThreadSummary" }
        unreadTotal:
          description: 当前身份全部线索的未读总数
          type: integer
          minimum: 0
        nextCursor: { type: [string, "null"] }

    InboxThread:
      type: object
      required: [threadId, messages]
      additionalProperties: false
      properties:
        threadId: { type: string, format: uuid }
        messages:
          description: 按时间正序
          type: array
          items: { $ref: "#/components/schemas/InboxMessage" }

    InboxUnreadTotal:
      type: object
      required: [unreadTotal]
      additionalProperties: false
      properties:
        unreadTotal:
          description: 当前身份最新的未读总数
          type: integer
          minimum: 0

    InboxConversationPage:
      type: object
      required: [messages, nextCursor]
      additionalProperties: false
      properties:
        messages:
          description: 消息全文，新的在前
          type: array
          items: { $ref: "#/components/schemas/InboxMessage" }
        nextCursor:
          description: 下一页的游标；没有更多时为 null
          type: [string, "null"]

    InboxPendingItem:
      type: object
      required: [message, projectId]
      additionalProperties: false
      properties:
        message: { $ref: "#/components/schemas/InboxMessageSummary" }
        projectId:
          description: 发件 Agent 所属的项目；平台持有的 Agent、外部身份与平台通知为 null
          type: [string, "null"]
          format: uuid

    InboxPendingAgentCount:
      description: 发件方是常态 Agent（不在任务中，message.task 为 null）的待处理条数
      type: object
      required: [agentId, projectId, questions, unread]
      additionalProperties: false
      properties:
        agentId: { type: string, format: uuid }
        projectId: { type: [string, "null"], format: uuid }
        questions: { type: integer, minimum: 0, description: questions 中来自它的条数 }
        unread: { type: integer, minimum: 0, description: unread 中来自它的条数 }

    InboxPendingTaskCount:
      description: 发件方是任务实例（message.task 不为 null）的待处理条数，按任务汇总；节点级数字可由各项的 message.task.nodeRunId 自行汇总
      type: object
      required: [taskId, projectId, questions, unread]
      additionalProperties: false
      properties:
        taskId: { type: string, format: uuid }
        projectId: { type: [string, "null"], format: uuid }
        questions: { type: integer, minimum: 0, description: questions 中属于该任务的条数 }
        unread: { type: integer, minimum: 0, description: unread 中属于该任务的条数 }

    InboxPending:
      description: |
        控制台待处理的 Inbox，两张列表互不重复，都是新的在前：
        - `questions`：发给 `@console`、仍为 open 且未过期的问题（不论是否已读）；
        - `unread`：发给 `@console` 的其他未读消息（不含被人取消的）。
        `byAgent` 与 `byTask` 汇总两张列表中的条目：发件方是常态 Agent 的计入 byAgent，是任务实例的计入 byTask；外部身份与平台通知只出现在列表中。
      type: object
      required: [questions, unread, byAgent, byTask]
      additionalProperties: false
      properties:
        questions:
          type: array
          items: { $ref: "#/components/schemas/InboxPendingItem" }
        unread:
          type: array
          items: { $ref: "#/components/schemas/InboxPendingItem" }
        byAgent:
          type: array
          items: { $ref: "#/components/schemas/InboxPendingAgentCount" }
        byTask:
          type: array
          items: { $ref: "#/components/schemas/InboxPendingTaskCount" }

    SseInboxSnapshot:
      type: object
      required: [unreadTotal]
      additionalProperties: false
      properties:
        unreadTotal:
          description: 控制台操作者的未读总数，与快照位置在同一时刻统计
          type: integer
          minimum: 0

    SseInboxMessageCreated:
      type: object
      required: [message, unreadTotal]
      additionalProperties: false
      properties:
        message: { $ref: "#/components/schemas/InboxMessageSummary" }
        unreadTotal: { type: integer, minimum: 0, description: 控制台操作者最新的未读总数 }

    SseInboxMessageRead:
      type: object
      required: [id, threadId, to, readAt, unreadTotal]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        threadId: { type: string, format: uuid }
        to: { $ref: "#/components/schemas/InboxParticipant" }
        readAt: { type: string, format: date-time }
        unreadTotal: { type: integer, minimum: 0, description: 控制台操作者最新的未读总数 }

    SseInboxMessageCancelled:
      description: 发给 Agent 的一条排队消息被人取消
      type: object
      required: [id, threadId, from, to, cancelledAt, unreadTotal]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        threadId: { type: string, format: uuid }
        from: { $ref: "#/components/schemas/InboxParticipant" }
        to: { $ref: "#/components/schemas/InboxParticipant" }
        cancelledAt: { type: string, format: date-time }
        unreadTotal: { type: integer, minimum: 0, description: 控制台操作者最新的未读总数 }

    ExternalIdentityName:
      description: |
        外部身份的名称：以小写字母或数字开头，只含小写字母、数字、点、下划线与连字符，最长 64 个字符，不能是 `console` 或 `platform`。
        不满足时返回 422，字段级错误指向 `name`。
      type: string
      pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
      not: { enum: [console, platform] }

    ExternalIdentity:
      type: object
      required: [id, name, address, createdAt, deletedAt, managedBy]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        managedBy:
          description: 代管这个身份的插件渠道（plugins/SPEC.md §12）；没有时为 null。插件是否在运行见插件的 status
          oneOf:
            - $ref: "#/components/schemas/ExternalIdentityManager"
            - type: "null"
        address:
          description: Inbox 地址 `@<名称>`；已删除的身份仍给出原地址，名称释放后可能被新身份使用
          type: string
        createdAt: { type: string, format: date-time }
        deletedAt:
          description: 删除时间；未删除为 null。只有 `GET /external-identities/{identityId}` 会返回已删除的身份
          type: [string, "null"]
          format: date-time

    ExternalIdentityManager:
      type: object
      required: [pluginId, channelId]
      additionalProperties: false
      properties:
        pluginId: { type: string }
        channelId: { type: string }

    ExternalIdentityManagerInput:
      type: object
      required: [managedBy]
      additionalProperties: false
      properties:
        managedBy:
          description: 代管的插件渠道；null 清空
          oneOf:
            - $ref: "#/components/schemas/ExternalIdentityManager"
            - type: "null"

    ExternalIdentityList:
      type: object
      required: [identities]
      additionalProperties: false
      properties:
        identities:
          type: array
          items: { $ref: "#/components/schemas/ExternalIdentity" }

    ExternalIdentityCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/ExternalIdentityName" }

    ExternalToken:
      type: object
      required: [id, prefix, createdAt, expiresAt, revokedAt, lastUsedAt]
      additionalProperties: false
      properties:
        id:
          description: 令牌 ID（UUIDv7）
          type: string
          format: uuid
        prefix:
          description: 可识别的前缀：`lne_` 加 ID 去掉连字符后的前 8 位十六进制，与 `loopctl config list` 的 `tokenPrefix` 一致
          type: string
          pattern: "^lne_[0-9a-f]{8}$"
        createdAt: { type: string, format: date-time }
        expiresAt:
          description: 过期时间；永不过期为 null
          type: [string, "null"]
          format: date-time
        revokedAt:
          description: 吊销时间；未吊销为 null。身份删除时它的令牌一并吊销
          type: [string, "null"]
          format: date-time
        lastUsedAt:
          description: 最近使用时间，最多每分钟更新一次；从未使用为 null
          type: [string, "null"]
          format: date-time

    ExternalTokenList:
      type: object
      required: [tokens]
      additionalProperties: false
      properties:
        tokens:
          type: array
          items: { $ref: "#/components/schemas/ExternalToken" }

    ExternalTokenCreate:
      type: object
      additionalProperties: false
      properties:
        expiresAt:
          description: 过期时间（RFC 3339），必须晚于当前时间，否则返回 422；不传表示永不过期
          type: string
          format: date-time

    ExternalTokenIssued:
      type: object
      required: [token, secret]
      additionalProperties: false
      properties:
        token: { $ref: "#/components/schemas/ExternalToken" }
        secret:
          description: 令牌明文，只在签发时返回这一次；服务端只保存摘要
          type: string
          pattern: "^lne_[0-9a-f]{32}_[A-Za-z0-9_-]{43}$"

