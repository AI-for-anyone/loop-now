    get:
      tags: [conversation]
      operationId: getAgentQueue
      x-access: console
      summary: 普通对话的排队列表，逐条列出，按实际处理顺序
      description: |
        控制台在对话中发出、仍在排队的消息每条一项（kind=run）；平台提醒承载的 Inbox 消息每条一项（kind=inbox），
        只列仍待处理的：未读、未取消、承载它的提醒仍在排队。消息被读取或取消后立即离开列表。
        顺序与实际处理顺序一致：先按承载执行的 priority、queue_seq，同一提醒内按消息发送先后。sleep 唤醒执行不列出。
        变化时 Agent SSE 推送 `queue.updated`（items 同本接口），snapshot 带 `queueItems`。
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 排队列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentQueue" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{agentId}/runs/{runId}/promote-to-interrupt:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [conversation]
      operationId: promoteRunToInterrupt
      x-access: console
      summary: 把控制台发出、仍在排队的消息转为打断
      description: |
        效果与发送时选择打断一致：执行改为 `whenBusy=interrupt`，排到已有打断之后、全部普通排队之前（连续转换多条时按转换先后排列），
        然后打断进行中的回复。只对控制台发出的执行开放；平台提醒承载的 Inbox 消息用 `POST /agents/{agentId}/inbox-messages/{messageId}/promote-to-interrupt` 逐条转换，
        对提醒执行或 sleep 唤醒调用本接口返回 422。
        已被领取、开始或结束时返回 409 `run_not_queued`，details 为 `RunNotQueuedDetails`。已经是打断时返回 status=already_interrupt，不重复打断。
        actionId 幂等：同一 actionId 重放返回首次结果，同一 actionId 不同内容返回 409 `action_conflict`。
        成功后推送 `run.updated` 与 `queue.updated`；运行记录时间线追加 `promoted` 条目。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentQueueActionInput" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 动作结果；同一 actionId 重放返回首次结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentQueueActionReceipt" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /agents/{agentId}/runs/{runId}/cancel:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [conversation]
      operationId: cancelQueuedRun
      x-access: console
      summary: 撤回控制台发出、仍在排队的消息
      description: |
        执行以 interrupted、endReason=user_cancelled 结束，从队列移除，Agent 不会收到。回执的 item 带原文与图片引用，供“编辑”回填输入框；
        图片已属于这条消息，重新发送时需按 ID 读取内容后以新 ID 上传。
        已被领取、开始或结束时返回 409 `run_not_queued`；已经撤回时返回 status=already_cancelled。平台提醒或 sleep 唤醒执行返回 422。
        actionId 规则同转为打断。成功后推送 `run.updated`、`queue.updated`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentQueueActionInput" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 动作结果；同一 actionId 重放返回首次结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentQueueActionReceipt" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /agents/{agentId}/runs/{runId}/stop:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [conversation]
      operationId: stopRun
      x-access: console
      summary: 只停止这一次进行中的回复，不发送新消息
      description: |
        沿用打断路径（清空 Pi 队列、abort、超时强制结束），执行以 interrupted、endReason=user_stopped 结束；之后排队的消息照常按顺序处理。
        只作用于路径中的这一次执行：它已结束时返回 409 `run_not_active`（details 为 `RunNotActiveDetails`），不会停到下一条；
        已在停止或打断中时返回 status=already_stopping。actionId 规则同转为打断。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentQueueActionInput" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 动作结果；同一 actionId 重放返回首次结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentQueueActionReceipt" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /agents/{agentId}/inbox-messages/{messageId}/promote-to-interrupt:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [conversation]
      operationId: promoteAgentInboxMessage
      x-access: console
      summary: 把排队中的单条 Inbox 消息转为打断（任何发件人）
      description: |
        把消息从承载它的普通提醒移到排队中的打断提醒（没有就新建一个，排在已有打断之后、全部普通排队之前），消息的 whenBusy 改为 interrupt；
        原提醒没有其他待处理消息时作废（endReason=merged_into_interrupt）。随后打断进行中的回复。
        提醒开始时只点名它承载的消息，其余未读消息由各自的提醒稍后处理。
        消息不在队列中时返回 409 `run_not_queued`：details.messageState 为 read、cancelled、dispatched 或 not_queued。
        已经是打断时返回 status=already_interrupt。actionId 规则同 `promoteRunToInterrupt`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentQueueActionInput" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 动作结果；同一 actionId 重放返回首次结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentQueueActionReceipt" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /agents/{agentId}/inbox-messages/{messageId}/cancel:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [conversation]
      operationId: cancelAgentInboxMessage
      x-access: console
      summary: 取消排队中的单条 Inbox 消息（任何发件人）
      description: |
        消息记 `cancelledAt`，不再计为未读，收件 Agent 不会处理：收件 Agent 读取或列出时只得到取消说明，不含原文与图片；
        发件方与控制台仍看到全文与 `cancelledAt`。带选项的问题同时变为 state=cancelled，不能再回答。
        承载它的提醒没有其他待处理消息时作废（endReason=user_cancelled）。Inbox 事件流推送 `inbox.message.cancelled`。
        消息不在队列中时返回 409 `run_not_queued`（messageState 同上）；已经取消时返回 status=already_cancelled。actionId 规则同上。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentQueueActionInput" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 动作结果；同一 actionId 重放返回首次结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentQueueActionReceipt" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /agents/{agentId}/inbox:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      tags: [inbox]
      operationId: listAgentInbox
      x-access: console
      x-plugin-scope: inbox.read
      summary: 查看 Agent 收到的消息摘要，新的在前；只读，不改变已读状态
      parameters:
        - $ref: "#/components/parameters/InboxUnread"
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 一页消息摘要
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxMessagePage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /agents/{agentId}/console-messages:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      tags: [inbox]
      operationId: listAgentConsoleMessages
      x-access: console
      summary: 控制台与 Agent（常态，不含它的任务实例）之间的 Inbox 消息全文，两个方向都有，新的在前；只读，不改变已读状态
      description: |
        供 Agent 对话按时间合并显示。每条消息带问题（选项、状态、回答）与已读状态。
        任务实例与控制台之间的消息不在这里，见 `GET /tasks/{taskId}/nodes/{nodeRunId}/inbox-messages`。
        Agent 不存在时返回 404；已删除的 Agent 仍可查看。
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 一页消息全文
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxConversationPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /agents/{agentId}/inbox/{messageId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/MessageId"
    get:
      tags: [inbox]
      operationId: getAgentInboxMessage
      x-access: console
      x-plugin-scope: inbox.read
      summary: 查看 Agent 收到的一条消息的全文；只读，不改变已读状态
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 消息全文
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxMessage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /overview/events:
    get:
      tags: [observability]
      operationId: streamOverviewEvents
      x-access: console
      summary: 概览事件流（SSE）：所有未删除项目与平台中未删除 Agent 的运行状态，可按项目或平台筛选
      description: |
        `text/event-stream`，快照与续传规则同 `GET /agents/{agentId}/events`。
        `agent.status` 带 Agent 完整的新状态；文字增量与工具状态不触发推送。
        按范围筛选时，快照与后续事件都只含该范围的 Agent；项目被删除时，其中每个 Agent 推送 `agent.removed`。
      parameters:
        - $ref: "#/components/parameters/ScopeProjectId"
        - $ref: "#/components/parameters/ScopePlatform"
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 事件流
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
      x-sse-events:
        snapshot: { $ref: "#/components/schemas/SseOverviewSnapshot" }
        agent.status: { $ref: "#/components/schemas/SseAgentStatus" }
        agent.removed: { $ref: "#/components/schemas/SseAgentRemoved" }

  /usage:
    get:
      tags: [observability]
      operationId: getUsage
      x-access: console-and-external
      summary: 按（Agent、提供方、模型）统计 token 用量；只统计 token，不提供费用；可按项目或平台筛选
      parameters:
        - $ref: "#/components/parameters/ScopeProjectId"
        - $ref: "#/components/parameters/ScopePlatform"
        - name: from
          in: query
          required: false
          description: 开始时间（含），RFC 3339；不传表示不限
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: 结束时间（不含），RFC 3339；不传表示不限。from 不早于 to 时返回 422
          schema: { type: string, format: date-time }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 用量统计，按总数降序
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsagePage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /anomalies:
    get:
      tags: [observability]
      operationId: listAnomalies
      x-access: console-and-external
      summary: 异常与失败列表：未正常完成的执行，按结束时间倒序分页，不含已删除的 Agent（含已删除项目中的 Agent）；可按项目或平台筛选
      parameters:
        - $ref: "#/components/parameters/ScopeProjectId"
        - $ref: "#/components/parameters/ScopePlatform"
        - name: from
          in: query
          required: false
          description: 只返回此后结束的执行，RFC 3339；不传表示不限
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          required: false
          description: 上一页返回的 nextCursor
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 一页异常
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnomalyPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /stats:
    get:
      tags: [observability]
      operationId: getStats
      x-access: console
      summary: 统计页报表：时间窗内的 token、触发来源、唤醒、上下文、提问、等待、结果、工具、进程与并发；可按项目或平台筛选
      description: |
        只读汇总已有记录，不含已删除的 Agent（含已删除项目中的 Agent）。
        时间窗为 [from, to)，按 bucket 切成连续的桶：第一桶从 from 开始，每桶 1 小时或 24 小时，最后一桶截止于 to。
        计入时间窗与桶的依据：用量按记录时间；执行（常态执行与任务轮次）按排入时间（发出消息、唤醒到期的时刻）；提问按发出时间。
        各处 `series` 与 `buckets` 等长、一一对应。
      parameters:
        - $ref: "#/components/parameters/ScopeProjectId"
        - $ref: "#/components/parameters/ScopePlatform"
        - name: from
          in: query
          required: true
          description: 开始时间（含），RFC 3339
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          description: 结束时间（不含），RFC 3339。from 不早于 to 时返回 422
          schema: { type: string, format: date-time }
        - name: bucket
          in: query
          required: true
          description: 桶的宽度；桶数超过 1000 时返回 422
          schema: { type: string, enum: [hour, day] }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 统计报表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsReport" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /plugins:
    get:
      tags: [plugins]
      operationId: listPlugins
      x-access: console-and-external
      summary: 已安装的插件（插件市场页），按 id 排序
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 插件列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [plugins]
      operationId: installPlugin
      x-access: console-and-external
      summary: 按预览安装插件
      description: |
        先用 `POST /plugin-previews` 取得预览并展示给人，再带 previewId 安装。非官方来源（本地目录、git、npm）须带 `confirm: true`，
        否则返回 409 `plugin_confirmation_required`。插件 id 已安装时返回 409 `name_conflict`（更新用 `POST /plugins/{pluginId}/update`）。
        git 与 npm 来源在这一步执行 `npm ci --ignore-scripts --omit=dev`（没有锁文件时 `npm install`），失败返回 422 `plugin_source_failed`；
        本地目录来源原地使用，不安装依赖、不修改。预览过期或不存在返回 404。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginInstall" }
      responses:
        "201":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 已安装
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plugin" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /plugin-previews:
    post:
      tags: [plugins]
      operationId: previewPlugin
      x-access: console-and-external
      summary: 取来插件并读出清单，供安装或更新前展示
      description: |
        `source` 与 `pluginId` 二选一：`source` 是新安装的来源；`pluginId` 按已安装插件记录的来源重新获取（更新前预览）。
        获取（git 克隆、npm 打包下载）与清单校验在这一步完成，不安装依赖；预览保留 30 分钟。
        来源无法获取返回 422 `plugin_source_failed`；清单不合规则或 minPlatformVersion 高于平台版本返回 422 `validation_failed`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginPreviewRequest" }
      responses:
        "201":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 预览
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginPreview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /plugins/{pluginId}:
    parameters:
      - $ref: "#/components/parameters/PluginId"
    get:
      tags: [plugins]
      operationId: getPlugin
      x-access: console-and-external
      summary: 插件详情：清单、来源、状态与已装版本
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 插件
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [plugins]
      operationId: uninstallPlugin
      x-access: console-and-external
      summary: 卸载插件
      description: |
        宿主内卸载平台半边，删除插件的配置、启用、授权、账号、状态、事件投递与令牌，删除各版本的安装目录（本地目录来源不删）。
        数据目录 `<work root>/platform/plugins/<id>/data/` 只在 `deleteData=true` 时删除。已经启动的 Pi 继续使用已加载的 Agent 半边，直到下次启动。
      parameters:
        - name: deleteData
          in: query
          required: false
          description: 同时删除插件的数据目录，默认 false
          schema: { type: boolean }
      responses:
        "204":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 已卸载
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /plugins/{pluginId}/update:
    parameters:
      - $ref: "#/components/parameters/PluginId"
    post:
      tags: [plugins]
      operationId: updatePlugin
      x-access: console-and-external
      summary: 按预览安装插件的新版本
      description: |
        预览须是同一插件 id。新版本装到自己的目录，宿主内先卸载旧版本再加载新版本；任务里已经启动的 Pi 继续用旧文件直到自然重启。
        版本号与已装版本相同但内容不同时返回 409 `plugin_version_conflict`。其余规则同安装。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginInstall" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 更新后的插件
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plugin" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /plugins/{pluginId}/config:
    parameters:
      - $ref: "#/components/parameters/PluginId"
    get:
      tags: [plugins]
      operationId: getPluginConfig
      x-access: console-and-external
      summary: 插件的全局配置；secret 字段只给出是否已设置
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 全局配置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginConfig" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [plugins]
      operationId: putPluginConfig
      x-access: console-and-external
      summary: 按版本保存全局配置
      description: |
        values 按清单 configSchema 校验（不含 x-secret 字段），不合规则返回 422；secrets 只写，省略的保留原值、null 清除。
        expectedRevision 与当前不同返回 412。保存后宿主内的插件收到 config_changed。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginConfigUpdate" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 保存后的配置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginConfig" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /plugins/{pluginId}/logs:
    parameters:
      - $ref: "#/components/parameters/PluginId"
    get:
      tags: [plugins]
      operationId: listPluginLogs
      x-access: console-and-external
      summary: 插件的宿主日志，新的在前，保留 7 天
      parameters:
        - name: before
          in: query
          required: false
          description: 上一页的 nextBefore
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          required: false
          description: 1 到 500，默认 100
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 一页日志
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginLogPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /plugins/{pluginId}/deliveries:
    parameters:
      - $ref: "#/components/parameters/PluginId"
    get:
      tags: [plugins]
      operationId: listPluginDeliveries
      x-access: console-and-external
      summary: 观察类事件对这个插件的投递，按事件时间新的在前
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, delivered, failed] }
        - name: projectId
          in: query
          required: false
          description: 只看这个项目的事件
          schema: { type: string, format: uuid }
        - name: before
          in: query
          required: false
          description: 上一页的 nextBefore（事件 id）
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: 1 到 200，默认 50
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 一页投递
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginDeliveryPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /plugins/{pluginId}/state:
    parameters:
      - $ref: "#/components/parameters/PluginId"
    get:
      tags: [plugins]
      operationId: listPluginState
      x-access: console-and-external
      summary: 读插件的持久状态（只读），例如投递记录约定的 `deliveries/` 前缀
      parameters:
        - name: prefix
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
        - name: projectId
          in: query
          required: false
          description: 项目级状态；不传时为插件全局状态
          schema: { type: string, format: uuid }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 按 key 排序，最多 1000 项
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginStateList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /plugins/{pluginId}/actions/{actionId}:
    parameters:
      - $ref: "#/components/parameters/PluginId"
      - name: actionId
        in: path
        required: true
        schema: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$" }
    post:
      tags: [plugins]
      operationId: invokePluginAction
      x-access: console-and-external
      summary: 执行插件的控制台操作按钮
      description: |
        操作须是清单 actions 声明的，where 给出按钮所在的页面对象：项目、Agent、任务或外部身份；页面只在清单 where 包含该种页面时显示按钮。
        input 按该操作的 fields 校验（不合规则 422），交给宿主 `action` 请求，30 秒超时（504 plugin_timeout）；插件报错时 502 plugin_failed。
        where 指向的项目（Agent、任务所在的项目）没有启用插件，或插件不在宿主里时返回 409 plugin_not_enabled。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginActionInput" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 插件的回应，以提示显示
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginActionResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "502":
          description: 插件报错（plugin_failed）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504":
          description: 插件没有在时限内回应（plugin_timeout）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /plugin-markets:
    get:
      tags: [plugins]
      operationId: listPluginMarkets
      x-access: console-and-external
      summary: 汇总各市场的插件，标出已安装与可更新
      description: |
        市场是 HTTPS 可取到的 `loop-now-market.json`：`{ "name", "plugins": [{ "id", "source": "git:<地址>[@ref]" | "npm:<包规格>", "displayName", "description", "verified", "version" }] }`。
        依次读取官方市场（服务端配置）与全局设置里的市场；某个市场读取失败时它的 error 不为空，其余照常。
        已安装的插件给出已装版本；市场条目的 version 高于已装版本时 updateAvailable 为 true。安装用 `POST /plugin-previews`，来源 `{kind: market, market, id}`。
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 各市场的插件
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginMarketList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /plugin-sources/builtin:
    get:
      tags: [plugins]
      operationId: listBuiltinPluginSources
      x-access: console-and-external
      summary: 随平台发布、可作为 builtin 来源安装的官方插件
      description: "服务端没有官方插件目录时为空列表。安装用 `POST /plugin-previews`，source 为 `{kind: builtin, location: <id>}`。"
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 按 id 排序
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuiltinPluginSourceList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /plugin-host:
    get:
      tags: [plugins]
      operationId: getPluginHost
      x-access: console-and-external
      summary: 插件宿主的状态与最近一次崩溃
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 宿主状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginHostStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /plugin-host/restart:
    post:
      tags: [plugins]
      operationId: restartPluginHost
      x-access: console-and-external
      summary: 重新启动插件宿主，清零崩溃计数；全局停用时返回 409 `plugin_not_enabled`
      responses:
        "202":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 已请求重启，宿主状态随后变化
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginHostStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /plugin-settings:
    get:
      tags: [plugins]
      operationId: getPluginSettings
      x-access: console-and-external
      summary: 全局插件设置：一键停用与额外的市场
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [plugins]
      operationId: putPluginSettings
      x-access: console-and-external
      summary: 保存全局插件设置
      description: |
        disabled 为 true 时停止宿主、不再给新启动的 Pi 挂载任何 Agent 半边（已经启动的不受影响，下次启动生效）；改回 false 时恢复。
        markets 在第三阶段使用，现在只保存。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginSettings" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 保存后的设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /projects/{projectId}/plugins:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [plugins]
      operationId: listProjectPlugins
      x-access: console-and-external
      summary: 项目插件页：每个已安装插件在这个项目的启用状态与项目级配置
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 按插件 id 排序
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPluginList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/plugins/{pluginId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/PluginId"
    put:
      tags: [plugins]
      operationId: putProjectPlugin
      x-access: console-and-external
      summary: 在项目里启用或停用插件，并保存项目级配置
      description: |
        values 只能包含清单 configSchema 中标了 `x-scope: project` 的字段；secrets 只写，省略的保留原值、null 清除。
        expectedRevision 与当前不同返回 412（还没有项目级配置时为 0）。
        停用后这个项目不再产生事件给该插件，项目内 Agent 的授权保留但不生效（下次启动 Pi 时不再挂载）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectPluginUpdate" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 保存后的项目插件
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPlugin" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /projects/{projectId}/plugins/{pluginId}/accounts:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/PluginId"
    get:
      tags: [plugins]
      operationId: listPluginAccounts
      x-access: console-and-external
      summary: 项目里这个插件的账号；secret 字段只给出是否已设置
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 按种类、名称排序
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginAccountList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [plugins]
      operationId: createPluginAccount
      x-access: console-and-external
      summary: 添加账号
      description: kind 须是清单 accounts 声明的种类，values 与 secrets 按该种类的 fields 校验；不支持多账号的种类已有账号时返回 409 `name_conflict`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginAccountCreate" }
      responses:
        "201":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 已添加
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginAccount" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /projects/{projectId}/plugins/{pluginId}/accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/PluginId"
      - $ref: "#/components/parameters/PluginAccountId"
    put:
      tags: [plugins]
      operationId: updatePluginAccount
      x-access: console-and-external
      summary: 按版本修改账号的名称与字段；secrets 省略的保留、null 清除，版本不同返回 412
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginAccountUpdate" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 修改后的账号
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginAccount" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [plugins]
      operationId: deletePluginAccount
      x-access: console-and-external
      summary: 删除账号；各 Agent 授权里对它的引用随之移除，下次启动 Pi 生效
      responses:
        "204":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 已删除
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{agentId}/plugins:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      tags: [plugins]
      operationId: listAgentPlugins
      x-access: console-and-external
      summary: Agent 配置页插件段：每个已安装插件对这个 Agent 是否可授权、是否已授权及选用的账号
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 按插件 id 排序
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentPluginList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{agentId}/plugins/{pluginId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/PluginId"
    put:
      tags: [plugins]
      operationId: putAgentPlugin
      x-access: console-and-external
      summary: 授权或取消授权，并选择账号；下次启动 Pi 生效，不打断当前回合
      description: |
        项目 Agent 只能授权其项目已启用的插件，否则返回 409 `plugin_not_enabled`；平台 Agent 不受项目启用限制，没有账号。
        accountIds 须是该项目这个插件未删除的账号，否则返回 422（字段 accountIds）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentPluginUpdate" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 保存后的授权
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentPlugin" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /inbox/messages:
    get:
      tags: [inbox]
      operationId: listInboxMessages
      x-access: console-and-external
      x-plugin-scope: inbox.read
      summary: 列出发给当前身份的消息摘要，新的在前；默认含已读与未读，不改变已读状态
      parameters:
        - $ref: "#/components/parameters/InboxUnread"
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 一页消息摘要
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxMessagePage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [inbox]
      operationId: sendInboxMessage
      x-access: console-and-external
      x-plugin-scope: inbox.send
      summary: 发送消息，总是开启新线索；回复用 `POST /inbox/messages/{messageId}/reply`
      description: |
        收件地址不存在、Agent 已删除或外部身份已删除时返回 404，不保存消息。
        发给其他组织的 Agent 不被允许时返回 403 `forbidden`；控制台操作者与外部身份属于平台，可以发给任何组织的 Agent。
        收件人是 Agent 时安排一轮平台提醒；收件人是人时忽略 whenBusy，记为 null。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InboxSendInput" }
      responses:
        "201":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 已保存的消息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxMessage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "409":
          description: 已回答/到期/关闭的选项回答或任务节点冲突，返回固定错误码及安全最新问题。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /inbox/messages/{messageId}/read:
    {
      "parameters": [
        {
          "$ref": "#/components/parameters/MessageId"
        }
      ],
      "post": {
        "operationId": "readInboxMessage", "x-plugin-scope": "inbox.read",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/InboxMessage"
                }
              }
            },
            "description": "消息全文",
            "headers": {
              "Loop-Now-Request-Id": {
                "$ref": "#/components/headers/RequestId"
              },
              "Loop-Now-Version": {
                "$ref": "#/components/headers/Version"
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          }
        },
        "summary": "读取发给当前身份的一条消息的全文，并标为已读；重复读取返回同样的内容，已读时间保持第一次的值",
        "tags": [
          "inbox"
        ],
        "x-access": "console-and-external",
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/InboxReadInput"
              }
            }
          }
        },
        "description": " 严格任务 Inbox 的 Agent 必须提供所属实际运行中的 runId；普通旧 Inbox 可省略。失效或跨节点不改投、不推断当前 run。"
      }
    }
  /inbox/messages/{messageId}/reply:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [inbox]
      operationId: replyInboxMessage
      x-access: console-and-external
      x-plugin-scope: inbox.send
      summary: 回复线索中的一条消息；收件人为线索中的另一方
      description: |
        线索的任一方都可以回复其中任意一条消息，包括自己发出的（在线索中追加）。不是线索参与方时返回 404。
        回复不检查跨组织发送权限。收件人已删除时返回 404，不保存消息。
        原问题的收件方回复仍为 open 的问题时，问题记为 answered：带 `optionId` 时 `answer.optionId`/`optionLabel` 为所选项；只有正文时二者为 null、`answer.textPreview` 为正文。两种回答对问题与任务节点的效果相同。控制台回答时，原问题消息在同一事务中标为已读（未读时），并推送 `inbox.message.read`。
        插件代管外部身份（plugins/SPEC.md §12）：插件令牌带 `asIdentityId` 时以该外部身份的名义回复，效果与该身份亲自回复完全相同（回答问题、任务由等待转回、提醒 Agent）。
        只能是这个插件代管的身份，清单须有 `identities.manage` 范围，这时不需要 `inbox.send`；否则 403。身份已删除或消息不在它的线索里时 404。
        审计记操作者为插件、代表的身份。其他调用方带 `asIdentityId` 时 422。
        插件作为发件方（plugins/SPEC.md §11）：Agent 在插件发来的线索里回复时可以提问（带 `options`），提问以 `channel.outbound` 送给该插件（带 `question`）。
        插件令牌（`inbox.send` 范围）直接回复这道提问即作答，带 `optionId` 或只有正文，效果与外部身份作答相同（回答问题、任务由等待转回、提醒 Agent），审计记操作者为插件。
        插件不能在线索里提问（带 `options` 时 422）；插件令牌回复不属于它的线索时 403。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InboxReplyInput" }
      responses:
        "201":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 已保存的回复
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxMessage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "409":
          description: 已回答/到期/关闭的选项回答或任务节点冲突，返回固定错误码及安全最新问题。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /inbox/threads:
    get:
      tags: [inbox]
      operationId: listInboxThreads
      x-access: console-and-external
      x-plugin-scope: inbox.read
      summary: 列出当前身份参与的线索，按最后一条消息的时间倒序
      parameters:
