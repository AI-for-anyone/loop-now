    # ---- 插件（plugins/SPEC.md）----

    PluginStatus:
      description: |
        - installed：已安装，平台半边没有在宿主里（没有平台半边、全局停用或宿主尚未启动）
        - active：平台半边已在宿主里加载
        - error：加载失败（清单与代码不符、register 抛错等），原因见 lastError
        - host_stopped：宿主崩溃次数达到上限，已停止
      type: string
      enum: [installed, active, error, host_stopped]

    PluginSource:
      description: |
        安装来源。builtin 为随平台发布的官方插件（location 为插件 id），local 为服务端本机目录的绝对路径（原地使用），
        git 为仓库地址（ref 为分支、标签或提交，省略时为默认分支），npm 为包规格（名称，可带 @版本），
        market 为市场里的条目（market 为市场地址，id 为条目的插件 id，version 省略时取市场里的版本；实际按条目的 git 或 npm 来源获取）。
        builtin、local、git、npm 须给出 location；market 须给出 market 与 id。
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [builtin, local, git, npm, market] }
        location: { type: string, minLength: 1, maxLength: 2048 }
        ref: { type: [string, "null"], maxLength: 256 }
        market: { type: string, minLength: 1, maxLength: 2048 }
        id: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$" }
        version: { type: string, maxLength: 64 }

    PluginResolvedSource:
      description: 安装时记录的精确来源：git 为提交，npm 为版本；builtin 与 local 两者都为 null。从市场安装时 market 为市场地址（kind 为条目的 git 或 npm），否则为 null。
      type: object
      required: [kind, location, ref, commit, npmVersion, market]
      additionalProperties: false
      properties:
        market: { type: [string, "null"] }
        kind: { type: string, enum: [builtin, local, git, npm] }
        location: { type: string }
        ref: { type: [string, "null"] }
        commit: { type: [string, "null"] }
        npmVersion: { type: [string, "null"] }

    PluginAccountKind:
      type: object
      required: [kind, label, fields, multiple]
      additionalProperties: false
      properties:
        kind: { type: string }
        label: { type: string }
        fields: { description: "账号字段的 JSON Schema；secret 字段带 `x-secret: true`", type: object }
        multiple: { type: boolean }

    PluginAction:
      type: object
      required: [id, label, where, fields]
      additionalProperties: false
      properties:
        id: { type: string }
        label: { type: string }
        fields: { description: "操作表单的 JSON Schema（对象）；没有输入时为空对象", type: object }
        where:
          type: array
          items: { type: string, enum: [agent, task, project, identity, global] }

    PluginComponents:
      description: 安装前展示的组成：两半各有什么。
      type: object
      required: [agentExtensions, skills, mcpServers, bin, platform, actions, channels, http, schedules]
      additionalProperties: false
      properties:
        agentExtensions: { description: "pi.extensions 的文件数", type: integer, minimum: 0 }
        skills: { description: "pi.skills 的目录", type: array, items: { type: string } }
        mcpServers: { description: "loopNow.mcpServers 的名称", type: array, items: { type: string } }
        bin: { description: "loopNow.bin 的目录", type: array, items: { type: string } }
        platform: { description: "是否有平台半边", type: boolean }
        actions: { type: array, items: { $ref: "#/components/schemas/PluginAction" } }
        channels:
          type: array
          items:
            type: object
            required: [id, label, manageIdentities]
            additionalProperties: false
            properties:
              id: { type: string }
              label: { type: string }
              manageIdentities: { description: "这个渠道能代管外部身份（plugins/SPEC.md §12），需要 identities.manage 范围", type: boolean }
        http: { type: boolean }
        schedules:
          type: array
          items:
            type: object
            required: [id, cron]
            additionalProperties: false
            properties:
              id: { type: string }
              cron: { type: string }

    PluginManifest:
      description: 从插件 `package.json` 读出的清单（pi 段与 loopNow 段），已按规则校验。
      type: object
      required: [id, name, version, displayName, description, minPlatformVersion, events, permissions, failClosed, configSchema, accounts, components]
      additionalProperties: false
      properties:
        id: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$" }
        name: { description: "npm 包名", type: string }
        version: { type: string }
        displayName: { type: string }
        description: { type: string }
        minPlatformVersion: { type: [string, "null"] }
        events: { description: "订阅的事件", type: array, items: { type: string } }
        permissions: { type: array, items: { $ref: "#/components/schemas/PluginPermission" } }
        failClosed: { description: "拦截类 Hook 超时或出错时阻止而不是放行", type: boolean }
        configSchema: { description: "配置表单的 JSON Schema；没有配置时为空对象", type: object }
        accounts: { type: array, items: { $ref: "#/components/schemas/PluginAccountKind" } }
        components: { $ref: "#/components/schemas/PluginComponents" }

    PluginPermission:
      description: 插件令牌可用的平台接口范围（plugins/SPEC.md §5）；接口上的 `x-plugin-scope` 标明所需范围。
      type: string
      enum: [agents.read, agents.write, tasks.read, tasks.write, runs.read, inbox.read, inbox.send, folders.read, folders.write, identities.read, identities.manage, state, accounts.read]

    PluginPreviewRequest:
      type: object
      additionalProperties: false
      properties:
        source: { $ref: "#/components/schemas/PluginSource" }
        pluginId: { description: "按已安装插件记录的来源重新获取（更新前预览）", type: string }

    PluginPreview:
      type: object
      required: [previewId, expiresAt, source, trusted, manifest, installedVersion]
      additionalProperties: false
      properties:
        previewId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        source: { $ref: "#/components/schemas/PluginResolvedSource" }
        trusted: { description: "官方来源；为 false 时安装要带 confirm", type: boolean }
        manifest: { $ref: "#/components/schemas/PluginManifest" }
        installedVersion: { description: "同 id 已安装的版本；没有安装时为 null", type: [string, "null"] }

    PluginInstall:
      type: object
      required: [previewId]
      additionalProperties: false
      properties:
        previewId: { type: string, format: uuid }
        confirm: { description: "确认安装非官方来源", type: boolean }

    Plugin:
      type: object
      required: [id, displayName, description, version, source, status, lastError, hasPlatform, enabledProjects, grantedAgents, installedAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string }
        displayName: { type: string }
        description: { type: string }
        version: { type: string }
        source: { $ref: "#/components/schemas/PluginResolvedSource" }
        status: { $ref: "#/components/schemas/PluginStatus" }
        lastError: { type: [string, "null"] }
        hasPlatform: { type: boolean }
        enabledProjects: { description: "已启用的未删除项目数", type: integer, minimum: 0 }
        grantedAgents: { description: "已授权的未删除 Agent 数", type: integer, minimum: 0 }
        installedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PluginList:
      type: object
      required: [plugins]
      additionalProperties: false
      properties:
        plugins: { type: array, items: { $ref: "#/components/schemas/Plugin" } }

    PluginVersion:
      type: object
      required: [version, digest, installedAt, current]
      additionalProperties: false
      properties:
        version: { type: string }
        digest: { description: "安装内容的 sha256", type: string }
        installedAt: { type: string, format: date-time }
        current: { type: boolean }

    PluginDetail:
      type: object
      required: [plugin, manifest, versions, installDir, dataDir]
      additionalProperties: false
      properties:
        plugin: { $ref: "#/components/schemas/Plugin" }
        manifest: { $ref: "#/components/schemas/PluginManifest" }
        versions: { description: "新的在前", type: array, items: { $ref: "#/components/schemas/PluginVersion" } }
        installDir: { type: string }
        dataDir: { type: string }

    PluginConfig:
      type: object
      required: [values, secretsSet, revision]
      additionalProperties: false
      properties:
        values: { description: "非 secret 字段", type: object }
        secretsSet: { description: "已设置的 secret 字段名", type: array, items: { type: string } }
        revision: { description: "还没有保存过时为 0", type: integer, format: int64, minimum: 0 }

    PluginConfigUpdate:
      type: object
      required: [values, expectedRevision]
      additionalProperties: false
      properties:
        values: { type: object }
        secrets:
          description: 只写；省略的字段保留原值，null 清除
          type: object
          additionalProperties: { type: [string, "null"] }
        expectedRevision: { type: integer, format: int64, minimum: 0 }

    PluginLogEntry:
      type: object
      required: [id, at, level, line]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        level: { type: string, enum: [debug, info, warn, error] }
        line: { type: string }

    PluginLogPage:
      type: object
      required: [entries, nextBefore]
      additionalProperties: false
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/PluginLogEntry" } }
        nextBefore: { description: "还有更早的日志时为下一页的 before", type: [integer, "null"], format: int64 }

    PluginDelivery:
      type: object
      required: [eventId, eventType, at, projectId, agentId, taskId, runId, status, attempts, lastError, ackedAt, durationMs]
      additionalProperties: false
      properties:
        eventId: { type: string }
        eventType: { type: string }
        at: { type: string, format: date-time }
        projectId: { type: [string, "null"], format: uuid }
        agentId: { type: [string, "null"], format: uuid }
        taskId: { type: [string, "null"], format: uuid }
        runId: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [pending, delivered, failed] }
        attempts: { type: integer, minimum: 0 }
        lastError: { type: [string, "null"] }
        ackedAt: { type: [string, "null"], format: date-time }
        durationMs: { description: "成功那一次从发出事件到收到 ack 的时长；未送达时为 null", type: [integer, "null"], format: int64, minimum: 0 }

    PluginDeliveryPage:
      type: object
      required: [deliveries, nextBefore]
      additionalProperties: false
      properties:
        deliveries: { type: array, items: { $ref: "#/components/schemas/PluginDelivery" } }
        nextBefore: { type: [string, "null"] }

    PluginStateEntry:
      type: object
      required: [key, value]
      additionalProperties: false
      properties:
        key: { type: string }
        value: { description: 插件保存的任意 JSON }

    PluginStateList:
      type: object
      required: [entries]
      additionalProperties: false
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/PluginStateEntry" } }

    PluginHostRequest:
      type: object
      required: [type, since]
      additionalProperties: false
      properties:
        type: { type: string }
        plugin: { type: string }
        eventId: { type: string }
        eventType: { type: string }
        since: { type: string, format: date-time }

    PluginHostCrash:
      type: object
      required: [at, error, inFlight, last, stderr]
      additionalProperties: false
      properties:
        at: { type: string, format: date-time }
        error: { type: string }
        inFlight: { description: "退出时没有回应的请求", type: array, items: { $ref: "#/components/schemas/PluginHostRequest" } }
        last:
          description: 退出前最后发给宿主的请求
          oneOf:
            - $ref: "#/components/schemas/PluginHostRequest"
            - type: "null"
        stderr: { description: "最后几行标准错误", type: array, items: { type: string } }

    PluginHostStatus:
      type: object
      required: [configured, state, pid, startedAt, hostVersion, recentExits, lastCrash, loaded, today]
      additionalProperties: false
      properties:
        configured: { description: "服务端是否有宿主入口；为 false 时插件的平台半边不运行", type: boolean }
        state: { type: string, enum: [disabled, starting, running, restarting, stopped, idle] }
        pid: { type: [integer, "null"] }
        startedAt: { type: [string, "null"], format: date-time }
        hostVersion: { type: [string, "null"] }
        recentExits: { description: "5 分钟内的意外退出时间", type: array, items: { type: string, format: date-time } }
        lastCrash:
          oneOf:
            - $ref: "#/components/schemas/PluginHostCrash"
            - type: "null"
        loaded: { type: array, items: { type: string } }
        today:
          description: 服务端本地时间今天零点以来的投递结果（全部插件）
          type: object
          required: [delivered, failed]
          additionalProperties: false
          properties:
            delivered: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }

    PluginActionInput:
      type: object
      required: [where, input]
      additionalProperties: false
      properties:
        where:
