        voidReason:
          description: 未执行即作废的排队轮次的原因，控制台应隐藏：merged_into_interrupt 为其中的消息已全部转入打断轮次；user_cancelled 为其中的消息已全部被人取消；no_pending_messages 为其中的消息已全部被读取或取消。其他原因作废的轮次不带此字段。
