    TaskNodeQueue:
      type: object
      additionalProperties: false
      required: [taskId, nodeRunId, runtimeId, items]
      properties:
        taskId: { type: string, format: uuid }
        nodeRunId: { type: string, format: uuid }
        runtimeId: { type: string, format: uuid }
        items:
          description: 逐条消息，按服务端实际领取顺序排列（轮次的 priority、queue_seq，同一轮内按发送先后）；kind 恒为 inbox，runId 为承载它的轮次
          type: array
          items: { $ref: "#/components/schemas/QueueItem" }

    TaskNodeQueueActionInput:
      type: object
      additionalProperties: false
      required: [actionId, expectedAgentId, expectedRuntimeId]
      properties:
        actionId: { type: string, format: uuid }
        expectedAgentId: { type: string, format: uuid }
        expectedRuntimeId: { type: string, format: uuid }

    TaskNodeQueueActionReceipt:
      type: object
      additionalProperties: false
      required: [actionId, taskId, nodeRunId, agentId, runtimeId, operation, status, messageId, runId, item]
      properties:
        actionId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        nodeRunId: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        runtimeId: { type: string, format: uuid }
        operation:
          type: string
          enum: [promote_inbox_message, cancel_inbox_message, stop_run]
        status:
          type: string
          enum: [accepted, already_interrupt, already_cancelled, already_stopping]
        messageId:
          description: 消息动作的消息；停止为 null
          type: [string, "null"]
          format: uuid
        runId:
          description: 转为打断时为现在承载这条消息的打断轮次；取消时为原承载轮次；停止时为被停止的轮次
          type: string
          format: uuid
        item:
          description: 动作针对的排队项在动作时的内容（取消时供“编辑”回填）；停止为 null
          oneOf:
            - $ref: "#/components/schemas/QueueItem"
            - type: "null"

