        找不到、Agent 已删除、所在项目已删除、地址以 `@` 开头（不指向 Agent），或带 `#任务ID` 时，返回空列表，不返回 404。
        地址放在查询参数中，必须按 URL 规则编码，否则 `#` 之后的部分会被当作 URL 片段丢失。
      parameters:
