      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The moved entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /agents/{agentId}/folder/git-pulls:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      tags: [folders]
      operationId: listAgentFolderGitPulls
      x-access: console
      summary: List the Agent's recent Git pulls, newest first
      description: Used to restore the state of in-progress or failed pulls after a page reload. `limit` defaults to 20, at
        most 100.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Recent pulls
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderGitPullList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [folders]
      operationId: startAgentFolderGitPull
      x-access: console
      summary: Pull one branch from Git, once, into a subdirectory of the Agent folder
      description: |
        Pulls only this one branch and keeps its full history (`clone --single-branch --branch`, not shallow); afterwards
        it is ordinary files and is not synced again.
        When the local mode git switch is off: only the gh CLI credential in the Agent's current config (the project GitHub
        account) is used; without gh configured the clone is anonymous and only public repositories can be pulled;
        HOME is the Agent's own directory, so SSH addresses cannot read the user's keys and known_hosts.
        When the switch is on (the default): the server process user's real HOME, SSH_AUTH_SOCK, git config and credential
        helper are used, so SSH addresses and the HTTPS credentials already stored on this computer work;
        when the Agent has gh configured, HTTPS to github.com uses only its credential (the credentials stored on this
        computer for github.com are neither read nor written), and other hosts go through the local helper.
        In both cases nothing is ever asked interactively: git shows no terminal prompt and no askpass, SSH runs in
        BatchMode, and an unknown host fails immediately (`host_key_unverified`).
        `path` must not exist or must be an empty directory, otherwise 409 `path_conflict`; a pull already in progress for
        the same target also returns 409.
        Runs asynchronously and returns 202 with the operation; query its status with GET. actionId is idempotent: the same
        actionId returns the same operation, and different content returns 409 `action_conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FolderGitPullInput" }
      responses:
        "202":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderGitPull" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /agents/{agentId}/folder/git-pulls/{operationId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - { in: path, name: operationId, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [folders]
      operationId: getAgentFolderGitPull
      x-access: console
      summary: Get the status of a Git pull
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Operation status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderGitPull" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/context-folder/entries:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [folders]
      operationId: listProjectContextFolderEntries
      x-access: console
      x-plugin-scope: folders.read
      summary: List one level of the project context folder (lazy loading)
      description: |
        Lists only the `path` level: not recursive, and directory sizes are not computed. Directories come first;
        entries of the same kind are sorted by name. `limit` defaults to 500, maximum 2000; when there are more entries,
        `nextCursor` is returned; pass it back unchanged to get the next page. The project context folder is read and
        written by both this project's Agents (including their instances in tasks) and people, and is created
        automatically if it does not exist; after the project is deleted it stays on disk but is no longer accessible.
      parameters:
        - $ref: "#/components/parameters/FolderPath"
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
      responses:
        "200":
