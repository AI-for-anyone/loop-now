    delete:
      tags:
      - credentials
      operationId: deleteProjectCredentialAccount
      x-access: console-and-external
      description: Stops new use of the account and keeps its historical versions and a tombstone. Compare-and-set on the
        revision comes first; repeating the request with the old revision still returns 412.
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: expectedRevision
        in: query
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Success
          headers:
