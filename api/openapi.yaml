components:
  headers:
    RequestId:
      description: 本次请求的唯一编号（UUIDv7），与服务端日志中的 requestId 一致；控制台出错时显示它
      required: true
      schema: { type: string, format: uuid }
    Version:
      description: 服务端版本（与 loopctl 共用的版本包），loopctl 据此比对版本；跨源访问时与 `Loop-Now-Request-Id`、`ETag` 一起列在 `Access-Control-Expose-Headers` 中
      required: true
      schema: { type: string, minLength: 1 }

  parameters:
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PluginId:
      name: pluginId
      in: path
      required: true
      description: 插件 id（清单 loopNow.id）
      schema: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$" }
    PluginAccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ScopeProjectId:
      name: projectId
      in: query
      required: false
      description: 只看这个项目（未删除）中的 Agent；与 platform 二选一，同时给出时返回 422；都不给表示所有未删除项目与平台
      schema: { type: string, format: uuid }
    ScopePlatform:
      name: platform
      in: query
      required: false
      description: 为 true 时只看平台持有的 Agent；与 projectId 二选一
      schema: { type: boolean }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FolderPath:
      name: path
      in: query
      required: false
      description: 文件夹内的相对路径；缺省或空串表示文件夹根
      schema: { type: string }
    FolderEntryPath:
      name: path
      in: query
      required: true
      description: 文件夹内的相对路径，例如 `docs/intro.md`；不能为空，不能含 `..` 或以 `/` 开头
      schema: { type: string, minLength: 1 }
    SkillId:
      name: skillId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentSkillId:
      name: agentSkillId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProviderId:
      name: providerId
      in: path
      required: true
      schema: { type: string }
    CliName:
      name: cli
      in: path
      required: true
      schema: { $ref: "#/components/schemas/CliName" }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ThreadId:
      name: threadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdentityId:
      name: identityId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InboxUnread:
      name: unread
      in: query
      required: false
      description: 为 true 时只列未读（已读时间为空）的消息；默认包含已读与未读
      schema: { type: boolean, default: false }
    PageCursor:
      name: cursor
      in: query
      required: false
      description: 上一页返回的 nextCursor；不透明字符串，无效时返回 422
      schema: { type: string, minLength: 1 }
    PageLimit:
      name: limit
      in: query
      required: false
      description: 每页条数，默认 20；超过服务端的上限（默认 100，可配置）时按上限返回
      schema: { type: integer, minimum: 1, default: 20 }

  responses:
    Unauthenticated:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: 令牌缺失、无效、过期或已吊销，或所属身份已删除（`unauthenticated`）。只出现在对外端口与 Agent 专用接口上；错误信息不回显令牌
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: |
        `error.code` 取值：
        - `forbidden`：身份有效，但不允许这个操作：外部身份调用 `x-access: console` 的操作，跨组织发送被拒绝，或在控制台接口上带了令牌；
        - `forbidden_origin`、`invalid_host`：控制台接口的 Origin 或 Host 不在允许名单。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: 资源不存在（含已删除的 Agent）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: |
        与当前状态冲突。`error.code` 取值：
        `agent_busy`（details 为 AgentBusyDetails）、`agent_not_idle`（删除项目时 details 为 ProjectNotIdleDetails）、`session_missing`、`template_deleted`、`name_conflict`、`path_conflict`。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: 校验失败，尽量带字段级错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PreconditionFailed:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: If-Match 与当前内容不一致
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: 超过大小上限
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    CLIImportInternalError:
      {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "安全化internal_error；不能以失败响应推断提交已回滚",
        "headers": {
          "Loop-Now-Request-Id": {
            "$ref": "#/components/headers/RequestId"
          },
          "Loop-Now-Version": {
            "$ref": "#/components/headers/Version"
          }
        }
      }

    CLIImportPreconditionFailed:
      {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "precondition_failed或import_source_changed，需核对revision/重新扫描",
        "headers": {
          "Loop-Now-Request-Id": {
            "$ref": "#/components/headers/RequestId"
          },
          "Loop-Now-Version": {
            "$ref": "#/components/headers/Version"
          }
        }
      }

    CLIImportUnavailable:
      {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "HTTP503同样使用现internal_error；提交未知只查询原operation，不重发工作",
        "headers": {
          "Loop-Now-Request-Id": {
            "$ref": "#/components/headers/RequestId"
          },
          "Loop-Now-Version": {
            "$ref": "#/components/headers/Version"
          }
        }
      }

  schemas:
    SleepInput:
      type: object
      additionalProperties: false
      required: [actionId, runId, seconds]
      properties:
        actionId: { type: string, format: uuid }
        runId:
          description: 平台本轮说明中提供的运行 ID；不能用状态查询悄悄替换旧轮 ID
          type: string
          format: uuid
        seconds: { type: integer, format: int64, minimum: 1, maximum: 2147483647 }
        reason:
          description: 可选说明，非空文本遵循服务端消息长度上限
          type: [string, "null"]

    SleepRecord:
      type: object
      additionalProperties: false
      required: [id, scopeKind, agentId, taskId, runtimeId, nodeRunId, sourceRunId, state, seconds, requestedAt, enteredAt, wakeAt, endedAt, endReason, wakeRunId, reason, revision]
      properties:
        id: { type: string, format: uuid }
        scopeKind: { type: string, enum: [normal, task] }
        agentId: { type: string, format: uuid }
        taskId: { type: [string, "null"], format: uuid }
        runtimeId: { type: [string, "null"], format: uuid }
        nodeRunId: { type: [string, "null"], format: uuid }
        sourceRunId: { type: string, format: uuid }
        state: { type: string, enum: [requested, sleeping, woken, cancelled] }
        seconds: { type: integer, format: int64, minimum: 1, maximum: 2147483647 }
        requestedAt: { type: string, format: date-time }
        enteredAt: { type: [string, "null"], format: date-time }
        wakeAt: { type: [string, "null"], format: date-time }
        endedAt: { type: [string, "null"], format: date-time }
        endReason:
          type: [string, "null"]
          enum: [deadline, queued_work, execution_failed, interrupted, task_ended, node_changed, session_reopened, owner_deleted, null]
        wakeRunId: { type: [string, "null"], format: uuid }
        reason: { type: [string, "null"] }
        revision:
          description: 所属 scope 的单调版本；新 sleep 延续原 scope 版本
          type: integer
          format: int64
          minimum: 1

    SleepInfo:
      $ref: "#/components/schemas/SleepRecord"

    SleepReceipt:
      type: object
      additionalProperties: false
      required: [sleep, endTurn]
      properties:
        sleep: { $ref: "#/components/schemas/SleepRecord" }
        endTurn: { type: boolean, enum: [true] }

    SleepState:
      type: object
      additionalProperties: false
      required: [currentRunId, sleep]
      properties:
        currentRunId: { type: [string, "null"], format: uuid }
        sleep:
          description: 自身 requested 或 sleeping 记录；没有时为 null
          oneOf:
            - $ref: "#/components/schemas/SleepRecord"
            - type: "null"

    SseSleepUpdated:
      type: object
      additionalProperties: false
      required: [scopeKind, agentId, taskId, runtimeId, nodeRunId, taskVersion, sleepRevision, sleep, endedSleepId]
      properties:
        scopeKind: { type: string, enum: [normal, task] }
        agentId: { type: string, format: uuid }
        taskId: { type: [string, "null"], format: uuid }
        runtimeId: { type: [string, "null"], format: uuid }
        nodeRunId: { type: [string, "null"], format: uuid }
        taskVersion:
          description: 任务事务提交后的 task.version；常态为 null。用于拒绝旧任务快照的空列表
          type: [integer, "null"]
          format: int64
          minimum: 1
        sleepRevision: { type: integer, format: int64, minimum: 0 }
        sleep:
          oneOf:
            - $ref: "#/components/schemas/SleepInfo"
            - type: "null"
        endedSleepId: { type: [string, "null"], format: uuid }

    TaskAgentList:
      type: object
      additionalProperties: false
      required:
        - agents
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/TaskAvailableAgent'
    TaskAvailableAgent:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - address
        - prompt
        - clis
        - configVersion
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        prompt:
          type: string
        clis:
          type: array
          items:
            type: string
        configVersion:
          type: integer
          minimum: 1
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            details:
              description: 按 code 定义：agent_busy 带 AgentBusyDetails；删除项目时的 agent_not_idle 带 ProjectNotIdleDetails
              oneOf:
                - $ref: "#/components/schemas/VerificationVersionConflictDetails"
                - $ref: "#/components/schemas/VerificationConflictDetails"
                - $ref: "#/components/schemas/VerificationUnsupportedDetails"
                - $ref: "#/components/schemas/TaskNodeMessageConflictDetails"
                - $ref: "#/components/schemas/CredentialPreconditionDetails"
                - $ref: "#/components/schemas/CLIAuthInProgressDetails"
                - $ref: "#/components/schemas/CredentialSelectionModeConflictDetails"
                - $ref: "#/components/schemas/CredentialResolutionDetails"
                - $ref: "#/components/schemas/CredentialAccountDeletedDetails"
                - $ref: "#/components/schemas/ProjectCredentialRequiredDetails"
                - $ref: "#/components/schemas/ProjectModelAuthInProgressDetails"
                - $ref: "#/components/schemas/ProjectActiveTasksDetails"
                - $ref: "#/components/schemas/QuestionClosedDetails"
                - $ref: "#/components/schemas/AgentBusyDetails"
                - $ref: "#/components/schemas/RunNotQueuedDetails"
                - $ref: "#/components/schemas/RunNotActiveDetails"
                - $ref: "#/components/schemas/ProjectNotIdleDetails"
            fields:
              type: array
              items: { $ref: "#/components/schemas/FieldError" }

    ErrorCode:
      {
        "description": "- not_found：资源不存在（404）
- validation_failed：校验失败（422）
- precondition_failed：请求前置版本条件不一致（If-Match 或 Prompt 编辑版本，412）
- payload_too_large：超过大小上限（413）
- agent_busy：Agent 正忙且未选择打断或排队（409）
- agent_not_idle：需要 Agent 空闲的操作（删除 Agent、删除项目、重开会话）在忙时被拒绝（409）
- session_missing：Agent 处于会话丢失状态，需要先确认重开会话（409）
- template_deleted：来源模板已删除，不能重新复制（409）
- name_conflict：名称重复（409）：项目内或平台内 Agent 重名、项目重名、Skill 名称重复或使用了内置 Skill 的名称 `loopctl`、外部身份重名
- path_conflict：文件夹来源子目录重复或互相包含（409）
- forbidden_origin：Origin 不在白名单（403）
- invalid_host：Host 不在允许名单（403）
- unauthenticated：令牌缺失、无效、过期或已吊销，或所属身份已删除（401）
- forbidden：身份有效，但不允许这个操作（403）
- sleep_conflict：运行过期、动作内容冲突、已提交节点或已有不同有效 sleep（409）
- run_not_queued：转为打断、撤回或取消的排队项已不在队列：执行已被领取、开始或结束，或消息已读、已取消（409）
- run_not_active：停止回复时，这一次执行已经结束（409）
- action_conflict：同一 actionId 被用于不同内容的动作（409）
- plugin_source_failed：插件来源无法获取，或依赖安装失败（422）
- plugin_confirmation_required：非官方来源的插件安装或更新须确认（409）
- plugin_version_conflict：同一插件已装同版本号但内容不同（409）
- plugin_not_enabled：插件没有在项目里启用，或全局停用（409）
- plugin_blocked：插件的拦截类 Hook 阻止了这个操作，message 带插件 id 与原因（409）
- plugin_failed：插件处理请求时报错，message 带插件给出的原因（502）
- plugin_timeout：插件没有在时限内回应（504）
- internal_error：服务端内部错误（500）
