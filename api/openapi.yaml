    get:
      tags: [observability]
      operationId: getRunTimeline
      x-access: console-and-external
      x-plugin-scope: runs.read
      summary: The run record timeline of one run
      description: |
        Entries are sorted by time: lifecycle events, each tool call (start and end merged into one entry), and the
        usage of each model call. While the run is in progress, returns the entries so far. Runs from before this change
        have no detailed events; entries are synthesized from the times in the run information.
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Timeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunTimeline" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{agentId}/queue:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      tags: [conversation]
      operationId: getAgentQueue
      x-access: console
      summary: The queue of the ordinary conversation, one item per message, in actual processing order
      description: |
        One item (kind=run) for each message the console sent in the conversation that is still queued; one item
        (kind=inbox) for each Inbox message carried by a platform reminder, listing only those still pending: unread,
        not cancelled, and with the reminder carrying it still queued. A message leaves the list as soon as it is read
        or cancelled. The order matches the actual processing order: first by the carrying run's priority and queue_seq,
        then, within one reminder, by the order the messages were sent. Sleep wake runs are not listed. On changes, the
        Agent SSE pushes `queue.updated` (items as in this endpoint), and snapshot carries `queueItems`.
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentQueue" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{agentId}/runs/{runId}/promote-to-interrupt:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [conversation]
      operationId: promoteRunToInterrupt
      x-access: console
      summary: Promote a still-queued message sent from the console to an interrupt
      description: |
        Same effect as choosing interrupt when sending: the run changes to `whenBusy=interrupt` and is placed after
        existing interrupts and before all ordinary queued items (several promoted in a row are ordered by when they
        were promoted), then the reply in progress is interrupted. Only open to runs sent from the console; Inbox
        messages carried by a platform reminder are promoted one at a time with
        `POST /agents/{agentId}/inbox-messages/{messageId}/promote-to-interrupt`, and calling this endpoint on a
        reminder run or a sleep wake returns 422. Returns 409 `run_not_queued`, with details `RunNotQueuedDetails`, when
        the run has already been claimed, started or ended. When it is already an interrupt, returns
        status=already_interrupt and does not interrupt again. actionId is idempotent: replaying the same actionId
        returns the first result; the same actionId with different content returns 409 `action_conflict`. On success,
        `run.updated` and `queue.updated` are pushed, and a `promoted` entry is appended to the run record timeline.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentQueueActionInput" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Action result; replaying the same actionId returns the first result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentQueueActionReceipt" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /agents/{agentId}/runs/{runId}/cancel:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [conversation]
      operationId: cancelQueuedRun
      x-access: console
      summary: Withdraw a still-queued message sent from the console
      description: |
        The run ends as interrupted with endReason=user_cancelled and is removed from the queue; the Agent never
        receives it. The receipt's item carries the original text and image references so that "Edit" can put them back
        in the input box; the images already belong to this message, so to send again, read their content by ID and
        upload it under new IDs. Returns 409 `run_not_queued` when the run has already been claimed, started or ended;
        returns status=already_cancelled when it has already been withdrawn. Platform reminder and sleep wake runs
        return 422. actionId rules are the same as for promoting to an interrupt. On success, `run.updated` and
        `queue.updated` are pushed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentQueueActionInput" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Action result; replaying the same actionId returns the first result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentQueueActionReceipt" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /agents/{agentId}/runs/{runId}/stop:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [conversation]
      operationId: stopRun
      x-access: console
      summary: Stop only this reply in progress, without sending a new message
      description: |
        Uses the interrupt path (clear the Pi queue, abort, force-end on timeout); the run ends as interrupted with
        endReason=user_stopped. Messages queued after it are processed in order as usual. Applies only to the run in the
        path: when it has already ended, returns 409 `run_not_active` (details `RunNotActiveDetails`) and does not stop
        the next one; when it is already stopping or being interrupted, returns status=already_stopping. actionId rules
        are the same as for promoting to an interrupt.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentQueueActionInput" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Action result; replaying the same actionId returns the first result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentQueueActionReceipt" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /agents/{agentId}/inbox-messages/{messageId}/promote-to-interrupt:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [conversation]
      operationId: promoteAgentInboxMessage
      x-access: console
      summary: Promote a single queued Inbox message to an interrupt (any sender)
      description: |
        Moves the message from the ordinary reminder carrying it to a queued interrupt reminder (creating one if there
        is none, placed after existing interrupts and before all ordinary queued items), and changes the message's
        whenBusy to interrupt. The original reminder is voided (endReason=merged_into_interrupt) when it has no other
        pending messages. Then the reply in progress is interrupted. When a reminder starts, it names only the messages
        it carries; other unread messages are handled later by their own reminders. Returns 409 `run_not_queued` when
        the message is not in the queue; details.messageState is read, cancelled, dispatched or not_queued. Returns
        status=already_interrupt when it is already an interrupt. actionId rules are the same as
        `promoteRunToInterrupt`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentQueueActionInput" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Action result; replaying the same actionId returns the first result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentQueueActionReceipt" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /agents/{agentId}/inbox-messages/{messageId}/cancel:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [conversation]
      operationId: cancelAgentInboxMessage
      x-access: console
      summary: Cancel a single queued Inbox message (any sender)
      description: |
        The message gets `cancelledAt`, no longer counts as unread, and the receiving Agent will not process it: when
        the receiving Agent reads or lists it, it gets only a cancellation notice, without the original text or images;
        the sender and the console still see the full text and `cancelledAt`. A question with options also changes to
        state=cancelled and can no longer be answered. The reminder carrying it is voided (endReason=user_cancelled)
        when it has no other pending messages. The Inbox event stream pushes `inbox.message.cancelled`. Returns 409
        `run_not_queued` when the message is not in the queue (messageState as above); returns status=already_cancelled
        when it is already cancelled. actionId rules are the same as above.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentQueueActionInput" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Action result; replaying the same actionId returns the first result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentQueueActionReceipt" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /agents/{agentId}/inbox:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      tags: [inbox]
      operationId: listAgentInbox
      x-access: console
      x-plugin-scope: inbox.read
      summary: View summaries of the messages the Agent received, newest first; read-only, does not change the read state
      parameters:
        - $ref: "#/components/parameters/InboxUnread"
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: A page of message summaries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxMessagePage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /agents/{agentId}/console-messages:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      tags: [inbox]
      operationId: listAgentConsoleMessages
      x-access: console
      summary: Full text of the Inbox messages between the console and the Agent (regular, not its task instances), in both directions, newest first; read-only, does not change the read state
      description: |
        For merging into the Agent conversation by time. Each message carries its question (options, state, answer) and
        read state. Messages between task instances and the console are not here; see
        `GET /tasks/{taskId}/nodes/{nodeRunId}/inbox-messages`. Returns 404 when the Agent does not exist; deleted
        Agents can still be viewed.
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: A page of full messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxConversationPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /agents/{agentId}/inbox/{messageId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/MessageId"
    get:
      tags: [inbox]
      operationId: getAgentInboxMessage
      x-access: console
      x-plugin-scope: inbox.read
      summary: View the full text of one message the Agent received; read-only, does not change the read state
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The full message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxMessage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /overview/events:
    get:
      tags: [observability]
      operationId: streamOverviewEvents
      x-access: console
      summary: Overview event stream (SSE) with the run state of the non-deleted Agents in all non-deleted projects and on the platform; can be filtered by project or platform
      description: |
        `text/event-stream`; snapshot and resume rules are the same as for `GET /agents/{agentId}/events`.
        `agent.status` carries the Agent's complete new status; text deltas and tool states do not trigger a push. When
        filtered by scope, both the snapshot and later events include only the Agents in that scope; when a project is
        deleted, `agent.removed` is pushed for each of its Agents.
      parameters:
        - $ref: "#/components/parameters/ScopeProjectId"
        - $ref: "#/components/parameters/ScopePlatform"
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
      x-sse-events:
        snapshot: { $ref: "#/components/schemas/SseOverviewSnapshot" }
        agent.status: { $ref: "#/components/schemas/SseAgentStatus" }
        agent.removed: { $ref: "#/components/schemas/SseAgentRemoved" }

  /usage:
    get:
      tags: [observability]
      operationId: getUsage
      x-access: console-and-external
      summary: Token usage per (Agent, provider, model); counts tokens only, no cost; can be filtered by project or platform
      parameters:
        - $ref: "#/components/parameters/ScopeProjectId"
        - $ref: "#/components/parameters/ScopePlatform"
        - name: from
          in: query
          required: false
          description: Start time (inclusive), RFC 3339; omit for no limit
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: End time (exclusive), RFC 3339; omit for no limit. Returns 422 when from is not earlier than to
          schema: { type: string, format: date-time }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Usage statistics, sorted by total, descending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsagePage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /anomalies:
    get:
      tags: [observability]
      operationId: listAnomalies
      x-access: console-and-external
      summary: List of anomalies and failures (runs that did not complete normally), paged by end time, newest first, excluding deleted Agents (including Agents in deleted projects); can be filtered by project or platform
      description: A manual compaction (/compact) cancelled by a person or interrupted by a service restart is not an anomaly; only failed manual compactions are listed. Pi not compacting (session too short, already compacted) is a normal completion.
      parameters:
        - $ref: "#/components/parameters/ScopeProjectId"
        - $ref: "#/components/parameters/ScopePlatform"
        - name: from
          in: query
          required: false
          description: Return only runs that ended after this time, RFC 3339; omit for no limit
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          required: false
          description: The nextCursor returned with the previous page
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: A page of anomalies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnomalyPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /stats:
    get:
      tags: [observability]
      operationId: getStats
      x-access: console
      summary: Stats page report for a time window covering tokens, trigger sources, wakes, context, questions, waiting, outcomes, tools, processes and concurrency; can be filtered by project or platform
      description: |
        A read-only summary of existing records, excluding deleted Agents (including Agents in deleted projects). The
        time window is [from, to), cut by bucket into consecutive buckets: the first bucket starts at from, each bucket
        is 1 hour or 24 hours, and the last bucket ends at to. What places a record in the window and in a bucket: usage
        by its record time; runs (regular runs and task turns) by their enqueue time (when the message was sent or the
        wake came due); questions by when they were sent. Every `series` has the same length as `buckets`, and their
        entries correspond one to one.
      parameters:
        - $ref: "#/components/parameters/ScopeProjectId"
        - $ref: "#/components/parameters/ScopePlatform"
        - name: from
          in: query
          required: true
          description: Start time (inclusive), RFC 3339
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          description: End time (exclusive), RFC 3339. Returns 422 when from is not earlier than to
          schema: { type: string, format: date-time }
        - name: bucket
          in: query
          required: true
          description: Bucket width; returns 422 when there would be more than 1000 buckets
          schema: { type: string, enum: [hour, day] }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Stats report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsReport" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /plugins:
    get:
      tags: [plugins]
      operationId: listPlugins
      x-access: console-and-external
      summary: Installed plugins (plugin market page), sorted by id
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Plugin list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [plugins]
      operationId: installPlugin
      x-access: console-and-external
      summary: Install a plugin from a preview
      description: |
        First get a preview with `POST /plugin-previews` and show it to a person, then install with the previewId.
        Unofficial sources (local directory, git, npm) require `confirm: true`; otherwise returns 409
        `plugin_confirmation_required`. Returns 409 `name_conflict` when the plugin id is already installed (to update,
        use `POST /plugins/{pluginId}/update`). For git and npm sources, this step runs
        `npm ci --ignore-scripts --omit=dev --omit=peer` (`npm install` with the same flags when there is no lockfile);
        failure returns 422 `plugin_source_failed`. Peer dependencies are not installed: peer dependencies that the
        plugin's runtime dependencies need must be listed directly in the plugin's own `dependencies`. Local directory
        sources are used in place, with no dependency install and no changes. Returns 404 when the preview has expired
        or does not exist. When the plugin has Pi extensions (`pi.extensions`), after dependencies are installed the
        bundled Pi loads those extensions to read the model providers they register (plugins/SPEC.md §13; this runs
        plugin code, so it happens at this step rather than at preview time); the result is in the plugin detail's
        `providers`. A read failure does not block installation; the reason is in `providersError`. Providers that
        register an OAuth login and whose id differs from those in the Pi catalog (built-in and models.json) are merged
        into the model catalog (source is plugin in `listModelProviders`); when such a provider has the same id as a
        provider another installed plugin merged into the catalog, returns 409 `name_conflict` and nothing is installed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginInstall" }
      responses:
        "201":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Installed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plugin" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /plugin-previews:
    post:
      tags: [plugins]
      operationId: previewPlugin
      x-access: console-and-external
      summary: Fetch a plugin and read its manifest, to show before installing or updating
      description: |
        Pass exactly one of `source` and `pluginId`: `source` is the source for a new installation; `pluginId` fetches
        again from the source recorded for the installed plugin (preview before an update). Fetching (git clone, npm
        package download) and manifest validation happen at this step; dependencies are not installed. Previews are kept
        for 30 minutes. Returns 422 `plugin_source_failed` when the source cannot be fetched; returns 422
        `validation_failed` when the manifest breaks the rules or minPlatformVersion is higher than the platform
        version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginPreviewRequest" }
      responses:
        "201":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginPreview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /plugin-previews/{previewId}/readme:
    parameters:
      - $ref: "#/components/parameters/PluginPreviewId"
    get:
      tags: [plugins]
      operationId: getPluginPreviewReadme
      x-access: console-and-external
      summary: The README of the plugin in a preview, to read before installing or updating
      description: Reads the plugin directory the preview fetched, with the same selection rules as `GET /plugins/{pluginId}/readme`. Returns 404 when the preview has expired, has already been used for an install, or does not exist.
      parameters:
        - $ref: "#/components/parameters/PluginReadmeLocale"
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: README
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginReadme" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /plugins/{pluginId}:
    parameters:
      - $ref: "#/components/parameters/PluginId"
    get:
      tags: [plugins]
      operationId: getPlugin
      x-access: console-and-external
      summary: Plugin details (manifest, source, status and installed version)
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Plugin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [plugins]
      operationId: uninstallPlugin
      x-access: console-and-external
      summary: Uninstall a plugin
      description: |
        Unloads the platform side in the plugin host; deletes the plugin's config, enablements, grants, accounts, state,
        event deliveries and tokens; deletes the install directory of every version (not for local directory sources).
        The data directory `<work root>/platform/plugins/<id>/data/` is deleted only with `deleteData=true`. Pi
        processes that have already started keep using the loaded agent side until their next start. The model providers
        the plugin registered disappear from the model catalog; their subscription accounts in each project and platform
        Agents' own logins are kept by default (restored after reinstalling), and are deleted too with `deleteData=true`
        (the same as deleting an account: versions bound by unfinished tasks are kept until the task ends, after which
        the sweeper deletes the state directory; for a platform Agent's login it is the same as clearing the credential,
        after which that Agent has no model credential).
      parameters:
        - name: deleteData
          in: query
          required: false
          description: Also delete the plugin's data directory; default false
          schema: { type: boolean }
      responses:
        "204":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Uninstalled
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /plugins/{pluginId}/readme:
    parameters:
      - $ref: "#/components/parameters/PluginId"
    get:
      tags: [plugins]
      operationId: getPluginReadme
      x-access: console-and-external
      summary: The plugin's README (currently installed version)
      description: |
        Reads the install directory of the currently installed version (for a local directory source, that directory),
        looking only at direct child files, with case-insensitive base names (plugins/SPEC.md §2.3): with `locale`, it
        looks for `README.<locale>.md`, then `README.<primary language>.md` (such as zh for zh-CN), then `README.md`;
        without it, `README.md` first. If none of these exists, it takes the first `README.<language>.md` in language
        tag order. A symlink must still resolve inside that directory, otherwise it is treated as absent. Over 1 MiB,
        only the first 1 MiB is returned and `truncated` is true; with no README at all, `file` and `markdown` are null.
      parameters:
        - $ref: "#/components/parameters/PluginReadmeLocale"
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: README
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginReadme" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /plugins/{pluginId}/update:
    parameters:
      - $ref: "#/components/parameters/PluginId"
    post:
      tags: [plugins]
      operationId: updatePlugin
      x-access: console-and-external
      summary: Install a new version of a plugin from a preview
      description: |
        The preview must have the same plugin id. The new version is installed to its own directory; in the plugin host
        the old version is unloaded and then the new one is loaded. Pi processes already started in tasks keep using the
        old files until they restart naturally. Returns 409 `plugin_version_conflict` when the version number equals the
        installed version but the content differs. Other rules are the same as for installing (including reading the
        model providers again and the 409 for the same id).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginInstall" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The updated plugin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plugin" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /plugins/{pluginId}/config:
    parameters:
      - $ref: "#/components/parameters/PluginId"
    get:
      tags: [plugins]
      operationId: getPluginConfig
      x-access: console-and-external
      summary: The plugin's global config; secret fields only show whether they are set
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Global config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginConfig" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [plugins]
      operationId: putPluginConfig
      x-access: console-and-external
      summary: Save the global config against its revision
      description: |
        values are validated against the manifest's configSchema (excluding x-secret fields); invalid values return 422.
        secrets are write-only: omitted ones keep their value and null clears one. Returns 412 when expectedRevision
        differs from the current revision. After saving, the plugin in the host receives config_changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginConfigUpdate" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The saved config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginConfig" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /plugins/{pluginId}/logs:
    parameters:
      - $ref: "#/components/parameters/PluginId"
    get:
      tags: [plugins]
      operationId: listPluginLogs
      x-access: console-and-external
      summary: The plugin's host logs, newest first, kept for 7 days
      parameters:
        - name: before
          in: query
          required: false
          description: The nextBefore of the previous page
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          required: false
          description: 1 to 500, default 100
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: A page of logs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginLogPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /plugins/{pluginId}/deliveries:
    parameters:
      - $ref: "#/components/parameters/PluginId"
    get:
      tags: [plugins]
      operationId: listPluginDeliveries
      x-access: console-and-external
      summary: Deliveries of observation events to this plugin, newest event time first
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, delivered, failed] }
        - name: projectId
          in: query
          required: false
          description: Only events of this project
          schema: { type: string, format: uuid }
        - name: before
          in: query
          required: false
          description: The nextBefore of the previous page (an event id)
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: 1 to 200, default 50
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: A page of deliveries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginDeliveryPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /plugins/{pluginId}/state:
    parameters:
      - $ref: "#/components/parameters/PluginId"
    get:
      tags: [plugins]
      operationId: listPluginState
      x-access: console-and-external
      summary: Reads a plugin's persistent state (read-only), for example the `deliveries/` prefix of the delivery-record convention
      parameters:
        - name: prefix
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
        - name: projectId
          in: query
          required: false
          description: Project-level state; omit for the plugin's global state
          schema: { type: string, format: uuid }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Sorted by key, at most 1000 entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginStateList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /plugins/{pluginId}/actions/{actionId}:
    parameters:
      - $ref: "#/components/parameters/PluginId"
      - name: actionId
        in: path
        required: true
        schema: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$" }
    post:
      tags: [plugins]
      operationId: invokePluginAction
      x-access: console-and-external
      summary: Runs a plugin's console action button
      description: |
        The action must be declared in the manifest's `actions`; `where` gives the page object the button sits on: a
        project, an Agent, a task or an external identity. A page shows the button only when the manifest's `where`
        includes that kind of page.
        `input` is validated against the action's `fields` (422 if invalid) and passed to the plugin host as an `action`
        request with a 30-second timeout (504 plugin_timeout); 502 plugin_failed when the plugin reports an error.
        Returns 409 plugin_not_enabled when the project `where` points to (for an Agent or a task, its project) has not
        enabled the plugin, or the plugin is not in the plugin host.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginActionInput" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The plugin's response, shown as a toast
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginActionResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "502":
          description: The plugin reported an error (plugin_failed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504":
          description: The plugin did not respond in time (plugin_timeout)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /plugin-markets:
    get:
      tags: [plugins]
      operationId: listPluginMarkets
      x-access: console-and-external
      summary: Aggregates the plugins of every market, marking the installed ones and those with an update available
      description: |
        A market is a `loop-now-market.json` reachable over HTTPS: `{ "name", "plugins": [{ "id", "source":
        "git:<url>[@ref]" | "npm:<package spec>", "displayName", "description", "verified", "version" }] }`.
        Reads the official market (configured on the server) and then the markets in the global settings; when one
        market fails to load, its `error` is set and the others load as usual.
        Installed plugins show the installed version; `updateAvailable` is true when the market entry's `version` is
        higher than the installed one. Install with `POST /plugin-previews`, source `{kind: market, market, id}`.
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Plugins of each market
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginMarketList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /plugin-sources/builtin:
    get:
      tags: [plugins]
      operationId: listBuiltinPluginSources
      x-access: console-and-external
      summary: Official plugins shipped with the platform that can be installed from the builtin source
      description: "An empty list when the server has no official plugin directory. Install with `POST /plugin-previews`, with source `{kind: builtin, location: <id>}`."
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Sorted by id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuiltinPluginSourceList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /plugin-host:
    get:
      tags: [plugins]
      operationId: getPluginHost
      x-access: console-and-external
      summary: Plugin host status and its most recent crash
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Plugin host status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginHostStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /plugin-host/restart:
    post:
      tags: [plugins]
      operationId: restartPluginHost
      x-access: console-and-external
      summary: Restarts the plugin host and resets the crash count; returns 409 `plugin_not_enabled` when plugins are disabled globally
      responses:
        "202":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Restart requested; the plugin host status changes afterwards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginHostStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /plugin-settings:
    get:
      tags: [plugins]
      operationId: getPluginSettings
      x-access: console-and-external
      summary: Global plugin settings (the "Disable all" switch and extra markets)
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [plugins]
      operationId: putPluginSettings
      x-access: console-and-external
      summary: Saves the global plugin settings
      description: |
        When `disabled` is true, stops the plugin host and no longer mounts any agent side into newly started Pi
        processes (Pi processes already running are not affected; the change applies at their next start); setting it
        back to false restores this.
        `markets` is used in phase three; for now it is only saved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginSettings" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The saved settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /projects/{projectId}/plugins:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [plugins]
      operationId: listProjectPlugins
      x-access: console-and-external
      summary: For the project plugins page, each installed plugin's enable state and project-level config in this project
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Sorted by plugin id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPluginList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/plugins/{pluginId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/PluginId"
    put:
      tags: [plugins]
      operationId: putProjectPlugin
      x-access: console-and-external
      summary: Enables or disables a plugin in the project and saves its project-level config
      description: |
        `values` may contain only the fields marked `x-scope: project` in the manifest's `configSchema`; `secrets` are
        write-only: omitted ones keep their value and null clears them.
        Returns 412 when `expectedRevision` differs from the current one (0 while the project has no project-level
        config).
        After the plugin is disabled, the project no longer produces events for it; the grants of the project's Agents
        are kept but have no effect (the plugin is no longer mounted the next time Pi starts).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectPluginUpdate" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The saved project plugin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPlugin" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /projects/{projectId}/plugins/{pluginId}/accounts:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/PluginId"
    get:
      tags: [plugins]
      operationId: listPluginAccounts
      x-access: console-and-external
      summary: This plugin's accounts in the project; secret fields only show whether they are set
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Sorted by kind, then name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginAccountList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [plugins]
      operationId: createPluginAccount
      x-access: console-and-external
      summary: Adds an account
      description: The `kind` must be a kind declared in the manifest's `accounts`, and `values` and `secrets` are validated against that kind's `fields`. Returns 409 `name_conflict` when the kind does not support multiple accounts and already has one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginAccountCreate" }
      responses:
        "201":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginAccount" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /projects/{projectId}/plugins/{pluginId}/accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/PluginId"
      - $ref: "#/components/parameters/PluginAccountId"
    put:
      tags: [plugins]
      operationId: updatePluginAccount
      x-access: console-and-external
      summary: Updates the account's name and fields at the expected revision; omitted secrets are kept and null clears them; returns 412 when the revision differs
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginAccountUpdate" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginAccount" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [plugins]
      operationId: deletePluginAccount
      x-access: console-and-external
      summary: Deletes the account; references to it in Agent grants are removed as well, taking effect the next time Pi starts
      responses:
        "204":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{agentId}/plugins:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      tags: [plugins]
      operationId: listAgentPlugins
      x-access: console-and-external
      summary: For the plugins section of the Agent config page, whether each installed plugin can be granted to this Agent, whether it is granted, and the selected accounts
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Sorted by plugin id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentPluginList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{agentId}/commands:
    get:
      tags: [conversation]
      operationId: listAgentCommands
      x-access: console
      summary: Commands for the "/" menu on the conversation page (built-in platform commands and Pi commands)
      description: |
        First come the built-in platform commands (`source` is `platform`, in the fixed order session, new, compact,
        reload, copy, export, resume), each marked with whether it can be used right now given the Agent's runtime and
        session state (`available`, `unavailableReason`). Conditions that change at any moment, such as the Agent being
        busy, are not checked here; sending still returns 409 as usual. The console displays and completes them as
        `/<name>`; see `usage` for how to use them.
        Then come the extension commands, prompt templates and Skill commands read when the Agent last started Pi (Pi
        RPC `get_commands`; plugins/SPEC.md §14). The platform does not start Pi just to list commands: if Pi has never
        started, `capturedAt` is null and there are no Pi commands; after the granted plugins change, the list updates
        only at Pi's next start. The console displays and completes them as `/pi:<name>`.
        `console.command`, which plugins claim on the platform side, is a claim Hook with no command names to list,
        so it is not listed here.
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Command list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentCommandList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /agents/{agentId}/plugins/{pluginId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/PluginId"
    put:
      tags: [plugins]
      operationId: putAgentPlugin
      x-access: console-and-external
      summary: Grants or revokes a plugin and selects accounts; takes effect the next time Pi starts and does not interrupt the current turn
      description: |
        A project Agent can be granted only plugins its project has enabled, otherwise 409 `plugin_not_enabled`; a
        platform Agent is not limited by project enablement and has no accounts.
        `accountIds` must be undeleted accounts of this plugin in the project, otherwise 422 (field `accountIds`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentPluginUpdate" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The saved grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentPlugin" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
