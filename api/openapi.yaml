  /tasks/{taskId}/nodes/{nodeRunId}/queue:
    parameters:
      - { in: path, name: taskId, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: nodeRunId, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [tasks]
      operationId: getTaskNodeQueue
      x-access: console
      summary: 节点的排队列表，逐条消息，按服务端实际领取顺序
      description: |
        逐条列出该节点仍待处理的 Inbox 消息（kind=inbox）：控制台发给节点的消息，以及其他 Agent 发给该任务实例、由本节点处理的消息。
        只列未读、未取消、承载它的轮次仍在排队的消息；先按轮次的 priority、queue_seq，同一轮内按发送先后，与实际执行顺序一致。
        sleep 唤醒、飞书切换续行等不带消息的轮次不列出（它们按优先级插在中间执行）。
        变化时任务 SSE 推送 `task.node.queue.updated`（同一结构）；SSE 首次连接或重连收到 snapshot 后请重新读取本接口。
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 排队列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskNodeQueue" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/nodes/{nodeRunId}/inbox-messages/{messageId}/promote-to-interrupt:
    parameters:
      - { in: path, name: taskId, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: nodeRunId, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: messageId, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [tasks]
      operationId: promoteTaskNodeInboxMessage
      x-access: console
      summary: 把节点排队中的单条消息转为打断（任何发件人）
      description: |
        控制台发给节点的消息：从所在的普通优先级提醒轮次拆出，按发送打断时的合并规则（同节点、同执行模式、图片总数不超上限）并入已在排队的打断轮次，
        没有可并入的就新建一个；其他 Agent 发来的消息：移到该节点排队中的打断提醒（没有就新建）。都排在已有打断之后、全部普通排队之前；
        原轮次没有其他待处理消息即作废（TaskMessage.voidReason=merged_into_interrupt）。随后打断该节点当前的回复。
        actionId 幂等：同一 actionId 重放返回原响应，同一 actionId 不同内容返回 409 action_conflict。
        已经是打断时返回 status=already_interrupt，不重复打断。所在轮次已被领取、开始或结束时返回 409 task_conflict，
        reason=message_dispatched 并带 runId、runStatus；已读为 message_read，已取消为 message_cancelled，已失效为 message_not_executed。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskNodeQueueActionInput" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 动作结果；同一 actionId 重放返回首次结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskNodeQueueActionReceipt" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /tasks/{taskId}/nodes/{nodeRunId}/inbox-messages/{messageId}/cancel:
    parameters:
      - { in: path, name: taskId, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: nodeRunId, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: messageId, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [tasks]
      operationId: cancelTaskNodeInboxMessage
      x-access: console
      summary: 取消节点排队中的单条消息（任何发件人）
      description: |
        消息记 `cancelledAt`，不再计为未读，节点 Agent 不会处理（读取时只得到取消说明）；控制台发给节点的消息另记 notExecuted.reason=cancelled。
        带选项的问题同时变为 state=cancelled。所在轮次没有其他待处理消息即作废（TaskMessage.voidReason=user_cancelled）。
        回执的 item 带原文与图片引用，供“编辑”回填输入框。冲突与 actionId 规则同转为打断；已经取消时返回 status=already_cancelled。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskNodeQueueActionInput" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 动作结果；同一 actionId 重放返回首次结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskNodeQueueActionReceipt" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /tasks/{taskId}/nodes/{nodeRunId}/runs/{runId}/stop:
    parameters:
      - { in: path, name: taskId, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: nodeRunId, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [tasks]
      operationId: stopTaskNodeRun
      x-access: console
      summary: 只停止节点当前这一轮回复，不发送新消息
      description: |
        沿用节点打断路径，这一轮以 interrupted 结束、errorCode=user_stopped。节点还有排队项（任意优先级）时继续处理下一条；
        没有排队项时节点转为阻塞，原因“已被人停止”，之后可以继续给它发消息或重试。
        这一轮已结束时返回 409 task_conflict，reason=run_not_active 并带 runId、runStatus；已在停止或打断中时返回 status=already_stopping。
        actionId 规则同转为打断。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskNodeQueueActionInput" }
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 动作结果；同一 actionId 重放返回首次结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskNodeQueueActionReceipt" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

