        expectedAgentId: { type: string, format: uuid }
        expectedRuntimeId: { type: string, format: uuid }

    TaskNodeQueueActionReceipt:
      type: object
      additionalProperties: false
      required: [actionId, taskId, nodeRunId, agentId, runtimeId, operation, status, messageId, runId, item]
      properties:
        actionId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        nodeRunId: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        runtimeId: { type: string, format: uuid }
        operation:
          type: string
          enum: [promote_inbox_message, cancel_inbox_message, stop_run]
        status:
          type: string
          enum: [accepted, already_interrupt, already_cancelled, already_stopping]
        messageId:
          description: The message for message actions; null for stop
          type: [string, "null"]
          format: uuid
        runId:
          description: For promote to interrupt, the interrupt turn that now carries this message; for cancel, the turn that carried it; for stop, the turn that was stopped
          type: string
          format: uuid
        item:
          description: Content of the targeted queue item at the time of the action (on cancel, used to refill the input box for "Edit"); null for stop
          oneOf:
            - $ref: "#/components/schemas/QueueItem"
            - type: "null"

