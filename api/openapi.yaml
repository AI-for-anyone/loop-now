      properties:
        agentId: { type: string, format: uuid }
        scope: { $ref: "#/components/schemas/AgentScope" }
        projectId: { type: [string, "null"], format: uuid }

    UsageRow:
      description: 按（Agent、提供方、模型）分组的用量；provider 与 model 都为 null 表示未知模型
      type: object
      required: [agentId, agentName, agentDeleted, scope, projectId, provider, model, calls, input, output, cacheRead, cacheWrite, total]
      additionalProperties: false
      properties:
        agentId: { type: string, format: uuid }
        scope: { $ref: "#/components/schemas/AgentScope" }
        projectId:
          description: Agent 所属项目（项目可能已删除，此时 agentDeleted 为 true）；平台 Agent 为 null
          type: [string, "null"]
          format: uuid
        agentName: { type: string }
        agentDeleted: { type: boolean }
        provider: { type: [string, "null"] }
        model: { type: [string, "null"] }
        calls: { type: integer, minimum: 0 }
        input: { type: integer, minimum: 0 }
        output: { type: integer, minimum: 0 }
        cacheRead: { type: integer, minimum: 0 }
        cacheWrite: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }

    UsagePage:
      type: object
      required: [from, to, rows]
      additionalProperties: false
      properties:
        from: { type: [string, "null"], format: date-time }
        to: { type: [string, "null"], format: date-time }
        rows:
          type: array
          items: { $ref: "#/components/schemas/UsageRow" }

    AnomalyKind:
      description: run_failed 为失败（由 errorCode 区分原因），run_interrupted 为用户打断，server_restart 为服务端重启中断
      type: string
      enum: [run_failed, run_interrupted, server_restart]

    Anomaly:
      type: object
      required: [runId, kind, at, agentId, agentName, scope, projectId, errorCode, errorMessage, endReason]
      additionalProperties: false
      properties:
        runId: { type: string, format: uuid }
        scope: { $ref: "#/components/schemas/AgentScope" }
        projectId: { type: [string, "null"], format: uuid }
        kind: { $ref: "#/components/schemas/AnomalyKind" }
        at:
          description: 执行的结束时间
          type: string
          format: date-time
        agentId: { type: string, format: uuid }
        agentName: { type: string }
        errorCode:
          oneOf:
            - $ref: "#/components/schemas/RunErrorCode"
            - type: "null"
        errorMessage: { type: [string, "null"] }
        endReason: { $ref: "#/components/schemas/RunEndReason" }

    AnomalyPage:
      type: object
      required: [items, total, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Anomaly" }
        total:
          description: from 之后符合条件的总条数，与游标无关
          type: integer
          minimum: 0
        nextCursor:
          description: 下一页的游标；没有更多时为 null
          type: [string, "null"]

    StatsReport:
      description: |
        统计页报表。秒数为小数；比例为 0 到 1 的小数，分母为 0 时为 null。
        执行指常态执行（runs）与任务轮次（task_turns），只算真正派发过的；排队中被取消、合并或作废的不算。
      type: object
      required: [from, to, bucket, buckets, tokens, byOrigin, wakes, context, questions, wait, outcomes, agents, tools, process, concurrency]
      additionalProperties: false
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        bucket: { type: string, enum: [hour, day] }
        buckets:
          description: 每个桶的开始时间，按时间先后
          type: array
          items: { type: string, format: date-time }
        tokens: { $ref: "#/components/schemas/StatsTokens" }
        byOrigin: { $ref: "#/components/schemas/StatsOrigins" }
        wakes:
          description: 定时唤醒（sleep 到期）的执行，按 Agent 汇总，按 tokens 降序；没有唤醒的 Agent 不出现
          type: array
          items: { $ref: "#/components/schemas/StatsAgentWakes" }
        context: { $ref: "#/components/schemas/StatsContext" }
        questions: { $ref: "#/components/schemas/StatsQuestions" }
        wait: { $ref: "#/components/schemas/StatsWait" }
        outcomes: { $ref: "#/components/schemas/StatsOutcomes" }
        agents:
          description: Agent 体检，时间窗内有执行或用量的 Agent 各一行，按 tokens 降序
          type: array
          items: { $ref: "#/components/schemas/StatsAgentHealth" }
        tools: { $ref: "#/components/schemas/StatsTools" }
        process: { $ref: "#/components/schemas/StatsProcess" }
        concurrency:
          description: |
            服务端本地时间 0 点到 23 点，每个小时内同时在回复的执行数的平均值（时间窗内该小时的总回复时长 ÷ 该小时被观察到的总时长）。
            回复时长：常态执行从开始回复到结束，任务轮次从派发到结束（任务轮次不单独记录开始回复时间），未结束的算到现在。
            时间窗内该小时尚未到来（晚于现在）时为 null。
          type: array
          minItems: 24
          maxItems: 24
          items: { type: [number, "null"], minimum: 0 }

    StatsTokenCounts:
      type: object
      required: [input, output, cacheRead, cacheWrite, total]
      additionalProperties: false
      properties:
        input: { type: integer, minimum: 0 }
        output: { type: integer, minimum: 0 }
        cacheRead: { type: integer, minimum: 0 }
        cacheWrite: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }

    StatsTokens:
      description: 时间窗内的全部用量（含任务与回复之外的用量）
      type: object
      required: [totals, cacheHitRate, byModel, series]
      additionalProperties: false
      properties:
        totals: { $ref: "#/components/schemas/StatsTokenCounts" }
        cacheHitRate:
          description: cacheRead ÷ (input + cacheRead)
          type: [number, "null"]
          minimum: 0
          maximum: 1
        byModel:
          description: 按（提供方、模型）汇总，按 total 降序；provider 与 model 都为 null 表示未知模型
          type: array
          items: { $ref: "#/components/schemas/StatsModelTokens" }
        series:
          description: 每桶的 total
          type: array
          items: { type: integer, minimum: 0 }

    StatsModelTokens:
      type: object
      required: [provider, model, total]
      additionalProperties: false
      properties:
        provider: { type: [string, "null"] }
        model: { type: [string, "null"] }
        total: { type: integer, minimum: 0 }

    StatsOriginTokens:
      description: |
        按触发执行的来源分的 token。常态执行按 runs.origin：console（你发的消息）、inbox_reminder（Inbox 提醒）、sleep_wake（定时唤醒）；
        任务轮次按其 origin：console_node 计入 console，inbox_reminder 计入 inboxReminder，sleep_wake 计入 sleepWake，task_node 计入 task；
        不属于任何执行的用量（例如两轮之间的缓存预热）计入 other。五项之和等于 tokens.totals.total。
      type: object
      required: [console, inboxReminder, sleepWake, task, other]
      additionalProperties: false
      properties:
        console: { type: integer, minimum: 0 }
        inboxReminder: { type: integer, minimum: 0 }
        sleepWake: { type: integer, minimum: 0 }
        task: { type: integer, minimum: 0 }
        other: { type: integer, minimum: 0 }

    StatsOrigins:
      type: object
      required: [totals, unrequestedShare, series]
      additionalProperties: false
      properties:
        totals: { $ref: "#/components/schemas/StatsOriginTokens" }
        unrequestedShare:
          description: sleepWake ÷ 全部 token
          type: [number, "null"]
          minimum: 0
          maximum: 1
        series:
          description: 每桶各来源的 token
          type: array
          items: { $ref: "#/components/schemas/StatsOriginTokens" }

    StatsAgentWakes:
      type: object
      required: [agentId, name, projectId, count, tokens, avgTokens, avgIntervalSeconds]
      additionalProperties: false
      properties:
        agentId: { type: string, format: uuid }
        name: { type: string }
        projectId: { type: [string, "null"], format: uuid, description: 平台 Agent 为 null }
        count:
          description: 时间窗内排入的定时唤醒执行数（常态执行与任务轮次）
          type: integer
          minimum: 1
        tokens:
          description: 这些唤醒执行的全部用量
          type: integer
          minimum: 0
        avgTokens: { type: number, minimum: 0 }
        avgIntervalSeconds:
          description: 相邻两次唤醒的平均间隔（最后一次与第一次之差 ÷ (count − 1)）；只有一次时为 null
          type: [number, "null"]
          minimum: 0

    StatsContext:
      description: 每次模型调用送进去的上下文（input + cacheRead），只算 kind 为 assistant 的用量；压缩为 kind 为 compaction 的用量条数
      type: object
      required: [avgInputPerCall, compactions, series, agents]
      additionalProperties: false
      properties:
        avgInputPerCall: { type: [number, "null"], minimum: 0 }
        compactions: { type: integer, minimum: 0 }
        series:
          description: 每桶的 avgInputPerCall；该桶没有调用时为 null
          type: array
          items: { type: [number, "null"], minimum: 0 }
        agents:
          description: 时间窗内有模型调用的 Agent，按 avgInputPerCall 降序
          type: array
          items: { $ref: "#/components/schemas/StatsAgentContext" }

    StatsAgentContext:
      type: object
      required: [agentId, name, projectId, calls, avgInputPerCall, compactions]
      additionalProperties: false
      properties:
        agentId: { type: string, format: uuid }
        name: { type: string }
        projectId: { type: [string, "null"], format: uuid }
        calls: { type: integer, minimum: 1 }
        avgInputPerCall: { type: number, minimum: 0 }
        compactions: { type: integer, minimum: 0 }

    StatsQuestions:
      description: Agent（含任务实例）发给 `@console` 的问题
      type: object
      required: [asked, answered, avgAnswerSeconds, maxAnswerSeconds, series, pending]
      additionalProperties: false
      properties:
        asked:
          description: 时间窗内发出的问题数
          type: integer
          minimum: 0
        answered:
          description: 其中已被回答的数目
          type: integer
          minimum: 0
        avgAnswerSeconds:
          description: 已回答问题从发出到回答（answered_at）的平均秒数；没有时为 null
          type: [number, "null"]
          minimum: 0
        maxAnswerSeconds: { type: [number, "null"], minimum: 0 }
        series:
          description: 每桶发出的问题数
          type: array
          items: { type: integer, minimum: 0 }
        pending:
          description: 现在仍为 open 且未过期的问题，不受时间窗限制，先发出的在前
          type: array
          items: { $ref: "#/components/schemas/StatsPendingQuestion" }

    StatsPendingQuestion:
      type: object
      required: [messageId, agentId, name, projectId, text, askedAt]
      additionalProperties: false
      properties:
        messageId: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        name: { type: string }
        projectId: { type: [string, "null"], format: uuid }
        text:
          description: 问题正文的前 80 个字符
          type: string
          maxLength: 80
        askedAt: { type: string, format: date-time }

    StatsWait:
      description: |
        等待：你发的消息（origin 为 console 的常态执行）从排入到开始回复的秒数，含排在别的执行后面的时间。
        回复时长：执行从开始回复到结束的秒数（任务轮次从派发算起），含各种来源与结果。
      type: object
      required: [p50, p90, durationP50, series]
      additionalProperties: false
      properties:
        p50: { type: [number, "null"], minimum: 0 }
        p90: { type: [number, "null"], minimum: 0 }
        durationP50: { type: [number, "null"], minimum: 0 }
        series:
          type: array
          items: { $ref: "#/components/schemas/StatsWaitBucket" }

    StatsWaitBucket:
      type: object
      required: [p50, p90]
      additionalProperties: false
      properties:
        p50: { type: [number, "null"], minimum: 0 }
        p90: { type: [number, "null"], minimum: 0 }

    StatsOutcomeCounts:
      description: 已结束执行的结果；interrupted 含被打断与被停止
      type: object
      required: [completed, interrupted, failed]
      additionalProperties: false
      properties:
        completed: { type: integer, minimum: 0 }
        interrupted: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }

    StatsOutcomes:
      type: object
      required: [totals, series, reasons]
      additionalProperties: false
      properties:
        totals: { $ref: "#/components/schemas/StatsOutcomeCounts" }
        series:
          type: array
          items: { $ref: "#/components/schemas/StatsOutcomeCounts" }
        reasons:
          description: 没完成的原因，按 count 降序
          type: array
          items: { $ref: "#/components/schemas/StatsOutcomeReason" }

    StatsOutcomeReason:
      type: object
      required: [kind, code, count]
      additionalProperties: false
      properties:
        kind:
          description: stopped 为你按了停止；interrupted 为其他打断（新消息打断、服务重启等）；failed 为失败
          type: string
          enum: [interrupted, stopped, failed]
        code:
          description: 被打断或停止时为结束原因（常态执行的 endReason，任务轮次的 errorCode，停止为 user_stopped），失败时为 errorCode；没有记录时为 null
          type: [string, "null"]
        count: { type: integer, minimum: 1 }

    StatsAgentHealth:
      type: object
      required: [agentId, name, projectId, runs, completionRate, waitP90, durationP50, wakes, wakeTokens, avgContext, compactions, tokens, cacheHitRate]
      additionalProperties: false
      properties:
        agentId: { type: string, format: uuid }
        name: { type: string }
        projectId: { type: [string, "null"], format: uuid }
        runs:
          description: 已结束的执行数（同 outcomes）
          type: integer
          minimum: 0
        completionRate: { type: [number, "null"], minimum: 0, maximum: 1 }
        waitP90: { type: [number, "null"], minimum: 0, description: "同 wait.p90，只算该 Agent" }
        durationP50: { type: [number, "null"], minimum: 0 }
        wakes: { type: integer, minimum: 0 }
        wakeTokens: { type: integer, minimum: 0 }
        avgContext: { type: [number, "null"], minimum: 0, description: "同 context.agents[].avgInputPerCall" }
        compactions: { type: integer, minimum: 0 }
        tokens: { type: integer, minimum: 0 }
        cacheHitRate: { type: [number, "null"], minimum: 0, maximum: 1 }

    StatsTools:
      description: 常态执行的工具调用（任务轮次不记录工具调用）；按时间窗内排入并开始回复的执行统计
      type: object
      required: [byName, callsPerRunAvg, callsPerRunMax]
      additionalProperties: false
      properties:
        byName:
          description: 按工具名汇总，按 calls 降序
          type: array
          items: { $ref: "#/components/schemas/StatsTool" }
        callsPerRunAvg:
          description: 每次执行的平均调用数（含没有调用的执行）；没有执行时为 null
          type: [number, "null"]
          minimum: 0
        callsPerRunMax: { type: [integer, "null"], minimum: 0 }

    StatsTool:
      type: object
      required: [name, calls, failures]
      additionalProperties: false
      properties:
        name: { type: string }
        calls: { type: integer, minimum: 0 }
        failures: { type: integer, minimum: 0 }

    StatsProcess:
      description: 时间窗内的运行记录事件（常态与任务）
      type: object
      required: [modelRetries, piExits, piColdStarts, piColdStartAvgMs]
      additionalProperties: false
      properties:
        modelRetries:
          description: 模型请求重试次数（model.retry_started）
          type: integer
          minimum: 0
        piExits:
          description: Pi 进程异常结束次数：意外退出（pi.exited）加打断超时被强制停止（pi.stopped，原因 abort_timeout）
          type: integer
          minimum: 0
        piColdStarts:
          description: Pi 进程启动次数（pi.started）
          type: integer
          minimum: 0
        piColdStartAvgMs: { type: [number, "null"], minimum: 0 }

    RunTimeline:
      type: object
      required: [run, entries, usage]
      additionalProperties: false
      properties:
        run: { $ref: "#/components/schemas/Run" }
        entries:
          description: 按时间排序
          type: array
          items: { $ref: "#/components/schemas/TimelineEntry" }
        usage: { $ref: "#/components/schemas/UsageTotals" }

    TimelineEntry:
      oneOf:
        - $ref: "#/components/schemas/TimelineSleepEntry"
        - $ref: "#/components/schemas/TimelineQueued"
        - $ref: "#/components/schemas/TimelinePromoted"
        - $ref: "#/components/schemas/TimelineMessageCancelled"
        - $ref: "#/components/schemas/TimelineMarker"
        - $ref: "#/components/schemas/TimelinePhase"
        - $ref: "#/components/schemas/TimelineCliInstall"
        - $ref: "#/components/schemas/TimelineWorkspaceSync"
        - $ref: "#/components/schemas/TimelinePiStarted"
        - $ref: "#/components/schemas/TimelinePiReused"
        - $ref: "#/components/schemas/TimelinePiStopped"
        - $ref: "#/components/schemas/TimelinePiExited"
        - $ref: "#/components/schemas/TimelineTool"
        - $ref: "#/components/schemas/TimelineModelCall"
        - $ref: "#/components/schemas/TimelineModelRetryStarted"
        - $ref: "#/components/schemas/TimelineModelRetryEnded"
        - $ref: "#/components/schemas/TimelineCompaction"
        - $ref: "#/components/schemas/TimelineAbortRequested"
        - $ref: "#/components/schemas/TimelineEnded"
        - $ref: "#/components/schemas/TimelineSessionMissing"
        - $ref: "#/components/schemas/TimelineExtensionUI"
      discriminator:
        propertyName: type
        mapping:
          queued: "#/components/schemas/TimelineQueued"
          promoted: "#/components/schemas/TimelinePromoted"
          message_cancelled: "#/components/schemas/TimelineMessageCancelled"
          dispatched: "#/components/schemas/TimelineMarker"
          running: "#/components/schemas/TimelineMarker"
          phase: "#/components/schemas/TimelinePhase"
          cli_install: "#/components/schemas/TimelineCliInstall"
          workspace_sync: "#/components/schemas/TimelineWorkspaceSync"
          pi_started: "#/components/schemas/TimelinePiStarted"
          pi_reused: "#/components/schemas/TimelinePiReused"
          pi_stopped: "#/components/schemas/TimelinePiStopped"
          pi_exited: "#/components/schemas/TimelinePiExited"
          tool: "#/components/schemas/TimelineTool"
          model_call: "#/components/schemas/TimelineModelCall"
          model_retry_started: "#/components/schemas/TimelineModelRetryStarted"
          model_retry_ended: "#/components/schemas/TimelineModelRetryEnded"
          compaction: "#/components/schemas/TimelineCompaction"
          abort_requested: "#/components/schemas/TimelineAbortRequested"
          ended: "#/components/schemas/TimelineEnded"
          session_missing: "#/components/schemas/TimelineSessionMissing"
          sleep: "#/components/schemas/TimelineSleepEntry"
          extension_ui: "#/components/schemas/TimelineExtensionUI"

    TimelineExtensionUI:
      description: |
        Agent 半边的扩展经 ctx.ui 发来的请求（Pi RPC 的 extension_ui_request）。notify 是通知（level 为 info、warning、error），
        setStatus 设置或清除一条状态（message 为空时清除）。select、confirm、input、editor 是对话，message 为对话标题：
        常态 Agent 一轮之中的 confirm、select、input 成为这个 Agent 发给控制台的提问（questionId，期限为请求的超时，没有时 30 分钟），
        回答后交还给扩展，这条记录在对话结束时写入，answered 为 answered（有人回答）、cancelled（回答为取消）或 expired（到期或这一轮结束，
        扩展收到取消）；editor、任务轮次与无法提问的对话立即按取消回应（answered 为 cancelled，questionId 为 null）。
      type: object
      required: [type, at, method, message, level, statusKey, answered, questionId]
      additionalProperties: false
      properties:
        type: { type: string, enum: [extension_ui] }
        at: { type: string, format: date-time }
        method: { type: string, enum: [notify, setStatus, select, confirm, input, editor] }
        message: { type: [string, "null"] }
        level: { type: [string, "null"], enum: [info, warning, error, null] }
        statusKey: { type: [string, "null"] }
        answered: { type: [string, "null"], enum: [answered, cancelled, expired, null] }
        questionId: { description: 对话对应的控制台提问（Inbox 消息 ID）, type: [string, "null"], format: uuid }

    TimelineSleepEntry:
      description: sleep 登记、生效、提前结束、到期安排或失效的持久记录；不包含内部调度字段
      type: object
      additionalProperties: false
      required: [type, at, sleep]
      properties:
        type: { type: string, enum: [sleep] }
        at: { type: string, format: date-time }
        sleep: { $ref: "#/components/schemas/SleepRecord" }

    TimelineQueued:
      description: 入队：发送时 Agent 正忙
      type: object
      required: [type, at, whenBusy]
      additionalProperties: false
      properties:
        type: { type: string, enum: [queued] }
        at: { type: string, format: date-time }
        whenBusy: { $ref: "#/components/schemas/WhenBusy" }

    TimelinePromoted:
      description: 排队中的消息改变了排队方式（目前只有普通排队转为打断）；之前的 queued 条目保留原值。Inbox 消息逐条转换时记在接收它的打断提醒上，并带 messageId
      type: object
      required: [type, at, from, to]
      additionalProperties: false
      properties:
        type: { type: string, enum: [promoted] }
        at: { type: string, format: date-time }
        from: { $ref: "#/components/schemas/WhenBusy" }
        to: { $ref: "#/components/schemas/WhenBusy" }
        messageId:
          description: 逐条转换的 Inbox 消息；控制台执行整条转换时省略
          type: string
          format: uuid

    TimelineMessageCancelled:
      description: 这一执行承载的一条 Inbox 消息被人取消；执行本身若因此作废另有 ended 条目
      type: object
      required: [type, at, messageId]
      additionalProperties: false
      properties:
        type: { type: string, enum: [message_cancelled] }
        at: { type: string, format: date-time }
        messageId: { type: string, format: uuid }
    TimelineMarker:
      description: dispatched 为派发（离开队列、开始处理），running 为进入回复（消息已交给 Pi）
      type: object
      required: [type, at]
      additionalProperties: false
      properties:
        type: { type: string, enum: [dispatched, running] }
        at: { type: string, format: date-time }

    TimelinePhase:
      description: 启动阶段开始
      type: object
      required: [type, at, phase]
      additionalProperties: false
      properties:
        type: { type: string, enum: [phase] }
        at: { type: string, format: date-time }
        phase: { type: string, enum: [waiting_slot, preparing, launching] }

    TimelineCliInstall:
      description: 一次实际进行的 CLI 安装；已安装、无需安装时没有这一条
      type: object
      required: [type, at, cli, version, result, durationMs, error]
      additionalProperties: false
      properties:
        type: { type: string, enum: [cli_install] }
        at: { type: string, format: date-time }
        cli: { type: string }
        version: { type: string }
        result: { type: string, enum: [succeeded, failed] }
        durationMs: { type: integer, minimum: 0 }
        error: { type: [string, "null"] }

    TimelineSyncSource:
      type: object
      required: [path, kind, outcome, filesWritten, filesDeleted, error]
      additionalProperties: false
      properties:
        path: { type: string }
        kind: { $ref: "#/components/schemas/FolderSourceKind" }
        outcome:
          description: cloned 为新克隆，kept 为已存在的仓库保持不动，files_synced 为资料已同步，failed 为失败
          type: string
          enum: [cloned, kept, files_synced, failed]
        filesWritten:
          description: 仅资料来源：写入磁盘的文件数
          type: [integer, "null"]
        filesDeleted:
          description: 仅资料来源：从磁盘删除的文件数
          type: [integer, "null"]
        error: { type: [string, "null"] }

    TimelineWorkspaceSync:
      description: 准备运行环境时的配置同步（Skills、Prompt、凭证文件与文件夹来源）
      type: object
      required: [type, at, result, durationMs, error, sources]
      additionalProperties: false
      properties:
        type: { type: string, enum: [workspace_sync] }
        at: { type: string, format: date-time }
        result: { type: string, enum: [succeeded, failed] }
        durationMs: { type: integer, minimum: 0 }
        error: { type: [string, "null"] }
        sources:
          type: array
          items: { $ref: "#/components/schemas/TimelineSyncSource" }

    TimelinePiStarted:
      description: 新启动了 Pi 进程
      type: object
      required: [type, at, pid, startupMs, reason, configVersion]
      additionalProperties: false
      properties:
        type: { type: string, enum: [pi_started] }
        at: { type: string, format: date-time }
        pid: { type: integer }
        startupMs:
          description: 从启动进程到 Pi 就绪的用时
          type: integer
          minimum: 0
        reason:
          description: no_process 为没有存活的进程，config_changed 为配置变化后重启
          type: string
          enum: [no_process, config_changed]
        configVersion: { type: integer }

    TimelinePiReused:
      description: 复用了已运行的 Pi 进程
      type: object
      required: [type, at, pid, processStartedAt]
      additionalProperties: false
      properties:
        type: { type: string, enum: [pi_reused] }
        at: { type: string, format: date-time }
        pid: { type: integer }
        processStartedAt: { type: [string, "null"], format: date-time }

    TimelinePiStopped:
      description: 平台停止了 Pi 进程
      type: object
      required: [type, at, pid, reason, uptimeMs]
      additionalProperties: false
      properties:
        type: { type: string, enum: [pi_stopped] }
        at: { type: string, format: date-time }
        pid: { type: integer }
        reason: { type: string, enum: [idle_timeout, config_changed, evicted, released, fork_snapshot, shutdown, abort_timeout] }
        uptimeMs: { type: integer, minimum: 0 }

    TimelinePiExited:
      description: Pi 进程意外退出
      type: object
      required: [type, at, pid, uptimeMs, exit, stderrTail]
      additionalProperties: false
      properties:
        type: { type: string, enum: [pi_exited] }
        at: { type: string, format: date-time }
        pid: { type: integer }
        uptimeMs: { type: integer, minimum: 0 }
        exit: { type: string }
        stderrTail:
          description: Pi 错误输出的末尾片段（有长度上限）
          type: string

    TimelineTool:
      description: 一次工具调用，at 为开始时间；仅 bash 可含有界、脱敏后的 command；不含其他参数与输出
      type: object
      required: [type, at, toolCallId, toolName, state, endedAt, durationMs]
      additionalProperties: false
      properties:
        type: { type: string, enum: [tool] }
        at: { type: string, format: date-time }
        toolCallId: { type: string }
        toolName: { type: string }
        command:
          description: 实际 bash 命令的安全显示文本，最多4096字符；敏感命令隐藏，旧记录及其他工具省略。
          type: string
          maxLength: 4096
        state: { $ref: "#/components/schemas/ToolState" }
        endedAt: { type: [string, "null"], format: date-time }
        durationMs: { type: [integer, "null"] }

    TimelineModelCall:
      description: 一次用量：模型调用（assistant）、工具自身（tool）、上下文压缩（compaction）、缓存预热（cache_warm）或其他（other）
      type: object
      required: [type, at, kind, provider, model, responseModel, stopReason, input, output, cacheRead, cacheWrite, reasoning, total, durationMs]
      additionalProperties: false
      properties:
        type: { type: string, enum: [model_call] }
        at: { type: string, format: date-time }
        kind: { type: string, enum: [assistant, tool, compaction, cache_warm, other] }
        provider: { type: [string, "null"] }
        model: { type: [string, "null"] }
        responseModel:
          description: 提供方返回的实际模型名
          type: [string, "null"]
        stopReason: { type: [string, "null"] }
        input: { type: integer, minimum: 0 }
        output: { type: integer, minimum: 0 }
        cacheRead: { type: integer, minimum: 0 }
        cacheWrite: { type: integer, minimum: 0 }
        reasoning:
          description: 推理 token，是 output 的一部分
          type: [integer, "null"]
        total: { type: integer, minimum: 0 }
        durationMs: { type: [integer, "null"] }

    TimelineModelRetryStarted:
      type: object
      required: [type, at, attempt, maxAttempts, delayMs, errorMessage]
      additionalProperties: false
      properties:
        type: { type: string, enum: [model_retry_started] }
        at: { type: string, format: date-time }
        attempt: { type: integer }
        maxAttempts: { type: integer }
        delayMs: { type: integer }
        errorMessage: { type: string }

    TimelineModelRetryEnded:
      type: object
      required: [type, at, success, attempt, finalError]
      additionalProperties: false
      properties:
        type: { type: string, enum: [model_retry_ended] }
        at: { type: string, format: date-time }
        success: { type: boolean }
        attempt: { type: integer }
        finalError: { type: [string, "null"] }

    TimelineCompaction:
      type: object
      required: [type, at, reason, result, tokensBefore, estimatedTokensAfter, errorMessage, durationMs]
      additionalProperties: false
      properties:
        type: { type: string, enum: [compaction] }
        at: { type: string, format: date-time }
        reason: { type: string }
        result: { type: string, enum: [succeeded, failed, aborted] }
        tokensBefore: { type: [integer, "null"] }
        estimatedTokensAfter: { type: [integer, "null"] }
        errorMessage: { type: [string, "null"] }
        durationMs: { type: [integer, "null"] }

    TimelineAbortRequested:
      description: 发起打断或停止
      type: object
      required: [type, at, byRunId]
      additionalProperties: false
      properties:
        type: { type: string, enum: [abort_requested] }
        at: { type: string, format: date-time }
        byRunId:
          description: 引发打断的那条消息所属的执行；被人停止或本变更之前的执行为 null
          type: [string, "null"]
          format: uuid
        stop:
          description: 为 true 表示被人停止（不发送新消息）
          type: boolean

    TimelineEnded:
      type: object
      required: [type, at, status, endReason, errorCode]
      additionalProperties: false
      properties:
        type: { type: string, enum: [ended] }
        at: { type: string, format: date-time }
        status: { type: string, enum: [completed, failed, interrupted] }
        endReason: { $ref: "#/components/schemas/RunEndReason" }
        errorCode:
          oneOf:
            - $ref: "#/components/schemas/RunErrorCode"
            - type: "null"

    TimelineSessionMissing:
      type: object
      required: [type, at, sessionFile]
      additionalProperties: false
      properties:
        type: { type: string, enum: [session_missing] }
        at: { type: string, format: date-time }
        sessionFile: { type: [string, "null"] }

    PrincipalKind:
      description: 身份类别：console 为控制台操作者，external 为外部身份，agent 为 Agent
      type: string
      enum: [console, external, agent]

    Whoami:
      type: object
      required:
        - kind
        - address
        - name
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/PrincipalKind'
        address:
          description: 当前身份的地址：`@console`、`@<外部身份名>`，或 Agent 的地址（写法同 `Agent.address`；名称不满足命名规则时为 null）
          type:
            - string
            - 'null'
        name:
          description: 显示名称：控制台操作者为“控制台”，外部身份为其名称，Agent 为 Agent 名
          type: string
        taskId:
          type:
            - string
            - 'null'
          format: uuid
          description: 任务实例绑定；常态Agent与人员身份为空或不返回
        runtimeId:
          type:
            - string
            - 'null'
          format: uuid
          description: 任务运行实例ID；不授予额外权限
    InboxParticipant:
      description: |
        消息的一方。
        - `address`：控制台操作者为 `@console`，外部身份为 `@<名称>`，Agent 的写法同 `Agent.address`。参与方已删除时仍给出原地址（外部身份的名称释放后可能被新身份使用，以 `deleted` 区分）；名称不满足命名规则的 Agent 为 null。
        - `name`：显示名称：控制台操作者为“控制台”，外部身份为其名称，Agent 为 Agent 名；已删除时为“已删除身份”或“已删除 Agent”。
        - `deleted`：外部身份已删除，或 Agent 已删除（含随项目删除）。
        - `id`：Agent ID 或外部身份 ID，控制台操作者与插件为 null。地址不唯一或为 null 时，用它定位到具体的 Agent 或外部身份。
        - `plugin`：插件经插件令牌以 inbox.send 发来的消息（plugins/SPEC.md §11），在对话里像外部身份一样显示：`pluginId` 为插件 id，
          `channelId` 为插件里的渠道（没有时为 null），`address` 为 `plugin:<插件 id>` 或 `plugin:<插件 id>/<渠道>`，`name` 为插件给出的发件名称；
          插件已卸载时 `deleted` 为 true。其他参与方的 `pluginId` 与 `channelId` 为 null。
      type: object
      required: [kind, id, address, name, deleted, pluginId, channelId]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [console, external, agent, platform, plugin]}
        id: { type: [string, "null"], format: uuid }
        address: { type: [string, "null"] }
        name: { type: string }
        deleted: { type: boolean }
        pluginId: { type: [string, "null"] }
        channelId: { type: [string, "null"] }

    InboxTaskRef:
      description: |
        消息所属的任务实例，由消息两端的任务实例记录得出，不解析地址文字：发件方是任务实例时取发件方，否则取收件方；两端都不是任务实例时整个字段为 null。
      type: object
      required: [taskId, nodeRunId, runtimeId]
      additionalProperties: false
      properties:
        taskId: { type: string, format: uuid }
        nodeRunId:
          description: |
            消息归属的节点运行，按顺序取第一个能确定的：
            - 严格节点消息：绑定的节点；
            - 任务实例提出的问题，以及回复该问题的消息：问题绑定的节点；
            - 发给任务实例的其他消息：承载它的提醒轮次所属节点；
            - 否则：该任务实例在消息时间或之前最近一次开始的轮次所属节点。
            都无法确定时为 null。
          type: [string, "null"]
          format: uuid
        runtimeId:
          description: 任务实例（运行实例）ID
          type: string
          format: uuid

