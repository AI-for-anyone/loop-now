openapi: 3.1.0
info:
  title: Loop Now Console API
  version: 0.1.0
  description: |
    The interface contract the Loop Now server provides to the web console, maintained by the server (change
    add-server-first-loop).
    The console generates its types from it; the server uses contract tests to keep its actual behavior consistent with
    this file.

    Conventions:
    - All JSON fields use camelCase; times are RFC 3339 strings; IDs are UUIDs.
    - Error responses always use the `Error` structure.
    - Every response carries the `Loop-Now-Request-Id` header (the ID of this request) and the `Loop-Now-Version` header
      (the server version).
    - For the SSE event streams see `GET /agents/{agentId}/events` and `GET /overview/events`; the data structure of each
      event is given in the operation's own `x-sse-events`.
    - Observability (change add-observability): the run record timeline, usage statistics (tokens only, no costs), the
      anomaly list and the overview event stream.
    - Inbox and external access (change add-inbox-and-external-access): the Inbox between Agents, the console operator and
      external identities; management of external identities and tokens; finding an Agent by address.
    - Access scope: every operation carries `x-access`. `console` is limited to the console; `console-and-external` is also
      open to external identities.
      - Console: `/api/v1` on the loopback listener, no login; a request with an `Authorization` header (for example with an
        `lna_` or `lne_` token) returns 403 `forbidden`;
      - External identities: the same `/api/v1` on the external port (TLS); `Authorization: Bearer lne_…` is required, a
        missing or invalid token returns 401 `unauthenticated`, and calling an operation with `x-access: console` returns
        403 `forbidden`;
      - The external port also serves loopctl downloads (not in this file): `GET /downloads/loopctl/manifest.json`,
        `GET /downloads/loopctl/SHA256SUMS` and `GET /downloads/loopctl/{file}`; they also require an external token, and
        responses carry `X-Content-SHA256`.
      - Agent-only endpoints are in `api/agent-openapi.yaml`.
      - Plugin tokens (plugins v2, plugins/SPEC.md §5): a plugin's platform side calls `/api/v1` on the loopback
        listener with `Authorization: Bearer lnp_…`.
        It may only call operations marked with `x-plugin-scope` whose scope is in the token, otherwise 403 `forbidden`; the
        projects, Agents and tasks in the path must belong to a project that has enabled the plugin (platform Agents and the
        global context folder excepted), otherwise 403.
        The plugin host protocol is in `api/plugin-host-protocol.md`.
        When a plugin token calls "My Inbox" (listInboxMessages, readInboxMessage, threads), the current identity is the
        plugin, and it reads the messages sent to it (Agents' replies to it);
        a message sent with inbox.send has the sender plugin (plugins/SPEC.md §11) and can only be sent to a platform
        Agent or to an Agent in a project that has enabled the plugin.
      - Plugin HTTP entry (not one of the operations in this file): a plugin whose manifest has `http: true` gets a
        token-free `/hooks/<plugin id>/<any path>` on the external port (TLS),
        and `/api/v1/plugins/<plugin id>/http/<any path>` on the loopback listener (for the console, or with the plugin's own
        plugin token). The method, path, query, headers and body (at most 1 MiB, larger returns 413)
        are handed to the platform side as-is, and its response within 30 seconds is returned as-is (timeout returns 504
        plugin_timeout); the plugin verifies signatures itself; at most 20 requests per second per plugin, more returns 429.
        Returns 404 when the plugin does not exist, has no HTTP entry or is not loaded in the plugin host.
    - Project layer (change add-project-layer): project management and the Manager; an Agent belongs to a project or to the
      platform, and listing and creating are scoped (`/projects/{projectId}/agents`, `/platform/agents`), while a single
      Agent is still accessed by ID; overview, usage and anomalies can be filtered by `projectId` or `platform`.
servers:
  - url: http://127.0.0.1:8780/api/v1
    description: Default local development address (console)
  - url: https://{externalHost}/api/v1
    description: External port (when enabled); accepts external tokens only
    variables:
      externalHost:
        default: 127.0.0.1:8781
tags:
  - name: context
  - name: models
  - name: cli-templates
  - name: projects
  - name: agents
  - name: folders
  - name: credentials
  - name: skills
  - name: agent-skills
  - name: conversation
  - name: observability
  - name: inbox
  - name: external-identities
  - name: plugins
  - name: local-mode
  - name: text-generation
  - name: path-picks

