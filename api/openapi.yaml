  "/projects/{projectId}/credential-accounts/{accountId}/credential":
    put:
      tags:
      - credentials
      operationId: replaceProjectCredentialAccount
      x-access: console-and-external
      description: Replaces the whole secret and creates a new version; purpose/provider/cli/name cannot be changed through
        this call.
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
