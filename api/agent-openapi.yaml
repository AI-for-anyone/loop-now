    ErrorCode:
      {
        "description": "- not_found：资源不存在（404）
- validation_failed：校验失败（422）
- precondition_failed：请求前置版本条件不一致（If-Match 或 Prompt 编辑版本，412）
- payload_too_large：超过大小上限（413）
- agent_busy：Agent 正忙且未选择打断或排队（409）
- agent_not_idle：需要 Agent 空闲的操作（删除 Agent、删除项目、重开会话）在忙时被拒绝（409）
- session_missing：Agent 处于会话丢失状态，需要先确认重开会话（409）
- template_deleted：来源模板已删除，不能重新复制（409）
- name_conflict：名称重复（409）：项目内或平台内 Agent 重名、项目重名、Skill 名称重复或使用了内置 Skill 的名称 `loopctl`、外部身份重名
- path_conflict：文件夹来源子目录重复或互相包含（409）
- forbidden_origin：Origin 不在白名单（403）
- invalid_host：Host 不在允许名单（403）
- unauthenticated：令牌缺失、无效、过期或已吊销，或所属身份已删除（401）
- forbidden：身份有效，但不允许这个操作（403）
- sleep_conflict：运行过期、动作内容冲突、已提交节点或已有不同有效 sleep（409）
- run_not_queued：转为打断、撤回或取消的排队项已不在队列：执行已被领取、开始或结束，或消息已读、已取消（409）
- run_not_active：停止回复时，这一次执行已经结束（409）
- action_conflict：同一 actionId 被用于不同内容的动作（409）
- plugin_source_failed：插件来源无法获取，或依赖安装失败（422）
- plugin_confirmation_required：非官方来源的插件安装或更新须确认（409）
- plugin_version_conflict：同一插件已装同版本号但内容不同（409）
- plugin_not_enabled：插件没有在项目里启用，或全局停用（409）
- plugin_blocked：插件的拦截类 Hook 阻止了这个操作，message 带插件 id 与原因（409）
- plugin_failed：插件处理请求时报错，message 带插件给出的原因（502）
- plugin_timeout：插件没有在时限内回应（504）
- internal_error：服务端内部错误（500）
",
