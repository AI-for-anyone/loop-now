    ToolState:
      type: string
      enum: [started, succeeded, failed]
    RunEndReason:
      description: |
        Why a run was interrupted, or why a queued run that was not yet picked up became void:
        - user_interrupt: interrupted by a new message; user_stopped: stopped by a person (stops only this one reply);
          server_restart: the server restarted.
        - sleep_superseded: the sleep timer was taken over by real work; sleep_invalidated: the lifecycle it belongs to
          became invalid.
        - user_cancelled: withdrawn or cancelled by a person while queued; merged_into_interrupt: all of its messages
          were moved into an interrupt reminder; no_pending_messages: all messages the reminder carried were already
          read or cancelled.
        None of the last five ran any tool or model; the conversation stream should hide user_cancelled,
        merged_into_interrupt and no_pending_messages.
      type: [string, "null"]
      enum: [user_interrupt, user_stopped, server_restart, sleep_superseded, sleep_invalidated, user_cancelled, merged_into_interrupt, no_pending_messages, null]
    RunErrorCode: {"description":"- credential_unavailable: the credential is unavailable (it must be entered again, or it has become invalid)\n- cli_install_failed: installing the CLI failed\n- workspace_sync_failed: syncing the workspace failed (such as a failed clone)\n- session_missing: the session file is missing\n- pi_start_failed: Pi failed to start or timed out while starting\n- pi_exited: the Pi process exited unexpectedly\n- pi_error: Pi reported that this turn ended with an error\n- internal_error: internal server error (such as the database being temporarily unavailable); this reply could not run\n- plugin_blocked: a plugin rejected this turn's operation, or the run conditions changed\n- image_unsupported: the model actually used for this turn does not support images; the turn neither sent the images nor switched models\n- runtime_unavailable: the Claude Code runtime is not available on this computer (claude is not on the login shell's PATH, or its version cannot be read)\n- runtime_login_required: Claude Code on this computer is not logged in; the user must log in on this computer and try again\n- runtime_start_failed: Claude Code exited before the first turn started, or timed out while starting (the message includes the version and the tail of the error output)\n- runtime_exited: the Claude Code process exited unexpectedly during this turn\n- runtime_error: Claude Code reported that this turn ended with an error (such as the usage limit being used up)\n","type":"string","enum":["credential_unavailable","cli_install_failed","workspace_sync_failed","session_missing","pi_start_failed","pi_exited","pi_error","internal_error","plugin_blocked","image_unsupported","runtime_unavailable","runtime_login_required","runtime_start_failed","runtime_exited","runtime_error"]}
    RunStatus:
      type: string
      enum: [queued, starting, running, aborting, completed, failed, interrupted]
    InboxUnreadTotal:
