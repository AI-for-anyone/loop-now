              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
