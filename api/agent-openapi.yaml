      summary: "Platform Agents only: discovers undeleted projects and their current Managers"
      description: |
        Authorization is based on what the current actual Agent belongs to; a project Agent (including a Manager) gets
        403.
        Only a safe directory: the full addresses are for use with the existing Inbox; it grants no access to project
        content and no management permissions.
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The current directory, in a stable order by organization name/ID, then project name/ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformProjectDirectory" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500":
          description: Server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /inbox/threads/{threadId}/read:
    {
      "parameters": [
        {
          "$ref": "#/components/parameters/ThreadId"
        }
      ],
      "post": {
        "operationId": "readInboxThread",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/InboxUnreadTotal"
                }
              }
            },
            "description": "The current identity's latest unread total",
            "headers": {
              "Loop-Now-Request-Id": {
                "$ref": "#/components/headers/RequestId"
              },
              "Loop-Now-Version": {
                "$ref": "#/components/headers/Version"
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          }
        },
        "summary": "Marks every message in the thread that was sent to the current identity as read",
        "tags": [
          "inbox"
        ],
        "x-access": "console-and-external",
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/InboxReadInput"
              }
            }
          }
        },
        "description": "An Agent on a strict task Inbox must give the runId of the run it actually belongs to; the ordinary legacy Inbox may omit it. A stale or cross-node runId is not redirected, and the current run is not inferred."
      }
    }
  /inbox/threads/{threadId}:
    {
      "get": {
        "operationId": "getInboxThread",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/InboxThread"
                }
              }
            },
            "description": "The thread",
            "headers": {
              "Loop-Now-Request-Id": {
                "$ref": "#/components/headers/RequestId"
              },
              "Loop-Now-Version": {
                "$ref": "#/components/headers/Version"
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          }
        },
        "summary": "All messages in the thread, oldest first; does not change read state",
        "tags": [
          "inbox"
        ],
        "x-access": "console-and-external",
        "parameters": [
          {
            "in": "query",
            "name": "runId",
            "required": false,
            "schema": {
              "type": "string",
              "format": "uuid",
              "not": {
                "const": "00000000-0000-0000-0000-000000000000"
              }
            }
          }
        ],
        "description": "An Agent on a strict task Inbox must give the runId of the run it actually belongs to; the ordinary legacy Inbox may omit it. A stale or cross-node runId is not redirected, and the current run is not inferred."
      },
      "parameters": [
        {
          "$ref": "#/components/parameters/ThreadId"
        }
      ]
    }
components:
  headers:
    RequestId:
      description: Unique ID of this request (UUIDv7), the same as requestId in the server logs; the console shows it on errors
      required: true
      schema: { type: string, format: uuid }
    Version:
      description: Server version (from the version package shared with loopctl), which loopctl compares against its own; for cross-origin access it is listed in `Access-Control-Expose-Headers` together with `Loop-Now-Request-Id` and `ETag`
      required: true
      schema: { type: string, minLength: 1 }

  parameters:
    ThreadId:
      {
        "in": "path",
        "name": "threadId",
        "required": true,
        "schema": {
          "format": "uuid",
          "type": "string"
        }
      }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InboxUnread:
      name: unread
      in: query
      required: false
      description: When true, lists only unread messages (no read time); by default both read and unread messages are included
      schema: { type: boolean, default: false }
    PageCursor:
      name: cursor
      in: query
      required: false
      description: The nextCursor returned by the previous page; an opaque string, and an invalid one returns 422
      schema: { type: string, minLength: 1 }
    PageLimit:
      name: limit
      in: query
      required: false
      description: Items per page, default 20; a value over the server limit (default 100, configurable) is capped at that limit
      schema: { type: integer, minimum: 1, default: 20 }

  responses:
    Conflict:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: |
        Conflicts with the current state. `error.code` values:
        `agent_busy` (details is AgentBusyDetails), `agent_not_idle` (details is ProjectNotIdleDetails when deleting a
        project, otherwise no details), `session_missing`, `template_deleted`, `name_conflict`, `path_conflict`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: The Agent token is missing, invalid or has been invalidated (`unauthenticated`); the error message never echoes the token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: |
        `error.code` values:
        - `forbidden`: a cross-organization send was rejected;
        - `forbidden_origin`: the request carries an `Origin` header.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: The message, thread or recipient does not exist, or does not belong to the current Agent
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: Validation failed, with field-level errors where possible
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: The message text exceeds the byte limit for Inbox messages
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    CodexServiceTier:
      description: Codex request speed tier; default is Standard, priority is Fast, ultrafast is Ultrafast. The vendor decides account and model eligibility; the tier is never silently downgraded.
      type: string
      enum: [default, priority, ultrafast]

    ThinkingLevel:
      type: string
      enum: [off, minimal, low, medium, high, xhigh, max]

    TimelineExtensionUI:
      description: |
        A request from an agent-side extension through ctx.ui (extension_ui_request in Pi RPC). notify is a notification
        (level info, warning or error); setStatus sets or clears a status (cleared when message is empty). select,
        confirm, input and editor are dialogs, and message is the dialog title: a confirm, select or input during a
        regular Agent's turn becomes a question from that Agent to the console (questionId; the deadline is the
        request's timeout, or 30 minutes when it has none), and the answer is handed back to the extension. This entry
        is written when the dialog ends, with answered set to answered (someone answered), cancelled (the answer was a
        cancel) or expired (the deadline passed or the turn ended, and the extension received a cancel); editor, task
        turns and dialogs that cannot become questions are answered with a cancel right away (answered is cancelled,
        questionId is null).
      type: object
      required: [type, at, method, message, level, statusKey, answered, questionId]
      additionalProperties: false
      properties:
        type: { type: string, enum: [extension_ui] }
        at: { type: string, format: date-time }
        method: { type: string, enum: [notify, setStatus, select, confirm, input, editor] }
        message: { type: [string, "null"] }
        level: { type: [string, "null"], enum: [info, warning, error, null] }
        statusKey: { type: [string, "null"] }
        answered: { type: [string, "null"], enum: [answered, cancelled, expired, null] }
        questionId: { description: "The console question for the dialog (an Inbox message ID)", type: [string, "null"], format: uuid }

    TimelineSleepEntry:
      description: Persistent record of a sleep being registered, taking effect, ending early, being scheduled on expiry or becoming invalid; contains no internal scheduling fields
      type: object
      additionalProperties: false
      required: [type, at, sleep]
      properties:
        type: { type: string, enum: [sleep] }
        at: { type: string, format: date-time }
        sleep: { $ref: "#/components/schemas/SleepRecord" }
    SleepInput:
      type: object
      additionalProperties: false
      required: [actionId, runId, seconds]
      properties:
        actionId: { type: string, format: uuid }
        runId:
          description: The run ID given in the platform's instructions for this turn; a status query must not be used to silently swap in an old turn's ID
          type: string
          format: uuid
        seconds: { type: integer, format: int64, minimum: 1, maximum: 2147483647 }
        reason:
          description: Optional note; non-empty text is subject to the server's message length limit
          type: [string, "null"]

    SleepRecord:
      type: object
      additionalProperties: false
      required: [id, scopeKind, agentId, taskId, runtimeId, nodeRunId, sourceRunId, state, seconds, requestedAt, enteredAt, wakeAt, endedAt, endReason, wakeRunId, reason, revision]
      properties:
        id: { type: string, format: uuid }
        scopeKind: { type: string, enum: [normal, task] }
        agentId: { type: string, format: uuid }
        taskId: { type: [string, "null"], format: uuid }
        runtimeId: { type: [string, "null"], format: uuid }
        nodeRunId: { type: [string, "null"], format: uuid }
        sourceRunId: { type: string, format: uuid }
        state: { type: string, enum: [requested, sleeping, woken, cancelled] }
        seconds: { type: integer, format: int64, minimum: 1, maximum: 2147483647 }
        requestedAt: { type: string, format: date-time }
        enteredAt: { type: [string, "null"], format: date-time }
        wakeAt: { type: [string, "null"], format: date-time }
        endedAt: { type: [string, "null"], format: date-time }
        endReason:
          type: [string, "null"]
          enum: [deadline, queued_work, execution_failed, interrupted, task_ended, node_changed, session_reopened, owner_deleted, null]
        wakeRunId: { type: [string, "null"], format: uuid }
        reason: { type: [string, "null"] }
        revision:
          description: Monotonic revision of the owning scope; a new sleep continues the scope's existing revision
          type: integer
          format: int64
          minimum: 1
    SleepInfo:
      $ref: "#/components/schemas/SleepRecord"

    SleepReceipt:
      type: object
      additionalProperties: false
      required: [sleep, endTurn]
      properties:
        sleep: { $ref: "#/components/schemas/SleepRecord" }
        endTurn: { type: boolean, enum: [true] }

    SleepState:
      type: object
      additionalProperties: false
      required: [currentRunId, sleep]
      properties:
        currentRunId: { type: [string, "null"], format: uuid }
        sleep:
          description: The caller's own requested or sleeping record; null when there is none
          oneOf:
            - $ref: "#/components/schemas/SleepRecord"
            - type: "null"

    SseSleepUpdated:
      type: object
      additionalProperties: false
      required: [scopeKind, agentId, taskId, runtimeId, nodeRunId, taskVersion, sleepRevision, sleep, endedSleepId]
      properties:
        scopeKind: { type: string, enum: [normal, task] }
        agentId: { type: string, format: uuid }
        taskId: { type: [string, "null"], format: uuid }
        runtimeId: { type: [string, "null"], format: uuid }
        nodeRunId: { type: [string, "null"], format: uuid }
        taskVersion:
          description: task.version after the task transaction commits; null for the regular scope. Used to reject an empty list from an older task snapshot
          type: [integer, "null"]
          format: int64
          minimum: 1
        sleepRevision: { type: integer, format: int64, minimum: 0 }
        sleep:
          oneOf:
            - $ref: "#/components/schemas/SleepInfo"
            - type: "null"
        endedSleepId: { type: [string, "null"], format: uuid }

    TaskAgentList:
      type: object
      additionalProperties: false
      required:
        - agents
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/TaskAvailableAgent'
    TaskAvailableAgent:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - address
        - prompt
        - clis
        - configVersion
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        prompt:
          type: string
        clis:
          type: array
          items:
            type: string
        configVersion:
          type: integer
          minimum: 1
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            details:
              description: Depends on the code; agent_busy carries AgentBusyDetails, agent_not_idle when deleting a project carries ProjectNotIdleDetails, and other agent_not_idle errors (including platform commands) carry none; not_found carries NotFoundDetails when the request matches no endpoint and none when a resource does not exist
              oneOf:
                - $ref: "#/components/schemas/VerificationVersionConflictDetails"
                - $ref: "#/components/schemas/VerificationConflictDetails"
                - $ref: "#/components/schemas/VerificationUnsupportedDetails"
                - $ref: "#/components/schemas/TaskNodeMessageConflictDetails"
                - $ref: "#/components/schemas/CredentialPreconditionDetails"
                - $ref: "#/components/schemas/CLIAuthInProgressDetails"
                - $ref: "#/components/schemas/CredentialSelectionModeConflictDetails"
                - $ref: "#/components/schemas/CredentialResolutionDetails"
                - $ref: "#/components/schemas/CredentialAccountDeletedDetails"
                - $ref: "#/components/schemas/ProjectCredentialRequiredDetails"
                - $ref: "#/components/schemas/ProjectModelAuthInProgressDetails"
                - $ref: "#/components/schemas/ProjectActiveTasksDetails"
                - $ref: "#/components/schemas/QuestionClosedDetails"
                - $ref: "#/components/schemas/AgentBusyDetails"
                - $ref: "#/components/schemas/RunNotQueuedDetails"
                - $ref: "#/components/schemas/RunNotActiveDetails"
                - $ref: "#/components/schemas/ProjectNotIdleDetails"
                - $ref: "#/components/schemas/NotFoundDetails"
            fields:
              type: array
              items: { $ref: "#/components/schemas/FieldError" }

    Whoami:
      type: object
      required:
        - kind
        - address
        - name
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/PrincipalKind'
        address:
          description: "Address of the current identity: `@console`, `@<external identity name>`, or the Agent's address (same form as `Agent.address`; null when the name does not satisfy the naming rules)"
          type:
            - string
            - 'null'
        name:
          description: "Display name: the fixed console name for the console operator (still sent in Chinese for now), its name for an external identity, the Agent name for an Agent"
          type: string
        taskId:
          type:
            - string
            - 'null'
          format: uuid
          description: The bound task instance; null or omitted for regular Agents and human identities
        runtimeId:
          type:
            - string
            - 'null'
          format: uuid
          description: Task runtime instance ID; grants no extra permissions
    InboxMessagePage:
      type: object
      required: [messages, nextCursor]
      additionalProperties: false
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/InboxMessageSummary" }
        nextCursor:
          description: Cursor for the next page; null when there are no more
          type: [string, "null"]

    InboxMessage: {"description":"Full message: all fields of InboxMessageSummary plus text","type":"object","required":["id","threadId","inReplyTo","from","to","preview","whenBusy","createdAt","readAt","text","cancelledAt","task"],"additionalProperties":false,"properties":{"id":{"type":"string","format":"uuid"},"threadId":{"type":"string","format":"uuid"},"inReplyTo":{"type":["string","null"],"format":"uuid"},"from":{"$ref":"#/components/schemas/InboxParticipant"},"to":{"$ref":"#/components/schemas/InboxParticipant"},"preview":{"type":"string"},"whenBusy":{"oneOf":[{"$ref":"#/components/schemas/WhenBusy"},{"type":"null"}]},"createdAt":{"type":"string","format":"date-time"},"readAt":{"type":["string","null"],"format":"date-time"},"text":{"type":"string"},"cancelledAt":{"description":"When a person cancelled it; null if not cancelled. A cancelled message no longer counts as unread; when the recipient Agent reads or lists it, text and preview hold a cancellation notice and images is empty, while the sender and the console still see the full text","type":["string","null"],"format":"date-time"},"question":{"oneOf":[{"$ref":"#/components/schemas/InboxQuestion"},{"type":"null"}]},"answerTo":{"oneOf":[{"$ref":"#/components/schemas/InboxAnswerTo"},{"type":"null"}]},"notice":{"oneOf":[{"$ref":"#/components/schemas/InboxNotice"},{"type":"null"}]},"images":{"type":"array","items":{"$ref":"#/components/schemas/MessageImage"}},"task":{"description":"The task instance the message belongs to; null when it is not related to a task instance","oneOf":[{"$ref":"#/components/schemas/InboxTaskRef"},{"type":"null"}]}}}
    InboxQuestionOptions:
      type: array
      minItems: 1
      maxItems: 10
      uniqueItems: true
      items: {type: string, minLength: 1, maxLength: 50}
    InboxQuestionOption:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id: {type: string}
        label: {type: string}
    InboxAnswer:
      type: object
      additionalProperties: false
      required: [messageId, optionId, optionLabel, textPreview, by, at]
      properties:
        messageId: {type: string, format: uuid}
        optionId: {type: [string, 'null']}
        optionLabel: {type: [string, 'null']}
        textPreview: {type: string}
        by: {$ref: '#/components/schemas/InboxParticipant'}
        at: {type: string, format: date-time}
    InboxQuestion:
      type: object
      additionalProperties: false
      required: [options, expiresAt, state, answer]
      properties:
        options:
          type: array
          items: {$ref: '#/components/schemas/InboxQuestionOption'}
        expiresAt: {type: string, format: date-time}
        state: {type: string, enum: [open, answered, expired, closed, cancelled]}
        answer:
          oneOf:
            - $ref: '#/components/schemas/InboxAnswer'
            - type: 'null'
    InboxAnswerTo:
      type: object
      additionalProperties: false
      required: [messageId, optionId, optionLabel]
      properties:
        messageId: {type: string, format: uuid}
        optionId: {type: [string, 'null']}
        optionLabel: {type: [string, 'null']}
    InboxNotice:
      type: object
      additionalProperties: false
      required: [type, messageId, reason]
      properties:
        type: {type: string, enum: [question_expired]}
        messageId: {type: string, format: uuid}
        reason: {type: string}
    QuestionClosedDetails:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question: {$ref: '#/components/schemas/InboxQuestion'}

    InboxSendInput:
      type: object
      required: [to, text]
      additionalProperties: false
      properties:
        runId:
          type: string
          format: uuid
          not: {const: "00000000-0000-0000-0000-000000000000"}
          description: Ordinary Inbox calls may omit it. A question from a dedicated QA recovery node must carry the exact runId of the current turn; a missing runId or one that belongs elsewhere is rejected inside the original transaction and is not treated as a workflow retry.
        to:
          description: |
            Recipient address, resolved by the server; names match segment by segment, exactly and case-sensitively:
            - `@console`: the console operator; `@<name>`: an external identity that is not deleted;
            - three segments `<organization>/<project>/<Agent>`: looked up only among projects that are not deleted;
            - two segments `<project>/<Agent>`: a project in the sender's organization; for the console operator,
              external identities and platform-held Agents, resolved in the default organization;
            - a single segment shaped like a UUID: the Agent's internal ID;
            - any other single segment: the name of a platform-held Agent;
            - an address with `#<task ID>` resolves to a task instance; when the task has ended, the message goes to the
              current Manager with the original recipient noted.
          type: string
          minLength: 1
        text:
          description: Message text, must not be empty; returns 413 when it exceeds limits.maxInboxMessage bytes
          type: string
          minLength: 1
        whenBusy:
          description: Applies when the recipient is an Agent, defaulting to queue when omitted; ignored when the recipient is a person
          $ref: "#/components/schemas/WhenBusy"
        options: {$ref: '#/components/schemas/InboxQuestionOptions'}
        nodeRunId:
          description: Required when a task instance asks a question and must match the current node access; ordinary identities omit it. Grants no task/runtime permissions.
          type: string
          format: uuid
        channelId:
          description: Valid only for calls with a plugin token (other identities get 422). The plugin channel the message comes from; the Agent's reply goes back to this channel through the thread.
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
        senderName:
          description: Valid only for calls with a plugin token. Sender name shown in the conversation; defaults to the plugin's display name.
          type: string
          minLength: 1
          maxLength: 100

    InboxReplyInput:
      {
        "additionalProperties": false,
        "if": {
          "not": {
            "required": [
              "optionId"
            ]
          }
        },
        "properties": {
          "asIdentityId": {
            "description": "Plugin token only: reply on behalf of an external identity the plugin manages (plugins/SPEC.md §12)",
            "format": "uuid",
            "type": "string"
          },
          "nodeRunId": {
            "description": "Required when a task instance asks a new question; must match the current node access.",
            "format": "uuid",
            "type": "string"
          },
          "optionId": {
            "description": "On the explicit answer path, the chosen option of the original question; the caller must be the question's recipient and the question must be open. When text is omitted, the chosen option's text is recorded automatically.",
            "minLength": 1,
            "type": "string"
          },
          "options": {
            "$ref": "#/components/schemas/InboxQuestionOptions"
          },
          "text": {
            "description": "Message text, must not be empty; returns 413 when it exceeds limits.maxInboxMessage bytes",
            "minLength": 1,
            "type": "string"
          },
          "whenBusy": {
            "$ref": "#/components/schemas/WhenBusy",
            "description": "Applies when the recipient is an Agent, defaulting to queue when omitted; ignored when the recipient is a person"
          },
          "runId": {
            "type": "string",
            "format": "uuid",
            "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
            "not": {
              "const": "00000000-0000-0000-0000-000000000000"
            },
            "description": "An Agent reply in a strict task Inbox must pass the ID of the turn actually running under the original task/node/runtime; it is not inferred from the most recent run."
          }
        },
        "then": {
          "required": [
            "text"
          ]
        },
        "type": "object"
      }
    ErrorCode:
      {
        "description": "- not_found: the resource does not exist (404)
- validation_failed: validation failed (422)
- precondition_failed: a version precondition of the request does not match (If-Match or the Prompt edit version, 412)
- payload_too_large: exceeds the size limit (413)
- agent_busy: the Agent is busy and the request chose neither interrupt nor queue (409)
- agent_not_idle: an operation that needs the Agent to be idle (deleting an Agent, deleting a project, reopening the session, the platform commands /new /reload /compact /resume, exporting the session) was rejected because it is busy (409)
- session_missing: the Agent's session is missing, and reopening the session must be confirmed first (409)
- session_none: there is no Pi session yet to compact or export (409)
- console_command_failed: the platform command ran but could not finish (409)
- template_deleted: the source template has been deleted and cannot be copied again (409)
- name_conflict: duplicate name (409): an Agent name already used in the project or on the platform, a duplicate project name, a duplicate Skill name or the name of the built-in Skill `loopctl`, or a duplicate external identity name
- path_conflict: folder source subdirectories duplicate or contain each other (409)
- forbidden_origin: the Origin is not on the allowlist (403)
- invalid_host: the Host is not on the allowlist (403)
- unauthenticated: the token is missing, invalid, expired or revoked, or its identity has been deleted (401)
- forbidden: the identity is valid but not allowed to do this (403)
- sleep_conflict: the run is stale, the action content conflicts, the node has already been submitted, or a different active sleep already exists (409)
- run_not_queued: the queued item to promote to an interrupt, withdraw or cancel is no longer in the queue: its run has been picked up, started or finished, or the message has been read or cancelled (409)
- run_not_active: when stopping a reply, this run has already ended (409)
- action_conflict: the same actionId was used for an action with different content (409)
- plugin_source_failed: the plugin source could not be fetched, or installing its dependencies failed (422)
- plugin_confirmation_required: installing or updating a plugin from an unofficial source must be confirmed (409)
- plugin_version_conflict: the same plugin is already installed with the same version number but different content (409)
- plugin_not_enabled: the plugin is not enabled in the project, or is disabled globally (409)
- plugin_blocked: a blocking Hook of a plugin stopped this operation; message carries the plugin id and the reason (409)
- plugin_failed: the plugin reported an error while handling the request; message carries the reason the plugin gave (502)
- plugin_timeout: the plugin did not respond in time (504)
- internal_error: internal server error (500)
