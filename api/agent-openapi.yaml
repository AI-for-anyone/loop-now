    RunEndReason:
      description: |
        执行中断或尚未领取的排队执行失效的原因：
        - user_interrupt：被新消息打断；user_stopped：被人停止（只停这一次回复）；server_restart：服务重启。
        - sleep_superseded：sleep timer 被真实工作承接；sleep_invalidated：所属生命周期失效。
        - user_cancelled：排队中被人撤回或取消；merged_into_interrupt：其中的消息已全部转入打断提醒；no_pending_messages：提醒承载的消息已全部被读取或取消。
        后五种都没有执行工具或模型，对话流中应隐藏 user_cancelled、merged_into_interrupt、no_pending_messages 三种。
      type: [string, "null"]
      enum: [user_interrupt, user_stopped, server_restart, sleep_superseded, sleep_invalidated, user_cancelled, merged_into_interrupt, no_pending_messages, null]
    RunErrorCode: {"description":"- credential_unavailable：凭证不可用（需要重新录入或已失效）\n- cli_install_failed：CLI 安装失败\n- workspace_sync_failed：工作区同步失败（如克隆失败）\n- session_missing：会话文件丢失\n- pi_start_failed：Pi 启动失败或启动超时\n- pi_exited：Pi 进程异常退出\n- pi_error：Pi 报告这一轮以错误结束\n- internal_error：服务端内部错误（如数据库暂时不可用），这次回复未能执行\n- plugin_blocked：插件拒绝本轮操作或运行条件已变化\n- image_unsupported：本轮实际模型不支持图片，未发送图片或切换模型\n","type":"string","enum":["credential_unavailable","cli_install_failed","workspace_sync_failed","session_missing","pi_start_failed","pi_exited","pi_error","internal_error","plugin_blocked","image_unsupported"]}
