      x-agent-only: true
  /projects:
    get:
      operationId: listPlatformProjects
      x-agent-only: true
      summary: 仅平台 Agent：发现未删除项目及当前 Manager
      description: |
        按当前真实 Agent 归属鉴权，项目 Agent（含 Manager）返回403。
        仅安全目录，完整地址用于既有 Inbox；不授予项目内容或管理权限。
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 按组织名称/ID、项目名称/ID稳定排序的当前目录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformProjectDirectory" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500":
          description: 服务端错误
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /inbox/threads/{threadId}/read:
    {
      "parameters": [
        {
          "$ref": "#/components/parameters/ThreadId"
        }
      ],
      "post": {
        "operationId": "readInboxThread",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/InboxUnreadTotal"
                }
              }
            },
            "description": "当前身份最新的未读总数",
            "headers": {
              "Loop-Now-Request-Id": {
                "$ref": "#/components/headers/RequestId"
              },
              "Loop-Now-Version": {
                "$ref": "#/components/headers/Version"
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          }
        },
        "summary": "把线索中发给当前身份的消息全部标为已读",
        "tags": [
          "inbox"
        ],
        "x-access": "console-and-external",
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/InboxReadInput"
              }
            }
          }
        },
        "description": " 严格任务 Inbox 的 Agent 必须提供所属实际运行中的 runId；普通旧 Inbox 可省略。失效或跨节点不改投、不推断当前 run。"
      }
    }
  /inbox/threads/{threadId}:
    {
      "get": {
        "operationId": "getInboxThread",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/InboxThread"
                }
              }
            },
            "description": "线索",
            "headers": {
              "Loop-Now-Request-Id": {
                "$ref": "#/components/headers/RequestId"
              },
              "Loop-Now-Version": {
                "$ref": "#/components/headers/Version"
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          }
        },
        "summary": "线索中的全部消息，按时间正序；不改变已读状态",
        "tags": [
          "inbox"
        ],
        "x-access": "console-and-external",
        "parameters": [
          {
            "in": "query",
            "name": "runId",
            "required": false,
            "schema": {
              "type": "string",
              "format": "uuid",
              "not": {
                "const": "00000000-0000-0000-0000-000000000000"
              }
            }
          }
        ],
        "description": " 严格任务 Inbox 的 Agent 必须提供所属实际运行中的 runId；普通旧 Inbox 可省略。失效或跨节点不改投、不推断当前 run。"
      },
      "parameters": [
        {
          "$ref": "#/components/parameters/ThreadId"
        }
      ]
    }
components:
  headers:
    RequestId:
      description: 本次请求的唯一编号（UUIDv7），与服务端日志中的 requestId 一致；控制台出错时显示它
      required: true
      schema: { type: string, format: uuid }
    Version:
      description: 服务端版本（与 loopctl 共用的版本包），loopctl 据此比对版本；跨源访问时与 `Loop-Now-Request-Id`、`ETag` 一起列在 `Access-Control-Expose-Headers` 中
      required: true
      schema: { type: string, minLength: 1 }

  parameters:
    ThreadId:
      {
        "in": "path",
        "name": "threadId",
        "required": true,
        "schema": {
          "format": "uuid",
          "type": "string"
        }
      }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InboxUnread:
      name: unread
      in: query
      required: false
      description: 为 true 时只列未读（已读时间为空）的消息；默认包含已读与未读
      schema: { type: boolean, default: false }
    PageCursor:
      name: cursor
      in: query
      required: false
      description: 上一页返回的 nextCursor；不透明字符串，无效时返回 422
      schema: { type: string, minLength: 1 }
    PageLimit:
      name: limit
      in: query
      required: false
      description: 每页条数，默认 20；超过服务端的上限（默认 100，可配置）时按上限返回
      schema: { type: integer, minimum: 1, default: 20 }

  responses:
    Conflict:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: |
        与当前状态冲突。`error.code` 取值：
        `agent_busy`（details 为 AgentBusyDetails）、`agent_not_idle`（删除项目时 details 为 ProjectNotIdleDetails）、`session_missing`、`template_deleted`、`name_conflict`、`path_conflict`。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: Agent 令牌缺失、无效或已作废（`unauthenticated`）；错误信息不回显令牌
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: |
        `error.code` 取值：
        - `forbidden`：跨组织发送被拒绝；
        - `forbidden_origin`：请求带了 `Origin` 头。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: 消息、线索或收件人不存在，或不属于当前 Agent
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: 校验失败，尽量带字段级错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
      description: 正文超过 Inbox 消息的字节上限
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    CodexServiceTier:
      description: Codex请求速度档位；default为标准，priority为Fast，ultrafast为Ultrafast。供应商决定账号和模型资格，不静默降档。
      type: string
      enum: [default, priority, ultrafast]

    ThinkingLevel:
      type: string
      enum: [off, minimal, low, medium, high, xhigh, max]

    TimelineExtensionUI:
      description: |
        Agent 半边的扩展经 ctx.ui 发来的请求（Pi RPC 的 extension_ui_request）。notify 是通知（level 为 info、warning、error），
        setStatus 设置或清除一条状态（message 为空时清除）。select、confirm、input、editor 是对话，message 为对话标题：
        常态 Agent 一轮之中的 confirm、select、input 成为这个 Agent 发给控制台的提问（questionId，期限为请求的超时，没有时 30 分钟），
        回答后交还给扩展，这条记录在对话结束时写入，answered 为 answered（有人回答）、cancelled（回答为取消）或 expired（到期或这一轮结束，
        扩展收到取消）；editor、任务轮次与无法提问的对话立即按取消回应（answered 为 cancelled，questionId 为 null）。
      type: object
      required: [type, at, method, message, level, statusKey, answered, questionId]
      additionalProperties: false
      properties:
        type: { type: string, enum: [extension_ui] }
        at: { type: string, format: date-time }
        method: { type: string, enum: [notify, setStatus, select, confirm, input, editor] }
        message: { type: [string, "null"] }
        level: { type: [string, "null"], enum: [info, warning, error, null] }
        statusKey: { type: [string, "null"] }
        answered: { type: [string, "null"], enum: [answered, cancelled, expired, null] }
        questionId: { description: 对话对应的控制台提问（Inbox 消息 ID）, type: [string, "null"], format: uuid }

    TimelineSleepEntry:
      {
        "additionalProperties": false,
        "description": "sleep 登记、生效、提前结束、到期安排或失效的持久记录；不包含内部调度字段",
        "properties": {
          "at": {
            "format": "date-time",
            "type": "string"
          },
          "sleep": {
            "$ref": "#/components/schemas/SleepRecord"
          },
          "type": {
            "enum": [
              "sleep"
            ],
            "type": "string"
          }
        },
        "required": [
          "type",
          "at",
          "sleep"
        ],
        "type": "object"
      }
    SleepInput:
      type: object
      additionalProperties: false
      required: [actionId, runId, seconds]
      properties:
        actionId: { type: string, format: uuid }
        runId:
          description: 平台本轮说明中提供的运行 ID；不能用状态查询悄悄替换旧轮 ID
          type: string
          format: uuid
        seconds: { type: integer, format: int64, minimum: 1, maximum: 2147483647 }
        reason:
          description: 可选说明，非空文本遵循服务端消息长度上限
          type: [string, "null"]

    SleepRecord:
      {
        "additionalProperties": false,
        "properties": {
          "agentId": {
            "format": "uuid",
            "type": "string"
          },
          "endReason": {
            "enum": [
              "deadline",
              "queued_work",
              "execution_failed",
              "interrupted",
              "task_ended",
              "node_changed",
              "session_reopened",
              "owner_deleted",
              null
            ],
            "type": [
              "string",
              "null"
            ]
          },
          "endedAt": {
            "format": "date-time",
            "type": [
              "string",
              "null"
            ]
          },
          "enteredAt": {
            "format": "date-time",
            "type": [
              "string",
              "null"
            ]
          },
          "id": {
            "format": "uuid",
            "type": "string"
          },
          "nodeRunId": {
            "format": "uuid",
            "type": [
              "string",
              "null"
            ]
          },
          "reason": {
            "type": [
              "string",
              "null"
            ]
          },
          "requestedAt": {
            "format": "date-time",
            "type": "string"
          },
          "revision": {
            "description": "所属 scope 的单调版本；新 sleep 延续原 scope 版本",
            "format": "int64",
            "minimum": 1,
            "type": "integer"
          },
          "runtimeId": {
            "format": "uuid",
            "type": [
              "string",
              "null"
            ]
          },
          "scopeKind": {
            "enum": [
              "normal",
              "task"
            ],
            "type": "string"
          },
          "seconds": {
            "format": "int64",
            "maximum": 2147483647,
            "minimum": 1,
            "type": "integer"
          },
          "sourceRunId": {
            "format": "uuid",
            "type": "string"
          },
          "state": {
            "enum": [
              "requested",
              "sleeping",
              "woken",
              "cancelled"
            ],
            "type": "string"
          },
          "taskId": {
            "format": "uuid",
            "type": [
              "string",
              "null"
            ]
          },
          "wakeAt": {
            "format": "date-time",
            "type": [
              "string",
              "null"
            ]
          },
          "wakeRunId": {
            "format": "uuid",
            "type": [
              "string",
              "null"
            ]
          }
        },
        "required": [
          "id",
          "scopeKind",
          "agentId",
          "taskId",
          "runtimeId",
          "nodeRunId",
          "sourceRunId",
          "state",
          "seconds",
          "requestedAt",
          "enteredAt",
          "wakeAt",
          "endedAt",
          "endReason",
          "wakeRunId",
          "reason",
          "revision"
        ],
        "type": "object"
      }
    SleepInfo:
      $ref: "#/components/schemas/SleepRecord"

    SleepReceipt:
      type: object
      additionalProperties: false
      required: [sleep, endTurn]
      properties:
        sleep: { $ref: "#/components/schemas/SleepRecord" }
        endTurn: { type: boolean, enum: [true] }

    SleepState:
      type: object
      additionalProperties: false
      required: [currentRunId, sleep]
      properties:
        currentRunId: { type: [string, "null"], format: uuid }
        sleep:
          description: 自身 requested 或 sleeping 记录；没有时为 null
          oneOf:
            - $ref: "#/components/schemas/SleepRecord"
            - type: "null"

    SseSleepUpdated:
      type: object
      additionalProperties: false
      required: [scopeKind, agentId, taskId, runtimeId, nodeRunId, taskVersion, sleepRevision, sleep, endedSleepId]
      properties:
        scopeKind: { type: string, enum: [normal, task] }
        agentId: { type: string, format: uuid }
        taskId: { type: [string, "null"], format: uuid }
        runtimeId: { type: [string, "null"], format: uuid }
        nodeRunId: { type: [string, "null"], format: uuid }
        taskVersion:
          description: 任务事务提交后的 task.version；常态为 null。用于拒绝旧任务快照的空列表
          type: [integer, "null"]
          format: int64
          minimum: 1
        sleepRevision: { type: integer, format: int64, minimum: 0 }
        sleep:
          oneOf:
            - $ref: "#/components/schemas/SleepInfo"
            - type: "null"
        endedSleepId: { type: [string, "null"], format: uuid }

    TaskAgentList:
      type: object
      additionalProperties: false
      required:
        - agents
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/TaskAvailableAgent'
    TaskAvailableAgent:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - address
        - prompt
        - clis
        - configVersion
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        prompt:
          type: string
        clis:
          type: array
          items:
            type: string
        configVersion:
          type: integer
          minimum: 1
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            details:
              description: 按 code 定义：agent_busy 带 AgentBusyDetails；删除项目时的 agent_not_idle 带 ProjectNotIdleDetails
              oneOf:
                - $ref: "#/components/schemas/VerificationVersionConflictDetails"
                - $ref: "#/components/schemas/VerificationConflictDetails"
                - $ref: "#/components/schemas/VerificationUnsupportedDetails"
                - $ref: "#/components/schemas/TaskNodeMessageConflictDetails"
                - $ref: "#/components/schemas/CredentialPreconditionDetails"
                - $ref: "#/components/schemas/CLIAuthInProgressDetails"
                - $ref: "#/components/schemas/CredentialSelectionModeConflictDetails"
                - $ref: "#/components/schemas/CredentialResolutionDetails"
                - $ref: "#/components/schemas/CredentialAccountDeletedDetails"
                - $ref: "#/components/schemas/ProjectCredentialRequiredDetails"
                - $ref: "#/components/schemas/ProjectModelAuthInProgressDetails"
                - $ref: "#/components/schemas/ProjectActiveTasksDetails"
                - $ref: "#/components/schemas/QuestionClosedDetails"
                - $ref: "#/components/schemas/AgentBusyDetails"
                - $ref: "#/components/schemas/RunNotQueuedDetails"
                - $ref: "#/components/schemas/RunNotActiveDetails"
                - $ref: "#/components/schemas/ProjectNotIdleDetails"
            fields:
              type: array
              items: { $ref: "#/components/schemas/FieldError" }

    Whoami:
      type: object
      required:
        - kind
        - address
        - name
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/PrincipalKind'
        address:
          description: 当前身份的地址：`@console`、`@<外部身份名>`，或 Agent 的地址（写法同 `Agent.address`；名称不满足命名规则时为 null）
          type:
            - string
            - 'null'
        name:
          description: 显示名称：控制台操作者为“控制台”，外部身份为其名称，Agent 为 Agent 名
          type: string
        taskId:
          type:
            - string
            - 'null'
          format: uuid
          description: 任务实例绑定；常态Agent与人员身份为空或不返回
        runtimeId:
          type:
            - string
            - 'null'
          format: uuid
          description: 任务运行实例ID；不授予额外权限
    InboxMessagePage:
      type: object
      required: [messages, nextCursor]
      additionalProperties: false
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/InboxMessageSummary" }
        nextCursor:
          description: 下一页的游标；没有更多时为 null
          type: [string, "null"]

