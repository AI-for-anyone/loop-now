          description: |
            消息归属的节点运行，按顺序取第一个能确定的：
            - 严格节点消息：绑定的节点；
            - 任务实例提出的问题，以及回复该问题的消息：问题绑定的节点；
            - 发给任务实例的其他消息：承载它的提醒轮次所属节点；
            - 否则：该任务实例在消息时间或之前最近一次开始的轮次所属节点。
            都无法确定时为 null。
          type: [string, "null"]
          format: uuid
        runtimeId:
          description: 任务实例（运行实例）ID
          type: string
          format: uuid

    InboxMessageSummary: {"type":"object","required":["id","threadId","inReplyTo","from","to","preview","whenBusy","createdAt","readAt","cancelledAt","task"],"additionalProperties":false,"properties":{"id":{"type":"string","format":"uuid"},"threadId":{"description":"线索 ID，等于线索中第一条消息的 ID","type":"string","format":"uuid"},"inReplyTo":{"description":"回复的是哪条消息；线索的第一条为 null","type":["string","null"],"format":"uuid"},"from":{"$ref":"#/components/schemas/InboxParticipant"},"to":{"$ref":"#/components/schemas/InboxParticipant"},"preview":{"description":"正文的前若干个字符（默认 200，可配置）","type":"string"},"whenBusy":{"description":"发给 Agent 的消息为 interrupt 或 queue；发给人的消息为 null","oneOf":[{"$ref":"#/components/schemas/WhenBusy"},{"type":"null"}]},"createdAt":{"type":"string","format":"date-time"},"readAt":{"description":"收件方第一次读取的时间；未读为 null","type":["string","null"],"format":"date-time"},"cancelledAt":{"description":"被人取消的时间；未取消为 null。取消后不计为未读；收件 Agent 读取或列出时 text、preview 为取消说明、images 为空，发件方与控制台仍看到全文","type":["string","null"],"format":"date-time"},"question":{"oneOf":[{"$ref":"#/components/schemas/InboxQuestion"},{"type":"null"}]},"answerTo":{"oneOf":[{"$ref":"#/components/schemas/InboxAnswerTo"},{"type":"null"}]},"notice":{"oneOf":[{"$ref":"#/components/schemas/InboxNotice"},{"type":"null"}]},"images":{"type":"array","items":{"$ref":"#/components/schemas/MessageImage"}},"task":{"description":"消息所属的任务实例；与任务实例无关时为 null","oneOf":[{"$ref":"#/components/schemas/InboxTaskRef"},{"type":"null"}]}}}
    InboxParticipant:
      description: |
        消息的一方。
        - `address`：控制台操作者为 `@console`，外部身份为 `@<名称>`，Agent 的写法同 `Agent.address`。参与方已删除时仍给出原地址（外部身份的名称释放后可能被新身份使用，以 `deleted` 区分）；名称不满足命名规则的 Agent 为 null。
        - `name`：显示名称：控制台操作者为“控制台”，外部身份为其名称，Agent 为 Agent 名；已删除时为“已删除身份”或“已删除 Agent”。
        - `deleted`：外部身份已删除，或 Agent 已删除（含随项目删除）。
        - `id`：Agent ID 或外部身份 ID，控制台操作者与插件为 null。地址不唯一或为 null 时，用它定位到具体的 Agent 或外部身份。
        - `plugin`：插件经插件令牌以 inbox.send 发来的消息（plugins/SPEC.md §11），在对话里像外部身份一样显示：`pluginId` 为插件 id，
          `channelId` 为插件里的渠道（没有时为 null），`address` 为 `plugin:<插件 id>` 或 `plugin:<插件 id>/<渠道>`，`name` 为插件给出的发件名称；
          插件已卸载时 `deleted` 为 true。其他参与方的 `pluginId` 与 `channelId` 为 null。
      type: object
      required: [kind, id, address, name, deleted, pluginId, channelId]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [console, external, agent, platform, plugin]}
        id: { type: [string, "null"], format: uuid }
        address: { type: [string, "null"] }
        name: { type: string }
        deleted: { type: boolean }
        pluginId: { type: [string, "null"] }
        channelId: { type: [string, "null"] }

