    AgentBusyDetails:
      type: object
      required: [currentRunId, queued]
      additionalProperties: false
      properties:
        currentRunId:
          description: The run in progress, or the earliest queued run when none is in progress. Null when there is neither, because the busy lock is held by a platform command that produces no run (/new, /reload, /resume, export), or a run is just about to start or has just ended. The request can still interrupt or queue per whenBusy, and the message starts once the lock is released.
          type: [string, "null"]
          format: uuid
        queued: { $ref: "#/components/schemas/QueueCounts" }

    RunNotQueuedDetails:
      description: Details for run_not_queued, the current state of the queued item
      type: object
      required: [runId, status, whenBusy]
      additionalProperties: false
      properties:
        runId:
          description: The run, or the run currently carrying the Inbox message; null when the message has no carrying run
          type: [string, "null"]
          format: uuid
        status:
          type: [string, "null"]
          enum: [queued, starting, running, aborting, completed, failed, interrupted, null]
        whenBusy:
          oneOf:
            - $ref: "#/components/schemas/WhenBusy"
            - type: "null"
        messageId:
          description: Given for actions on an Inbox message
          type: string
          format: uuid
        messageState:
          description: "read: already read; cancelled: already cancelled; dispatched: the carrying run has started or ended; not_queued: no queued carrying run"
          type: string
          enum: [read, cancelled, dispatched, not_queued]

    RunNotActiveDetails:
      description: Details for run_not_active, the current state of the run to be stopped
      type: object
      required: [runId, status]
      additionalProperties: false
      properties:
        runId: { type: string, format: uuid }
        status: { type: string, enum: [queued, starting, running, aborting, completed, failed, interrupted] }
    NotFoundDetails:
      description: |
        Details of a not_found that is not about a missing resource. Only a request that matches no endpoint carries it
        today, with reason `unknown_endpoint` (an unknown method or path, for example from a console that is newer than
        the server). A missing resource returns not_found without details. Clients must use this field, not the message,
        to tell "this server has no such endpoint" from "the resource does not exist".
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          description: "unknown_endpoint: no endpoint matches the request's method and path."
          type: string
          enum: [unknown_endpoint]

    ProjectNotIdleDetails:
      description: When deleting a project is rejected, lists the Agents that are not idle
      type: object
      required: [agents]
      additionalProperties: false
      properties:
        agents:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, name]
            additionalProperties: false
            properties:
              id: { type: string, format: uuid }
              name: { type: string }

    FieldError:
      type: object
      required: [field, message]
      additionalProperties: false
      properties:
        field: { type: string }
        message: { type: string }

    PrincipalKind:
      description: Identity kind. console is the console operator, external is an external identity, agent is an Agent
      type: string
      enum: [console, external, agent]

    InboxTaskRef:
      description: |
        The task instance the message belongs to, derived from the task instance records of the message's two ends, not
        by parsing address text: the sender if the sender is a task instance, otherwise the recipient; the whole field
        is null when neither end is a task instance.
      type: object
      required: [taskId, nodeRunId, runtimeId]
      additionalProperties: false
      properties:
        taskId: { type: string, format: uuid }
        nodeRunId:
          description: |
            The node run the message belongs to; the first of these that can be determined, in order:
            - strict node message: the bound node;
            - a question asked by the task instance, and messages replying to it: the node the question is bound to;
            - other messages to the task instance: the node of the reminder turn carrying it;
            - otherwise: the node of the task instance's most recent turn that started at or before the message time.
            null when none can be determined.
          type: [string, "null"]
          format: uuid
        runtimeId:
          description: Task instance (runtime instance) ID
          type: string
          format: uuid

    InboxMessageSummary: {"type":"object","required":["id","threadId","inReplyTo","from","to","preview","whenBusy","createdAt","readAt","cancelledAt","task"],"additionalProperties":false,"properties":{"id":{"type":"string","format":"uuid"},"threadId":{"description":"Thread ID; equals the ID of the first message in the thread","type":"string","format":"uuid"},"inReplyTo":{"description":"The message this one replies to; null for the first message of a thread","type":["string","null"],"format":"uuid"},"from":{"$ref":"#/components/schemas/InboxParticipant"},"to":{"$ref":"#/components/schemas/InboxParticipant"},"preview":{"description":"The first characters of the text (200 by default, configurable)","type":"string"},"whenBusy":{"description":"interrupt or queue for messages to an Agent; null for messages to a person","oneOf":[{"$ref":"#/components/schemas/WhenBusy"},{"type":"null"}]},"createdAt":{"type":"string","format":"date-time"},"readAt":{"description":"When the recipient first read it; null while unread","type":["string","null"],"format":"date-time"},"cancelledAt":{"description":"When a person cancelled it; null if not cancelled. A cancelled message no longer counts as unread; when the recipient Agent reads or lists it, text and preview hold a cancellation notice and images is empty, while the sender and the console still see the full text","type":["string","null"],"format":"date-time"},"question":{"oneOf":[{"$ref":"#/components/schemas/InboxQuestion"},{"type":"null"}]},"answerTo":{"oneOf":[{"$ref":"#/components/schemas/InboxAnswerTo"},{"type":"null"}]},"notice":{"oneOf":[{"$ref":"#/components/schemas/InboxNotice"},{"type":"null"}]},"images":{"type":"array","items":{"$ref":"#/components/schemas/MessageImage"}},"task":{"description":"The task instance the message belongs to; null when it is not related to a task instance","oneOf":[{"$ref":"#/components/schemas/InboxTaskRef"},{"type":"null"}]}}}
    InboxParticipant:
      description: |
        One party of a message.
        - `address`: `@console` for the console operator, `@<name>` for an external identity, and the same form as
          `Agent.address` for an Agent. A deleted party still gets its original address (once released, an external
          identity's name may be taken by a new identity; `deleted` tells them apart); null for an Agent whose name does
          not satisfy the naming rules.
        - `name`: display name: the fixed console name for the console operator, its name for an external identity, the
          Agent name for an Agent; a fixed placeholder name once the identity or Agent is deleted. The fixed names are
          still sent in Chinese for now.
        - `deleted`: the external identity has been deleted, or the Agent has been deleted (including along with its
          project).
        - `id`: Agent ID or external identity ID; null for the console operator and for plugins. When the address is not
          unique or is null, use it to find the specific Agent or external identity.
        - `plugin`: a message a plugin sent with inbox.send using its plugin token (plugins/SPEC.md §11), shown in the
          conversation like an external identity: `pluginId` is the plugin id, `channelId` is the channel within the
          plugin (null when none), `address` is `plugin:<plugin id>` or `plugin:<plugin id>/<channel>`, and `name` is
          the sender name the plugin gave; `deleted` is true once the plugin is uninstalled. For other parties
          `pluginId` and `channelId` are null.
      type: object
      required: [kind, id, address, name, deleted, pluginId, channelId]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [console, external, agent, platform, plugin]}
        id: { type: [string, "null"], format: uuid }
        address: { type: [string, "null"] }
        name: { type: string }
        deleted: { type: boolean }
        pluginId: { type: [string, "null"] }
        channelId: { type: [string, "null"] }

