openapi: 3.1.0
info:
  title: Loop Now Agent API
  version: 0.1.0
  description: |
    The interface contract that Agents inside the platform call through loopctl, maintained by the server (change
    add-inbox-and-external-access).
    Structures with the same name as in `api/openapi.yaml` are identical, and contract tests compare them one by one;
    operations with the same name also behave the same, except that the current identity is the Agent.

    Conventions:
    - The base URL is `LOOPCTL_AGENT_URL`, that is, `/agent/v1` on the loopback listener. The server injects it together
      with `LOOPCTL_AGENT_TOKEN` when it starts Pi.
    - Every request must carry `Authorization: Bearer lna_…`. The token becomes invalid when the Pi process stops,
      restarts or is discarded, and all tokens become invalid when the server restarts; requests then return 401
      `unauthenticated`.
    - A request with an `Origin` header returns 403 `forbidden_origin`.
    - The token determines the current identity, which can only read the messages sent to it and view the threads it
      takes part in.
    - Every response carries `Loop-Now-Request-Id` and `Loop-Now-Version`.
servers:
  - url: http://127.0.0.1:8780/agent/v1
    description: Default local development address
tags:
  - name: inbox
  - name: sleep

paths:
  /agents/status:
    get:
      operationId: getProjectAgentStatus
      x-agent-only: true
      summary: Read-only view of the status of a regular Agent in the same project
      description: |
        The caller's project is determined by the actual, undeleted configuration of the token's base Agent; a task
        token also uses only its base Agent's project.
        The target accepts a UUID, a short name in the same project, or a project/Agent or organization/project/Agent
        address; #task addresses are rejected.
        The caller and the target must belong to the same non-empty project; platform Agents, other projects and
        deleted targets are not allowed.
        Returns only the regular AgentStatus; it does not aggregate task instances, start a run, read messages or
        change read state.
      parameters:
        - name: agent
          in: query
          required: true
          description: UUID or same-project address of the target regular Agent
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: The existing safe status projection of the target regular Agent
          headers: { Loop-Now-Request-Id: { $ref: '#/components/headers/RequestId' }, Loop-Now-Version: { $ref: '#/components/headers/Version' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /sleep:
    get:
      tags: [sleep]
      operationId: getSleepState
      x-agent-only: true
      summary: Queries the current Agent instance's own sleep; makes no changes
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The caller's own current run and active sleep; null when there is none
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SleepState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    post:
      tags: [sleep]
      operationId: requestSleep
      x-agent-only: true
      summary: Registers a sleep for the current turn; it takes effect only after the turn ends normally
      description: |
        The scope is derived from the token only. Resending the same action with the same content returns the original
        receipt and does not reset the time; different content or a stale run returns 409 sleep_conflict.
        202 only means the registration succeeded; the Agent then ends the current turn, and the platform computes
        wakeAt only after it confirms that the turn ended successfully and the session was saved.
        Mutating requests must not be retried automatically. A sleep counts as idle; valid new work can end this wait
        early.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SleepInput" }
      responses:
        "202":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The persisted receipt of the original registration; at this point it does not yet mean the Agent is idle or that the timer has started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SleepReceipt" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /whoami:
    get:
      tags: [inbox]
      operationId: getWhoami
      summary: Identity of the current Agent
      description: |
        Returns `{kind: agent, address, name}`; `address` is written the same way as `Agent.address` in the console
        contract.
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: Current identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Whoami" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /inbox/messages:
    get:
      tags: [inbox]
      operationId: listInboxMessages
      summary: Lists summaries of the messages sent to the current Agent, newest first; includes read and unread messages by default and does not change read state
      parameters:
        - $ref: "#/components/parameters/InboxUnread"
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: A page of message summaries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxMessagePage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [inbox]
      operationId: sendInboxMessage
      summary: Sends a message, always starting a new thread; to reply, use `POST /inbox/messages/{messageId}/reply`
      description: |
        A two-segment address `<project>/<Agent>` is resolved in the current Agent's organization; for a platform-held
        Agent, in the default organization.
        Returns 404 and saves nothing when the recipient address does not exist, or the Agent or external identity has
        been deleted.
        Returns 403 `forbidden` when a cross-organization send is not allowed: an Agent in an organization can only send
        to Agents of the same organization and to platform-held Agents, and a project Manager can also send to the
        project Managers of other organizations; a platform-held Agent can send to any organization. Sending to
        `@console` and to external identities is not subject to this restriction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InboxSendInput" }
      responses:
        "201":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The saved message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxMessage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "409":
          description: An option answer to a question that is already answered, expired or closed, or a task node conflict; returns a fixed error code and the latest safe view of the question.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /inbox/messages/{messageId}/read:
    {
      "parameters": [
        {
          "$ref": "#/components/parameters/MessageId"
        }
      ],
      "post": {
        "operationId": "readInboxMessage",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/InboxMessage"
                }
              }
            },
            "description": "The full message",
            "headers": {
              "Loop-Now-Request-Id": {
                "$ref": "#/components/headers/RequestId"
              },
              "Loop-Now-Version": {
                "$ref": "#/components/headers/Version"
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          }
        },
        "summary": "Reads the full text of one message sent to the current identity and marks it read; reading it again returns the same content, and the read time keeps its first value",
        "tags": [
          "inbox"
        ],
        "x-access": "console-and-external",
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/InboxReadInput"
              }
            }
          }
        },
        "description": "An Agent on a strict task Inbox must give the runId of the run it actually belongs to; the ordinary legacy Inbox may omit it. A stale or cross-node runId is not redirected, and the current run is not inferred."
      }
    }
  /inbox/messages/{messageId}/reply:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [inbox]
      operationId: replyInboxMessage
      summary: Replies to a message in a thread; the recipient is the other party of the thread
      description: |
        Either party of a thread can reply to any message in it, including its own (appending to the thread). Returns
        404 when the caller is not a party to the thread.
        Replies do not check cross-organization sending permission. Returns 404 and saves nothing when the recipient has
        been deleted.
        In a thread a plugin started, the Agent can also ask a question (with `options`); the plugin answers it in its
        own channel, with the same effect as an external identity answering.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InboxReplyInput" }
      responses:
        "201":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: The saved reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxMessage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "409":
          description: An option answer to a question that is already answered, expired or closed, or a task node conflict; returns a fixed error code and the latest safe view of the question.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /tasks/{taskId}:
    get:
      tags:
        - tasks
      operationId: getTask
      summary: Task details, including every node visit and retry record
      x-access: console
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '401':
          description: Standard error response
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
