            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Standard error response
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Standard error response
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Standard error response
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Standard error response
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: >-
        Ordered by `createdAt`/`id`, oldest first. `cursor` is the opaque position of the last returned message; default
        20, at most 100; an empty `nextCursor` means this query has reached the end. Returns only the user and assistant
        messages of the runs of this `nodeRunId`. Later live updates come from the task SSE; paging through history does
        not mark Inbox messages read.
  /tasks/{taskId}/retry:
    post:
      tags:
        - tasks
      operationId: retryTask
      summary: A person or the project's current Manager retries the blocked node, closing the old question and keeping the task instance's session
      x-access: console
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
