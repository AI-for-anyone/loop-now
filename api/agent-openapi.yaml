              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 统一错误响应
          headers:
