  /tasks/{taskId}/nodes/{nodeRunId}:
    get:
      tags:
        - tasks
      operationId: getTaskNodeRun
      summary: Details of one node run (attempt)
      x-access: console
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: nodeRunId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
