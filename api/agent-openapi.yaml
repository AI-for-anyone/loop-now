openapi: 3.1.0
info:
  title: Loop Now Agent API
  version: 0.1.0
  description: |
    平台内 Agent 通过 loopctl 调用的接口契约，由服务端维护（变更 add-inbox-and-external-access）。
    与 `api/openapi.yaml` 同名的结构完全相同，由契约测试逐一比对；同名接口的行为也相同，只是当前身份是 Agent。

    约定：
    - 基址为 `LOOPCTL_AGENT_URL`，即回环监听器上的 `/agent/v1`。服务端启动 Pi 时注入它与 `LOOPCTL_AGENT_TOKEN`。
    - 每个请求必须带 `Authorization: Bearer lna_…`。令牌在 Pi 进程停止、重启或被丢弃时作废，服务端重启后也全部作废；此时返回 401 `unauthenticated`。
    - 带 `Origin` 头的请求返回 403 `forbidden_origin`。
    - 当前身份由令牌决定，只能读取发给自己的消息、查看自己参与的线索。
    - 每个响应都带 `Loop-Now-Request-Id` 与 `Loop-Now-Version`。
servers:
  - url: http://127.0.0.1:8780/agent/v1
    description: 本机开发默认地址
tags:
  - name: inbox
  - name: sleep

paths:
  /agents/status:
    get:
      operationId: getProjectAgentStatus
      x-agent-only: true
      summary: 只读查看同项目 Agent 的常态状态
      description: |
        调用者项目由令牌 base Agent 的真实未删除配置确定，任务令牌也只使用其 base Agent 项目。
        目标接受 UUID、同项目短名、项目/Agent 或组织/项目/Agent 地址；拒绝 #task 地址。
        调用者和目标必须属于同一个非空项目；平台 Agent、跨项目及删除目标不允许。
        只返回常态 AgentStatus，不聚合任务实例，不启动执行、不读取消息或改变已读状态。
      parameters:
        - name: agent
          in: query
          required: true
          description: 目标常态 Agent 的 UUID 或同项目地址
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: 目标常态 Agent 的现有安全状态投影
          headers: { Loop-Now-Request-Id: { $ref: '#/components/headers/RequestId' }, Loop-Now-Version: { $ref: '#/components/headers/Version' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /sleep:
    get:
      tags: [sleep]
      operationId: getSleepState
      x-agent-only: true
      summary: 查询当前 Agent 实例自身的 sleep，不产生变更
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 自身当前运行与有效 sleep；不存在时为 null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SleepState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    post:
      tags: [sleep]
      operationId: requestSleep
      x-agent-only: true
      summary: 为本轮登记 sleep，正常收尾后才生效
      description: |
        作用域只由令牌派生。相同动作与内容重发返回原回执，不重置时间；不同内容或过期运行返回 409 sleep_conflict。
        202 只代表登记成功；Agent 随后结束本轮，平台确认成功收尾和会话保存后才计算 wakeAt。
        变更请求不能自动重试。sleep 视为空闲，有效新工作可提前结束此次等待。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SleepInput" }
      responses:
        "202":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 已持久保存的原登记回执；此时尚不代表空闲或已开始计时
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SleepReceipt" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /whoami:
    get:
      tags: [inbox]
      operationId: getWhoami
      summary: 当前 Agent 的身份
      description: |
        返回 `{kind: agent, address, name}`；`address` 的写法同控制台契约中的 `Agent.address`。
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 当前身份
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Whoami" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /inbox/messages:
    get:
      tags: [inbox]
      operationId: listInboxMessages
      summary: 列出发给当前 Agent 的消息摘要，新的在前；默认含已读与未读，不改变已读状态
      parameters:
        - $ref: "#/components/parameters/InboxUnread"
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 一页消息摘要
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxMessagePage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [inbox]
      operationId: sendInboxMessage
      summary: 发送消息，总是开启新线索；回复用 `POST /inbox/messages/{messageId}/reply`
      description: |
        两段地址 `项目名/Agent名` 按当前 Agent 所在组织解析；平台持有的 Agent 按默认组织解析。
        收件地址不存在、Agent 已删除或外部身份已删除时返回 404，不保存消息。
        跨组织发送不被允许时返回 403 `forbidden`：组织内的 Agent 只能发给同组织的 Agent 与平台持有的 Agent，项目 Manager 还可以发给其他组织的项目 Manager；平台持有的 Agent 可以发给任何组织。发给 `@console` 与外部身份不受此限制。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InboxSendInput" }
      responses:
        "201":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 已保存的消息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxMessage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "409":
          description: 已回答/到期/关闭的选项回答或任务节点冲突，返回固定错误码及安全最新问题。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /inbox/messages/{messageId}/read:
    {
      "parameters": [
        {
          "$ref": "#/components/parameters/MessageId"
        }
      ],
      "post": {
        "operationId": "readInboxMessage",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/InboxMessage"
                }
              }
            },
            "description": "消息全文",
            "headers": {
              "Loop-Now-Request-Id": {
                "$ref": "#/components/headers/RequestId"
              },
              "Loop-Now-Version": {
                "$ref": "#/components/headers/Version"
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          }
        },
        "summary": "读取发给当前身份的一条消息的全文，并标为已读；重复读取返回同样的内容，已读时间保持第一次的值",
        "tags": [
          "inbox"
        ],
        "x-access": "console-and-external",
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/InboxReadInput"
              }
            }
          }
        },
        "description": " 严格任务 Inbox 的 Agent 必须提供所属实际运行中的 runId；普通旧 Inbox 可省略。失效或跨节点不改投、不推断当前 run。"
      }
    }
  /inbox/messages/{messageId}/reply:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [inbox]
      operationId: replyInboxMessage
      summary: 回复线索中的一条消息；收件人为线索中的另一方
      description: |
        线索的任一方都可以回复其中任意一条消息，包括自己发出的（在线索中追加）。不是线索参与方时返回 404。
        回复不检查跨组织发送权限。收件人已删除时返回 404，不保存消息。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InboxReplyInput" }
      responses:
        "201":
          headers: { Loop-Now-Request-Id: { $ref: "#/components/headers/RequestId" }, Loop-Now-Version: { $ref: "#/components/headers/Version" } }
          description: 已保存的回复
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxMessage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "409":
          description: 已回答/到期/关闭的选项回答或任务节点冲突，返回固定错误码及安全最新问题。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /tasks/{taskId}:
    get:
      tags:
        - tasks
      operationId: getTask
      summary: 任务详情，含全部节点访问与重试记录
      x-access: console
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '401':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tasks/{taskId}/nodes/{nodeRunId}:
    get:
      tags:
        - tasks
      operationId: getTaskNodeRun
      summary: 指定节点运行/尝试详情
      x-access: console
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: nodeRunId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskNodeRun'
        '401':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tasks/{taskId}/nodes/{nodeRunId}/messages:
    get:
      tags:
        - tasks
      operationId: listTaskNodeMessages
      summary: 只列该节点运行/尝试的会话轮次
      x-access: console
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: nodeRunId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: 成功
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskMessagePage'
        '401':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 统一错误响应
          headers:
            Loop-Now-Request-Id:
              $ref: '#/components/headers/RequestId'
            Loop-Now-Version:
              $ref: '#/components/headers/Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: >-
        按createdAt/id从旧到新。cursor为最后一条已返回消息的不透明位置；默认20、最多100，nextCursor为空表示该次查询已到末尾。只返回该nodeRunId各run的用户与助手消息。后续实时更新来自任务SSE，历史分页不标读Inbox。
  /tasks/{taskId}/retry:
    post:
      tags:
        - tasks
      operationId: retryTask
      summary: 人或当前项目Manager重试阻塞节点，关闭旧题、沿用实例会话
      x-access: console
