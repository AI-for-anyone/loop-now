          type: string
        nodeRunId:
          type: string
          format: uuid

    ModelAuthMethod:
      type: string
      enum:
        - api_key
        - oauth

    ModelAuthErrorCode:
      type: string
      enum:
        - auth_failed
        - auth_port_busy
        - auth_timeout
        - auth_unavailable
        - configuration_changed
        - server_restarted
        - invalid_authorization_url
        - helper_unavailable
        - plugin_unavailable
        - extension_load_failed

    ModelAuthLoginInput:
      type: object
      additionalProperties: false
      required:
        - provider
        - expectedConfigVersion
      properties:
        provider:
          description: |
            Must be the Agent's current model provider: openai-codex, or a plugin provider in the model catalog whose
            source is plugin and whose authMethods include oauth (plugins/SPEC.md §13).
          type: string
        expectedConfigVersion:
          type: integer
          minimum: 1

    ModelAuthCancelInput:
      type: object
      additionalProperties: false
      required: []
      properties: {}

    ModelAuthOperation:
      type: object
      additionalProperties: false
      required:
        - id
        - agentId
        - provider
        - configVersion
        - status
        - startedAt
        - expiresAt
        - completedAt
        - authorizationUrl
        - errorCode
        - errorMessage
        - deviceCode
        - prompt
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        provider:
          description: openai-codex, or a model provider registered by a plugin (plugins/SPEC.md §13).
          type: string
          minLength: 1
          maxLength: 64
        configVersion:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - pending
            - awaiting_authorization
            - succeeded
            - failed
            - cancelled
            - expired
        startedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        completedAt:
          type:
            - string
            - 'null'
          format: date-time
        authorizationUrl:
          type:
            - string
            - 'null'
          format: uri
          description: >-
            Authorization URL that can be fetched repeatedly only for the currently active, console-only login
            operation. For Codex it uses a fixed HTTPS issuer/path and the query must not contain token/code; for a
            plugin provider it is an https address supplied by the extension and validated by the server (no
            username/password or fragment, no authorization code or token). Cleared in a final state; never stored in
            AgentDetail, logs, audit records or persistent browser storage.
        errorCode:
          description: |
            Plugin provider logins additionally have plugin_unavailable (the plugin was uninstalled or disabled) and
            extension_load_failed (the plugin extension failed to load or did not register a login for this provider);
            the rest are the same as for project plugin logins. A user cancellation gives status=cancelled with
            errorCode null.
          oneOf:
            - $ref: '#/components/schemas/ModelAuthErrorCode'
            - type: 'null'
        errorMessage:
          type:
            - string
            - 'null'
          description: Fixed, safe description; never echoes provider exceptions, authorization codes or tokens.
        deviceCode:
          description: Device-code login (plugin providers only); open verificationUri and enter userCode. The address has been validated by the server. Held only in memory; null in a final state and for Codex logins.
          anyOf:
            - $ref: '#/components/schemas/ProjectModelLoginDeviceCode'
            - type: 'null'
        prompt:
          description: |
            A question the plugin provider login is waiting for a person to answer (a choice, text, or a manually pasted
            authorization code); answer it with POST …/operations/{operationId}/input. message and the options are text
            from the extension; show them as untrusted plain text. Held only in memory; null in a final state and for
            Codex logins.
          anyOf:
            - $ref: '#/components/schemas/ProjectModelLoginPrompt'
            - type: 'null'

    ModelAuthState:
      type: object
      additionalProperties: false
      required:
        - credential
        - operation
      properties:
        credential:
          oneOf:
            - $ref: '#/components/schemas/CredentialMeta'
            - type: 'null'
        operation:
          oneOf:
            - $ref: '#/components/schemas/ModelAuthOperation'
            - type: 'null'
        localLogin:
          description: |
            Given only when the Agent's current model provider comes from a plugin and declares state paths that follow
            the account (plugins/SPEC.md §13); omitted otherwise.
            With "Use local logins" on, this provider uses the extension's own login in the local home directory, not
            this Agent's login: active means that login exists locally; missing means it does not, and Pi fails with
            credential_unavailable before starting (turn the switch off, or log in locally and try again).
            Omitted when the switch is off.
          type: string
          enum: [active, missing]

    ProjectModelLoginDeviceCode:
      type: object
      additionalProperties: false
      required: [userCode, verificationUri, expiresAt]
      properties:
        userCode: { type: string, minLength: 1 }
        verificationUri: { type: string }
        expiresAt: { type: [string, "null"], format: date-time }
    ProjectModelLoginPrompt:
      type: object
      additionalProperties: false
      required: [id, kind, message, options]
      properties:
        id: { type: string }
        kind:
          description: select picks one id from options; text takes free text; manual_code takes a callback URL or authorization code pasted by hand when the browser callback cannot get through (message may be empty).
          type: string
          enum: [select, text, manual_code]
        message: { type: string, maxLength: 501 }
        options:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [id, label]
            properties:
              id: { type: string }
              label: { type: string }

    ModelCredentialInput:
      type: object
      additionalProperties: false
      required:
        - provider
        - key
      properties:
        provider:
          type: string
        key:
          type: string
          minLength: 1
          writeOnly: true
        expectedConfigVersion:
          type: integer
          minimum: 1

    CredentialMeta:
      type: object
      required:
        - status
        - updatedAt
        - fieldNames
        - envNames
        - filePaths
        - warnings
      additionalProperties: false
      properties:
        projectId: { type: [string, "null"], format: uuid, description: "The project it is shared from; omitted for platform-private history" }
        accountId: { type: [string, "null"], format: uuid, description: "Stable project account ID; omitted for platform-private history" }
        status:
          type: string
          enum:
            - set
            - unavailable
            - needs_reentry
        updatedAt:
          type: string
          format: date-time
        fieldNames:
          type: array
          items:
            type: string
        envNames:
          type: array
          items:
            type: string
        filePaths:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        provider:
          type:
            - string
            - 'null'
        authMethod:
          type:
            - string
            - 'null'
          enum:
            - api_key
            - oauth
            - legacy
            - null
        versionId:
          type:
            - string
            - 'null'
          format: uuid
        accountLabel:
          type:
            - string
            - 'null'
          description: Non-secret account label that may be displayed; contains no token or authorization code.

    LocalizedText:
      description: >-
        Text that can be given per language: plugin manifests and market entries (displayName, description, the labels
        of channels, actions and account kinds, and title, description and oneOf entry titles inside their JSON Schemas)
        and CLI template field labels. A string, which counts as English and is shown in every language; or an object
        keyed by language tag (such as `en-US`, `zh-CN`) whose values are strings that are non-empty after trimming, with
        at least one entry; official templates and plugins give en-US first and zh-CN. The server returns it as is
        (objects keep the author's key order) and does not translate it; the console picks the current language → zh-CN
        → en-US → the first entry. An empty string when absent.
      oneOf:
        - type: string
        - type: object
          minProperties: 1
          propertyNames: { pattern: "^[A-Za-z]{2,3}(-[A-Za-z0-9]{1,8})*$" }
          additionalProperties: { type: string, pattern: "\\S" }

    AgentRuntime:
      type: string
      enum: [pi, claude-code]
      description: |
        The runtime that executes the Agent: pi is the bundled Pi; claude-code is the unmodified Claude Code installed
        on the user's computer (claude is looked up on the login shell's PATH), using its own local login; the platform
        neither reads nor stores its credentials. The runtime follows from the model provider and is not set separately:
        it is claude-code when model.provider is claude-code, and pi otherwise. Under Claude Code there are no Pi
        extensions (/pi: commands, extension conversations, plugin providers); plugin Skills and MCP servers work as
        usual.

    ModelProvider:
      type: object
      required:
        - id
        - name
        - source
        - runtime
        - pluginId
        - pluginDisplayName
        - unavailableReason
        - apiKeyEnvVars
        - modelCount
        - authMethods
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: [string, "null"]
          description: Display name given by the provider itself; currently only plugin providers have one (the extension's original text, shown as plain text), null for the rest.
        source:
          type: string
          enum: [builtin, config, plugin, local_cli]
          description: |
            builtin is the pure built-in catalog; config means the provider has a native models.json configuration or
            override;
            plugin is a provider registered by the Pi extension of an installed plugin (plugins/SPEC.md §13): a project
            Agent can choose it only when the project has enabled the plugin and the Agent has been granted it, and the
            account is a subscription account logged in within the project; a platform Agent can choose it only when the
            plugin has been granted to that Agent, and the account is logged in under that Agent's own model credential
            (POST /agents/{agentId}/model-auth/operations). Otherwise updating the Agent returns 422, and it cannot be
            chosen directly when creating an Agent.
            local_cli is a model provided by a CLI installed on the user's computer (currently only claude-code, the
            local Claude Code); it uses the CLI's own local login, needs no account, and the platform stores no token;
            both project Agents and platform Agents can choose it. Model ids are Claude Code aliases (fable, opus,
            sonnet, haiku), and the thinking level is Claude Code's effort (low to max). Whether it is installed and
            logged in on this computer is shown by GET /runtimes; it can be chosen even when not installed, and runs
            then fail with runtime_*.
        runtime:
          $ref: "#/components/schemas/AgentRuntime"
          description: The runtime that executes Agents that choose this provider.
        pluginId:
          type: [string, "null"]
          description: When source is plugin, the id of the plugin that registered it; otherwise null.
        pluginDisplayName:
          description: When source is plugin, the display name of the plugin that registered it (as in the manifest); otherwise null.
          oneOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        unavailableReason:
          type: [string, "null"]
          enum: [plugin_not_enabled, agent_not_granted, plugins_disabled, null]
          description: |
            Can be non-null only when the query has agentId and source is plugin: why this Agent cannot use it now.
            plugin_not_enabled: the Agent's project has not enabled the plugin (project Agents only; platform Agents
            have no project enable step);
            agent_not_granted: the plugin has not been granted to this Agent; plugins_disabled: all plugins are disabled
            globally (this does not block saving, but Pi fails to start).
            In the first two cases, updating the Agent to choose it returns 422 (validation_failed, field
            model.provider, with a message saying which case).
            Once the plugin is uninstalled, its provider disappears from the catalog (Agents that chose it fail
            explicitly at start).
        apiKeyEnvVars:
          description: Diagnostic metadata kept for compatibility with legacy environment credentials; not a field for entering model credentials.
          type: array
          items:
            type: string
          deprecated: true
        modelCount:
          type: integer
          minimum: 0
        authMethods:
          type: array
          items:
            $ref: '#/components/schemas/ModelAuthMethod'
          uniqueItems: true
          description: Explicit authentication methods the platform supports; OAuth login is console only and currently supports openai-codex and plugin providers (plugin providers support only oauth).

