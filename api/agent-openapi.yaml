    CLIImportCandidate:
      {
        "additionalProperties": false,
        "properties": {
          "candidateId": {
            "$ref": "#/components/schemas/CLIImportUUID"
          },
          "cli": {
            "$ref": "#/components/schemas/CLIImportCLI"
          },
          "label": {
            "maxLength": 200,
            "type": "string"
          },
          "missingFields": {
            "description": "Names of required fixed-template fields that are currently missing; a secret field name here does not grant permission to supply it",
            "items": {
              "maxLength": 80,
              "pattern": "^[A-Za-z][A-Za-z0-9]*$",
              "type": "string"
            },
            "type": "array",
            "uniqueItems": true
          },
          "previouslyImported": {
            "description": "Only reflects origin history; does not prove the content is the same version",
            "type": "boolean"
          },
          "reasonCode": {
            "oneOf": [
              {
                "type": "null"
              },
              {
                "enum": [
                  "unsupported",
                  "source_unreadable",
                  "missing_field",
                  "tool_unavailable",
                  "template_mismatch",
                  "requires_platform_login",
                  "unsupported_cli_store",
                  "cached_token_not_credential",
                  "keyring_version_unavailable"
                ],
                "type": "string"
              }
            ]
          },
          "sourceKind": {
            "maxLength": 80,
            "pattern": "^[a-z0-9_]+$",
            "type": "string"
          },
          "status": {
            "enum": [
              "may_import",
              "needs_fields",
              "unsupported",
              "unreadable",
              "requires_platform_login"
            ],
            "type": "string"
          },
          "supplementableFields": {
            "description": "Fields missing in the source that may be supplied; not necessarily a subset of missingFields. A CA may be supplied when there is no TLS; existing values cannot be overwritten",
            "items": {
              "enum": [
                "database",
                "sslMode",
                "caCert"
              ],
              "type": "string"
            },
            "type": "array",
            "uniqueItems": true
          }
        },
        "required": [
          "candidateId",
          "cli",
          "sourceKind",
          "label",
          "status",
          "missingFields",
          "supplementableFields",
          "reasonCode",
          "previouslyImported"
        ],
        "type": "object"
      }

